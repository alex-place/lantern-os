<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="loop-stage" content="verify">
<title>Unisona Trading Journal</title>

<!-- Apply the saved theme before paint so the global header + light mode don't flash (#1577). -->
<script>
  (function(){ try {
    var stored = localStorage.getItem('lantern-theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var isDark = stored ? stored === 'dark' : prefersDark;
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  } catch(e){ document.documentElement.setAttribute('data-theme','dark'); } })();
</script>
<link rel="stylesheet" href="/css/site.css">

<style>
  @import url('/css/trader.css');

  /* ── Journal page ───────────────────────────────────────────────────────────
     The journal used to be the fourth tab of the trader's bottom panel, in a
     306px strip under the charts. A review surface is not a strip: a calendar,
     an equity curve and a breakdown table all want room at once, and the panel
     could only ever show one of them at a time.
     Laid out the way the journal products lay this out (TradeZella, TraderWaves):
     a KPI band across the top, then the calendar as the centrepiece with the
     curve beside it, then the tables underneath. */
  /* --green and --red are declared INLINE in stock-trader.html and watch.html, not in
     any shared stylesheet. This page loads site.css + trader.css, one of which happens
     to define --green -- but NOTHING defines --red. So gains rendered green and every
     LOSS fell back to the inherited text colour: white on dark, black on light. A
     trading journal that shows losses in the same colour as ordinary text is worse than
     one with no colour at all. Same values as the trader page, so the two agree. */
  /* THE FULL TOKEN SET, not just the two colours. Neither site.css nor trader.css
     defines --text0/--text1/--text2/--bg0..--bg3, so on this page every one of them was
     UNDEFINED. HTML text got away with it -- an invalid var() on `color` falls back
     through inheritance to a UA default that happens to be light in dark mode. SVG did
     not: an invalid var() in a `fill` resolves to fill's INITIAL value, which is BLACK.
     That is why every label on every chart was black on a dark background while the
     surrounding text looked fine. Same values as stock-trader.html so the pages agree. */
  :root{--bg0:#0a0c0f;--bg1:#111318;--bg2:#181c22;--bg3:#1f242d;
    --border:#252b35;--text0:#e8eaf0;--text1:#b3b9c5;
    /* #828a99 measured 4.48:1 on --bg3, which a flat day cell uses -- under by a
       rounding error, but under. Two points lighter clears it at 4.60. */
    --text2:#848c9b;
    --green:#00d4aa;--red:#ff5f6d;--amber:#f5a623;--blue:var(--accent,#4a9eff);
    /* The heatmap's wash, which scales to 52% with the size of a cell's figure. It is
       a SEPARATE token from --green/--red because a background that dark text has to
       survive is not the same colour as the text. In dark mode they coincide. */
    --tint-pos:#0a6b58;--tint-neg:#7a1f27}
  /* THE SIGNAL COLOURS ARE THEMED TOO. The block below used to redefine only the greys,
     so the dark-tuned green, red, amber and blue above leaked into light mode -- where
     they measure 1.91, 2.95, 2.03 and 2.75 to 1 against white. AA wants 4.5. This page is
     almost entirely coloured money figures, so that is most of the journal sitting under
     the bar, not an edge case.

     These are the same hues taken down until they clear 4.5:1 against --bg3, the darkest
     surface any of them sits on, which puts them at 4.6-5.8:1 everywhere else. */
  html[data-theme="light"]{
    --bg0:#f4f6fa;--bg1:#ffffff;--bg2:#eef1f6;--bg3:#e3e8f0;
    /* --text2 carries every label, note and column header. At #828b9c it measured
       2.79:1 on the darkest light surface, where the dark theme's equivalent manages
       5.35:1 -- the same oversight as the signal colours below. */
    --border:#d6dbe4;--text0:#1a1d24;--text1:#4a5160;--text2:#5f6778;
    --green:#00745d;--red:#cf0012;--amber:#905a01;--blue:#0062d3;
    /* Pale enough that the figure on top still clears 4.5:1 at the strongest wash,
       and the gradient survives: near-white at 12%, #84ead6 / #ffc6ca at 52%. */
    --tint-pos:#12d7b0;--tint-neg:#ff919a}
  body{margin:0;background:var(--bg0);color:var(--text1);font-family:var(--sans,system-ui,sans-serif)}
  .jp-shell{max-width:1440px;margin:0 auto;padding:0 16px 40px}

  .jp-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0 12px}
  .jp-title{font-size:19px;font-weight:600;color:var(--text0);margin:0}
  .jp-sub{font-size:11.5px;color:var(--text2)}
  .jp-controls{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

  /* KPI band. auto-fit keeps it one row on a wide screen and reflows rather than
     scrolling on a narrow one -- a metric you have to scroll to is a metric you
     will not read. */
  /* THE COLUMN COUNT HAS TO DIVIDE THE TILE COUNT. auto-fit packed as many 150px
     tiles as fitted, which at a common desktop width is six -- so eight tiles came
     out as a row of six and an orphan pair against a half-empty row. Four and eight
     both divide eight; five, six and seven do not.

     Measured against the CARD rather than the window, because the reader can resize
     the card now (#3565): a half-width Key figures card needs the two-column layout
     whatever the window is doing. */
  #jpKpis{container-type:inline-size}
  .jp-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
  @container (min-width:560px){ .jp-kpis{grid-template-columns:repeat(4,minmax(0,1fr))} }
  /* Eight across only once a tile can still hold "$1,391.64" at its own size. */
  @container (min-width:1180px){ .jp-kpis{grid-template-columns:repeat(8,minmax(0,1fr))} }
  .jp-kpi{background:var(--bg1);border:1px solid var(--border);border-radius:10px;padding:11px 13px;min-width:0}
  .jp-kpi .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .jp-kpi .v{font-size:21px;font-weight:600;color:var(--text0);font-variant-numeric:tabular-nums;margin-top:3px;
    line-height:1.15}
  .jp-kpi .s{font-size:10.5px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .jp-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;align-items:start}
  @media (max-width:1080px){ .jp-grid{grid-template-columns:1fr} }
  .jp-col{display:flex;flex-direction:column;gap:12px;min-width:0}
  /* The reader's own arrangement (#3543): one grid, each card one column or both. */
  /* Twelve columns, not two (#3565). Half-or-full was two choices dressed as
     customisation: a reader who wants a wide calendar beside a narrow balance could
     not have one, and every card was forced to the same two shapes. */
  /* Cards in a row stretch to the same height. Ragged box bottoms were the other half
     of the awkwardness -- a short card beside a tall one left the row looking broken
     rather than deliberate. A reader who wants a card shorter drags its bottom edge. */
  .jp-cards{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;
    align-items:stretch;position:relative}
  /* One column on a narrow screen: spans are a desktop idea, and a 3/12 card on a
     phone is a column of single characters. */
  @media (max-width:1080px){
    .jp-cards{grid-template-columns:1fr}
    .jp-cards > .jp-card{grid-column:1/-1 !important}
    .jp-editing .jp-res{display:none !important}
  }
  .jp-cards > .jp-card.bare{background:none;border:0;padding:0}
  .jp-bar{display:none;align-items:center;gap:6px;margin:0 0 10px}
  .jp-editing .jp-bar{display:flex}
  .jp-editing .jp-cards > .jp-card{outline:1px dashed color-mix(in srgb,var(--accent) 45%,var(--border))}
  .jp-editing .jp-cards > .jp-card.grabbing{opacity:.4}
  /* The card body is what a height applies to, so the bar and handles stay put. */
  .jp-cbody{min-width:0}
  .jp-editing .jp-card{position:relative}
  .jp-res{display:none;position:absolute;z-index:3;touch-action:none}
  .jp-editing .jp-res{display:block}
  .jp-res::after{content:'';position:absolute;border-radius:3px;
    background:color-mix(in srgb,var(--accent) 50%,transparent)}
  .jp-res:hover::after,.jp-res.on::after{background:var(--accent)}
  .jp-res-x{top:10px;bottom:10px;right:-8px;width:16px;cursor:col-resize}
  .jp-res-x::after{left:6px;top:50%;transform:translateY(-50%);width:4px;height:36px}
  /* A divider runs the height of the card it splits, so it reads as a boundary
     between two things rather than a corner grip on one of them. */
  .jp-res-split{cursor:col-resize}
  .jp-res-split::after{top:12px;bottom:12px;height:auto;transform:none}
  .jp-res-y{left:10px;right:10px;bottom:-8px;height:16px;cursor:row-resize}
  .jp-res-y::after{top:6px;left:50%;transform:translateX(-50%);height:4px;width:36px}
  /* Where the card will land. An insertion LINE rather than a highlighted target,
     because 'before or after this one' is the question a drop actually answers. */
  .jp-drop{position:absolute;width:3px;border-radius:2px;background:var(--accent);
    pointer-events:none;z-index:6;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  .jp-bar .grip{all:unset;cursor:grab;padding:1px 4px;border-radius:4px;color:var(--text2);touch-action:none}
  .jp-bar .grip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .jp-bar .jp-span{font-size:9.5px;color:var(--text2);font-variant-numeric:tabular-nums}
  .jp-bar .grip{cursor:grab;color:var(--muted);letter-spacing:-2px}
  .jp-bar .name{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:auto}
  .jp-bar .jp-chip{padding:2px 8px;font-size:11px}
  .jp-tray{display:none;flex-wrap:wrap;gap:6px;align-items:center;grid-column:1/-1;
    border:1px dashed var(--border);border-radius:10px;padding:10px 12px}
  .jp-editing .jp-tray{display:flex}

  .jp-card{background:var(--bg1);border:1px solid var(--border);border-radius:10px;padding:12px 14px;min-width:0}
  .jp-card h2{margin:0 0 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);
    font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .jp-card h2 .sp{margin-left:auto;display:flex;gap:4px}

  /* Calendar. Colour carries the sign, the figure carries the size -- colour alone
     would leave a -$4 day and a -$400 day looking identical. */
  .jp-cal-head{display:grid;grid-template-columns:repeat(7,1fr) 76px;gap:4px;margin-bottom:4px}
  .jp-cal-head span{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);text-align:center}
  .jp-cal{display:grid;grid-template-columns:repeat(7,1fr) 76px;gap:4px}
  /* NOT aspect-ratio:1. A square cell takes its HEIGHT from the column width, so the
     calendar grew as the window did -- 95px tall to hold a date and one figure that
     need about 34px. Five rows spent 493px, which put the last week flush against the
     fold on a 1080p screen at 125% scaling (viewport 1536x864: calendar bottom 862).
     A bounded min-height sizes the cell to its CONTENT and stops the month growing
     off-screen on a wider monitor. */
  .jp-day{min-height:clamp(44px,4.6vh,62px);border-radius:7px;background:var(--bg2);border:1px solid var(--border);padding:5px 6px;
    display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .jp-day.empty{background:transparent;border-color:transparent}
  .jp-day .d{font-size:9.5px;color:var(--text2);font-variant-numeric:tabular-nums}
  .jp-day .p{margin-top:auto;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .jp-day.win{background:color-mix(in srgb,var(--green) 15%,var(--bg2));border-color:color-mix(in srgb,var(--green) 35%,var(--border))}
  /* A day's figure sits on a tint of its own colour, so in light mode it was reading
     3.63:1 at ten pixels -- the sign was clear and the amount was not. Weakening the
     tint would fix the text and cost the at-a-glance read the calendar exists for, so
     the tint stays at full strength and the FIGURE goes darker instead. Nothing to do
     in dark mode, where bright text on a dark tint already measures comfortably. */
  html[data-theme="light"] .jp-day .p.jp-pos, html[data-theme="light"] .jp-heat-c .jp-pos{color:#006a55}
  html[data-theme="light"] .jp-day .p.jp-neg, html[data-theme="light"] .jp-heat-c .jp-neg{color:#b90010}
  /* The day NUMBER shares the tinted cell, where tertiary grey is not enough -- in
     either theme. Dark measured 3.68:1 on a winning day before this. */
  .jp-day.win .d, .jp-day.loss .d{color:var(--text1)}
  html[data-theme="light"] .jp-day.today .d{color:#0a4b96}
  /* A selected chip is dark-on-accent in the dark theme; in light mode the accent itself
     went dark, so the label has to flip with it. */
  html[data-theme="light"] .jp-chip.on{color:#ffffff}
  .jp-day.loss{background:color-mix(in srgb,var(--red) 15%,var(--bg2));border-color:color-mix(in srgb,var(--red) 35%,var(--border))}
  .jp-day.flat{background:var(--bg3)}
  /* Today is a RING, never a fill: it has to be legible on a green day, a red day and
     an empty one alike, and a fill would fight the P&L colour that the cell exists to
     show. inset keeps it inside the 7px radius instead of bleeding into the gap. */
  .jp-day.today{box-shadow:inset 0 0 0 1.5px var(--accent),0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
  .jp-day.today .d{color:var(--accent);font-weight:700}
  /* Today, live (#3502): the broker's figure for a session still running. It is not a
     booked result, so it takes no win/loss fill -- the figure carries the sign, and a
     dashed edge plus a "live" tag say it is still moving. At the close it becomes an
     ordinary booked day. */
  .jp-day.live, .jp-week.live{border-style:dashed;border-color:color-mix(in srgb,var(--accent) 55%,var(--border))}
  .jp-day .lv{float:right;font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);line-height:1.2}
  .jp-week{border-radius:7px;background:var(--bg2);border:1px solid var(--border);padding:5px 6px;
    display:flex;flex-direction:column;justify-content:center;min-width:0}
  .jp-week .l{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
  .jp-week .v{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .jp-day .p-abbr{display:none}
  /* A NARROW CALENDAR, not a narrow window. The 76px week column is a fifth of a 375px
     viewport and the full figure cannot fit what is left -- but that was written when a
     card was as wide as the window. Since #3565 the reader can make this card six columns
     wide on a large screen, where a viewport query never fires and "-$198.00" truncates
     to "-$198...". Measured against the card, it behaves the same at any window size.
     The week totals are not lost when the column goes -- they are a sum of days already
     on screen. */
  #jpCalCard{container-type:inline-size}
  @container (max-width:560px){
    .jp-cal, .jp-cal-head{grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
    .jp-cal-head span:last-child, .jp-week{display:none}
    .jp-day{padding:3px 4px;min-height:clamp(40px,5.2vh,52px)}
    .jp-day .d{font-size:9px}
    .jp-day .p{font-size:9.5px}
    .jp-day .p-full{display:none}
    .jp-day .lv{font-size:0;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:3px}
    .jp-day .p-abbr{display:inline}
  }
  @media (max-width:560px){
    .jp-shell{padding:0 10px 32px}
  }
  .jp-monthbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .jp-monthbar .m{font-size:12.5px;font-weight:600;color:var(--text0)}
  .jp-navb{background:var(--bg2);border:1px solid var(--border);color:var(--text1);border-radius:6px;
    width:24px;height:24px;cursor:pointer;font:inherit;font-size:12px;line-height:1;display:grid;place-items:center}
  .jp-navb:hover:not(:disabled){background:var(--bg3);color:var(--text0)}
  /* Every other control on this page draws its own ring; this one was falling back to
     whatever the browser does. */
  .jp-navb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .jp-navb:disabled{opacity:.35;cursor:default}

  /* .jp-kpi .v declares color:var(--text0) at (0,2,0); .jp-neg alone is (0,1,0) and
     loses, so Max drawdown rendered WHITE while the same figure in the calendar was
     red. The sign has to read the same wherever it appears. */
  /* A sign colour has to win WHEREVER it lands. Both `.jp-kpi .v` (0,2,0) and
     `.jp-table td` (0,1,1) declare their own colour, out-specifying a bare `.jp-neg`
     at (0,1,0) -- so losses rendered white in the KPI band, and then again in the
     tables after the KPI band was fixed. Naming the containers here settles it once,
     for every place a figure can appear, without reaching for !important. */
  .jp-dim{color:var(--text2)}
  .jp-pos, .jp-kpi .v.jp-pos, .jp-table td.jp-pos,
  .jp-week .v.jp-pos, .jp-day .p.jp-pos{color:var(--green)}
  .jp-neg, .jp-kpi .v.jp-neg, .jp-table td.jp-neg,
  .jp-week .v.jp-neg, .jp-day .p.jp-neg{color:var(--red)}
  .jp-chip{font-size:10.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--border);background:transparent;
    color:var(--text2);cursor:pointer;font-family:inherit}
  .jp-chip.on{background:var(--blue);border-color:var(--blue);color:#08131f}
  .jp-chip:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

  .jp-table{width:100%;border-collapse:collapse;font-size:12px}
  .jp-table th{text-align:left;color:var(--text2);font-weight:600;font-size:10px;text-transform:uppercase;
    letter-spacing:.05em;padding:5px 7px;border-bottom:1px solid var(--border);white-space:nowrap;
    position:sticky;top:0;background:var(--bg1)}
  .jp-table td{padding:5px 7px;border-bottom:1px solid var(--border);color:var(--text1);white-space:nowrap}
  .jp-table tr:last-child td{border-bottom:0}
  .jp-table .num{text-align:right;font-variant-numeric:tabular-nums}
  /* A sortable header is a real button (keyboard, screen reader) wearing the th's clothes. */
  .jp-sort{all:unset;cursor:pointer;display:inline-block;width:100%}
  .jp-table th.num .jp-sort{text-align:right}
  .jp-sort:hover{color:var(--text1)}
  .jp-sort:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .jp-scroll{overflow:auto;max-height:300px}
  /* A cell that jumps the calendar is a button, not a styled span. */
  .jp-linkish{all:unset;cursor:pointer;border-bottom:1px dotted var(--border)}
  .jp-linkish:hover{color:var(--blue);border-bottom-color:var(--blue)}
  .jp-linkish:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .jp-table tr.on td{background:color-mix(in srgb, var(--blue) 9%, transparent)}
  /* The grid wants square-ish cells and a readable figure in each one; the row
     header stays put so a wide week can scroll without losing which day it is. */
  /* .jp-table is width:100%, which turned a two-column week into two 380px slabs.
     A grid sizes to its cells and scrolls when the week is wider than the card. */
  .jp-heat{width:auto;min-width:0}
  .jp-heat td, .jp-heat th{text-align:center;padding:6px 4px;font-variant-numeric:tabular-nums}
  .jp-heat th[scope=row]{position:sticky;left:0;background:var(--bg1);text-align:left;
    font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);font-weight:600}
  .jp-heat td{font-size:11px;min-width:58px;width:58px}
  .jp-heat td.jp-heat-0{background:transparent}

  /* R distribution (#3550). A histogram, so the bars carry the shape and the four
     figures above carry what the shape means. */
  .jp-rstats{display:flex;flex-wrap:wrap;gap:10px 22px;margin:2px 0 14px}
  .jp-rstat .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2)}
  .jp-rstat .v{font-size:17px;font-weight:600;color:var(--text0);font-variant-numeric:tabular-nums;line-height:1.3}
  .jp-rstat .v.jp-pos{color:var(--green)} .jp-rstat .v.jp-neg{color:var(--red)}
  .jp-rstat .s{font-size:10px;color:var(--text2)}
  .jp-rhist{display:flex;align-items:flex-end;gap:3px;padding-top:2px}
  .jp-rcol{width:46px;flex:0 0 46px;text-align:center}
  .jp-rplot{height:120px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
  .jp-rcol .n{font-size:9.5px;color:var(--text2);font-variant-numeric:tabular-nums;line-height:1.4}
  .jp-rcol .b{width:100%;border-radius:3px 3px 0 0;display:block}
  .jp-rcol.win .b{background:var(--green)} .jp-rcol.loss .b{background:var(--red)}
  /* Zero is always a bucket edge, so the line between losing and winning is real. */
  .jp-rcol.zero{border-left:1px solid var(--border);margin-left:-1px}
  .jp-rcol .x{font-size:9.5px;color:var(--text2);padding-top:5px;font-variant-numeric:tabular-nums}

  /* Trade log (#3558). */
  .jp-bar-filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
  .jp-select{font-size:10.5px;padding:3px 8px;border-radius:999px;border:1px solid var(--border);
    background:transparent;color:var(--text2);font-family:inherit;cursor:pointer}
  .jp-trade{cursor:pointer}
  .jp-trade:hover td{background:color-mix(in srgb, var(--text0) 4%, transparent)}
  .jp-trade.on td{background:color-mix(in srgb, var(--blue) 8%, transparent)}
  .jp-trade-detail td{padding:0}
  .jp-detail{display:flex;flex-wrap:wrap;gap:6px 24px;padding:9px 8px 11px;
    background:color-mix(in srgb, var(--blue) 5%, transparent);font-size:11px}
  .jp-detail .k{color:var(--text2);margin-right:7px}
  .jp-detail .v{color:var(--text1)}
  .jp-pager{display:flex;align-items:center;gap:10px;padding-top:9px;font-size:10.5px}
  /* The editor sits inside the expanded row, so it has to read as part of the trade
     rather than as a form bolted under it. */
  /* The editor lives in a cell of a table that scrolls sideways, so it inherited the
     TABLE's width -- 485px inside a 375px screen, which meant scrolling right to type.
     The scroll box is the container, so 100cqi is the width actually on screen, and
     sticky-left keeps the editor there while the columns scroll behind it. */
  .jp-trades-scroll{container-type:inline-size}
  .jp-note-edit{padding:2px 8px 12px;background:color-mix(in srgb, var(--blue) 5%, transparent);
    position:sticky;left:0;width:100cqi;box-sizing:border-box}
  .jp-note-text{width:100%;box-sizing:border-box;background:var(--bg0);color:var(--text1);
    border:1px solid var(--border);border-radius:7px;padding:7px 9px;font:inherit;font-size:11.5px;resize:vertical}
  .jp-note-text:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
  .jp-note-row{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:7px}
  .jp-note-row .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-right:3px}
  .jp-tag{font-size:10.5px;padding:3px 8px;border-radius:999px;cursor:pointer;font-family:inherit;
    border:1px solid color-mix(in srgb, var(--blue) 45%, var(--border));
    background:color-mix(in srgb, var(--blue) 12%, transparent);color:var(--text1)}
  .jp-tag:hover{border-color:var(--red);color:var(--red)}
  .jp-tag-in{font-size:10.5px;padding:3px 9px;border-radius:999px;border:1px dashed var(--border);
    background:transparent;color:var(--text1);font-family:inherit;width:110px}
  .jp-tag-in:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

  /* The coach (#3560). The sentence leads; the figures sit under it, because a claim
     about someone's money should arrive with its receipts rather than ask for trust. */
  .jp-coach-text{font-size:14.5px;line-height:1.65;color:var(--text0);margin:2px 0 14px;max-width:72ch}
  .jp-finds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .jp-find{border-left:2px solid var(--border);padding:1px 0 1px 11px}
  .jp-find p{margin:0;font-size:12px;color:var(--text1);line-height:1.55}
  .jp-find-tag{border-left-color:var(--blue)}
  .jp-find-structure{border-left-color:var(--accent)}
  .jp-evs{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}
  .jp-ev{display:flex;gap:5px;align-items:baseline;font-size:10px}
  .jp-ev .k{color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
  .jp-ev .v{color:var(--text1);font-variant-numeric:tabular-nums}
  .jp-coach-locked p{font-size:12.5px;color:var(--text1);line-height:1.6;max-width:66ch;margin:2px 0 11px}
  .jp-coach-locked a{text-decoration:none;display:inline-block}
  /* The list is the point of this card, so it gets room the small tables do not need.
     Still bounded: a page of 25 with rows expanded must not push every later card off
     the screen. */
  .jp-trades-scroll{max-height:560px}
  .jp-pager .jp-chip[disabled]{opacity:.4;cursor:default}

  .jp-curve svg{display:block;width:100%;height:auto}
  /* A chart you cannot read a value off is decoration. The readout replaces the
     crosshair: it follows the pointer and names the point, without drawing the two
     lines across the plot that were explicitly not wanted. */
  .jp-chart{position:relative}
  .jp-chart .jp-read{position:absolute;top:6px;left:8px;display:none;gap:10px;align-items:baseline;
    background:color-mix(in srgb,var(--bg2) 92%,transparent);border:1px solid var(--border);
    border-radius:7px;padding:4px 9px;font-size:11.5px;pointer-events:none;z-index:2;
    box-shadow:0 4px 14px rgba(0,0,0,.28);white-space:nowrap}
  .jp-chart.on .jp-read{display:flex}
  .jp-read .d{color:var(--text2);font-variant-numeric:tabular-nums}
  .jp-read .v{color:var(--text0);font-weight:600;font-variant-numeric:tabular-nums}
  .jp-chart .jp-dot{display:none;pointer-events:none}
  .jp-chart.on .jp-dot{display:block}
  /* A finger is not a mouse: give the plot room so the readout is not under the thumb. */
  @media (max-width:560px){ .jp-chart .jp-read{font-size:11px;padding:3px 7px} }
  .jp-empty{color:var(--text2);padding:16px 2px;max-width:66ch;line-height:1.6}
  .jp-import{padding:0 2px 8px;max-width:66ch}
  .jp-import .jp-note{margin-top:8px}
  .jp-loading{color:var(--text2);padding:16px 2px}
  .jp-banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--bg1);border:1px solid var(--border);
    border-left:3px solid var(--blue);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:12px}
  .jp-banner a{color:var(--blue)}
  .jp-note{font-size:10.5px;color:var(--text2);margin:6px 0 0;line-height:1.5}
</style>
</head>
<body>

<div class="jp-shell">

  <div class="jp-head">
    <div>
      <h1 class="jp-title">Trading journal</h1>
      <div class="jp-sub" id="jpRange">Realized results, day by day.</div>
    </div>
    <div class="jp-controls">
      <span class="jp-dim" id="jpLoadedAt" title="This page never reloads itself — this is when it last read the broker record"></span>
      <button type="button" class="jp-chip" id="jpEditBtn" onclick="jpSetEdit(!jpEdit)" title="Arrange the cards: drag them, set half or full width, hide what you do not read">Edit layout</button>
      <button type="button" class="jp-chip" id="jpImportBtn" hidden onclick="jpRunImport()"
        title="Read your own trades from the broker you have connected and put them in this journal">Import trades</button>
      <button type="button" class="jp-chip" onclick="jpLoad(true)" title="Read the broker record again">Refresh</button>
    </div>
  </div>

  <div id="jpBody"><div class="jp-loading">Loading the journal…</div></div>
</div>

<script>
/* ── Journal page ──────────────────────────────────────────────────────────────
   Reads the same endpoints the bottom-panel journal read -- /track-record for the
   realized book, /scorecard for the breakdown slice -- and lays them out with room to
   breathe. No new server surface.

   Exit reason is gone as a slice (#3542): the engine's own names for why it closed a
   position (zone r, max hold) describe machinery the reader has no view of. Declined went
   with it -- it said "nothing was declined" on every real account, for the price of a
   fetch and a panel. */
const JP_LABELS = { symbol:'Symbol', hour:'Hour' };
let jpSlice = 'symbol', jpBusy = false, jpMonth = null, jpData = null, jpLast = null;

const jpEsc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jpUsd = (n) => (typeof n !== 'number' || !isFinite(n)) ? '—'
  : (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
/* A 375px screen gives each day ~30px of text box; "-$65.11" needs 38. Rather than
   hide the figure (colour alone cannot tell a -$4 day from a -$400 one -- the whole
   point of the calendar) both forms are rendered and CSS shows one. Doing it in CSS
   rather than JS means a rotate or a resize cannot leave the wrong one showing. */
const jpUsdShort = (n) => {
  if (typeof n !== 'number' || !isFinite(n)) return '';
  const a = Math.abs(n), sign = n < 0 ? '-' : '';
  if (a >= 1000) return sign + '$' + (a / 1000).toFixed(a >= 10000 ? 0 : 1) + 'k';
  return sign + '$' + Math.round(a);
};
const jpPct = (n) => (typeof n === 'number' && isFinite(n)) ? n.toFixed(1) + '%' : '—';
const jpSign = (n) => (typeof n === 'number' && isFinite(n) && n !== 0) ? (n > 0 ? 'jp-pos' : 'jp-neg') : 'jp-dim';

/* The record's disclosures are three counts, not a sentence -- String()ing the object put
   a literal "[object Object]" at the foot of every journal (#3552), which is the exact
   opposite of what the line exists for. The same three numbers are what trader_journal is
   required to relay ("must be passed on, not hidden"), so the page owes the reader the
   same words. Nothing to disclose prints nothing: a row of zeros is noise, not honesty. */
function jpDisclosures(d) {
  if (!d) return '';
  if (typeof d === 'string') return d.trim();          // an older record may carry prose
  const n = (v) => ((typeof v === 'number' && isFinite(v) && v > 0) ? v : 0);
  const plural = (c, one, many) => c + ' ' + (c === 1 ? one : many);
  const parts = [];
  const dup = n(d.duplicateExitsCollapsed), bad = n(d.failedAttemptsExcluded), est = n(d.estimatedTrades);
  if (dup) parts.push(plural(dup, 're-decision row', 're-decision rows') + ' collapsed into the trade it belongs to');
  if (bad) parts.push(plural(bad, 'broker-rejected attempt', 'broker-rejected attempts') + ' excluded \u2014 they realized nothing');
  if (est) parts.push(plural(est, 'external close', 'external closes') + ' valued at the last observed mark, not a broker fill');
  return parts.length ? 'How these figures were counted: ' + parts.join('; ') + '.' : '';
}

async function jpFetch(demo) {
  const qs = demo ? '?demo=champion' : '';
  const amp = demo ? '&' : '?';
  const get = (u) => fetch(u, { cache: 'no-store' }).then(r => {
    if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
    return r.json();
  });
  const [rec, slice, equity, live] = await Promise.all([
    get('/api/trading/track-record' + qs),
    get('/api/trading/scorecard' + qs + amp + 'by=' + jpSlice),
    // The broker's OWN equity series -- a different question from the ledger. The
    // ledger answers "what did the autopilot do"; this answers "what is the money
    // doing", so it includes manual trades, deposits, and everything from before the
    // autopilot started, anchored to the opening balance rather than to zero.
    // Never fatal: a broker that cannot answer simply gets no card.
    get('/api/trading/portfolio/history' + (demo ? qs + '&range=ALL' : '?range=ALL'))
      .catch(() => null),
    // Today, live (#3502). Everything else here is closed trades or the broker's daily
    // history, whose newest bar is the previous close -- so without this, today read
    // blank until something closed. It is the trader header's own figure; a demo book
    // has no live account behind it, so it asks for none.
    demo ? Promise.resolve(null)
         : get('/api/trading/positions').then(j => (j && j.account) || null).catch(() => null),
  ]);
  return { rec, slice, equity, live, demo };
}

async function jpLoad(force) {
  if (jpBusy && !force) return;
  jpBusy = true;
  const host = document.getElementById('jpBody');
  host.innerHTML = '<div class="jp-loading">Loading the journal…</div>';
  let demo = !!(window.DEMO_ACCT || window.GUEST);
  try {
    let data;
    try { data = await jpFetch(demo); }
    catch (e) {
      // Same fallbacks the panel had: a gated feed shows the demo book rather than a
      // dead page, and a status-less rejection is usually a server mid-restart.
      if (!demo && (e.status === 401 || e.status === 403)) { demo = true; data = await jpFetch(true); }
      else if (!e.status) { await new Promise(r => setTimeout(r, 1500)); data = await jpFetch(demo); }
      else throw e;
    }
    jpData = data;
    jpSliceCache[jpSlice] = data.slice;   // the slice this load already brought (#3541)
    jpRender(host, data);
    jpStampLoaded();
  } catch (e) {
    const network = !(e && e.status);
    host.innerHTML = '<div class="jp-empty">'
      + (network ? 'The server didn’t answer — it may be restarting.' : 'The server said ' + jpEsc(e.message) + '.')
      + ' Nothing is shown rather than something stale. '
      + '<button type="button" class="jp-chip on" style="margin-left:6px" onclick="jpLoad(true)">Retry</button></div>';
  } finally { jpBusy = false; }
}

/* Switching the breakdown used to call jpLoad(true): every endpoint fetched again and the
   whole page repainted, scroll position and all, to change one table (#3541). Now it asks
   for that one slice, and only the first visit to a slice costs a request. */
const jpSliceCache = {};
async function jpSetSlice(k) {
  if (jpSlice === k || !JP_LABELS[k]) return;
  jpSlice = k;
  const card = document.getElementById('jpBreakdownCard');
  if (!card) return;
  if (jpSliceCache[k] === undefined) {
    card.setAttribute('aria-busy', 'true');
    const demo = !!(jpData && jpData.demo);
    const url = '/api/trading/scorecard' + (demo ? '?demo=champion&' : '?') + 'by=' + encodeURIComponent(k);
    try {
      const r = await fetch(url, { cache: 'no-store' });
      jpSliceCache[k] = r.ok ? await r.json() : null;
    } catch (_e) { jpSliceCache[k] = null; }
    card.removeAttribute('aria-busy');
    if (jpSlice !== k) return;          // clicked away while it was in flight
  }
  if (jpData) jpData.slice = jpSliceCache[k];
  card.innerHTML = jpBreakdown(jpSliceCache[k]);
}

/* The calendar's measure and its month arrows repaint the calendar card and the two tiles
   that read the same series. Nothing else on the page moves (#3541). */
function jpPaintCalendar() {
  if (!jpLast) return;
  const dsr = jpDaySeries(jpLast.daily, jpLast.liveToday, jpLast.acct);
  const card = document.getElementById('jpCalCard');
  if (card) card.innerHTML = jpCalendarCard(jpLast.daily, jpLast.liveToday, jpLast.acct);
  const tiles = document.getElementById('jpKpis');
  if (tiles) tiles.innerHTML = jpKpis(jpLast.s, jpLast.book, Object.assign(jpDayStats(dsr.days), { mode: dsr.mode }));
  // The monthly table reads the same series and marks the month on show, so it moves
  // with the measure and with the arrows rather than drifting out of agreement (#3548).
  const monthly = document.getElementById('jpMonthlyCard');
  if (monthly) monthly.innerHTML = jpMonthly(dsr);
}

/* The calendar's measure (#3517): 'account' -- the account's change each session, the
   default -- or 'booked', what closed that day. Remembered per browser; a private window
   just starts on the default. */
let jpCalMode = (function () {
  try { return localStorage.getItem('jp-cal-mode') === 'booked' ? 'booked' : 'account'; }
  catch (_e) { return 'account'; }
})();
function jpSetCalMode(m) {
  if (m !== 'account' && m !== 'booked') return;
  if (jpCalMode === m) return;
  jpCalMode = m;
  try { localStorage.setItem('jp-cal-mode', m); } catch (_e) { /* not remembered, still switches */ }
  jpPaintCalendar();
}

/* Derived from `daily`, not invented: a day counts as a win when its realized P&L is
   positive, which is the same rule the day-win figure uses in the products this page
   is modelled on. */
function jpDayStats(daily) {
  const d = daily || [];
  const traded = d.filter(x => typeof x.pnl === 'number' && x.pnl !== 0);
  const wins = traded.filter(x => x.pnl > 0).length;
  let streak = 0, dir = 0;
  for (let i = d.length - 1; i >= 0; i--) {
    const p = d[i].pnl;
    if (!p) break;
    const s = p > 0 ? 1 : -1;
    if (!dir) dir = s; else if (s !== dir) break;
    streak++;
  }
  return { tradingDays: traded.length, dayWinRate: traded.length ? (wins / traded.length) * 100 : null, streak, dir };
}

/* The day tiles read the calendar's measure (#3538). The calendar shows the account's
   change per session by default (#3517), but Current streak and Day win % still counted
   booked days. So on 2026-09-11 the calendar showed seven green sessions in a row while
   the tile said "2 winning days" -- 9/9 had no closes. Same series as the calendar now:
   Account -- every session from the account, today's live figure included; Booked --
   what closed each day. Account days start at the journal's first booked day, so the
   day win rate covers the same window as every other tile. A flat "today so far" is
   left out rather than read as a session that broke the run. */
function jpDaySeries(daily, liveToday, acct) {
  const d = daily || [];
  const mode = (jpCalMode === 'account' && acct) ? 'account' : 'booked';
  if (mode === 'booked') return { mode, days: d };
  const m = Object.assign({}, acct);
  if (liveToday && liveToday.pnl) m[liveToday.date] = liveToday.pnl;
  const from = d.length ? d[0].date : '';
  const days = Object.keys(m).filter(k => k >= from).sort().map(k => ({ date: k, pnl: m[k] }));
  return { mode, days };
}

function jpKpis(s, book, ds) {
  const dd = book.maxDrawdown || { amount: 0 };
  const card = (k, v, cls, sub) => '<div class="jp-kpi"><div class="k">' + k + '</div>'
    + '<div class="v ' + (cls || '') + '">' + v + '</div>'
    + '<div class="s">' + (sub || '&nbsp;') + '</div></div>';
  // The labels name the measure the calendar is showing (#3538).
  const acctMode = ds.mode === 'account';
  const plural = (n) => (n === 1 ? '' : 's');
  const streakTxt = !ds.streak ? 'no run'
    : ds.streak + (acctMode ? (ds.dir > 0 ? ' green session' : ' red session') : (ds.dir > 0 ? ' winning day' : ' losing day'))
      + plural(ds.streak);
  return '<div class="jp-kpis">'
    + card('Net P&amp;L', jpUsd(s.totalRealized), jpSign(s.totalRealized), s.trades + ' closed trade' + (s.trades === 1 ? '' : 's'))
    + card('Trade win %', jpPct(s.winRate), '', 'risk exits only: ' + jpPct(s.riskExitWinRate))
    + card('Profit factor', (typeof s.profitFactor === 'number' && isFinite(s.profitFactor)) ? s.profitFactor.toFixed(2) : '—', '',
           'gross win ÷ gross loss')
    + card('Day win %', ds.dayWinRate == null ? '—' : jpPct(ds.dayWinRate), '',
           ds.tradingDays + (acctMode ? ' session' : ' trading day') + plural(ds.tradingDays))
    // The paired amounts wrapped to two lines while every other card was one figure.
    // The RATIO is the headline metric anyway -- how much a winner returns per dollar a
    // loser costs -- so it leads, and both amounts sit underneath where they still read.
    + card('Avg win / loss',
           (typeof s.avgWin === 'number' && typeof s.avgLoss === 'number' && Math.abs(s.avgLoss) > 0)
             ? (s.avgWin / Math.abs(s.avgLoss)).toFixed(2)
             : '—',
           // Above 1.0 means the average winner outruns the average loser. Colour it
           // by that, not by the sum -- the headline figure IS the ratio.
           (Math.abs(s.avgLoss) > 0 ? jpSign((s.avgWin / Math.abs(s.avgLoss)) - 1) : ''),
           jpUsd(s.avgWin) + ' win · ' + jpUsd(s.avgLoss) + ' loss')
    + card('Expectancy', jpUsd(s.expectancy), jpSign(s.expectancy), 'per trade')
    + card('Max drawdown', jpUsd(-Math.abs(dd.amount || 0)), 'jp-neg',
           dd.peakDate ? (jpEsc(dd.peakDate) + ' → ' + jpEsc(dd.troughDate || '')) : 'peak to trough')
    + card('Current streak', String(ds.streak || 0), ds.streak ? (ds.dir > 0 ? 'jp-pos' : 'jp-neg') : '', streakTxt)
    + '</div>';
}

/* Cumulative realized P&L. Deliberately a plain SVG: it is one series and a zero line,
   and a charting library for that would be more code than the chart. */

/* Per-day bars, so a single outsized day is visible as one day rather than as a step
   in the cumulative line. */

/* Today's live figure, or null (#3502). The number is the one the trader's header
   shows -- realized today plus today's move on open positions, worked out by the server
   (routes/trading/market.js). It is $0 before the open and on a day with no session, and
   a blank cell says that better than "$0.00 live" would -- so a zero, a weekend or a
   missing account shows nothing at all. */
function jpLiveToday(live, now) {
  if (!live || live.pnl_today == null) return null;
  const pnl = Number(live.pnl_today);
  if (!isFinite(pnl) || pnl === 0) return null;
  const t = now || new Date();
  let date = '';
  try { date = t.toLocaleDateString('en-CA', { timeZone: 'America/New_York' }); } catch (_e) { return null; }
  const wd = new Date(date + 'T12:00:00Z').getUTCDay();
  if (wd === 0 || wd === 6) return null;
  let asOf = '';
  try { asOf = t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); } catch (_e) { /* cosmetic */ }
  return { date, pnl, equity: Number(live.equity), source: String(live.source || ''), asOf };
}

/* The calendar card (#3517): the measure toggle rides in the heading the way the
   Breakdown's does, and one line under the grid says which measure is showing. */
function jpCalendarCard(daily, liveToday, acct) {
  const mode = (jpCalMode === 'account' && acct) ? 'account' : 'booked';
  const chip = (m, label, title) => '<button type="button" class="jp-chip' + (mode === m ? ' on' : '') + '"'
    + ' onclick="jpSetCalMode(\'' + m + '\')" title="' + jpEsc(title) + '">' + label + '</button>';
  const chips = acct
    ? '<span class="sp">' + chip('account', 'Account', 'Each day: the account’s change from the previous close')
      + chip('booked', 'Booked', 'Each day: what closed that day') + '</span>'
    : '';
  const note = !acct ? ''
    : mode === 'account'
      ? '<p class="jp-note">Each day is the account’s change from the previous close, open positions included, '
        + 'straight from the broker. <b>Booked</b> shows only what closed that day.</p>'
      : '<p class="jp-note">Each day is what closed that day: a trade held across days books on the day it closes, '
        + 'so a day spent holding is blank. <b>Account</b> shows every session.</p>';
  return '<h2>P&amp;L calendar' + chips + '</h2>' + jpCalendar(daily, liveToday, acct) + note;
}

/* The calendar is the piece both TradeZella and TraderWaves put front and centre, and
   the weekly column on the right is the part that makes it more than decoration. */
function jpCalendar(daily, liveToday, acct) {
  const byDate = {};
  (daily || []).forEach(d => { byDate[d.date] = d; });
  // ONE measure per view (#3517). Mixed in one grid, a week total would count a trade
  // twice: once while the account carries it, again on the day it books.
  const mode = (jpCalMode === 'account' && acct) ? 'account' : 'booked';
  const valueOf = (iso) => {
    if (mode === 'account') {
      if (liveToday && iso === liveToday.date) return liveToday.pnl;
      return (typeof acct[iso] === 'number') ? acct[iso] : null;
    }
    return byDate[iso] ? byDate[iso].pnl : null;
  };
  const dates = (mode === 'account' ? Object.keys(acct) : Object.keys(byDate)).sort();
  const months = jpMonthList(dates, (mode === 'account' && liveToday) ? liveToday.date : null);
  if (!months.length) return '<div class="jp-empty">No closed days yet.</div>';
  if (!jpMonth || months.indexOf(jpMonth) < 0) jpMonth = months[months.length - 1];
  const [yy, mm] = jpMonth.split('-').map(Number);
  const first = new Date(Date.UTC(yy, mm - 1, 1));
  const days = new Date(Date.UTC(yy, mm, 0)).getUTCDate();
  const lead = first.getUTCDay();                       // 0=Sun, matching the header row
  const monthName = first.toLocaleString(undefined, { month: 'long', year: 'numeric', timeZone: 'UTC' });
  const idx = months.indexOf(jpMonth);

  /* The calendar's rows are exchange days, so "today" is the exchange day too --
     en-CA gives YYYY-MM-DD directly, which is the shape the ledger already uses. */
  let todayIso = '';
  try { todayIso = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' }); }
  catch (_e) { todayIso = new Date().toISOString().slice(0, 10); }
  let weekPnl = 0, weekHasData = false, weekLive = false, out = '';
  const flushWeek = () => {
    out += '<div class="jp-week' + (weekLive ? ' live' : '') + '"'
      + (weekLive ? ' title="Includes today\'s live figure."' : '')
      + '><div class="l">Week</div><div class="v ' + (weekHasData ? jpSign(weekPnl) : 'jp-dim') + '">'
      + (weekHasData ? jpUsd(weekPnl) : '—') + '</div></div>';
    weekPnl = 0; weekHasData = false; weekLive = false;
  };
  for (let i = 0; i < lead; i++) out += '<div class="jp-day empty"></div>';
  let col = lead;
  for (let d = 1; d <= days; d++) {
    const iso = jpMonth + '-' + String(d).padStart(2, '0');
    const rec = byDate[iso];
    /* Today, live (#3502): in the account view today's cell is the broker's figure for
       the session so far, open positions included; at the close it becomes an ordinary
       day. The booked view shows only what has actually closed today. */
    const lv = (mode === 'account' && liveToday && iso === liveToday.date) ? liveToday : null;
    const val = valueOf(iso);
    const cls = lv ? 'live' : (val != null ? (val > 0 ? 'win' : val < 0 ? 'loss' : 'flat') : '');
    const isToday = (iso === todayIso) ? ' today' : '';
    if (val != null) { weekPnl += val; weekHasData = true; if (lv) weekLive = true; }
    let tip = '';
    if (lv) {
      tip = 'Live: today so far, from the broker, open positions included' + (lv.asOf ? ' (as of ' + lv.asOf + ')' : '')
        + '. It settles into an ordinary day at the close.' + (rec ? ' Booked so far today: ' + jpUsd(rec.pnl) + '.' : '');
    } else if (val != null && mode === 'account') {
      tip = 'Account: ' + jpUsd(val) + ', the broker’s close against the one before, open positions included.'
        + (rec ? ' Booked from trades that closed this day: ' + jpUsd(rec.pnl) + '.' : ' No trade closed this day.');
    } else if (val != null) {
      const moved = acct && typeof acct[iso] === 'number' ? acct[iso] : null;
      tip = 'Booked: ' + jpUsd(val) + ' from trades that closed this day.'
        + (moved != null ? ' The account itself moved ' + jpUsd(moved) + '.' : '');
    }
    out += '<div class="jp-day ' + cls + isToday + '"'
      + (isToday ? ' aria-current="date"' : '') + (tip ? ' title="' + jpEsc(tip) + '"' : '')
      + '><div class="d">' + d + (lv ? '<span class="lv">live</span>' : '') + '</div>'
      + '<div class="p ' + (val != null ? jpSign(val) : 'jp-dim') + '">'
      + (val != null ? '<span class="p-full">' + jpUsd(val) + '</span><span class="p-abbr">' + jpUsdShort(val) + '</span>' : '')
      + '</div></div>';
    col++;
    if (col === 7) { flushWeek(); col = 0; }
  }
  if (col !== 0) { for (let i = col; i < 7; i++) out += '<div class="jp-day empty"></div>'; flushWeek(); }

  return '<div class="jp-monthbar">'
    + '<button type="button" class="jp-navb" onclick="jpShiftMonth(-1)"' + (idx <= 0 ? ' disabled' : '') + ' aria-label="Previous month">‹</button>'
    + '<button type="button" class="jp-navb" onclick="jpShiftMonth(1)"' + (idx >= months.length - 1 ? ' disabled' : '') + ' aria-label="Next month">›</button>'
    + '<span class="m">' + jpEsc(monthName) + '</span></div>'
    + '<div class="jp-cal-head"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Total</span></div>'
    + '<div class="jp-cal">' + out + '</div>';
}
/* The months the calendar can show for the measure it is showing (#3517), so the
   arrows walk exactly the months the grid would draw. */
function jpMonthList(dates, extraIso) {
  return Array.from(new Set(dates.map(d => d.slice(0, 7)).concat(extraIso ? [extraIso.slice(0, 7)] : []))).sort();
}
function jpCalMonths(data) {
  const daily = ((data && data.rec && Object.values(data.rec.books || {})[0]) || {}).daily || [];
  const acct = (data && !data.demo) ? jpAccountDaily(data.equity) : null;
  const lt = (data && !data.demo) ? jpLiveToday(data.live) : null;
  if (jpCalMode === 'account' && acct) return jpMonthList(Object.keys(acct), lt ? lt.date : null);
  return jpMonthList(daily.map(d => d.date), null);
}
function jpShiftMonth(n) {
  const months = jpCalMonths(jpData);
  const i = months.indexOf(jpMonth);
  if (i < 0) return;
  const next = months[i + n];
  if (!next) return;
  jpMonth = next;
  jpPaintCalendar();
}

function jpBreakdown(slice) {
  /* The scorecard does NOT return `rows`. It returns an object keyed by the slice value
     under two headings: `confirmed` = broker-accepted fills, `all` = every exit decision
     including the ones that never filled. Reading .rows silently produced an empty table
     for every slice, which looked like "no data" rather than like a bug.
     Supported slices come from the API itself: symbol, hour, reason, skip. `weekday` is
     not one of them -- offering it returned unknown_breakdown. */
  const SLICES = ['symbol', 'hour'];
  const chips = SLICES.map(k =>
    '<button type="button" class="jp-chip' + (jpSlice === k ? ' on' : '') + '" onclick="jpSetSlice(\'' + k + '\')">'
    + jpEsc(JP_LABELS[k] || k) + '</button>').join('');
  const head = '<h2>Breakdown<span class="sp">' + chips + '</span></h2>';
  const bucket = (slice && slice.confirmed) || {};
  const keys = Object.keys(bucket);
  if (!keys.length) return head + '<div class="jp-empty">Nothing to break down yet.</div>';
  const rows = keys.map(k => Object.assign({ key: k }, bucket[k]))
    .sort((a, b) => (b.totalRealized || 0) - (a.totalRealized || 0));
  return head
    + '<div class="jp-scroll"><table class="jp-table"><thead><tr>'
    + '<th scope="col">' + jpEsc(JP_LABELS[jpSlice] || jpSlice) + '</th><th scope="col" class="num">Trades</th>'
    + '<th scope="col" class="num">Win %</th><th scope="col" class="num">Realized</th></tr></thead><tbody>'
    + rows.map(r => '<tr><td>' + jpEsc(jpLabelValue(r.key)) + '</td>'
      + '<td class="num">' + (r.trades != null ? r.trades : '—') + '</td>'
      + '<td class="num">' + jpPct(r.winRate) + '</td>'
      + '<td class="num ' + jpSign(r.totalRealized) + '">' + jpUsd(r.totalRealized) + '</td></tr>').join('')
    + '</tbody></table></div>'
    + '<p class="jp-note">Broker-accepted fills only.</p>';
}
/* signal_exit -> "signal exit". The engine's keys are snake_case internally. */
function jpLabelValue(k) { return String(k == null ? '—' : k).replace(/_/g, ' '); }

/* Symbol statistics (#3547) -- where the trader makes and loses money.
   Every journal we looked at has a version of this, and it is the one competitor feature
   that survives the translation: TradeZella and RocketSheets are built for someone
   reviewing their OWN decisions (tags, mistakes, setups), which our reader never made.
   "Which symbols is it good at?" they can act on -- it is the tradelist question.

   No new endpoint: this is the by=symbol slice the breakdown card already loaded, shown
   in full. Sorting happens here, in rows the page already holds, so a click costs nothing. */
const JP_THIN_TRADES = 5;    // below this, a win rate is noise dressed as a number
const JP_SYM_COLS = [
  { key: 'key', label: 'Symbol', dir: 1 },
  { key: 'trades', label: 'Trades', num: true, fmt: (r) => (r.trades != null ? String(r.trades) : '\u2014') },
  { key: 'winRate', label: 'Win %', num: true, fmt: (r) => jpPct(r.winRate) },
  { key: 'totalRealized', label: 'Realized', num: true, sign: true, fmt: (r) => jpUsd(r.totalRealized) },
  { key: 'avgWin', label: 'Avg win', num: true, fmt: (r) => jpUsd(r.avgWin) },
  { key: 'avgLoss', label: 'Avg loss', num: true, fmt: (r) => jpUsd(r.avgLoss) },
  { key: 'expectancy', label: 'Per trade', num: true, sign: true, fmt: (r) => jpUsd(r.expectancy) },
  { key: 'profitFactor', label: 'Profit factor', num: true, fmt: (r) => jpProfitFactor(r),
    /* A symbol that has never lost shows as infinite, so it must SORT as infinite too --
       otherwise the biggest number in the column sits at the bottom of a descending sort. */
    sortVal: (r) => (typeof r.profitFactor === 'number' && isFinite(r.profitFactor) ? r.profitFactor
      : (!r.losses && r.wins ? Infinity : null)) },
];
let jpSymSort = { key: 'totalRealized', dir: -1 };

/* profitFactor is Infinity when a symbol has never lost -- and JSON turns Infinity into
   null, which is the same thing it sends for "not computed". The row itself settles it:
   wins with no losses is an infinite factor, not a missing one. */
function jpProfitFactor(r) {
  if (typeof r.profitFactor === 'number' && isFinite(r.profitFactor)) return r.profitFactor.toFixed(2);
  if (!r.losses && r.wins) return '\u221e';
  return '\u2014';
}

/* Pure: the confirmed bucket as sorted rows. Missing values sort last in BOTH directions,
   so a symbol the scorecard could not price never heads the table. */
function jpSymbolRows(slice, sort) {
  const bucket = (slice && slice.confirmed) || {};
  const rows = Object.keys(bucket).map((k) => Object.assign({ key: k }, bucket[k]));
  const key = (sort && sort.key) || 'totalRealized';
  const dir = (sort && sort.dir === 1) ? 1 : -1;
  const col = JP_SYM_COLS.find((c) => c.key === key);
  const val = (r) => {
    if (col && col.sortVal) { const c = col.sortVal(r); return (typeof c === 'number' && !isNaN(c)) ? c : null; }
    const v = r[key];
    if (key === 'key') return String(v == null ? '' : v);
    return (typeof v === 'number' && isFinite(v)) ? v : null;
  };
  return rows.sort((a, b) => {
    const x = val(a), y = val(b);
    if (x === null && y === null) return String(a.key).localeCompare(String(b.key));
    if (x === null) return 1;                       // no value: last, either way
    if (y === null) return -1;
    if (typeof x === 'string') return dir * x.localeCompare(y);
    return x === y ? String(a.key).localeCompare(String(b.key)) : dir * (x < y ? -1 : 1);
  });
}

function jpSymbols(slice) {
  const head = '<h2>Symbol statistics</h2>';
  if (slice === undefined) return head + '<div class="jp-empty" aria-busy="true">Loading\u2026</div>';
  const rows = jpSymbolRows(slice, jpSymSort);
  if (!rows.length) return head + '<div class="jp-empty">No closed trades to break down by symbol yet.</div>';
  const thin = rows.some((r) => (r.trades || 0) < JP_THIN_TRADES);
  const arrow = (c) => (jpSymSort.key === c.key ? (jpSymSort.dir === 1 ? ' \u25b2' : ' \u25bc') : '');
  const th = JP_SYM_COLS.map((c) =>
    '<th scope="col"' + (c.num ? ' class="num"' : '')
    + (jpSymSort.key === c.key ? ' aria-sort="' + (jpSymSort.dir === 1 ? 'ascending' : 'descending') + '"' : '')
    + '><button type="button" class="jp-sort" onclick="jpSetSymSort(\'' + c.key + '\')">'
    + jpEsc(c.label) + arrow(c) + '</button></th>').join('');
  const tr = rows.map((r) => {
    const few = (r.trades || 0) < JP_THIN_TRADES;
    return '<tr>' + JP_SYM_COLS.map((c) => {
      const cls = (c.num ? 'num' : '') + (c.sign ? ' ' + jpSign(r[c.key]) : '');
      const text = c.key === 'key' ? jpEsc(jpLabelValue(r.key)) : c.fmt(r);
      const mark = (c.key === 'trades' && few) ? '<span class="jp-dim" aria-hidden="true">\u2020</span> ' : '';
      return '<td' + (cls.trim() ? ' class="' + cls.trim() + '"' : '') + '>' + mark + text + '</td>';
    }).join('') + '</tr>';
  }).join('');
  return head
    + '<div class="jp-scroll"><table class="jp-table"><thead><tr>' + th + '</tr></thead><tbody>' + tr + '</tbody></table></div>'
    + '<p class="jp-note">Broker-accepted fills only. Per trade is expectancy \u2014 the average dollar outcome of one trade in this symbol.'
    + (thin ? ' \u2020 fewer than ' + JP_THIN_TRADES + ' closed trades: those rates are not yet a measurement.' : '') + '</p>';
}

/* A header click re-sorts rows already in hand and repaints one card. Same rule as the
   slice chips (#3541): nothing on this page reloads the record to change how it looks. */
function jpSetSymSort(key) {
  const col = JP_SYM_COLS.find((c) => c.key === key);
  if (!col) return;
  jpSymSort = (jpSymSort.key === key)
    ? { key: key, dir: jpSymSort.dir === 1 ? -1 : 1 }
    : { key: key, dir: col.dir === 1 ? 1 : -1 };     // names read A-Z, figures biggest first
  const card = document.getElementById('jpSymbolsCard');
  if (card) card.innerHTML = jpSymbols(jpSliceCache.symbol);
}

/* The page loads with the symbol slice (jpSlice starts there), so this normally does
   nothing. It covers the one case that would otherwise leave an empty card forever: the
   slice never arrived, or a later page starts on a different one. */
async function jpEnsureSymbols() {
  if (jpSliceCache.symbol !== undefined) return;
  if (!document.getElementById('jpSymbolsCard')) return;
  const demo = !!(jpData && jpData.demo);
  try {
    const r = await fetch('/api/trading/scorecard' + (demo ? '?demo=champion&' : '?') + 'by=symbol', { cache: 'no-store' });
    jpSliceCache.symbol = r.ok ? await r.json() : null;
  } catch (_e) { jpSliceCache.symbol = null; }
  const card = document.getElementById('jpSymbolsCard');
  if (card) card.innerHTML = jpSymbols(jpSliceCache.symbol);
}

/* Monthly report (#3548) -- months against each other.
   A trading record is noise at the trade level and signal at the month level, which is
   why RocketSheets sells a Monthly Reports sheet and TradeZella leads its dashboard with
   one. The calendar already shows a month; nothing showed months side by side, and that
   is the view that answers "is this getting better or worse" -- the question a reader of
   an autonomous trader asks most, because they cannot read it off the strategy.

   It follows the calendar's measure, so the two never disagree: 'account' counts every
   session the broker reports, 'booked' counts what closed that day.

   There is no trade count here on purpose. The daily series carries {date, pnl, cum} and
   no per-day trade count, so "trades this month" would have to be invented or fetched.
   Trading days is the honest column, and it is the one the day-win figure already uses. */
function jpMonthRows(days) {
  const byMonth = new Map();
  for (const d of (days || [])) {
    if (!d || typeof d.date !== 'string' || d.date.length < 7) continue;
    const m = d.date.slice(0, 7);
    if (!/^\d{4}-\d{2}$/.test(m)) continue;
    if (!byMonth.has(m)) byMonth.set(m, []);
    byMonth.get(m).push(d);
  }
  const rows = [];
  byMonth.forEach((ds, month) => {
    ds.sort((a, b) => (a.date < b.date ? -1 : 1));
    // A day with no P&L is not a trading day -- the same rule the day-win tile uses.
    const traded = ds.filter((x) => typeof x.pnl === 'number' && isFinite(x.pnl) && x.pnl !== 0);
    let pnl = 0, cum = 0, peak = 0, dd = 0, best = null, worst = null, wins = 0;
    for (const x of traded) {
      pnl += x.pnl;
      cum += x.pnl;
      if (cum > peak) peak = cum;
      if (peak - cum > dd) dd = peak - cum;      // the worst run-down INSIDE the month
      if (!best || x.pnl > best.pnl) best = x;
      if (!worst || x.pnl < worst.pnl) worst = x;
      if (x.pnl > 0) wins++;
    }
    const round = (n) => Math.round(n * 100) / 100;
    rows.push({ month, days: traded.length, winRate: traded.length ? (wins / traded.length) * 100 : null,
      pnl: round(pnl), best, worst, drawdown: round(dd) });
  });
  return rows.sort((a, b) => (a.month < b.month ? 1 : -1));   // newest first: this month is the one being lived
}

/* 2026-09 -> "Sep 2026", built from the numbers rather than parsed, so no timezone can
   turn the first of a month into the last of the one before. */
function jpMonthLabel(m) {
  const [y, mo] = String(m || '').split('-').map(Number);
  if (!y || !mo) return String(m || '');
  try { return new Date(y, mo - 1, 1).toLocaleDateString(undefined, { month: 'short', year: 'numeric' }); }
  catch (_e) { return m; }
}

/* 2026-09-04 -> "Sep 4", built from the numbers for the same reason jpMonthLabel is:
   parsing a bare date string is a timezone away from naming the day before. */
function jpShortDate(iso) {
  const [y, m, d] = String(iso || '').split('-').map(Number);
  if (!y || !m || !d) return String(iso || '');
  try { return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
  catch (_e) { return String(iso); }
}

function jpMonthly(ds) {
  const head = '<h2>Monthly report</h2>';
  const rows = jpMonthRows(ds && ds.days);
  if (!rows.length) return head + '<div class="jp-empty">Nothing to summarise by month yet.</div>';
  const max = rows.reduce((m, r) => Math.max(m, Math.abs(r.pnl)), 0) || 1;
  /* "$154.27 04" reads as a count, not a date. Name the day. */
  const dayCell = (d) => (d ? '<span class="' + jpSign(d.pnl) + '">' + jpUsd(d.pnl) + '</span>'
    + ' <span class="jp-dim">' + jpEsc(jpShortDate(d.date)) + '</span>' : '\u2014');
  const body = rows.map((r) => {
    // The bar is the P&L cell's own background, so it needs no column and cannot be read
    // as a figure in its own right. Scaled against the biggest month, either direction.
    const pct = Math.round((Math.abs(r.pnl) / max) * 100);
    const tint = r.pnl >= 0 ? 'var(--green)' : 'var(--red)';
    const bar = pct > 0
      ? ' style="background:linear-gradient(to left, color-mix(in srgb, ' + tint + ' 18%, transparent) '
        + pct + '%, transparent ' + pct + '%)"'
      : '';
    return '<tr' + (r.month === jpMonth ? ' class="on"' : '') + '>'
      + '<td><button type="button" class="jp-linkish" onclick="jpGotoMonth(\'' + r.month + '\')"'
      + ' aria-label="Show ' + jpEsc(jpMonthLabel(r.month)) + ' on the calendar">' + jpEsc(jpMonthLabel(r.month)) + '</button></td>'
      + '<td class="num">' + r.days + '</td>'
      + '<td class="num">' + jpPct(r.winRate) + '</td>'
      + '<td class="num ' + jpSign(r.pnl) + '"' + bar + '>' + jpUsd(r.pnl) + '</td>'
      + '<td class="num">' + dayCell(r.best) + '</td>'
      + '<td class="num">' + dayCell(r.worst) + '</td>'
      + '<td class="num ' + (r.drawdown > 0 ? 'jp-neg' : 'jp-dim') + '">' + (r.drawdown > 0 ? jpUsd(-r.drawdown) : '\u2014') + '</td>'
      + '</tr>';
  }).join('');
  const acct = ds && ds.mode === 'account';
  return head
    + '<div class="jp-scroll"><table class="jp-table"><thead><tr>'
    + '<th scope="col">Month</th><th scope="col" class="num">' + (acct ? 'Sessions' : 'Trading days') + '</th>'
    + '<th scope="col" class="num">Day win %</th><th scope="col" class="num">P&amp;L</th>'
    + '<th scope="col" class="num">Best day</th><th scope="col" class="num">Worst day</th>'
    + '<th scope="col" class="num">Drawdown</th>'
    + '</tr></thead><tbody>' + body + '</tbody></table></div>'
    + '<p class="jp-note">'
    + (acct ? 'Every session the account reported, today included.' : 'What closed each day \u2014 a trade held across days books on the day it closes.')
    + ' Drawdown is the worst run-down inside that month, not since the start. Pick a month to show it on the calendar.</p>';
}

/* Zero requests: the calendar is already holding every day of every month. */
function jpGotoMonth(m) {
  if (!/^\d{4}-\d{2}$/.test(String(m || ''))) return;
  if (jpCalMonths(jpData).indexOf(m) < 0) return;      // a month the calendar cannot show
  jpMonth = m;
  jpPaintCalendar();
  const cal = document.getElementById('jpCalCard');
  if (cal) { try { cal.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (_e) { cal.scrollIntoView(); } }
}

/* Weekday x hour (#3549) -- when the trader is strong.
   TradeZella's most-cited feature is its day/time analysis, and for a discretionary
   trader it is a discipline tool: stop trading after 3pm. Here it is something better --
   evidence about the trader's own behaviour that the reader cannot get any other way,
   because they never see the strategy. If it is systematically worse in the last hour on
   Mondays, that is a fact about our product they are entitled to see, and one we would
   want to act on.

   Weekday AND hour together, because neither alone can show it: a trader can be fine at
   10am overall and lose only at 10am on Mondays. That is why this needed a new bucketing
   key (by=weekday-hour) rather than another reading of by=hour.

   Colour is decoration. Every cell also carries its figure, because a grid whose meaning
   lives only in hue is unreadable to a chunk of the people looking at it. */
const JP_WEEK_ORDER = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

/* Pure: the bucket object as a grid. Only the weekdays and hours that actually traded get
   a row or a column -- an empty 7x24 grid of blanks says nothing and hides the shape. */
function jpHeatGrid(slice) {
  const bucket = (slice && slice.confirmed) || {};
  const cells = {};
  const days = new Set(), hours = new Set();
  for (const key of Object.keys(bucket)) {
    const i = key.indexOf(' ');
    if (i < 1) continue;
    const day = key.slice(0, i);
    const hour = key.slice(i + 1, i + 3);
    if (JP_WEEK_ORDER.indexOf(day) < 0 || !/^\d\d$/.test(hour)) continue;
    days.add(day);
    hours.add(hour);
    cells[day + hour] = bucket[key];
  }
  const weekdays = JP_WEEK_ORDER.filter((d) => days.has(d));
  const hourList = [...hours].sort();
  let max = 0;
  for (const k of Object.keys(cells)) {
    const e = cells[k] && cells[k].expectancy;
    if (typeof e === 'number' && isFinite(e)) max = Math.max(max, Math.abs(e));
  }
  return { weekdays, hours: hourList, cells, max };
}

function jpHeatmap(slice) {
  const head = '<h2>Weekday &times; hour</h2>';
  if (slice === undefined) return head + '<div class="jp-empty" aria-busy="true">Loading\u2026</div>';
  /* A request that failed is NOT a book with no trades. A server that does not know
     this slice yet -- an older box, a trader running behind the site -- would otherwise
     tell someone who has traded all week that they have never traded. */
  if (slice === null) {
    return head + '<div class="jp-empty">The week could not be loaded. Every other figure on this page is unaffected.</div>';
  }
  const g = jpHeatGrid(slice);
  if (!g.weekdays.length) return head + '<div class="jp-empty">No closed trades to place on a week yet.</div>';
  let cellsWithTrades = 0, thinCells = 0;
  const cell = (day, hour) => {
    const s = g.cells[day + hour];
    if (!s || !s.trades) return '<td class="jp-heat-0"><span class="jp-dim" aria-hidden="true">\u00b7</span>'
      + '<span class="visually-hidden">no trades</span></td>';
    const e = (typeof s.expectancy === 'number' && isFinite(s.expectancy)) ? s.expectancy : 0;
    const few = s.trades < JP_THIN_TRADES;
    cellsWithTrades++;
    if (few) thinCells++;
    /* 12% at the faintest so a real cell never reads as an empty one, 52% at the
       strongest -- and a THIN cell gets a fraction of that rather than a fade over the
       whole cell. Fading the cell dimmed the figure with it, which on a pale light
       theme took it under 4:1; the signal belongs in the wash, which is decoration,
       not in the number, which is the thing being read. */
    const full = g.max > 0 ? Math.round(12 + 40 * (Math.abs(e) / g.max)) : 12;
    const strength = few ? Math.round(full * 0.4) : full;
    // The wash, not the text colour -- see --tint-pos/--tint-neg.
    const tint = e >= 0 ? 'var(--tint-pos)' : 'var(--tint-neg)';
    const label = day + ' ' + hour + ':00 ET \u2014 ' + s.trades + ' trade' + (s.trades === 1 ? '' : 's')
      + ', ' + jpPct(s.winRate) + ' win, ' + jpUsd(e) + ' per trade, ' + jpUsd(s.totalRealized) + ' in total'
      + (few ? ' (too few to measure)' : '');
    return '<td class="jp-heat-c' + (few ? ' few' : '') + '"'
      + ' style="background:color-mix(in srgb, ' + tint + ' ' + strength + '%, transparent)"'
      + ' title="' + jpEsc(label) + '"><span class="' + jpSign(e) + '">'
      + jpEsc((e > 0 ? '+' : '') + (jpUsdShort(e) || '$0')) + '</span>'
      + '<span class="visually-hidden">' + jpEsc(label) + '</span></td>';
  };
  const body = g.weekdays.map((d) => '<tr><th scope="row">' + jpEsc(d) + '</th>'
    + g.hours.map((h) => cell(d, h)).join('') + '</tr>').join('');
  return head
    + '<div class="jp-scroll"><table class="jp-table jp-heat">'
    + '<thead><tr><th scope="col"><span class="visually-hidden">Weekday</span></th>'
    + g.hours.map((h) => '<th scope="col">' + jpEsc(h) + '</th>').join('')
    + '</tr></thead><tbody>' + body + '</tbody></table></div>'
    + '<p class="jp-note">Each cell is what one trade entered in that hour returned on average \u2014 expectancy, '
    + 'not the total, so a single big winner cannot light up an hour it only traded once. Hours are ET, '
    + 'broker-accepted fills only.'
    + jpHeatCaveat(cellsWithTrades, thinCells) + '</p>';
}

/* A grid where EVERY cell is thin is not a grid with some faded cells in it -- naming
   "faded cells" there points at a contrast the reader cannot see, and quietly suggests
   the rest is solid. Say which of the two it is. */
function jpHeatCaveat(cells, thinCells) {
  if (!thinCells) return '';
  if (thinCells === cells) {
    return ' Every cell here has fewer than ' + JP_THIN_TRADES + ' trades — this is the shape so far, not a measurement.';
  }
  return ' Faded cells have fewer than ' + JP_THIN_TRADES + ' trades: shape, not measurement.';
}

/* One fetch, the first time this card is on the page, then cached like every other slice. */
async function jpEnsureHeatmap() {
  if (jpSliceCache['weekday-hour'] !== undefined) return;
  if (!document.getElementById('jpHeatCard')) return;
  const demo = !!(jpData && jpData.demo);
  try {
    const r = await fetch('/api/trading/scorecard' + (demo ? '?demo=champion&' : '?') + 'by=weekday-hour', { cache: 'no-store' });
    jpSliceCache['weekday-hour'] = r.ok ? await r.json() : null;
  } catch (_e) { jpSliceCache['weekday-hour'] = null; }
  const card = document.getElementById('jpHeatCard');
  if (card) card.innerHTML = jpHeatmap(jpSliceCache['weekday-hour']);
}

/* R multiples (#3550) -- the shape of the outcomes, not their average.
   A reader looking at "+$3,000" cannot tell many small wins from one lucky one. This can.
   TradeZella reports R throughout and RocketSheets computes Kelly from the same idea, but
   it matters more here than for either: this strategy's edge was measured to live in the
   exits rather than the entries, and the exit asymmetry IS this picture.

   R is the result divided by the risk taken AT ENTRY -- +1R is a winner the size of the
   stop. Dividing by anything else is not an R multiple: against a stop ratcheted to
   break-even, a full winner reads as infinite R and a scratch as a disaster. */
function jpRStat(k, v, cls, sub) {
  return '<div class="jp-rstat"><div class="k">' + k + '</div>'
    + '<div class="v ' + (cls || '') + '">' + v + '</div>'
    + '<div class="s">' + (sub || '&nbsp;') + '</div></div>';
}
const jpR = (n) => ((typeof n === 'number' && isFinite(n)) ? (n > 0 ? '+' : '') + n.toFixed(2) + 'R' : '\u2014');

function jpRDist(slice) {
  const head = '<h2>R multiples</h2>';
  if (slice === undefined) return head + '<div class="jp-empty" aria-busy="true">Loading\u2026</div>';
  if (slice === null) {
    return head + '<div class="jp-empty">The distribution could not be loaded. Every other figure on this page is unaffected.</div>';
  }
  const d = (slice && slice.confirmed) || {};
  if (!d.withR) {
    /* Not "no trades": the trades are there, their risk was never written down. Saying
       so points at the actual reason, which is also the thing that fixes itself. */
    return head + '<div class="jp-empty">'
      + (d.n ? 'None of the ' + d.n + ' closed trades recorded the stop distance they were opened with, '
             + 'so there is nothing to measure them against yet. Trades from here on do record it.'
             : 'No closed trades yet.')
      + '</div>';
  }
  const max = d.buckets.reduce((m, b) => Math.max(m, b.count), 0) || 1;
  const bars = d.buckets.map((b) => {
    const win = b.from >= 0;
    const pct = Math.round((b.count / max) * 100);
    const label = jpR(b.from) + ' to ' + jpR(b.to) + ' \u2014 ' + b.count + ' trade' + (b.count === 1 ? '' : 's');
    return '<div class="jp-rcol' + (win ? ' win' : ' loss') + (b.from === 0 ? ' zero' : '') + '" title="' + jpEsc(label) + '">'
      + '<div class="jp-rplot"><span class="n">' + (b.count || '') + '</span>'
      + '<span class="b" style="height:' + (b.count ? Math.max(pct, 2) : 0) + '%"></span></div>'
      + '<div class="x">' + jpEsc(b.from.toFixed(Math.abs(d.width) < 0.1 ? 2 : 1)) + '</div>'
      + '<span class="visually-hidden">' + jpEsc(label) + '</span></div>';
  }).join('');
  const payoffSub = (d.avgWinR != null && d.avgLossR != null)
    ? jpR(d.avgWinR) + ' win \u00b7 ' + jpR(d.avgLossR) + ' loss' : 'win \u00f7 loss';
  const stats = '<div class="jp-rstats">'
    + jpRStat('Average', jpR(d.mean), jpSign(d.mean), 'per trade')
    + jpRStat('Median', jpR(d.median), jpSign(d.median), 'the middle trade')
    // Above 1.00 means the average winner outruns the average loser, measured in risk.
    + jpRStat('Payoff', (d.payoff != null ? d.payoff.toFixed(2) : '\u2014'),
              (d.payoff != null ? jpSign(d.payoff - 1) : ''), payoffSub)
    + jpRStat('Range', jpR(d.worst) + ' \u2192 ' + jpR(d.best), '', d.wins + 'W / ' + d.losses + 'L')
    + '</div>';
  const covered = d.withR < d.n;
  return head + stats
    + '<div class="jp-scroll"><div class="jp-rhist" role="img" aria-label="'
    + jpEsc('Distribution of ' + d.withR + ' trades by R multiple, from ' + jpR(d.worst) + ' to ' + jpR(d.best)) + '">'
    + bars + '</div></div>'
    + '<p class="jp-note">R is what a trade returned divided by the risk it was opened with, '
    + 'so +1R is a winner the size of its stop. Bars are counts; the axis is the low edge of each '
    + Math.abs(d.width).toFixed(2) + 'R bucket. Broker-accepted fills only.'
    + (covered
        ? ' Measured on ' + d.withR + ' of ' + d.n + ' closed trades (' + d.coverage + '%) \u2014 the rest were '
          + 'opened before the stop distance was recorded, so they cannot be placed on this axis at all.'
        : '')
    + '</p>';
}

async function jpEnsureRDist() {
  if (jpSliceCache.r !== undefined) return;
  if (!document.getElementById('jpRCard')) return;
  const demo = !!(jpData && jpData.demo);
  try {
    const r = await fetch('/api/trading/scorecard' + (demo ? '?demo=champion&' : '?') + 'by=r', { cache: 'no-store' });
    jpSliceCache.r = r.ok ? await r.json() : null;
  } catch (_e) { jpSliceCache.r = null; }
  const card = document.getElementById('jpRCard');
  if (card) card.innerHTML = jpRDist(jpSliceCache.r);
}

/* Bringing the reader's own trades in (#3557).
   The journal reads one ledger. The autopilot writes to it; nothing else did, so a manual
   trader's journal was empty no matter how much they traded. This asks the server to read
   their connected broker's fill history, reconstruct the round trips, and write them into
   that same ledger -- after which every card on this page works on them unchanged. */
let jpImportState = null;

async function jpImportCheck() {
  try {
    const r = await fetch('/api/trading/import', { credentials: 'same-origin', cache: 'no-store' });
    if (!r.ok) return;
    jpImportState = await r.json();
  } catch (_e) { return; }           // offline: the button simply stays hidden
  const btn = document.getElementById('jpImportBtn');
  if (btn) btn.hidden = !(jpImportState && jpImportState.available);
  jpPaintImportOffer();
}

/* Only drawn in the empty state, where the reader is looking at nothing and needs to know
   why. With trades on the page the header chip is enough. */
function jpPaintImportOffer() {
  const host = document.getElementById('jpImport');
  if (!host) return;
  const st = jpImportState;
  if (!st) { host.innerHTML = ''; return; }
  if (!st.available) {
    host.innerHTML = '<p class="jp-note">' + (st.reason === 'not_signed_in'
      ? 'Sign in to bring in trades from a connected broker.'
      : 'Connect a broker in Settings and your own trades will appear here.') + '</p>';
    return;
  }
  host.innerHTML = '<button type="button" class="jp-chip on" onclick="jpRunImport()">Import my trades</button>'
    + '<p class="jp-note">Reads the fill history from the broker you have connected and writes the finished '
    + 'trades into this journal. Running it twice changes nothing.</p>';
}

async function jpRunImport() {
  const host = document.getElementById('jpImport');
  const btn = document.getElementById('jpImportBtn');
  const say = (msg) => {
    if (host) host.innerHTML = '<p class="jp-note">' + jpEsc(msg) + '</p>';
    if (btn) btn.textContent = msg;
  };
  if (btn) { btn.disabled = true; btn.textContent = 'Importing\u2026'; }
  if (host) host.innerHTML = '<p class="jp-note" aria-busy="true">Reading your broker history\u2026</p>';
  let out = null;
  try {
    const r = await fetch('/api/trading/import', { method: 'POST', credentials: 'same-origin' });
    out = await r.json();
  } catch (_e) { out = { ok: false, error: 'offline' }; }
  if (btn) btn.disabled = false;
  if (!out || !out.ok) {
    say(out && out.error === 'no_broker'
      ? 'No broker connected yet \u2014 connect one in Settings.'
      : 'The import could not finish. Nothing was changed.');
    if (btn) btn.textContent = 'Import trades';
    return;
  }
  const open = (out.stillOpen || []).length;
  if (!out.imported) {
    // Not a failure, and worth distinguishing: nothing NEW is different from nothing AT ALL.
    say(out.closedTrades
      ? 'Already up to date \u2014 all ' + out.closedTrades + ' finished trades were on record.'
      : (open ? 'Nothing finished to import yet: ' + open + ' position' + (open === 1 ? ' is' : 's are') + ' still open.'
              : 'No trades found at your broker.'));
    if (btn) btn.textContent = 'Import trades';
    return;
  }
  if (btn) btn.textContent = 'Import trades';
  // The record genuinely changed, so this is the one case where re-reading it is right.
  await jpLoad(true);
  const el = document.getElementById('jpImport');
  if (el) el.innerHTML = '<p class="jp-note">Imported ' + out.imported + ' trade'
    + (out.imported === 1 ? '' : 's') + '.</p>';
}

/* The trade log (#3558) -- the trades themselves.
   Every other card on this page is a statistic drawn from these rows, and until now there
   was nowhere to see the rows. RocketSheets opens with a Trade Log and TradeZella's core
   view is the list; we built the aggregates first and skipped the thing they aggregate.

   Sorting, filtering and paging happen on the SERVER, because sorting the page rather
   than the set would order whichever rows happen to be visible -- which looks like
   sorting and is not. Each change is one request that repaints one card: the #3541 rule
   is that the page never reloads to change how it looks, not that it never asks. */
const JP_TRADE_COLS = [
  { key: 'ts', label: 'Closed', sortable: true },
  { key: 'symbol', label: 'Symbol', sortable: true },
