  { key: 'qty', label: 'Qty', num: true, sortable: true },
  { key: 'entry', label: 'Entry', num: true },
  { key: 'exit', label: 'Exit', num: true },
  { key: 'heldMs', label: 'Held', num: true },
  { key: 'pnl', label: 'P&L', num: true, sortable: true },
  { key: 'pnl_pct', label: '%', num: true, sortable: true },
  { key: 'r', label: 'R', num: true, sortable: true },
];
let jpTradeQ = { limit: 25, offset: 0, sort: 'ts', dir: 'desc', symbol: '', result: 'all' };
let jpTradeData = null;
const jpTradeOpen = new Set();

/* 3.5 hours reads better than 12,600,000. Days once a position has been held overnight,
   because at that point the minutes are noise. */
function jpHeld(ms) {
  if (typeof ms !== 'number' || !isFinite(ms) || ms < 0) return '\u2014';
  const m = Math.round(ms / 60000);
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '');
  const d = Math.floor(h / 24);
  return d + 'd' + (h % 24 ? ' ' + (h % 24) + 'h' : '');
}

function jpTradeWhen(ts) {
  if (!ts) return '\u2014';
  const d = new Date(ts);
  if (!isFinite(d.getTime())) return String(ts).slice(0, 10);
  try {
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch (_e) { return String(ts).slice(0, 16).replace('T', ' '); }
}

/* What the row has that the table has no column for -- and, as importantly, what it does
   NOT have. An imported manual trade has no engine reason and no excursions; saying so is
   the difference between an honest record and one that looks like a zero. */
function jpTradeDetail(t) {
  const bit = (k, v) => '<div><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
  const pct = (n) => (typeof n === 'number' && isFinite(n) ? (n > 0 ? '+' : '') + n.toFixed(2) + '%' : '\u2014');
  const src = t.source === 'broker-import' ? 'imported from your broker'
    : (t.source ? 'the autopilot (' + jpEsc(t.source) + ')' : 'the autopilot');
  const excursion = (t.mfe_pct == null && t.mae_pct == null)
    ? '<span class="jp-dim">not recorded for this trade</span>'
    : pct(t.mfe_pct) + ' best \u00b7 ' + pct(t.mae_pct) + ' worst';
  return '<tr class="jp-trade-detail"><td colspan="' + JP_TRADE_COLS.length + '"><div class="jp-detail">'
    + bit('Side', t.side === 'short' ? 'Short' : 'Long')
    + bit('Opened', t.openedAt ? jpTradeWhen(t.openedAt) : '<span class="jp-dim">not recorded</span>')
    + bit('Exit reason', t.reason ? jpEsc(jpLabelValue(t.reason)) : '<span class="jp-dim">not recorded</span>')
    + bit('While open', excursion)
    + bit('R', t.r != null ? jpR(t.r) : '<span class="jp-dim">no stop recorded to measure against</span>')
    + bit('Source', src)
    + (t.estimated ? bit('Note', '<span class="jp-dim">priced off the last observed mark, not a broker fill</span>') : '')
    + '</div>' + jpNoteEditor(t) + '</td></tr>';
}

function jpTrades(data) {
  const head = '<h2>Trade log</h2>';
  if (data === undefined) return head + '<div class="jp-empty" aria-busy="true">Loading\u2026</div>';
  if (data === null) return head + '<div class="jp-empty">The trade log could not be loaded. Every other figure on this page is unaffected.</div>';
  const tot = data.totals || {};
  const filtered = (data.filter && (data.filter.symbol || data.filter.result !== 'all'));
  if (!data.total) {
    return head + jpTradeControls(data)
      + '<div class="jp-empty">' + (filtered ? 'No trades match that filter.' : 'No closed trades yet.') + '</div>';
  }
  const arrow = (c) => (data.sort === c.key ? (data.dir === 'asc' ? ' \u25b2' : ' \u25bc') : '');
  const th = JP_TRADE_COLS.map((c) => '<th scope="col"' + (c.num ? ' class="num"' : '')
    + (data.sort === c.key ? ' aria-sort="' + (data.dir === 'asc' ? 'ascending' : 'descending') + '"' : '') + '>'
    + (c.sortable
      ? '<button type="button" class="jp-sort" onclick="jpTradeSort(\'' + c.key + '\')">' + jpEsc(c.label) + arrow(c) + '</button>'
      : jpEsc(c.label)) + '</th>').join('');
  const rows = data.trades.map((t) => {
    const open = jpTradeOpen.has(t.id);
    const cell = (cls, v) => '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + v + '</td>';
    return '<tr class="jp-trade' + (open ? ' on' : '') + '" onclick="jpTradeToggle(\'' + jpEsc(t.id).replace(/'/g, '') + '\')">'
      + cell('', '<span class="jp-dim" aria-hidden="true">' + (open ? '\u25be' : '\u25b8') + '</span> ' + jpEsc(jpTradeWhen(t.ts)))
      + cell('', jpEsc(t.symbol) + (t.side === 'short' ? ' <span class="jp-dim">S</span>' : ''))
      + cell('num', t.qty != null ? t.qty : '\u2014')
      + cell('num', t.entry != null ? jpUsd(t.entry) : '\u2014')
      + cell('num', t.exit != null ? jpUsd(t.exit) : '\u2014')
      + cell('num', jpHeld(t.heldMs))
      + cell('num ' + jpSign(t.pnl), jpUsd(t.pnl))
      + cell('num ' + jpSign(t.pnl_pct), jpPct(t.pnl_pct))
      + cell('num ' + (t.r != null ? jpSign(t.r) : 'jp-dim'), t.r != null ? jpR(t.r) : '\u2014')
      + '</tr>' + (open ? jpTradeDetail(t) : '');
  }).join('');
  const from = data.offset + 1, to = Math.min(data.offset + data.limit, data.total);
  const pager = data.total > data.limit
    ? '<div class="jp-pager">'
      + '<button type="button" class="jp-chip" onclick="jpTradePage(-1)"' + (data.offset <= 0 ? ' disabled' : '') + '>\u2039 Newer</button>'
      + '<span class="jp-dim">' + from + '\u2013' + to + ' of ' + data.total + '</span>'
      + '<button type="button" class="jp-chip" onclick="jpTradePage(1)"' + (to >= data.total ? ' disabled' : '') + '>Older \u203a</button>'
      + '</div>'
    : '';
  return head + jpTradeControls(data)
    + '<div class="jp-scroll jp-trades-scroll"><table class="jp-table"><thead><tr>' + th + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
    + pager
    + '<p class="jp-note">' + tot.trades + ' trade' + (tot.trades === 1 ? '' : 's')
    + ' \u00b7 ' + tot.wins + 'W / ' + tot.losses + 'L \u00b7 net <span class="' + jpSign(tot.net) + '">' + jpUsd(tot.net) + '</span>'
    + (filtered ? ' (this filter)' : '')
    + '. Broker-accepted fills only. A row opens to what else was recorded about it'
    + jpTradeRNote(tot)
    + '</p>';
}

/* "R is shown for the 0 opened with a recorded stop" is not a sentence, and none-of-them
   is a different fact from some-of-them: one says the column is empty for a reason, the
   other says which rows to trust it on. */
function jpTradeRNote(tot) {
  if (!tot || tot.withR >= tot.trades) return '.';
  if (!tot.withR) return '. None of these recorded the stop they were opened with, so R cannot be measured for them.';
  return ' \u2014 R is shown for the ' + tot.withR + ' of them opened with a recorded stop.';
}

function jpTradeControls(data) {
  const syms = (data.symbols || []);
  const opt = (v, label, sel) => '<option value="' + jpEsc(v) + '"' + (sel ? ' selected' : '') + '>' + jpEsc(label) + '</option>';
  const f = data.filter || {};
  const chip = (v, label) => '<button type="button" class="jp-chip' + ((f.result || 'all') === v ? ' on' : '')
    + '" onclick="jpTradeFilter({ result: \'' + v + '\' })">' + label + '</button>';
  return '<div class="jp-bar-filters">'
    + '<label class="visually-hidden" for="jpTradeSym">Filter by symbol</label>'
    + '<select id="jpTradeSym" class="jp-select" onchange="jpTradeFilter({ symbol: this.value })">'
    + opt('', 'All symbols', !f.symbol) + syms.map((s) => opt(s, s, f.symbol === s)).join('') + '</select>'
    + chip('all', 'All') + chip('win', 'Winners') + chip('loss', 'Losers')
    + '</div>';
}

/* One request, one card. Nothing else on the page moves. */
async function jpTradeLoad() {
  const card = document.getElementById('jpTradesCard');
  if (!card) return;
  card.setAttribute('aria-busy', 'true');
  const demo = !!(jpData && jpData.demo);
  const q = new URLSearchParams();
  if (demo) q.set('demo', 'champion');
  for (const [k, v] of Object.entries(jpTradeQ)) if (v !== '' && v != null) q.set(k, String(v));
  try {
    const r = await fetch('/api/trading/trades?' + q.toString(), { cache: 'no-store', credentials: 'same-origin' });
    jpTradeData = r.ok ? await r.json() : null;
  } catch (_e) { jpTradeData = null; }
  card.removeAttribute('aria-busy');
  card.innerHTML = jpTrades(jpTradeData);
}

function jpTradeSort(key) {
  const col = JP_TRADE_COLS.find((c) => c.key === key);
  if (!col || !col.sortable) return;
  // Same key flips direction; a new one starts the way that column is usually read.
  if (jpTradeQ.sort === key) jpTradeQ.dir = jpTradeQ.dir === 'asc' ? 'desc' : 'asc';
  else { jpTradeQ.sort = key; jpTradeQ.dir = key === 'symbol' ? 'asc' : 'desc'; }
  jpTradeQ.offset = 0;                 // a re-sort starts at the top, not mid-list
  jpTradeLoad();
}

function jpTradeFilter(patch) {
  Object.assign(jpTradeQ, patch, { offset: 0 });
  jpTradeLoad();
}

function jpTradePage(dir) {
  const next = jpTradeQ.offset + dir * jpTradeQ.limit;
  if (next < 0 || (jpTradeData && next >= jpTradeData.total)) return;
  jpTradeQ.offset = next;
  jpTradeLoad();
}

/* Expanding costs nothing: the row is already in hand. */
function jpTradeToggle(id) {
  if (jpTradeOpen.has(id)) jpTradeOpen.delete(id); else jpTradeOpen.add(id);
  const card = document.getElementById('jpTradesCard');
  if (card && jpTradeData) card.innerHTML = jpTrades(jpTradeData);
}

async function jpEnsureTrades() {
  if (jpTradeData !== null || !document.getElementById('jpTradesCard')) {
    if (jpTradeData === null && document.getElementById('jpTradesCard')) await jpTradeLoad();
    return;
  }
  await jpTradeLoad();
}

/* Notes, tags and feeling (#3559).
   Scoped out of the journal once, on the reasoning that competitors need notes because
   their users type in their own trades while ours do not. That was wrong: the autonomous
   trader is minPlan "pilot", so everyone below $200/mo trades by hand -- and for them
   this is not a competitor's crutch, it is the point of keeping a journal.

   Tagging is data entry until it pays something back, so the tag table is part of the
   same change rather than a follow-up: win rate and expectancy per tag is what turns
   "I tagged that one chased" into "every trade I tag chased loses money". */
const JP_FEELINGS = ['calm', 'confident', 'unsure', 'anxious', 'frustrated'];
let jpNotes = null;          // id -> { note, tags, feel } ; null until loaded
let jpNoteTags = [];         // tags this reader has used, most-used first
let jpTagStats = null;

const jpNoteOf = (id) => (jpNotes && jpNotes[id]) || { note: '', tags: [], feel: null };

/* The editor lives in the expanded row, because that is where the trade actually is.
   Nothing here is a separate page to remember to visit. */
function jpNoteEditor(t) {
  /* The demo book is simulated and regenerates, so a note written on it would attach
     to a trade that is not the reader's and will not be there tomorrow. Say what the
     editor is for instead of offering one that quietly goes nowhere. */
  if (jpData && jpData.demo) {
    return '<div class="jp-note-edit"><span class="jp-dim">Notes, tags and how a trade felt '
      + 'go on your own trades — this is the simulated demo book.</span></div>';
  }
  const n = jpNoteOf(t.id);
  const id = jpEsc(t.id);
  const tags = n.tags.map((tag) => '<button type="button" class="jp-tag" title="Remove"'
    + ' onclick="jpNoteTag(\'' + id + '\', \'' + jpEsc(tag) + '\', false)">' + jpEsc(tag) + ' \u00d7</button>').join('');
  const feels = JP_FEELINGS.map((f) => '<button type="button" class="jp-chip' + (n.feel === f ? ' on' : '') + '"'
    + ' onclick="jpNoteFeel(\'' + id + '\', \'' + f + '\')">' + f + '</button>').join('');
  return '<div class="jp-note-edit">'
    + '<label class="visually-hidden" for="jpn-' + id + '">What happened, in your words</label>'
    + '<textarea id="jpn-' + id + '" class="jp-note-text" rows="2" placeholder="What happened, in your words\u2026"'
    + ' onblur="jpNoteText(\'' + id + '\', this.value)">' + jpEsc(n.note) + '</textarea>'
    + '<div class="jp-note-row"><span class="k">Tags</span>' + tags
    + '<input class="jp-tag-in" list="jpTagList" placeholder="add a tag" aria-label="Add a tag"'
    + ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();jpNoteTag(\'' + id + '\', this.value, true);}"></div>'
    + '<div class="jp-note-row"><span class="k">Felt</span>' + feels
    + (n.feel ? '<button type="button" class="jp-chip" onclick="jpNoteFeel(\'' + id + '\', null)">clear</button>' : '')
    + '</div></div>'
    + '<datalist id="jpTagList">' + jpNoteTags.map((x) => '<option value="' + jpEsc(x.tag) + '">').join('') + '</datalist>';
}

/* One card repaints, and the tag table with it -- a tag that changes changes what the
   table says, and two views of the same fact must not disagree on screen. */
function jpNotePaint(focusTagFor) {
  const card = document.getElementById('jpTradesCard');
  if (card && jpTradeData) card.innerHTML = jpTrades(jpTradeData);
  jpTagStats = null;
  jpTagsLoad();
  if (focusTagFor) {
    const box = document.querySelector('[data-card="trades"] .jp-trade-detail .jp-tag-in');
    if (box) box.focus();
  }
}

async function jpNoteSave(id, patch) {
  const cur = jpNoteOf(id);
  const body = Object.assign({ id, note: cur.note, tags: cur.tags, feel: cur.feel }, patch);
  // Written locally first so the page never sits still waiting for a round trip.
  if (jpNotes) {
    if (body.note || (body.tags && body.tags.length) || body.feel) jpNotes[id] = { note: body.note, tags: body.tags, feel: body.feel };
    else delete jpNotes[id];
  }
  try {
    const r = await fetch('/api/journal/notes', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const j = r.ok ? await r.json() : null;
    if (j && jpNotes) {
      // The server normalises -- lower-cased tags, dropped duplicates -- so what the page
      // shows after a save is what is actually stored, not what was typed.
      if (j.saved) jpNotes[id] = j.saved; else delete jpNotes[id];
      if (Array.isArray(j.tags)) jpNoteTags = j.tags;
    }
  } catch (_e) { /* offline: the page keeps what it has and the next save will carry it */ }
}

async function jpNoteText(id, value) {
  if (jpNoteOf(id).note === String(value || '').trim()) return;   // a blur that changed nothing
  await jpNoteSave(id, { note: String(value || '') });
  jpNotePaint();
}
async function jpNoteTag(id, tag, add) {
  const clean = String(tag || '').trim().toLowerCase().replace(/\s+/g, ' ');
  if (add && !clean) return;
  const cur = jpNoteOf(id).tags;
  const tags = add ? (cur.includes(clean) ? cur : cur.concat(clean)) : cur.filter((x) => x !== clean);
  await jpNoteSave(id, { tags });
  jpNotePaint(add);
}
async function jpNoteFeel(id, feel) {
  await jpNoteSave(id, { feel: jpNoteOf(id).feel === feel ? null : feel });
  jpNotePaint();
}

async function jpEnsureNotes() {
  if (jpNotes !== null) return;
  jpNotes = {};
  if (jpData && jpData.demo) return;          // nothing of the reader's to annotate
  try {
    const r = await fetch('/api/journal/notes', { credentials: 'same-origin', cache: 'no-store' });
    const j = r.ok ? await r.json() : null;
    if (j) { jpNotes = j.notes || {}; jpNoteTags = Array.isArray(j.tags) ? j.tags : []; }
  } catch (_e) { /* a guest, or offline: nothing written and nothing to show */ }
  const card = document.getElementById('jpTradesCard');
  if (card && jpTradeData) card.innerHTML = jpTrades(jpTradeData);
}

/* ── the tag table ──────────────────────────────────────────────────────────── */
function jpTags(stats) {
  const head = '<h2>By your tags</h2>';
  if (!stats || (!stats.tags.length && !stats.feelings.length)) return '';   // nothing tagged: no card
  const table = (rows, label) => {
    if (!rows.length) return '';
    return '<div class="jp-scroll"><table class="jp-table"><thead><tr>'
      + '<th scope="col">' + label + '</th><th scope="col" class="num">Trades</th>'
      + '<th scope="col" class="num">Win %</th>'
      + '<th scope="col" class="num">Net</th><th scope="col" class="num">Per trade</th></tr></thead><tbody>'
      + rows.map((r) => '<tr><td>' + jpEsc(r.key) + '</td>'
        + '<td class="num">' + r.trades + '</td>'
        + '<td class="num">' + jpPct(r.winRate) + '</td>'
        + '<td class="num ' + jpSign(r.totalRealized) + '">' + jpUsd(r.totalRealized) + '</td>'
        + '<td class="num ' + jpSign(r.expectancy) + '">' + jpUsd(r.expectancy) + '</td></tr>').join('')
      + '</tbody></table></div>';
  };
  const thin = stats.annotated < 10;
  return head + table(stats.tags, 'Tag') + table(stats.feelings, 'Felt')
    + '<p class="jp-note">Your own words, priced the same way every other figure here is. '
    + 'Written about ' + stats.annotated + ' of ' + stats.trades + ' closed trades'
    + (thin ? ' \u2014 too few yet to read as a finding, but it is a start.' : '.') + '</p>';
}

async function jpTagsLoad() {
  if (jpData && jpData.demo) { jpTagStats = null; return; }
  const card = document.getElementById('jpTagsCard');
  if (!card && jpTagStats !== null) return;
  try {
    const r = await fetch('/api/journal/notes?stats=1', { credentials: 'same-origin', cache: 'no-store' });
    jpTagStats = r.ok ? await r.json() : null;
  } catch (_e) { jpTagStats = null; }
  // The card only exists once something is tagged, so a first tag has to bring it in.
  if (jpTagStats && !card) { jpPaintCards(); return; }
  if (card) card.innerHTML = jpTags(jpTagStats);
}

async function jpEnsureTags() {
  if (jpTagStats !== null) return;
  await jpTagsLoad();
}

/* What your record says (#3560) — Pro.
   Every claim is computed server-side from figures already on this page and arrives with
   the evidence it came from; a model may have reworded it, but anything it said
   containing a figure nobody computed was thrown away before it got here. So this card
   renders the evidence next to the sentence rather than asking the reader to trust it. */
let jpCoach = null;          // null until asked; { findings, text, source, ... } or a state

function jpCoachLine(f) {
  const ev = f.evidence.map((e) => '<span class="jp-ev"><span class="k">' + jpEsc(e.label) + '</span>'
    + '<span class="v">' + jpEsc(e.value) + '</span></span>').join('');
  return '<li class="jp-find jp-find-' + jpEsc(f.kind) + '"><p>' + jpEsc(f.claim) + '</p>'
    + '<div class="jp-evs">' + ev + '</div></li>';
}

function jpCoachCard(state) {
  const head = '<h2>What your record says</h2>';
  if (state === null || state === undefined) return head + '<div class="jp-empty" aria-busy="true">Reading\u2026</div>';

  /* Not a broken card for a reader who has not bought it -- say what it is and what it
     costs, once, without nagging. */
  if (state.locked) {
    return head + '<div class="jp-coach-locked"><p>Your journal is yours on every plan. '
      + 'Having it read back to you \u2014 what your tags cost you, when you trade worst, '
      + 'where you are right and still not paid \u2014 is part of Pro.</p>'
      + '<a class="jp-chip on" href="/pricing.html">See Pro \u2192</a></div>';
  }
  if (state.failed) {
    return head + '<div class="jp-empty">This could not be read just now. Every other figure on this page is unaffected.</div>';
  }

  const list = state.findings || [];
  if (!list.length) return head + '<div class="jp-empty">Nothing in your record stands out yet. That is not a complaint.</div>';
  const refusing = list.length === 1 && list[0].kind === 'refusal';
  if (refusing) return head + '<div class="jp-empty">' + jpEsc(list[0].claim) + '</div>';

  /* Where the words came from. A reader is entitled to know whether a sentence was
     written by the arithmetic or reworded by a model, and neither answer is a boast. */
  const provenance = state.source === 'model'
    ? 'Written up by ' + jpEsc(state.model || 'a model') + ' from the figures below, which it was not able to change.'
    : 'Read straight off the figures below.';
  const rejected = (state.rejected && state.rejected.length)
    ? ' A draft was discarded for quoting ' + jpEsc(state.rejected.slice(0, 3).join(', ')) + ', which is not in your record.'
    : '';

  return head
    + '<p class="jp-coach-text">' + jpEsc(state.text || '') + '</p>'
    + '<ul class="jp-finds">' + list.map(jpCoachLine).join('') + '</ul>'
    + '<p class="jp-note">' + provenance + rejected
    + ' Nothing here is advice \u2014 it is what already happened in your own record.</p>';
}

async function jpEnsureCoach() {
  if (jpCoach !== null) return;
  jpCoach = {};                                   // claim the slot so this runs once
  if (jpData && jpData.demo) { jpCoach = { locked: true }; jpCoachPaint(); return; }
  try {
    const r = await fetch('/api/journal/coach', { credentials: 'same-origin', cache: 'no-store' });
    if (r.status === 403 || r.status === 401) jpCoach = { locked: true };
    else if (!r.ok) jpCoach = { failed: true };
    else jpCoach = await r.json();
  } catch (_e) { jpCoach = { failed: true }; }
  jpCoachPaint();
}

function jpCoachPaint() {
  const card = document.getElementById('jpCoachCard');
  if (card) card.innerHTML = jpCoachCard(jpCoach);
}

/* Placement notes. journalLog() on the trader page has captured a snapshot on every
   order since #2446 -- signal, pattern, RVOL, session -- into localStorage, and until
   now nothing read them back. They are device-local and they are NOT P&L: these are
   intentions, the figures above are outcomes. */
function jpPlacements(opts) {
  const bare = !!(opts && opts.bare);
  let rows = [];
  try { rows = JSON.parse(localStorage.getItem('trader.journal') || '[]'); } catch (_e) { rows = []; }
  if (!rows.length) return '';
  const cell = v => (v === null || v === undefined || v === '') ? '<td class="jp-dim">—</td>' : '<td>' + jpEsc(String(v)) + '</td>';
  const when = ts => { try { return new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (_e) { return ts || ''; } };
  return (bare ? '' : '<div class="jp-card">') + '<h2>Placement notes — this device</h2>'
    + '<p class="jp-note">What the screen said at the moment each order went in. Captured locally, never uploaded, '
    + 'newest first, capped at 500. Not profit and loss — these are intentions, not outcomes.</p>'
    + '<div class="jp-scroll"><table class="jp-table"><thead><tr>'
    + '<th scope="col">When</th><th scope="col">Symbol</th><th scope="col">Side</th>'
    + '<th scope="col" class="num">Qty</th><th scope="col" class="num">Price</th>'
    + '<th scope="col">Signal</th><th scope="col">Pattern</th>'
    + '<th scope="col" class="num">RVOL</th><th scope="col">Session</th></tr></thead><tbody>'
    + rows.slice(0, 100).map(r => '<tr><td class="jp-dim">' + jpEsc(when(r.ts)) + '</td>'
      + '<td><b>' + jpEsc(r.symbol || '') + '</b></td>'
      + '<td class="' + (String(r.side).toLowerCase() === 'buy' ? 'jp-pos' : 'jp-neg') + '">' + jpEsc(String(r.side || '').toUpperCase()) + '</td>'
      + '<td class="num">' + jpEsc(r.qty == null ? '—' : r.qty) + '</td>'
      + '<td class="num">' + (r.price != null ? jpEsc(jpUsd(r.price)) : '—') + '</td>'
      + cell(r.signal) + cell(r.pattern) + '<td class="num">' + jpEsc(r.rvol == null ? '—' : r.rvol) + '</td>' + cell(r.session)
      + '</tr>').join('')
    + '</tbody></table></div>'
    + (rows.length > 100 ? '<p class="jp-note">Showing the most recent 100 of ' + rows.length + '.</p>' : '')
    + (bare ? '' : '</div>');
}


/* Account equity, from the broker's own record. Deliberately NOT the same chart as the
   realized curve above it: that one starts at zero and counts only what the autopilot
   booked, this one starts at the opening balance and counts everything the account did.
   Showing both is the point -- the gap between them IS the manual trades, the deposits,
   and the history from before the ledger existed. */
/* ── Plot engine ───────────────────────────────────────────────────────────────
   One builder for every chart on the page, because the three hand-rolled SVGs had
   drifted apart: two of them drew the same shape from different data, and the bar
   chart shipped with no axis at all -- bars floating over a baseline with no dates
   and no values, which tells you a day was red but not which day or by how much.

   Every plot gets:
     - a labelled Y axis (values) and X axis (dates)
     - a readout that follows the pointer and names the point under it
   and deliberately NOT a crosshair: no horizontal or vertical rule across the plot.
   The readout is the tracker.

   Series are kept in _jpPlots rather than serialised into the DOM, so the numbers a
   tooltip shows are the numbers the chart was drawn from -- not a re-parse that can
   disagree with it. */
const _jpPlots = {};
let _jpPlotSeq = 0;

/* Nice round tick values, so the axis reads 100k / 102k rather than 99,812.37. */
function jpTicks(lo, hi, n) {
  if (!(hi > lo)) return [lo];
  const raw = (hi - lo) / Math.max(1, n);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(v => v >= raw) || mag * 10;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(v);
  return out.length ? out : [lo, hi];
}
/* Axis labels want to be short: $102k reads at a glance, $102,033.33 does not. */
function jpAxisMoney(v) {
  const a = Math.abs(v), sign = v < 0 ? '-' : '';
  if (a >= 1000) return sign + '$' + (a / 1000).toFixed(a >= 10000 ? 0 : 1) + 'k';
  if (a >= 1) return sign + '$' + Math.round(a);
  return sign + '$' + a.toFixed(2);
}

/**
 * pts  : [{ d:'YYYY-MM-DD', v:Number }]
 * opts : { type:'line'|'bar', baseline:Number|null, baselineLabel:String, height:Number }
 */
function jpPlot(pts, opts) {
  const o = opts || {};
  if (!Array.isArray(pts) || pts.length < 1) return '';
  const id = 'jpp' + (++_jpPlotSeq);
  const bar = o.type === 'bar';
  const H = o.height || 190, W = 620;
  const padL = 8, padR = 8, padT = 14, padB = 22, axisW = 44;
  const iw = W - padL - padR - axisW, ih = H - padT - padB;
  const x0 = padL + axisW;

  const vals = pts.map(p => p.v).filter(v => typeof v === 'number' && isFinite(v));
  if (!vals.length) return '';
  let lo, hi;
  if (bar) { const m = Math.max.apply(null, vals.map(Math.abs)) || 1; lo = -m; hi = m; }
  else {
    lo = Math.min.apply(null, vals); hi = Math.max.apply(null, vals);
    if (o.baseline != null) { lo = Math.min(lo, o.baseline); hi = Math.max(hi, o.baseline); }
    if (hi === lo) hi = lo + 1;
    const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  }
  const X = i => x0 + (pts.length === 1 ? iw / 2 : (i / (pts.length - 1)) * iw);
  const Y = v => padT + (1 - (v - lo) / (hi - lo)) * ih;

  // ── axes ──────────────────────────────────────────────────────────────────
  let g = '';
  for (const t of jpTicks(lo, hi, 4)) {
    const y = Y(t);
    if (y < padT - 1 || y > padT + ih + 1) continue;
    g += '<line x1="' + x0 + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1)
      + '" stroke="var(--border)" opacity=".55"/>'
      + '<text x="' + (x0 - 6) + '" y="' + (y + 3.5).toFixed(1) + '" font-size="9.5" fill="var(--text2)" '
      + 'text-anchor="end">' + jpEsc(jpAxisMoney(t)) + '</text>';
  }
  // X labels: first, middle, last — enough to place the series in time without clutter.
  const marks = pts.length <= 2 ? [0, pts.length - 1] : [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
  for (const i of Array.from(new Set(marks))) {
    const anchor = i === 0 ? 'start' : (i === pts.length - 1 ? 'end' : 'middle');
    g += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 5) + '" font-size="9.5" fill="var(--text2)" '
      + 'text-anchor="' + anchor + '">' + jpEsc(pts[i].d) + '</text>';
  }

  // ── series ────────────────────────────────────────────────────────────────
  let body = '';
  const net = o.baseline != null ? (pts[pts.length - 1].v - o.baseline) : (pts[pts.length - 1].v);
  const col = net >= 0 ? 'var(--green)' : 'var(--red)';
  if (bar) {
    g += '<line x1="' + x0 + '" y1="' + Y(0).toFixed(1) + '" x2="' + (W - padR) + '" y2="' + Y(0).toFixed(1)
      + '" stroke="var(--text2)" opacity=".5"/>';
    const bw = Math.max(1.5, Math.min(16, iw / Math.max(1, pts.length) - 2));
    body = pts.map((p, i) => {
      const h = Math.abs(Y(p.v) - Y(0));
      const up = p.v >= 0;
      return '<rect x="' + (X(i) - bw / 2).toFixed(1) + '" y="' + (up ? Y(p.v) : Y(0)).toFixed(1)
        + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, h).toFixed(1) + '" rx="1.5" fill="'
        + (up ? 'var(--green)' : 'var(--red)') + '" opacity=".9"/>';
    }).join('');
  } else {
    const base = o.baseline != null ? o.baseline : 0;
    const line = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
    const area = 'M' + X(0).toFixed(1) + ' ' + Y(base).toFixed(1) + ' '
      + pts.map((p, i) => 'L' + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ')
      + ' L' + X(pts.length - 1).toFixed(1) + ' ' + Y(base).toFixed(1) + ' Z';
    if (o.baseline != null) {
      g += '<line x1="' + x0 + '" y1="' + Y(o.baseline).toFixed(1) + '" x2="' + (W - padR) + '" y2="'
        + Y(o.baseline).toFixed(1) + '" stroke="var(--text2)" stroke-dasharray="3 3" opacity=".75"/>';
      if (o.baselineLabel) {
        g += '<text x="' + (x0 + 4) + '" y="' + (Y(o.baseline) - 4).toFixed(1) + '" font-size="9" '
          + 'fill="var(--text2)">' + jpEsc(o.baselineLabel) + '</text>';
      }
    }
    body = '<path d="' + area + '" fill="' + col + '" opacity=".12"/>'
      + '<path d="' + line + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round"/>';
  }

  _jpPlots[id] = { pts: pts, geom: { W: W, H: H, x0: x0, iw: iw, padT: padT, ih: ih, lo: lo, hi: hi }, bar: bar };

  return '<div class="jp-chart" id="' + id + '">'
    + '<div class="jp-read"><span class="d"></span><span class="v"></span></div>'
    + '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + jpEsc(o.aria || 'chart') + '">'
    + g + body
    + '<circle class="jp-dot" r="3.5" fill="var(--text0)" stroke="var(--bg1)" stroke-width="1.5"/>'
    + '</svg></div>';
}

/* Bind after every render. Pointer events cover mouse, pen AND touch from one code
   path, so the phone behaves the way the desktop does rather than getting a second
   implementation that drifts. touch-action:none would kill page scrolling, so the
   readout tracks on move and clears on leave/cancel instead of capturing the gesture. */
function jpBindPlots() {
  Object.keys(_jpPlots).forEach(function (id) {
    const el = document.getElementById(id);
    if (!el || el.dataset.bound === '1') return;
    el.dataset.bound = '1';
    const rec = _jpPlots[id], svg = el.querySelector('svg');
    const dot = el.querySelector('.jp-dot');
    const rd = el.querySelector('.jp-read'), rdD = rd.querySelector('.d'), rdV = rd.querySelector('.v');
    const show = (clientX) => {
      const r = svg.getBoundingClientRect();
      if (!r.width) return;
      const vx = ((clientX - r.left) / r.width) * rec.geom.W;      // client px -> viewBox units
      const f = (vx - rec.geom.x0) / (rec.geom.iw || 1);
      const i = Math.max(0, Math.min(rec.pts.length - 1, Math.round(f * (rec.pts.length - 1))));
      const p = rec.pts[i];
      if (!p) return;
      rdD.textContent = p.d;
      rdV.textContent = jpUsd(p.v);
      rdV.className = 'v ' + jpSign(p.v);
      const gx = rec.geom.x0 + (rec.pts.length === 1 ? rec.geom.iw / 2 : (i / (rec.pts.length - 1)) * rec.geom.iw);
      const gy = rec.geom.padT + (1 - (p.v - rec.geom.lo) / (rec.geom.hi - rec.geom.lo)) * rec.geom.ih;
      dot.setAttribute('cx', gx.toFixed(1));
      dot.setAttribute('cy', gy.toFixed(1));
      el.classList.add('on');
    };
    const clear = () => el.classList.remove('on');
    el.addEventListener('pointermove', (e) => show(e.clientX));
    el.addEventListener('pointerdown', (e) => show(e.clientX));
    el.addEventListener('pointerleave', clear);
    el.addEventListener('pointercancel', clear);
  });
}


/* Which exchange day a broker point belongs to (#3501). The brokers stamp a day
   differently. IBKR (ibkr-cpapi _toEpochSeconds) and the demo stamp the session's own
   date at 00:00 UTC, which the UTC date reads correctly. Alpaca stamps each daily bar
   at the END of the session it closes -- 00:00 UTC the next day, 8 PM ET -- so its UTC
   date ran a day late: Friday's close showed as a Saturday, the Tuesday after a Monday
   holiday vanished, and the point labelled today was yesterday's close. Alpaca stamps
   are read in ET instead, backed off 5 hours so a stamp at or just after midnight
   (either side of daylight saving) still lands on the session it closed. The balance
   chart and the calendar's account view both label days through here. */
function jpDayOf(h) {
  const alpaca = !!(h && h.source === 'alpaca');
  return (t) => {
    try {
      return alpaca
        ? new Date((t - 5 * 3600) * 1000).toLocaleDateString('en-CA', { timeZone: 'America/New_York' })
        : new Date(t * 1000).toISOString().slice(0, 10);
    } catch (_e) { return ''; }
  };
}

/* The account's own change for each session (#3517): the broker's daily closing
   equity minus the close before it. Booked P&L lands on the day a trade CLOSES, so a
   day spent holding showed nothing -- Wed 9/9 was blank while the account made
   +$183.46. This gives every session a number, the way the broker reports a day.
   Daily series only: the demo book's monthly points would read as one-day jumps. A
   day that did not move at all stays blank rather than printing $0.00. */
function jpAccountDaily(h) {
  if (!h || h.ok === false || h.demo === true || h.source === 'champion-demo') return null;
  const ts = Array.isArray(h.timestamps) ? h.timestamps : [], eq = h.equity || [];
  if (ts.length < 3) return null;
  const gaps = [];
  for (let i = 1; i < ts.length; i++) gaps.push(ts[i] - ts[i - 1]);
  gaps.sort((a, b) => a - b);
  if (!(gaps[Math.floor(gaps.length / 2)] <= 4 * 86400)) return null;   // a long weekend is 4 days
  const dayOf = jpDayOf(h), out = {};
  let prev = null;
  for (let i = 0; i < ts.length; i++) {
    const v = eq[i];
    if (v == null || !isFinite(v)) continue;
    const d = dayOf(ts[i]);
    if (prev != null && d) {
      const chg = Math.round((Number(v) - prev) * 100) / 100;
      if (chg !== 0) out[d] = chg;
    }
    prev = Number(v);
  }
  return Object.keys(out).length ? out : null;
}

/* ONE balance chart, not two. The page used to draw the broker's equity AND the
   autopilot's cumulative realized as separate line charts -- two near-identical shapes
   asking the reader to work out which was which. The broker's series is the real
   account balance, so that is the one that stays; the autopilot's cumulative line is
   the same information the calendar and the bar chart already carry, per day.
   When the broker cannot answer (a box with no linked account), the autopilot's own
   cumulative curve stands in rather than leaving an empty slot. */
function jpBalanceChart(h, daily, liveToday) {
  const iso = jpDayOf(h);   // the exchange day each broker point belongs to (#3501)
  if (h && h.ok !== false && Array.isArray(h.timestamps) && h.timestamps.length > 1) {
    const eq = h.equity || [], pts = [];
    for (let i = 0; i < h.timestamps.length; i++) {
      const v = eq[i];
      if (v != null && isFinite(v)) pts.push({ d: iso(h.timestamps[i]), v: Number(v) });
    }
    // The payload says whether it is real. champion-demo is a SIMULATED 26-year DCA
    // book -- coherent on its own terms, but calling it "from the broker" would be a
    // false claim about provenance on the one page whose job is an honest record.
    const sim = h.demo === true || h.source === 'champion-demo';
    /* Today, live (#3502). The daily history's newest bar is the previous close, so
       during a session the chart ended a day behind. The live equity -- same broker,
       same account -- adds today's point, and the readout names it as today. */
    let live = false;
    if (!sim && liveToday && liveToday.equity > 0 && pts.length && pts[pts.length - 1].d < liveToday.date
        && (!liveToday.source || !h.source || liveToday.source === h.source)) {
      pts.push({ d: liveToday.date, v: liveToday.equity });
      live = true;
    }
    if (pts.length > 1) {
      const base = Number(h.base_value) || pts[0].v;
      const last = pts[pts.length - 1], net = last.v - base;
      return {
        title: sim ? 'Account balance — simulated demo book'
                   : 'Account balance — all time, from the broker',
        html: jpPlot(pts, { type: 'line', baseline: base, baselineLabel: 'opened ' + jpAxisMoney(base),
          aria: 'Account balance from ' + pts[0].d + ' to ' + last.d + ', opened ' + jpUsd(base) + ', now ' + jpUsd(last.v) })
          + '<p class="jp-note">Opened <b>' + jpEsc(jpUsd(base)) + '</b> on ' + jpEsc(pts[0].d)
          + ' — now <b>' + jpEsc(jpUsd(last.v)) + '</b>' + (live ? ' live' : '') + ' (<span class="' + jpSign(net) + '">'
          + jpEsc((net >= 0 ? '+' : '') + jpUsd(net)) + '</span>). '
          + (sim
              ? 'Simulated sample data for the demo book — not a real account, and not a real track record.'
              : 'Straight from the broker, so it counts manual trades and deposits too — the calendar '
                + 'below counts only what the autopilot booked.')
          + '</p>',
      };
    }
  }
  if (!daily || !daily.length) return null;
  const pts = daily.map(d => ({ d: d.date, v: d.cum }));
  return {
    title: 'Autopilot cumulative — realized, by exchange day',
    html: jpPlot(pts, { type: 'line', baseline: 0, baselineLabel: 'flat',
      aria: 'Cumulative realized profit and loss by exchange day' })
      + '<p class="jp-note">The broker did not return an account history for this box, so this is the '
      + 'autopilot\'s own realized total instead — it starts at zero, not at the opening balance.</p>',
  };
}

/* ── The reader's arrangement (#3543) ─────────────────────────────────────────
   Every card here is a widget with an id. Which ones show, in what order, at what width
   is the reader's business: TradeZella and TraderWaves both let a trader build the
   dashboard they actually read, and this is that without a layout library -- one CSS
   grid, cards spanning one column or two, dragged or nudged into place.

   It is kept per user on the server so it follows them to another device, with a copy in
   this browser so the first paint is already the right shape. A guest keeps theirs in the
   browser alone. A layout that names a card this page no longer has loses that card, and
   a card the layout never heard of is appended -- so a new card appears for everyone
   instead of being hidden by omission. */
/* `w` is the card's default span in twelfths (#3565) — 12 is the full width, 6 a half,
   3 the narrowest a card stays readable at. A reader can set any of them by dragging. */
const JP_WIDGETS = [
  { id: 'kpis', name: 'Key figures', w: 12 },
  { id: 'coach', name: 'What your record says', w: 12 },
  { id: 'calendar', name: 'P&L calendar', w: 6 },
  { id: 'balance', name: 'Account balance', w: 6 },
  // The list stays above the statistics drawn from it (#3558), and the halves are
  // paired: a 6 followed by a 12 leaves half a row of nothing, which is what made the
  // old default look unfinished. Every row here fills its twelve.
  { id: 'trades', name: 'Trade log', w: 12 },
  { id: 'tags', name: 'By your tags', w: 12 },
  { id: 'pnlday', name: 'Net P&L per day', w: 6 },
  { id: 'breakdown', name: 'Breakdown', w: 6 },
  { id: 'symbols', name: 'Symbol statistics', w: 12 },
  { id: 'monthly', name: 'Monthly report', w: 12 },
  { id: 'heatmap', name: 'Weekday × hour', w: 6 },
  { id: 'rdist', name: 'R multiples', w: 6 },
  { id: 'placements', name: 'Placement notes', w: 12 },
];
const JP_WIDGET = {};
JP_WIDGETS.forEach((w) => { JP_WIDGET[w.id] = w; });
const JP_LAYOUT_KEY = 'jp-layout-v2';
const JP_COLS = 12;
const JP_SPAN_MIN = 3;
/* Height moves in rows, the way width moves in columns (#3571). 40px is fine enough
   to land where you meant and coarse enough that two cards dragged to "about the
   same" actually match. The bounds are whole rows: 3 of them to 30. */
const JP_ROW = 40;
const JP_H_MIN = JP_ROW * 3, JP_H_MAX = JP_ROW * 30;

let jpEdit = false;

const jpSpanOk = (n) => Number.isInteger(n) && n >= JP_SPAN_MIN && n <= JP_COLS;
const jpHeightOk = (n) => Number.isFinite(n) && n >= JP_H_MIN && n <= JP_H_MAX;
const jpClamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const jpRowsToPx = (r) => jpClamp(Math.round(r), JP_H_MIN / JP_ROW, JP_H_MAX / JP_ROW) * JP_ROW;
const jpPxToRows = (px) => Math.round(px / JP_ROW);
const _l2 = (l, over) => Object.assign({ v: 2, order: l.order, hidden: l.hidden, span: l.span, h: l.h }, over);

function jpLayoutDefault() {
  return { v: 2, order: JP_WIDGETS.map((w) => w.id), hidden: [], span: {}, h: {} };
}
function jpLayoutMerge(stored) {
  const base = jpLayoutDefault();
  if (!stored || !Array.isArray(stored.order)) return base;
  const known = new Set(base.order);
  const order = [];
  for (const id of stored.order) if (known.has(id) && !order.includes(id)) order.push(id);
  for (const id of base.order) if (!order.includes(id)) order.push(id);
  const hidden = [];
  for (const id of (Array.isArray(stored.hidden) ? stored.hidden : [])) if (known.has(id) && !hidden.includes(id)) hidden.push(id);
  const span = {};
  const s = (stored.span && typeof stored.span === 'object') ? stored.span : {};
  for (const id of Object.keys(s)) if (known.has(id) && jpSpanOk(s[id])) span[id] = s[id];
  /* A layout stored before this page had real widths said 1 (half) or 2 (full). Reading
     those as spans keeps an arrangement somebody already made, instead of quietly
     resetting every reader who had one the day this shipped. */
  const w = (stored.width && typeof stored.width === 'object') ? stored.width : {};
  for (const id of Object.keys(w)) {
    if (known.has(id) && !(id in span) && (w[id] === 1 || w[id] === 2)) span[id] = w[id] === 2 ? JP_COLS : JP_COLS / 2;
  }
  const h = {};
  const hh = (stored.h && typeof stored.h === 'object') ? stored.h : {};
  // Snapped on the way in too: a browser copy written before heights moved in rows
  // would otherwise sit off the grid for as long as nobody touched that card.
  for (const id of Object.keys(hh)) if (known.has(id) && jpHeightOk(hh[id])) h[id] = jpRowsToPx(jpPxToRows(hh[id]));
  return { v: 2, order, hidden, span, h };
}
const jpSpanOf = (l, id) => l.span[id] || (JP_WIDGET[id] ? JP_WIDGET[id].w : JP_COLS / 2);
const jpHeightOf = (l, id) => l.h[id] || null;

function jpLayoutMove(l, id, delta) {
  const order = l.order.slice();
  const i = order.indexOf(id), j = i + delta;
  if (i < 0 || j < 0 || j >= order.length) return l;
  order.splice(j, 0, order.splice(i, 1)[0]);
  return _l2(l, { order });
}

/**
 * Move a card to a slot BETWEEN visible cards -- index 0 is before the first, and
 * `visible.length` is after the last.
 *
 * The old drop meant "before the card you released on", which is right going one way and
 * off by one going the other, and made the final position unreachable: dropping on the
 * last card put you second-to-last, every time. An index between cards has no direction
 * in it, so both ways behave the same and the end is a place you can actually drop.
 */
function jpLayoutInsert(l, id, index) {
  if (!l.order.includes(id) || l.hidden.includes(id)) return l;
  const vis = l.order.filter((x) => !l.hidden.includes(x));
  const from = vis.indexOf(id);
  const to = jpClamp(Math.round(index), 0, vis.length);
  if (from < 0 || to === from || to === from + 1) return l;      // already there
  const moved = vis.slice();
  moved.splice(from, 1);
  moved.splice(to > from ? to - 1 : to, 0, id);
  // Rebuild the full order, leaving hidden cards in their own slots so restoring one
  // puts it back where it was rather than at the end.
  const order = [];
  let vi = 0;
  for (const x of l.order) order.push(l.hidden.includes(x) ? x : moved[vi++]);
  return _l2(l, { order });
}

function jpLayoutSpan(l, id, span) {
  if (!l.order.includes(id)) return l;
  const next = Object.assign({}, l.span);
  next[id] = jpClamp(Math.round(span), JP_SPAN_MIN, JP_COLS);
  return _l2(l, { span: next });
}
function jpLayoutHeight(l, id, h) {
  if (!l.order.includes(id)) return l;
  const next = Object.assign({}, l.h);
  // Null clears it: a card goes back to sizing itself to its contents.
  if (h == null) delete next[id];
  // Snapped, not just clamped: an off-grid height is a height nobody could have
  // dragged to, and the card beside it would never quite line up with it.
  else next[id] = jpRowsToPx(jpPxToRows(h));
  return _l2(l, { h: next });
}
const jpLayoutHide = (l, id) => (l.hidden.includes(id) || !l.order.includes(id)
  ? l : _l2(l, { hidden: l.hidden.concat(id) }));
const jpLayoutShow = (l, id) => _l2(l, { hidden: l.hidden.filter((x) => x !== id) });

function jpLayoutRead() {
  try { return JSON.parse(localStorage.getItem(JP_LAYOUT_KEY) || 'null'); } catch (_e) { return null; }
}
let jpLayout = jpLayoutMerge(jpLayoutRead());

function jpApplyLayout(next) {
  jpLayout = next;
  try { localStorage.setItem(JP_LAYOUT_KEY, JSON.stringify(next)); } catch (_e) { /* private window: this tab only */ }
  fetch('/api/journal/layout', { method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ layout: next }) }).catch(() => {});
  jpPaintCards();
}
/* The server's copy is the one that follows the reader between devices; the browser's is
   only so the first paint is right. Quiet either way: an offline page keeps what it has. */
async function jpLayoutSync() {
  try {
    const r = await fetch('/api/journal/layout', { credentials: 'same-origin', cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    if (!j || !j.layout) return;
    const merged = jpLayoutMerge(j.layout);
    if (JSON.stringify(merged) === JSON.stringify(jpLayout)) return;
    jpLayout = merged;
    try { localStorage.setItem(JP_LAYOUT_KEY, JSON.stringify(merged)); } catch (_e) { /* nothing to keep it in */ }
    jpPaintCards();
  } catch (_e) { /* offline: what the browser has stands */ }
}
function jpLayoutReset() {
  jpLayout = jpLayoutDefault();
  try { localStorage.removeItem(JP_LAYOUT_KEY); } catch (_e) { /* nothing stored */ }
  fetch('/api/journal/layout', { method: 'DELETE', credentials: 'same-origin' }).catch(() => {});
  jpPaintCards();
}
function jpSetEdit(on) {
  jpEdit = !!on;
  document.body.classList.toggle('jp-editing', jpEdit);
  const b = document.getElementById('jpEditBtn');
  if (b) { b.classList.toggle('on', jpEdit); b.textContent = jpEdit ? 'Done' : 'Edit layout'; }
  jpPaintCards();
}

/* One card's contents. The ids the in-place painters look for (#3541) live INSIDE the
   card, so rearranging the page never breaks them. */
function jpCardBody(id, data) {
  const L = jpLast || {};
  if (id === 'kpis') {
    const dsr = jpDaySeries(L.daily, L.liveToday, L.acct);
    return '<div id="jpKpis">' + jpKpis(L.s, L.book, Object.assign(jpDayStats(dsr.days), { mode: dsr.mode })) + '</div>';
  }
  if (id === 'calendar') return '<div id="jpCalCard">' + jpCalendarCard(L.daily, L.liveToday, L.acct) + '</div>';
  if (id === 'breakdown') return '<div id="jpBreakdownCard">' + jpBreakdown(data.slice) + '</div>';
  if (id === 'balance') {
    const b = jpBalanceChart(data.equity, L.daily, L.liveToday);
    return b ? '<h2>' + b.title + '</h2>' + b.html : '';
  }
  if (id === 'pnlday') {
    return '<h2>Net P&amp;L per day — realized</h2>'
      + jpPlot((L.daily || []).map((d) => ({ d: d.date, v: d.pnl })), { type: 'bar', height: 150,
          aria: 'Realized profit and loss for each exchange day' });
  }
  if (id === 'coach') return '<div id="jpCoachCard">' + jpCoachCard(jpCoach && Object.keys(jpCoach).length ? jpCoach : null) + '</div>';
  if (id === 'trades') return '<div id="jpTradesCard">' + jpTrades(jpTradeData === null ? undefined : jpTradeData) + '</div>';
  if (id === 'tags') return jpTags(jpTagStats) ? '<div id="jpTagsCard">' + jpTags(jpTagStats) + '</div>' : '';
  if (id === 'symbols') return '<div id="jpSymbolsCard">' + jpSymbols(jpSliceCache.symbol) + '</div>';
  if (id === 'heatmap') return '<div id="jpHeatCard">' + jpHeatmap(jpSliceCache['weekday-hour']) + '</div>';
  if (id === 'rdist') return '<div id="jpRCard">' + jpRDist(jpSliceCache.r) + '</div>';
  if (id === 'monthly') {
    return '<div id="jpMonthlyCard">' + jpMonthly(jpDaySeries(L.daily, L.liveToday, L.acct)) + '</div>';
  }
  if (id === 'placements') return jpPlacements({ bare: true });
  return '';
}

/* The two arrow chips were a poor substitute for dragging and took the space that says
   what the card is. The grip does both jobs now: drag it with a pointer, or focus it and
   use the arrow keys -- which is more than the chips could do, since they could not
   resize at all. */
/**
 * The bar that appears on a card while the page is being arranged.
 *
 * `titled` says the card already shows its own heading, in which case the bar does not
 * repeat it -- ten of the twelve cards were printing their name twice the moment edit
 * mode opened, once in the bar and once as their own <h2>. The grip keeps the name in
 * its aria-label either way, so nothing is lost to a screen reader.
 */
function jpCardBar(id, span, h, titled) {
  if (!jpEdit) return '';
  const name = (JP_WIDGET[id] || {}).name || id;
  return '<div class="jp-bar">'
    + '<button type="button" class="grip" data-grip="' + jpEsc(id) + '" aria-label="Move or resize ' + jpEsc(name)
    + '. Arrow keys move it, shift and arrow keys resize it, Delete hides it.">\u283f</button>'
    // Empty, not absent: .name carries the margin that pushes the controls right.
    + (titled ? '<span class="name"></span>' : '<span class="name">' + jpEsc(name) + '</span>')
    + '<span class="jp-span" aria-hidden="true">' + span + '/' + JP_COLS
    + (h ? ' \u00b7 ' + (h / JP_ROW) + 'r' : '') + '</span>'
    + '<button type="button" class="jp-chip" data-act="hide" aria-label="Hide ' + jpEsc(name) + '">Hide</button></div>';
}

function jpTray() {
  if (!jpEdit) return '';
  const hidden = jpLayout.order.filter((id) => jpLayout.hidden.includes(id));
  return '<div class="jp-tray">'
    + (hidden.length
      ? '<span class="jp-dim">Hidden:</span>' + hidden.map((id) => '<button type="button" class="jp-chip" data-act="show" data-id="'
        + id + '">+ ' + jpEsc((JP_WIDGET[id] || {}).name || id) + '</button>').join('')
      : '<span class="jp-dim">Drag ⠿ to move a card, drag an edge to resize it. Hide what you do not read.</span>')
    + '<button type="button" class="jp-chip" data-act="reset" style="margin-left:auto">Reset</button></div>';
}

/**
 * Which cards end up on the same row, worked out the way the grid itself will: fill left
 * to right until the next span will not fit, then wrap. Knowing this BEFORE painting is
 * what lets the handle between two cards behave as a divider -- the pointer code would
 * otherwise have to measure the page and guess.
 */
function jpRowsOf(shown) {
  const rows = [];
  let row = [], used = 0;
  for (const id of shown) {
    const span = jpSpanOf(jpLayout, id);
    if (used + span > JP_COLS && row.length) { rows.push(row); row = []; used = 0; }
    row.push(id);
    used += span;
    if (used >= JP_COLS) { rows.push(row); row = []; used = 0; }
  }
  if (row.length) rows.push(row);
  return rows;
}

/* id -> the card immediately to its right on the same row, if any. */
function jpSplitPartners(shown) {
  const partner = {};
  for (const row of jpRowsOf(shown)) {
    for (let i = 0; i < row.length - 1; i++) partner[row[i]] = row[i + 1];
  }
  return partner;
}

/* Repaints the cards from data already in hand -- arranging the page never refetches. */
function jpPaintCards() {
  const host = document.getElementById('jpCards');
  if (!host || !jpData || !jpLast) return;
  const visible = jpLayout.order.filter((id) => !jpLayout.hidden.includes(id));
  // Built once: a card with nothing to show is not rendered, so it is not on a row
  // either, and the split partners have to be worked out from what is actually drawn.
  const bodies = new Map();
  for (const id of visible) { const b = jpCardBody(id, jpData); if (b) bodies.set(id, b); }
  const shown = [...bodies.keys()];
  const partner = jpSplitPartners(shown);
  host.innerHTML = shown.map((id) => {
    const body = bodies.get(id);
    const span = jpSpanOf(jpLayout, id);
    const h = jpHeightOf(jpLayout, id);
    /* NAMED, because an unnamed <section> is not a region at all -- twelve of them left
       a screen reader with one unnamed <nav> as the only thing on the page it could
       jump to. The registry name is used rather than the card's own heading: it is
       there for every card, including the two that print no heading. */
    const label = (JP_WIDGET[id] || {}).name || id;
    return '<section class="jp-card' + (id === 'kpis' ? ' bare' : '') + '"'
      + ' aria-label="' + jpEsc(label) + '"'
      // A card the reader has SIZED opts out of the row stretch (#3567). Stretching is
      // what keeps un-sized cards lined up, but it also means the row decides the box
      // height -- so dragging the bottom edge shrank the contents inside a box that could
      // not move, which is not resizing anything.
      + ' data-card="' + id + '" style="grid-column:span ' + span + (h ? ';align-self:start' : '') + '">'
      // A card that prints its own <h2> does not need the bar to print it again.
      + jpCardBar(id, span, h, /<h2[ >]/.test(body))
      + '<div class="jp-cbody"' + (h ? ' style="height:' + h + 'px;overflow:auto"' : '') + '>' + body + '</div>'
      + (jpEdit ? '<span class="jp-res jp-res-x' + (partner[id] ? ' jp-res-split' : '') + '" data-res="x"'
        + (partner[id] ? ' data-split="' + jpEsc(partner[id]) + '"' : '')
        + ' title="' + (partner[id] ? 'Drag to change the split with the card beside it' : 'Drag to set width') + '"></span>'
        + '<span class="jp-res jp-res-y" data-res="y" title="Drag to set height, double-click to fit"></span>' : '')
      + '</section>';
  }).join('') + jpTray();
  jpBindPlots();
  jpEnsureSymbols();
  jpEnsureHeatmap();
  jpEnsureRDist();
  jpEnsureTrades();
  jpEnsureNotes();
  jpEnsureTags();
  jpEnsureCoach();
}

/* Bound once, on the body host, because the cards themselves are replaced on every
   arrangement.

   HTML5 drag-and-drop is gone (#3565). It could only express "you dropped on this card",
   which the layout then had to read as "before it" -- correct going up, off by one going
   down, and leaving the last position unreachable no matter which way you came at it.
   Pointer events give a POSITION, which is what a drop actually means, so the same code
   handles both directions and the end of the list is just another slot.
   The same mechanism does resizing, which drag-and-drop could not do at all. */
function jpBindLayout(root) {
  if (!root) return;

  root.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.getAttribute('data-act');
    if (act === 'reset') { jpLayoutReset(); return; }
    const card = btn.closest('[data-card]');
    const id = btn.getAttribute('data-id') || (card && card.getAttribute('data-card'));
    if (!id) return;
    if (act === 'hide') jpApplyLayout(jpLayoutHide(jpLayout, id));
    else if (act === 'show') jpApplyLayout(jpLayoutShow(jpLayout, id));
  });

  /* A height the reader set is a height they can give back: double-click the bottom edge
     and the card sizes to its contents again. Without this, shrinking a card once means
     never seeing the rest of it. */
  root.addEventListener('dblclick', (e) => {
    const res = e.target.closest && e.target.closest('[data-res="y"]');
    const card = res && res.closest('[data-card]');
    if (!card) return;
    e.preventDefault();
    jpApplyLayout(jpLayoutHeight(jpLayout, card.getAttribute('data-card'), null));
  });

  /* Everything the pointer can do, the keyboard can do -- which was not true of the
     arrow chips this replaced, since they could not resize. */
  root.addEventListener('keydown', (e) => {
    const grip = e.target.closest && e.target.closest('[data-grip]');
    if (!grip || !jpEdit) return;
    const id = grip.getAttribute('data-grip');
    const span = jpSpanOf(jpLayout, id);
    let next = null;
    // Shift+arrows resize. Same rule as the divider: where there is a card beside it,
    // the width comes from that card rather than from the row's capacity.
    const resize = (by) => {
      const shown = [...root.querySelectorAll('[data-card]')].map((c) => c.getAttribute('data-card'));
      const mate = jpSplitPartners(shown)[id];
      if (!mate) return jpLayoutSpan(jpLayout, id, span + by);
      const total = span + jpSpanOf(jpLayout, mate);
      const mine = jpClamp(span + by, JP_SPAN_MIN, total - JP_SPAN_MIN);
      return jpLayoutSpan(jpLayoutSpan(jpLayout, id, mine), mate, total - mine);
    };
    if (e.key === 'ArrowLeft') next = e.shiftKey ? resize(-1) : jpLayoutMove(jpLayout, id, -1);
    else if (e.key === 'ArrowRight') next = e.shiftKey ? resize(1) : jpLayoutMove(jpLayout, id, 1);
    else if (e.key === 'Delete' || e.key === 'Backspace') next = jpLayoutHide(jpLayout, id);
    if (!next || next === jpLayout) return;
    e.preventDefault();
    jpApplyLayout(next);
    // The card moved; the focus follows it, or the next key press goes nowhere.
    const again = document.querySelector('[data-grip="' + id + '"]');
    if (again) again.focus();
  });

  let drag = null;

  /* Which SLOT the pointer is nearest: 0 is before the first card, cards.length is after
     the last. Measured against each card's leading edge, plus the trailing edge of the
     last one -- so "after everything" is a real answer rather than a missing case. */
  function jpDropIndex(host, x, y, cards) {
    let best = 0, bestD = Infinity;
    cards.forEach((c, idx) => {
      const r = c.getBoundingClientRect();
      const d = Math.hypot(x - r.left, y - (r.top + r.height / 2));
      if (d < bestD) { bestD = d; best = idx; }
    });
    if (cards.length) {
      const r = cards[cards.length - 1].getBoundingClientRect();
      if (Math.hypot(x - r.right, y - (r.top + r.height / 2)) < bestD) best = cards.length;
    }
    return best;
  }

  function jpShowDrop(host, cards, index) {
    let bar = host.querySelector('.jp-drop');
    if (!bar) { bar = document.createElement('div'); bar.className = 'jp-drop'; host.appendChild(bar); }
    const hostR = host.getBoundingClientRect();
    const at = Math.min(index, cards.length - 1);
    const r = cards[at].getBoundingClientRect();
    const after = index >= cards.length;
    bar.style.left = ((after ? r.right + 4 : r.left - 7) - hostR.left) + 'px';
    bar.style.top = (r.top - hostR.top) + 'px';
    bar.style.height = r.height + 'px';
  }

  const clearDrop = () => { const b = root.querySelector('.jp-drop'); if (b) b.remove(); };

  root.addEventListener('pointerdown', (e) => {
    if (!jpEdit || e.button !== 0) return;
    const card = e.target.closest && e.target.closest('[data-card]');
    if (!card) return;
    const res = e.target.closest('[data-res]');
    const grip = e.target.closest('[data-grip]');
    if (!res && !grip) return;
    const id = card.getAttribute('data-card');
    const body = card.querySelector('.jp-cbody');
    /* The handle sits BETWEEN two cards, so when there is a card beside it that is
       what it adjusts: the pair keeps its combined width and the boundary moves.
       Sizing them independently meant a 60/40 split took two drags with a state in
       between where they no longer fit -- and a card that does not fit wraps. */
    const splitId = res ? res.getAttribute('data-split') : null;
    const splitEl = splitId ? card.parentNode.querySelector('[data-card="' + splitId + '"]') : null;
    drag = {
      id, card, body,
      mode: res ? res.getAttribute('data-res') : 'move',
      x: e.clientX, y: e.clientY,
      span: jpSpanOf(jpLayout, id),
      h: body ? Math.round(body.getBoundingClientRect().height) : 0,
      handle: res || grip,
      pair: splitEl ? { id: splitId, el: splitEl, span: jpSpanOf(jpLayout, splitId) } : null,
      index: null, live: null, pairLive: null, moved: false,
    };
    if (res) res.classList.add('on');
    try { drag.handle.setPointerCapture(e.pointerId); } catch (_e) { /* mouse without capture */ }
    e.preventDefault();
  });

  root.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const host = document.getElementById('jpCards');
    if (!host) return;
    if (!drag.moved && Math.abs(e.clientX - drag.x) < 3 && Math.abs(e.clientY - drag.y) < 3) return;
    drag.moved = true;

    if (drag.mode === 'move') {
      drag.card.classList.add('grabbing');
      const cards = [...host.querySelectorAll('[data-card]')];
      drag.index = jpDropIndex(host, e.clientX, e.clientY, cards);
      jpShowDrop(host, cards, drag.index);
      return;
    }
    if (drag.mode === 'x') {
      // One column is a twelfth of the grid, gaps included -- so the card follows the
      // pointer rather than drifting away from it as the row fills up.
      const r = host.getBoundingClientRect();
      const col = (r.width + 12) / JP_COLS;
      const step = Math.round((e.clientX - drag.x) / col);
      const show = (el, span) => {
        el.style.gridColumn = 'span ' + span;
        const out = el.querySelector('.jp-span');
        if (out) out.textContent = span + '/' + JP_COLS;
      };
      if (drag.pair) {
        // The pair's combined width is fixed, so neither can be pushed off the row.
        const total = drag.span + drag.pair.span;
        drag.live = jpClamp(drag.span + step, JP_SPAN_MIN, total - JP_SPAN_MIN);
        drag.pairLive = total - drag.live;
        show(drag.card, drag.live);
        show(drag.pair.el, drag.pairLive);
        return;
      }
      // Last card on its row: nothing to take from, so it just grows or shrinks.
      drag.live = jpClamp(drag.span + step, JP_SPAN_MIN, JP_COLS);
      show(drag.card, drag.live);
      return;
    }
    if (drag.mode === 'y' && drag.body) {
      // Whole rows from where the drag started, exactly as the width handle takes
      // whole columns -- so the card lands on the grid rather than wherever the
      // pointer happened to stop.
      const step = Math.round((e.clientY - drag.y) / JP_ROW);
      drag.live = jpRowsToPx(jpPxToRows(drag.h) + step);
      drag.body.style.height = drag.live + 'px';
      drag.body.style.overflow = 'auto';
      const out = drag.card.querySelector('.jp-span');
      if (out) out.textContent = jpSpanOf(jpLayout, drag.id) + '/' + JP_COLS + ' \u00b7 ' + (drag.live / JP_ROW) + 'r';
    }
  });

  function endDrag() {
    if (!drag) return;
    const d = drag;
    drag = null;
    if (d.handle) d.handle.classList.remove('on');
    d.card.classList.remove('grabbing');
    clearDrop();
    if (!d.moved) return;                       // a click on a handle is not a drag
    if (d.mode === 'move' && d.index != null) jpApplyLayout(jpLayoutInsert(jpLayout, d.id, d.index));
    else if (d.mode === 'x' && d.live != null) {
      let next = jpLayoutSpan(jpLayout, d.id, d.live);
      if (d.pair && d.pairLive != null) next = jpLayoutSpan(next, d.pair.id, d.pairLive);
      jpApplyLayout(next);
    }
    else if (d.mode === 'y' && d.live != null) jpApplyLayout(jpLayoutHeight(jpLayout, d.id, d.live));
  }
  root.addEventListener('pointerup', endDrag);
  // A cancelled pointer (a right-click, a system gesture) must not leave the page in a
  // half-dragged state with an indicator stuck to it.
  root.addEventListener('pointercancel', endDrag);
}

function jpRender(host, data) {
  const bookKey = Object.keys(data.rec.books || {})[0];
  const book = (data.rec.books || {})[bookKey] || {};
  const s = book.stats || {};
  const daily = book.daily || [];
  // Today's live figure (#3502); the demo book has no live account behind it.
  const liveToday = data.demo ? null : jpLiveToday(data.live);
  // The account's own change per session (#3517); the demo book's series is monthly.
  const acct = data.demo ? null : jpAccountDaily(data.equity);
  let html = '';

  if (data.demo) {
    html += '<div class="jp-banner"><span><b>' + jpEsc(book.label || 'Demo book')
      + '</b> — simulated sample data, not real trades. Your own account fills this in once it trades.</span>'
      + '<a href="/pricing.html" style="margin-left:auto;white-space:nowrap">See plans →</a></div>';
  }

  const rangeEl = document.getElementById('jpRange');
  if (rangeEl) {
    rangeEl.textContent = (daily.length
      ? ('Realized results, ' + daily[0].date + ' to ' + daily[daily.length - 1].date + '.')
      : 'Realized results, day by day.')
      + (liveToday ? ' Today so far: ' + (liveToday.pnl > 0 ? '+' : '') + jpUsd(liveToday.pnl) + ', live.' : '');
  }

  if (!s.trades) {
    /* This used to say the page would fill in "as soon as a position closes" -- which
       is true only for the autopilot, and the autopilot is the $200 tier. For everyone
       who trades by hand it promised something nothing would ever keep: their fills
       were never written to this ledger at all (#3557). Say what is actually true, and
       offer the thing that fixes it. */
    html += '<div class="jp-empty">No trades on record yet. This journal fills in from two places: '
      + 'trades you place yourself through a connected broker, and — on the Pilot plan — the autopilot\'s own. '
      + 'If you have already been trading, bring that history in:</div>'
      + '<div id="jpImport" class="jp-import"></div>';
    html += jpPlacements();          // things you DID still belong here
    host.innerHTML = html;
  jpBindPlots();
    return;
  }

  jpLast = { s, book, daily, liveToday, acct };
  html += '<div class="jp-cards" id="jpCards"></div>';   // filled by jpPaintCards (#3543)

  const disclosed = jpDisclosures(book.disclosures);
  if (disclosed) html += '<p class="jp-note">' + jpEsc(disclosed) + '</p>';
  host.innerHTML = html;
  jpPaintCards();
}

/* ── Staying current ──────────────────────────────────────────────────────────
   The page reads the broker record when it opens, and when you press Refresh. Nothing
   else moves it (#3541). It used to refetch on focus, on visibilitychange and on a
   two-minute timer, so switching tabs and coming back repainted the page under you --
   scroll position included -- and any control did the same. A review surface that shifts
   while you are reading it is worse than one a few minutes old, so the header carries the
   time it last read the record instead. */
function jpStampLoaded(at) {
  const el = document.getElementById('jpLoadedAt');
  if (!el) return;
  let t = '';
  try { t = (at || new Date()).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); } catch (_e) { t = ''; }
  el.textContent = t ? 'Loaded ' + t : '';
}

document.addEventListener('DOMContentLoaded', () => {
  jpBindLayout(document.getElementById('jpBody'));
  jpLoad();
  jpLayoutSync();            // the copy that follows the reader between devices (#3543)
  jpImportCheck();           // can this reader bring in their own broker trades? (#3557)
});
</script>
