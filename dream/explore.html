<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="utf-8">
  <meta name="loop-stage" content="remember">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06b6d4">
  <link rel="manifest" href="/manifest.json">
  <script>
    /* Theme bootstrap — set before first paint to avoid flash of wrong theme */
    (function() {
      try {
        var stored = localStorage.getItem('lantern-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = stored ? stored === 'dark' : prefersDark;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/site.css">
  <title>Dashboard — unisona.ai</title>
  <style>
    /* ─────────────────────────────────────────────────────────────────────────
       Personalized dashboard (Robinhood-style). Left/main column: portfolio
       header + equity chart + holdings. Right column: buying power, the user's
       watchlist, then market news. Loop stage: Remember (surfaces your state).
       ───────────────────────────────────────────────────────────────────────── */
    :root { --gain: var(--green); --loss: var(--danger); }

    .dash {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 28px;
      align-items: start;
      padding: 24px 0 8px;
    }
    @media (max-width: 900px) {
      .dash { grid-template-columns: 1fr; gap: 20px; }
      .dash-side { position: static !important; }
    }
    .dash-main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
    .dash-side {
      display: flex; flex-direction: column; gap: 16px;
      position: sticky; top: 78px;
    }

    /* ── Card shell ── */
    .card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }
    .card-head {
      display: flex; align-items: center; gap: 8px;
      margin: 0 0 14px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.09em;
      text-transform: uppercase; color: var(--muted);
    }
    .card-head .ch-action {
      margin-left: auto; font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.02em; text-transform: none; color: var(--accent-strong);
      text-decoration: none;
    }
    .card-head .ch-action:hover { text-decoration: underline; }

    /* ── Portfolio header ── */
    .port-hero { padding: 24px 22px 8px; }
    .port-greeting {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      font-size: 0.82rem; color: var(--muted); margin-bottom: 4px;
    }
    .port-greeting .acct-pill {
      font-size: 0.64rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface2); color: var(--muted);
    }
    .port-greeting .acct-pill.live { color: var(--loss); border-color: color-mix(in srgb, var(--loss) 40%, var(--border)); }
    .port-value {
      font-size: clamp(2.1rem, 5.5vw, 3rem);
      font-weight: 800; letter-spacing: -0.03em; line-height: 1.05;
      color: var(--text); font-variant-numeric: tabular-nums;
    }
    .port-change {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-top: 8px; font-size: 0.98rem; font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .port-change .pc-money.up, .port-change .pc-pct.up { color: var(--gain); }
    .port-change .pc-money.down, .port-change .pc-pct.down { color: var(--loss); }
    .port-change .pc-arrow.up { color: var(--gain); }
    .port-change .pc-arrow.down { color: var(--loss); }
    .port-change .pc-range {
      color: var(--muted); font-weight: 600; font-size: 0.86rem;
    }

    /* ── Equity chart ── */
    .chart-wrap { position: relative; margin: 14px -22px 0; }
    .chart-canvas { display: block; width: 100%; height: 220px; touch-action: pan-y; }
    .chart-readout {
      position: absolute; top: -30px; left: 0; transform: translateX(-50%);
      font-size: 0.68rem; font-weight: 700; color: var(--muted);
      background: var(--surface2); border: 1px solid var(--border);
      padding: 3px 8px; border-radius: 6px; white-space: nowrap;
      opacity: 0; transition: opacity 0.1s; pointer-events: none;
    }
    .chart-readout.show { opacity: 1; }
    .chart-empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; height: 220px; color: var(--muted); font-size: 0.85rem; text-align: center;
      padding: 0 24px;
    }
    /* The class sets display:flex, which would otherwise beat the [hidden] UA
       display:none — so the empty-state text stayed visible under a drawn chart.
       Make `hidden` win. */
    .chart-empty[hidden] { display: none; }

    /* ── Range chips + chart-type toggle ── */
    .chart-controls {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px 12px; flex-wrap: wrap;
      padding: 14px 22px 4px; border-top: 1px solid var(--border); margin-top: 8px;
    }
    .range-row { display: flex; gap: 4px; flex-wrap: wrap; }
    .range-chip {
      font: inherit; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.02em;
      padding: 6px 13px; border-radius: 999px; border: 1.5px solid transparent;
      background: transparent; color: var(--muted); cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .range-chip:hover { color: var(--text); background: var(--surface2); }
    .range-chip.active { background: var(--accent); color: #fff; }
    .range-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Line ↔ Candlestick toggle — mirrors the trader's chart-type control. */
    .chart-type {
      display: inline-flex; gap: 2px; padding: 2px;
      border: 1.5px solid var(--border); border-radius: 10px; background: var(--bg);
    }
    .ct-btn {
      font: inherit; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.02em;
      padding: 5px 11px; border: none; border-radius: 8px;
      background: transparent; color: var(--muted); cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .ct-btn:hover { color: var(--text); }
    .ct-btn.active { background: var(--accent); color: #fff; }
    .ct-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── Holdings ── */
    .holding {
      display: grid; grid-template-columns: 1fr auto; gap: 4px 12px;
      align-items: center; padding: 13px 4px;
      border-bottom: 1px solid var(--border); text-decoration: none; color: inherit;
    }
    .holding:last-child { border-bottom: none; }
    .holding:hover { background: var(--surface2); border-radius: 8px; }
    .h-sym { font-weight: 700; font-size: 0.96rem; color: var(--text); }
    .h-sub { font-size: 0.72rem; color: var(--muted); }
    .h-val { text-align: right; font-weight: 700; font-size: 0.94rem; font-variant-numeric: tabular-nums; color: var(--text); }
    .h-pnl { text-align: right; font-size: 0.76rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .h-pnl.up { color: var(--gain); }
    .h-pnl.down { color: var(--loss); }

    /* ── Buying power ── */
    .bp-value { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text); font-variant-numeric: tabular-nums; }
    .bp-sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .bp-cta {
      display: block; text-align: center; margin-top: 14px;
      font-size: 0.82rem; font-weight: 700; padding: 10px; border-radius: 10px;
      background: var(--accent); color: #fff; text-decoration: none;
    }
    .bp-cta:hover { background: var(--accent-hover); }

    /* ── Watchlist ── */
    .wl-add { display: flex; gap: 6px; margin-bottom: 10px; }
    .wl-add input {
      flex: 1; min-width: 0; font: inherit; font-size: 0.82rem;
      padding: 7px 10px; border: 1.5px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); text-transform: uppercase;
    }
    .wl-add input:focus-visible { outline: none; border-color: var(--accent); }
    .wl-add button {
      font: inherit; font-size: 0.82rem; font-weight: 700; padding: 7px 12px;
      border: none; border-radius: 8px; background: var(--surface2); color: var(--text); cursor: pointer;
    }
    .wl-add button:hover { background: var(--accent); color: #fff; }
    .wl-row {
      display: grid; grid-template-columns: 1fr auto auto; gap: 4px 10px;
      align-items: center; padding: 9px 2px; border-bottom: 1px solid var(--border);
      text-decoration: none; color: inherit; position: relative;
    }
    .wl-row:last-child { border-bottom: none; }
    .wl-row:hover { background: var(--surface2); border-radius: 8px; }
    .wl-tk { font-weight: 700; font-size: 0.86rem; color: var(--text); }
    .wl-px { text-align: right; font-size: 0.84rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
    .wl-chg {
      text-align: right; font-size: 0.72rem; font-weight: 700; min-width: 58px;
      padding: 2px 7px; border-radius: 6px; font-variant-numeric: tabular-nums;
    }
    .wl-chg.up { color: var(--gain); background: color-mix(in srgb, var(--gain) 14%, transparent); }
    .wl-chg.down { color: var(--loss); background: color-mix(in srgb, var(--loss) 14%, transparent); }
    .wl-chg.flat { color: var(--muted); background: var(--surface2); }
    .wl-remove {
      position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
      width: 22px; height: 22px; border: none; border-radius: 6px; background: var(--surface);
      color: var(--muted); font-size: 13px; line-height: 1; cursor: pointer; opacity: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .wl-row:hover .wl-remove { opacity: 1; }
    .wl-remove:hover { color: var(--loss); background: var(--surface2); }

    /* ── News ── */
    .news-row {
      display: block; padding: 11px 2px; border-bottom: 1px solid var(--border);
      text-decoration: none; color: inherit;
    }
    .news-row:last-child { border-bottom: none; }
    .news-row:hover .nr-title { color: var(--accent-strong); }
    .nr-meta { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
    .nr-meta .nr-src { color: var(--accent-strong); }
    .nr-title { font-size: 0.85rem; font-weight: 600; line-height: 1.4; color: var(--text); }

    /* ── Skeleton shimmer ── */
    .sk { background: var(--surface2); border-radius: 6px;
      background-image: linear-gradient(90deg, transparent 0%, color-mix(in srgb, var(--accent) 10%, transparent) 50%, transparent 100%);
      background-size: 200% 100%; animation: sk-sh 1.25s ease-in-out infinite; }
    @keyframes sk-sh { to { background-position: -200% 0; } }
    .sk-line { height: 12px; margin: 10px 0; }

    .muted-note { color: var(--muted); font-size: 0.85rem; line-height: 1.5; }

    /* ── Connect-broker prompt ── */
    .connect-card { text-align: center; padding: 34px 24px; }
    .connect-card h2 { font-size: 1.15rem; font-weight: 800; margin: 0 0 8px; }
    .connect-card p { color: var(--muted); font-size: 0.92rem; line-height: 1.5; max-width: 420px; margin: 0 auto 16px; }
    .connect-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .connect-actions a {
      font-size: 0.85rem; font-weight: 700; padding: 10px 18px; border-radius: 10px; text-decoration: none;
    }
    .connect-actions a.primary { background: var(--accent); color: #fff; }
    .connect-actions a.primary:hover { background: var(--accent-hover); }
    .connect-actions a.ghost { border: 1.5px solid var(--border); color: var(--text); }
    .connect-actions a.ghost:hover { border-color: var(--accent); }

    /* ── Footer quick-links (keep the old Explore tool jumps discoverable) ── */
    .quick-links {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px;
      max-width: 920px; margin: 40px auto 0; padding: 18px 16px 4px;
      border-top: 1px solid var(--border);
    }
    .quick-links a { font-size: 0.8rem; font-weight: 600; color: var(--muted); text-decoration: none; }
    .quick-links a:hover { color: var(--accent); }
    .quick-links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
    @media (forced-colors: active) {
      .card, .holding, .wl-row, .news-row { border-color: CanvasText; }
    }
  </style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Personalized dashboard controller.
   Reads the SAME trading endpoints the trader page uses:
     • GET /api/trading/positions            → equity, buying power, holdings
     • GET /api/trading/portfolio/history    → equity curve (Robinhood chart)
     • GET /api/trading/watchlist            → the user's own symbols
     • GET /api/trading/watchlist-prices     → live prices (global map)
     • GET /api/trading/price-feed?symbol=   → price for uncovered symbols
     • POST /api/explore/feed/page (finance) → market news headlines
   Everything degrades honestly: no broker → connect prompt; no history → flat
   baseline; feed offline → a quiet note. Nothing here places an order.
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const usd = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtMoney = (n) => usd.format(Number(n) || 0);
  const fmtPct = (n) => (n >= 0 ? '+' : '') + (Number(n) || 0).toFixed(2) + '%';
  const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#888';

  let account = null;
  let positions = [];
  let curRange = '1D';
  let series = null;   // { timestamps:[], equity:[], baseline }

  // Demo showroom: logged-out / non-entitled visitors see the simulated champion
  // account (read-only) instead of a "connect a broker" prompt, so the dashboard is
  // never empty for them. `demoMode` is set to 'champion' either by an explicit
  // ?demo=champion in the URL or, in init(), when the session lacks the trade
  // entitlement. Entitled traders leave it null → their own broker data loads.
  let demoMode = new URLSearchParams(location.search).get('demo') || null;
  const demoParam = (sep) => (demoMode ? sep + 'demo=' + encodeURIComponent(demoMode) : '');

  // ── Portfolio header + holdings ──────────────────────────────────────────
  async function loadPositions() {
    let data = null;
    try {
      const r = await fetch('/api/trading/positions' + demoParam('?'), { cache: 'no-store', signal: AbortSignal.timeout(9000) });
      data = r.ok ? await r.json() : null;
    } catch (_e) { data = null; }
    account = (data && data.account) || {};
    positions = (data && Array.isArray(data.positions)) ? data.positions : [];
    const connected = (Number(account.equity) > 0) || positions.length > 0;

    if (!connected) { renderNotConnected(); return false; }

    // Account label pill (demo / paper / live).
    const pill = $('acctPill');
    if (account.mode) {
      pill.hidden = false;
      pill.textContent = account.mode === 'live' ? 'Live' : account.mode === 'demo' ? 'Demo' : 'Paper';
      pill.classList.toggle('live', account.mode === 'live');
    }
    $('greeting').textContent = account.demo
      ? 'Demo portfolio — the champion strategy'
      : (account.account_id ? ('Account · ' + account.account_id) : 'Portfolio overview');

    renderHoldings();
    renderBuyingPower();
    return true;
  }

  function renderNotConnected() {
    $('portValue').textContent = 'Get started';
    $('portChange').innerHTML = '<span class="pc-range">Connect a brokerage to see your portfolio</span>';
    $('chartEmpty').hidden = false;
    $('chartEmpty').textContent = 'Your equity curve appears here once an account is linked.';
    $('equityChart').style.display = 'none';
    $('holdingsCard').innerHTML =
      '<div class="connect-card">' +
        '<h2>No brokerage connected yet</h2>' +
        '<p>Link an Interactive Brokers or Alpaca account to track positions, buying power, and your equity curve here. Paper trading works with no money down.</p>' +
        '<div class="connect-actions">' +
          '<a class="primary" href="/ibkr-connect.html">Connect brokerage</a>' +
          '<a class="ghost" href="/stock-trader.html">Explore the trader</a>' +
        '</div>' +
      '</div>';
    $('bpValue').textContent = '$0.00';
    $('bpSub').textContent = 'Connect an account to fund';
  }

  function renderBuyingPower() {
    const bp = Number(account.buying_power);
    const cash = Number(account.cash);
    const val = Number.isFinite(bp) && bp > 0 ? bp : (Number.isFinite(cash) ? cash : 0);
    $('bpValue').textContent = fmtMoney(val);
    $('bpSub').textContent = Number.isFinite(cash)
      ? ('Cash ' + fmtMoney(cash) + ' · available to invest')
      : 'Available to invest';
  }

  function renderHoldings() {
    const box = $('holdingsList');
    if (!box) return;
    if (!positions.length) {
      box.innerHTML = '<p class="muted-note">No open positions. Head to the trader to place your first order.</p>';
      return;
    }
    // Sort by market value, biggest first.
    const rows = positions.slice().sort((a, b) =>
      Math.abs(Number(b.market_value) || 0) - Math.abs(Number(a.market_value) || 0));
    box.innerHTML = rows.map((p) => {
      const qty = Number(p.qty) || 0;
      const avg = Number(p.avg_entry_price) || 0;
      const mv = Number(p.market_value) || 0;
      const pnl = Number(p.unrealized_pl) || 0;
      const pct = Number(p.pnl_pct) || 0;
      const up = pnl >= 0;
      const sub = (qty % 1 === 0 ? qty : qty.toFixed(4)) + ' sh · avg ' + fmtMoney(avg);
      return '<a class="holding" href="/stock-trader.html?symbol=' + encodeURIComponent(p.symbol) + '">' +
        '<span class="h-sym">' + esc(p.symbol) + '</span>' +
        '<span class="h-val">' + fmtMoney(mv) + '</span>' +
        '<span class="h-sub">' + esc(sub) + '</span>' +
        '<span class="h-pnl ' + (up ? 'up' : 'down') + '">' + (up ? '+' : '') + fmtMoney(pnl) + ' (' + fmtPct(pct) + ')</span>' +
      '</a>';
    }).join('');
  }

  // ── Equity chart ─────────────────────────────────────────────────────────
  async function loadHistory(range) {
    curRange = range;
    let data = null;
    try {
      const r = await fetch('/api/trading/portfolio/history?range=' + encodeURIComponent(range) + demoParam('&'), { cache: 'no-store', signal: AbortSignal.timeout(9000) });
      data = r.ok ? await r.json() : null;
    } catch (_e) { data = null; }

    if (data && data.ok && Array.isArray(data.equity)) {
      // Keep aligned (timestamp, equity) pairs where equity is present.
      const pts = [];
      for (let i = 0; i < data.equity.length; i++) {
        const v = data.equity[i];
        if (v != null && Number.isFinite(Number(v)) && Number(v) > 0) {
          pts.push({ t: Number(data.timestamps[i]) * 1000, v: Number(v) });
        }
      }
      const baseline = Number(data.base_value) || (pts.length ? pts[0].v : 0);
      series = pts.length >= 2 ? { pts, baseline } : null;
    } else {
      series = null;
    }
    drawChart();
    updateHeader(null);
  }

  // Header value + change for the current range (or a hovered point).
  function updateHeader(hover) {
    if (!series || !series.pts.length) {
      // Fall back to the live account snapshot.
      const eq = Number(account && account.equity) || 0;
      const day = Number(account && account.pnl_today) || 0;
      const dayPct = Number(account && account.pnl_pct) || 0;
      $('portValue').textContent = eq ? fmtMoney(eq) : '$—';
      if (eq) renderChange(day, dayPct, 'Today');
      return;
    }
    const last = series.pts[series.pts.length - 1];
    const point = hover || last;
    const base = series.baseline || series.pts[0].v;
    const change = point.v - base;
    const pct = base ? (change / base) * 100 : 0;
    $('portValue').textContent = fmtMoney(point.v);
    renderChange(change, pct, hover ? fmtWhen(point.t) : rangeLabel(curRange));
  }

  function renderChange(change, pct, label) {
    const up = change >= 0;
    $('portChange').innerHTML =
      '<span class="pc-arrow ' + (up ? 'up' : 'down') + '" aria-hidden="true">' + (up ? '▲' : '▼') + '</span>' +
      '<span class="pc-money ' + (up ? 'up' : 'down') + '">' + (up ? '+' : '−') + fmtMoney(Math.abs(change)) + '</span>' +
      '<span class="pc-pct ' + (up ? 'up' : 'down') + '">(' + fmtPct(pct) + ')</span>' +
      '<span class="pc-range">' + esc(label) + '</span>';
  }

  function rangeLabel(r) {
    return ({ '1D': 'Today', '1W': 'Past week', '1M': 'Past month', '3M': 'Past 3 months', 'YTD': 'Year to date', '1Y': 'Past year', 'ALL': 'All time' })[r] || '';
  }
  function fmtWhen(t) {
    const d = new Date(t);
    if (curRange === '1D') return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    if (curRange === '1W') return d.toLocaleDateString(undefined, { weekday: 'short', hour: 'numeric' });
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: (curRange === '1Y' || curRange === 'ALL') ? '2-digit' : undefined });
  }

  const canvas = $('equityChart');
  let geom = null;   // last-drawn geometry for hit-testing
  let chartType = 'line';
  try { chartType = localStorage.getItem('explore-chart-type') === 'candle' ? 'candle' : 'line'; } catch (_e) {}

  // Aggregate the fine equity ticks into `count` OHLC candles. A portfolio-value
  // series carries one value per tick, so each candle's open/high/low/close is the
  // first / max / min / last of the ticks in its time bucket.
  function buildCandles(pts, count) {
    const n = pts.length;
    const size = Math.max(1, Math.ceil(n / count));
    const candles = [];
    for (let i = 0; i < n; i += size) {
      const slice = pts.slice(i, i + size);
      if (!slice.length) continue;
      let hi = -Infinity, lo = Infinity;
      for (const p of slice) { if (p.v > hi) hi = p.v; if (p.v < lo) lo = p.v; }
      candles.push({ o: slice[0].v, c: slice[slice.length - 1].v, h: hi, l: lo, t: slice[slice.length - 1].t });
    }
    return candles;
  }

  function drawChart() {
    const empty = $('chartEmpty');
    if (!series || series.pts.length < 2) {
      canvas.style.display = 'none';
      empty.hidden = false;
      empty.textContent = (Number(account && account.equity) > 0)
        ? 'No price history for this range yet.'
        : 'Your equity curve appears here once an account is linked.';
      geom = null;
      return;
    }
    canvas.style.display = 'block';
    empty.hidden = true;

    const dpr = window.devicePixelRatio || 1;
    const cssW = canvas.clientWidth || canvas.parentElement.clientWidth || 600;
    const cssH = 220;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    const ctx = canvas.getContext && canvas.getContext('2d');
    if (!ctx) { canvas.style.display = 'none'; geom = null; return; }  // no 2D context (headless) → hide gracefully
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);

    const pts = series.pts;
    const padX = 22, padTop = 14, padBot = 14;
    const vals = pts.map((p) => p.v);
    let min = Math.min(...vals, series.baseline);
    let max = Math.max(...vals, series.baseline);
    if (min === max) { min -= 1; max += 1; }
    const range = max - min;
    const W = cssW - padX * 2;
    const H = cssH - padTop - padBot;
    const y = (v) => padTop + H - ((v - min) / range) * H;

    const up = pts[pts.length - 1].v >= series.baseline;
    const line = up ? cssVar('--gain') : cssVar('--loss');

    // Baseline (previous close / range start) — dashed grey reference line.
    const by = y(series.baseline);
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = cssVar('--border');
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padX, by); ctx.lineTo(cssW - padX, by); ctx.stroke();
    ctx.restore();

    if (chartType === 'candle') {
      // ── Candlestick view ── each candle green/red by its own open→close.
      const gain = cssVar('--gain'), loss = cssVar('--loss');
      const count = Math.max(8, Math.min(pts.length, Math.floor(W / 9)));
      const candles = buildCandles(pts, count);
      const slot = W / candles.length;
      const bodyW = Math.max(1.5, Math.min(slot * 0.68, 12));
      const cx = (i) => padX + slot * (i + 0.5);
      candles.forEach((cd, i) => {
        const x0 = cx(i);
        const col = cd.c >= cd.o ? gain : loss;
        ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1;
        // wick (high → low)
        ctx.beginPath(); ctx.moveTo(x0, y(cd.h)); ctx.lineTo(x0, y(cd.l)); ctx.stroke();
        // body (open ↔ close), min 1px tall so flat candles stay visible
        const top = Math.min(y(cd.o), y(cd.c));
        ctx.fillRect(x0 - bodyW / 2, top, bodyW, Math.max(1, Math.abs(y(cd.c) - y(cd.o))));
      });
      geom = { mode: 'candle', candles, y, cx, padX, W, cssW, cssH, line };
    } else {
      // ── Line view (default) — area fill + stroke ──
      const x = (i) => padX + (W * i) / (pts.length - 1);
      const grad = ctx.createLinearGradient(0, padTop, 0, cssH - padBot);
      grad.addColorStop(0, up ? 'rgba(16,185,129,0.22)' : 'rgba(239,68,68,0.22)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath();
      ctx.moveTo(x(0), y(pts[0].v));
      for (let i = 1; i < pts.length; i++) ctx.lineTo(x(i), y(pts[i].v));
      ctx.lineTo(x(pts.length - 1), cssH - padBot);
      ctx.lineTo(x(0), cssH - padBot);
      ctx.closePath();
      ctx.fillStyle = grad; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x(0), y(pts[0].v));
      for (let i = 1; i < pts.length; i++) ctx.lineTo(x(i), y(pts[i].v));
      ctx.strokeStyle = line; ctx.lineWidth = 2;
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.stroke();
      geom = { mode: 'line', pts, x, y, padX, W, cssW, cssH, line };
    }
  }

  // Crosshair + header scrub on pointer move — works in both line and candle modes.
  function onScrub(clientX) {
    if (!geom) return;
    const rect = canvas.getBoundingClientRect();
    const px = clientX - rect.left;
    const rel = Math.max(0, Math.min(1, (px - geom.padX) / geom.W));
    let cx, cy, val, t;
    if (geom.mode === 'candle') {
      const idx = Math.max(0, Math.min(geom.candles.length - 1, Math.floor(rel * geom.candles.length)));
      const cd = geom.candles[idx]; if (!cd) return;
      cx = geom.cx(idx); cy = geom.y(cd.c); val = cd.c; t = cd.t;
    } else {
      const idx = Math.round(rel * (geom.pts.length - 1));
      const p = geom.pts[idx]; if (!p) return;
      cx = geom.x(idx); cy = geom.y(p.v); val = p.v; t = p.t;
    }
    drawChart();  // redraw base
    const ctx = canvas.getContext && canvas.getContext('2d');
    if (!ctx) return;
    ctx.save();
    ctx.strokeStyle = cssVar('--muted'); ctx.globalAlpha = 0.5; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, 8); ctx.lineTo(cx, geom.cssH - 8); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fillStyle = geom.line; ctx.fill();
    ctx.strokeStyle = cssVar('--surface'); ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    updateHeader({ v: val, t: t });
    const ro = $('chartReadout');
    ro.textContent = fmtWhen(t);
    ro.style.left = Math.max(30, Math.min(geom.cssW - 30, cx)) + 'px';
    ro.classList.add('show');
  }
  function endScrub() {
    $('chartReadout').classList.remove('show');
    drawChart();
    updateHeader(null);
  }
  canvas.addEventListener('mousemove', (e) => onScrub(e.clientX));
  canvas.addEventListener('mouseleave', endScrub);
  canvas.addEventListener('touchstart', (e) => { if (e.touches[0]) onScrub(e.touches[0].clientX); }, { passive: true });
  canvas.addEventListener('touchmove', (e) => { if (e.touches[0]) onScrub(e.touches[0].clientX); }, { passive: true });
  canvas.addEventListener('touchend', endScrub);

  let resizeT = null;
  window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(drawChart, 150); }, { passive: true });

  // Range chips.
  $('rangeRow').addEventListener('click', (e) => {
    const btn = e.target.closest('.range-chip');
    if (!btn || btn.dataset.range === curRange) return;
    $('rangeRow').querySelectorAll('.range-chip').forEach((b) => {
      const on = b === btn;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    loadHistory(btn.dataset.range);
  });

  // Chart-type toggle (line ↔ candlestick). Redraws in place — the same series,
  // rendered differently — and persists the choice.
  const typeRow = $('chartType');
  function applyChartType(t) {
    chartType = (t === 'candle') ? 'candle' : 'line';
    if (typeRow) typeRow.querySelectorAll('.ct-btn').forEach((b) => {
      const on = b.dataset.type === chartType;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    try { localStorage.setItem('explore-chart-type', chartType); } catch (_e) {}
    drawChart();
    updateHeader(null);
  }
  if (typeRow) typeRow.addEventListener('click', (e) => {
    const b = e.target.closest('.ct-btn');
    if (b) applyChartType(b.dataset.type);
  });
  applyChartType(chartType);   // reflect the persisted choice on load

  // ── Watchlist ────────────────────────────────────────────────────────────
  let priceMap = {};   // ticker → { price, chg_pct } from the global feed

  async function loadWatchlist() {
    let syms = [];
    try {
      const r = await fetch('/api/trading/watchlist', { cache: 'no-store', signal: AbortSignal.timeout(6000) });
      const d = r.ok ? await r.json() : null;
      syms = (d && Array.isArray(d.watchlist)) ? d.watchlist : [];
    } catch (_e) { syms = []; }

    // Global priced feed first (covers the seeded symbols instantly).
    try {
      const r = await fetch('/api/trading/watchlist-prices', { cache: 'no-store', signal: AbortSignal.timeout(6000) });
      const arr = r.ok ? await r.json() : [];
      (Array.isArray(arr) ? arr : []).forEach((w) => {
        if (w && w.ticker) priceMap[w.ticker.toUpperCase()] = { price: Number(w.price), chg: Number(w.chg_pct) };
      });
    } catch (_e) { /* map stays partial */ }

    if (!syms.length) {
      $('wlList').innerHTML = '<p class="muted-note">Your watchlist is empty. Add a symbol above to track it.</p>';
      return;
    }
    renderWatchlist(syms);

    // Fill in any symbol the global feed didn't price, from the per-symbol feed.
    const missing = syms.filter((s) => !priceMap[s.toUpperCase()]);
    await Promise.allSettled(missing.map(async (s) => {
      try {
        const r = await fetch('/api/trading/price-feed?symbol=' + encodeURIComponent(s) + '&range=1D', { cache: 'no-store', signal: AbortSignal.timeout(6000) });
        const d = r.ok ? await r.json() : null;
        if (d && d.current_price) {
          const op = Number(d.open_price) || Number(d.current_price);
          priceMap[s.toUpperCase()] = { price: Number(d.current_price), chg: op ? ((Number(d.current_price) - op) / op) * 100 : 0 };
        }
      } catch (_e) { /* leave unpriced */ }
    }));
    renderWatchlist(syms);
  }

  function renderWatchlist(syms) {
    $('wlList').innerHTML = syms.map((s) => {
      const key = s.toUpperCase();
      const q = priceMap[key];
      const price = q && Number.isFinite(q.price) ? fmtMoney(q.price) : '—';
      const chg = q && Number.isFinite(q.chg) ? q.chg : null;
      const cls = chg == null ? 'flat' : (chg >= 0 ? 'up' : 'down');
      const chgTxt = chg == null ? '·' : fmtPct(chg);
      return '<a class="wl-row" href="/stock-trader.html?symbol=' + encodeURIComponent(key) + '">' +
        '<span class="wl-tk">' + esc(key) + '</span>' +
        '<span class="wl-px">' + price + '</span>' +
        '<span class="wl-chg ' + cls + '">' + chgTxt + '</span>' +
        '<button type="button" class="wl-remove" data-sym="' + esc(key) + '" title="Remove ' + esc(key) + '" aria-label="Remove ' + esc(key) + '">✕</button>' +
      '</a>';
    }).join('');
  }

  // Add / remove.
  $('wlAdd').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = $('wlInput');
    const sym = input.value.trim().toUpperCase();
    if (!sym) return;
    input.value = '';
    try {
      const r = await fetch('/api/trading/watchlist', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticker: sym }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { input.value = sym; alert(d.error || 'Could not add symbol.'); return; }
      priceMap = {};
      loadWatchlist();
    } catch (_e) { input.value = sym; }
  });
  $('wlList').addEventListener('click', async (e) => {
    const btn = e.target.closest('.wl-remove');
    if (!btn) return;
    e.preventDefault(); e.stopPropagation();
    const sym = btn.dataset.sym;
    btn.disabled = true;
    try {
      await fetch('/api/trading/watchlist/' + encodeURIComponent(sym), { method: 'DELETE' });
      loadWatchlist();
    } catch (_e) { btn.disabled = false; }
  });

  // ── Market news (reuses the Explore finance feed) ─────────────────────────
  async function loadNews() {
    let cards = [];
    try {
      const r = await fetch('/api/explore/feed/page', {
        method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ seen: [], limit: 18, topic: 'finance' }),
        signal: AbortSignal.timeout(8000),
      });
      const d = r.ok ? await r.json() : null;
      cards = (d && Array.isArray(d.cards)) ? d.cards : [];
    } catch (_e) { cards = []; }

    // Headline-style items only (skip playable embeds / art / video).
    const news = cards.filter((c) => c && c.title && c.url &&
      ['read', 'doc', 'belief', 'build'].includes(c.type) &&
      /^https?:\/\//i.test(c.url)).slice(0, 8);

    const box = $('newsList');
    if (!news.length) {
      box.innerHTML = '<p class="muted-note">Market news is offline right now. <a href="/stock-trader.html">Open the trader →</a></p>';
      return;
    }
    box.innerHTML = news.map((c) => {
      const when = relTime(c.published);
      return '<a class="news-row" href="' + esc(c.url) + '" target="_blank" rel="noopener noreferrer">' +
        '<div class="nr-meta"><span class="nr-src">' + esc(c.source || 'News') + '</span>' + (when ? ' · ' + esc(when) : '') + '</div>' +
        '<div class="nr-title">' + esc(c.title) + '</div>' +
      '</a>';
    }).join('');
  }

  function relTime(d) {
    if (!d) return '';
    const t = typeof d === 'number' ? (d > 1e12 ? d : d * 1000) : Date.parse(d);
    if (!t || Number.isNaN(t)) return '';
    const diff = Date.now() - t;
    if (diff < 0) return '';
    const m = Math.floor(diff / 60000);
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    const days = Math.floor(h / 24);
    if (days < 7) return days + 'd ago';
    try { return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); } catch { return ''; }
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  (async function init() {
    // Decide demo vs real up front: a visitor without the "trade" entitlement
    // (logged out, or a Free account) sees the champion demo account. An explicit
    // ?demo=champion in the URL already forced it; entitled traders keep their own.
    if (!demoMode) {
      try {
        const s = await (await fetch('/api/auth/session', { cache: 'no-store', signal: AbortSignal.timeout(5000) })).json();
        if (!(s && s.entitlements && s.entitlements.trade)) demoMode = 'champion';
      } catch (_e) { demoMode = 'champion'; }   // fail toward the populated demo
    }
    const connected = await loadPositions();
    if (connected) loadHistory('1D');
    // These run regardless of broker state.
    loadWatchlist();
    loadNews();
  })();
})();
</script>
</body>
</html>
