/* Placement notes. journalLog() on the trader page has captured a snapshot on every
   order since #2446 -- signal, pattern, RVOL, session -- into localStorage, and until
   now nothing read them back. They are device-local and they are NOT P&L: these are
   intentions, the figures above are outcomes. */
function jpPlacements(opts) {
  const bare = !!(opts && opts.bare);
  let rows = [];
  try { rows = JSON.parse(localStorage.getItem('trader.journal') || '[]'); } catch (_e) { rows = []; }
  if (!rows.length) return '';
  const cell = v => (v === null || v === undefined || v === '') ? '<td class="jp-dim">—</td>' : '<td>' + jpEsc(String(v)) + '</td>';
  const when = ts => { try { return new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (_e) { return ts || ''; } };
  return (bare ? '' : '<div class="jp-card">') + '<h2>Placement notes — this device</h2>'
    + '<p class="jp-note">What the screen said at the moment each order went in. Captured locally, never uploaded, '
    + 'newest first, capped at 500. Not profit and loss — these are intentions, not outcomes.</p>'
    + '<div class="jp-scroll"><table class="jp-table"><thead><tr>'
    + '<th>When</th><th>Symbol</th><th>Side</th><th class="num">Qty</th><th class="num">Price</th>'
    + '<th>Signal</th><th>Pattern</th><th class="num">RVOL</th><th>Session</th></tr></thead><tbody>'
    + rows.slice(0, 100).map(r => '<tr><td class="jp-dim">' + jpEsc(when(r.ts)) + '</td>'
      + '<td><b>' + jpEsc(r.symbol || '') + '</b></td>'
      + '<td class="' + (String(r.side).toLowerCase() === 'buy' ? 'jp-pos' : 'jp-neg') + '">' + jpEsc(String(r.side || '').toUpperCase()) + '</td>'
      + '<td class="num">' + jpEsc(r.qty == null ? '—' : r.qty) + '</td>'
      + '<td class="num">' + (r.price != null ? jpEsc(jpUsd(r.price)) : '—') + '</td>'
      + cell(r.signal) + cell(r.pattern) + '<td class="num">' + jpEsc(r.rvol == null ? '—' : r.rvol) + '</td>' + cell(r.session)
      + '</tr>').join('')
    + '</tbody></table></div>'
    + (rows.length > 100 ? '<p class="jp-note">Showing the most recent 100 of ' + rows.length + '.</p>' : '')
    + (bare ? '' : '</div>');
}


/* Account equity, from the broker's own record. Deliberately NOT the same chart as the
   realized curve above it: that one starts at zero and counts only what the autopilot
   booked, this one starts at the opening balance and counts everything the account did.
   Showing both is the point -- the gap between them IS the manual trades, the deposits,
   and the history from before the ledger existed. */
/* ── Plot engine ───────────────────────────────────────────────────────────────
   One builder for every chart on the page, because the three hand-rolled SVGs had
   drifted apart: two of them drew the same shape from different data, and the bar
   chart shipped with no axis at all -- bars floating over a baseline with no dates
   and no values, which tells you a day was red but not which day or by how much.

   Every plot gets:
     - a labelled Y axis (values) and X axis (dates)
     - a readout that follows the pointer and names the point under it
   and deliberately NOT a crosshair: no horizontal or vertical rule across the plot.
   The readout is the tracker.

   Series are kept in _jpPlots rather than serialised into the DOM, so the numbers a
   tooltip shows are the numbers the chart was drawn from -- not a re-parse that can
   disagree with it. */
const _jpPlots = {};
let _jpPlotSeq = 0;

/* Nice round tick values, so the axis reads 100k / 102k rather than 99,812.37. */
function jpTicks(lo, hi, n) {
  if (!(hi > lo)) return [lo];
  const raw = (hi - lo) / Math.max(1, n);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(v => v >= raw) || mag * 10;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(v);
  return out.length ? out : [lo, hi];
}
/* Axis labels want to be short: $102k reads at a glance, $102,033.33 does not. */
function jpAxisMoney(v) {
  const a = Math.abs(v), sign = v < 0 ? '-' : '';
  if (a >= 1000) return sign + '$' + (a / 1000).toFixed(a >= 10000 ? 0 : 1) + 'k';
  if (a >= 1) return sign + '$' + Math.round(a);
  return sign + '$' + a.toFixed(2);
}

/**
 * pts  : [{ d:'YYYY-MM-DD', v:Number }]
 * opts : { type:'line'|'bar', baseline:Number|null, baselineLabel:String, height:Number }
 */
function jpPlot(pts, opts) {
  const o = opts || {};
  if (!Array.isArray(pts) || pts.length < 1) return '';
  const id = 'jpp' + (++_jpPlotSeq);
  const bar = o.type === 'bar';
  const H = o.height || 190, W = 620;
  const padL = 8, padR = 8, padT = 14, padB = 22, axisW = 44;
  const iw = W - padL - padR - axisW, ih = H - padT - padB;
  const x0 = padL + axisW;

  const vals = pts.map(p => p.v).filter(v => typeof v === 'number' && isFinite(v));
  if (!vals.length) return '';
  let lo, hi;
  if (bar) { const m = Math.max.apply(null, vals.map(Math.abs)) || 1; lo = -m; hi = m; }
  else {
    lo = Math.min.apply(null, vals); hi = Math.max.apply(null, vals);
    if (o.baseline != null) { lo = Math.min(lo, o.baseline); hi = Math.max(hi, o.baseline); }
    if (hi === lo) hi = lo + 1;
    const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  }
  const X = i => x0 + (pts.length === 1 ? iw / 2 : (i / (pts.length - 1)) * iw);
  const Y = v => padT + (1 - (v - lo) / (hi - lo)) * ih;

  // ── axes ──────────────────────────────────────────────────────────────────
  let g = '';
  for (const t of jpTicks(lo, hi, 4)) {
    const y = Y(t);
    if (y < padT - 1 || y > padT + ih + 1) continue;
    g += '<line x1="' + x0 + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1)
      + '" stroke="var(--border)" opacity=".55"/>'
      + '<text x="' + (x0 - 6) + '" y="' + (y + 3.5).toFixed(1) + '" font-size="9.5" fill="var(--text2)" '
      + 'text-anchor="end">' + jpEsc(jpAxisMoney(t)) + '</text>';
  }
  // X labels: first, middle, last — enough to place the series in time without clutter.
  const marks = pts.length <= 2 ? [0, pts.length - 1] : [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
  for (const i of Array.from(new Set(marks))) {
    const anchor = i === 0 ? 'start' : (i === pts.length - 1 ? 'end' : 'middle');
    g += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 5) + '" font-size="9.5" fill="var(--text2)" '
      + 'text-anchor="' + anchor + '">' + jpEsc(pts[i].d) + '</text>';
  }

  // ── series ────────────────────────────────────────────────────────────────
  let body = '';
  const net = o.baseline != null ? (pts[pts.length - 1].v - o.baseline) : (pts[pts.length - 1].v);
  const col = net >= 0 ? 'var(--green)' : 'var(--red)';
  if (bar) {
    g += '<line x1="' + x0 + '" y1="' + Y(0).toFixed(1) + '" x2="' + (W - padR) + '" y2="' + Y(0).toFixed(1)
      + '" stroke="var(--text2)" opacity=".5"/>';
    const bw = Math.max(1.5, Math.min(16, iw / Math.max(1, pts.length) - 2));
    body = pts.map((p, i) => {
      const h = Math.abs(Y(p.v) - Y(0));
      const up = p.v >= 0;
      return '<rect x="' + (X(i) - bw / 2).toFixed(1) + '" y="' + (up ? Y(p.v) : Y(0)).toFixed(1)
        + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, h).toFixed(1) + '" rx="1.5" fill="'
        + (up ? 'var(--green)' : 'var(--red)') + '" opacity=".9"/>';
    }).join('');
  } else {
    const base = o.baseline != null ? o.baseline : 0;
    const line = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
    const area = 'M' + X(0).toFixed(1) + ' ' + Y(base).toFixed(1) + ' '
      + pts.map((p, i) => 'L' + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ')
      + ' L' + X(pts.length - 1).toFixed(1) + ' ' + Y(base).toFixed(1) + ' Z';
    if (o.baseline != null) {
      g += '<line x1="' + x0 + '" y1="' + Y(o.baseline).toFixed(1) + '" x2="' + (W - padR) + '" y2="'
        + Y(o.baseline).toFixed(1) + '" stroke="var(--text2)" stroke-dasharray="3 3" opacity=".75"/>';
      if (o.baselineLabel) {
        g += '<text x="' + (x0 + 4) + '" y="' + (Y(o.baseline) - 4).toFixed(1) + '" font-size="9" '
          + 'fill="var(--text2)">' + jpEsc(o.baselineLabel) + '</text>';
      }
    }
    body = '<path d="' + area + '" fill="' + col + '" opacity=".12"/>'
      + '<path d="' + line + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round"/>';
  }

  _jpPlots[id] = { pts: pts, geom: { W: W, H: H, x0: x0, iw: iw, padT: padT, ih: ih, lo: lo, hi: hi }, bar: bar };

  return '<div class="jp-chart" id="' + id + '">'
    + '<div class="jp-read"><span class="d"></span><span class="v"></span></div>'
    + '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + jpEsc(o.aria || 'chart') + '">'
    + g + body
    + '<circle class="jp-dot" r="3.5" fill="var(--text0)" stroke="var(--bg1)" stroke-width="1.5"/>'
    + '</svg></div>';
}

/* Bind after every render. Pointer events cover mouse, pen AND touch from one code
   path, so the phone behaves the way the desktop does rather than getting a second
   implementation that drifts. touch-action:none would kill page scrolling, so the
   readout tracks on move and clears on leave/cancel instead of capturing the gesture. */
function jpBindPlots() {
  Object.keys(_jpPlots).forEach(function (id) {
    const el = document.getElementById(id);
    if (!el || el.dataset.bound === '1') return;
    el.dataset.bound = '1';
    const rec = _jpPlots[id], svg = el.querySelector('svg');
    const dot = el.querySelector('.jp-dot');
    const rd = el.querySelector('.jp-read'), rdD = rd.querySelector('.d'), rdV = rd.querySelector('.v');
    const show = (clientX) => {
      const r = svg.getBoundingClientRect();
      if (!r.width) return;
      const vx = ((clientX - r.left) / r.width) * rec.geom.W;      // client px -> viewBox units
      const f = (vx - rec.geom.x0) / (rec.geom.iw || 1);
      const i = Math.max(0, Math.min(rec.pts.length - 1, Math.round(f * (rec.pts.length - 1))));
      const p = rec.pts[i];
      if (!p) return;
      rdD.textContent = p.d;
      rdV.textContent = jpUsd(p.v);
      rdV.className = 'v ' + jpSign(p.v);
      const gx = rec.geom.x0 + (rec.pts.length === 1 ? rec.geom.iw / 2 : (i / (rec.pts.length - 1)) * rec.geom.iw);
      const gy = rec.geom.padT + (1 - (p.v - rec.geom.lo) / (rec.geom.hi - rec.geom.lo)) * rec.geom.ih;
      dot.setAttribute('cx', gx.toFixed(1));
      dot.setAttribute('cy', gy.toFixed(1));
      el.classList.add('on');
    };
    const clear = () => el.classList.remove('on');
    el.addEventListener('pointermove', (e) => show(e.clientX));
    el.addEventListener('pointerdown', (e) => show(e.clientX));
    el.addEventListener('pointerleave', clear);
    el.addEventListener('pointercancel', clear);
  });
}


/* Which exchange day a broker point belongs to (#3501). The brokers stamp a day
   differently. IBKR (ibkr-cpapi _toEpochSeconds) and the demo stamp the session's own
   date at 00:00 UTC, which the UTC date reads correctly. Alpaca stamps each daily bar
   at the END of the session it closes -- 00:00 UTC the next day, 8 PM ET -- so its UTC
   date ran a day late: Friday's close showed as a Saturday, the Tuesday after a Monday
   holiday vanished, and the point labelled today was yesterday's close. Alpaca stamps
   are read in ET instead, backed off 5 hours so a stamp at or just after midnight
   (either side of daylight saving) still lands on the session it closed. The balance
   chart and the calendar's account view both label days through here. */
function jpDayOf(h) {
  const alpaca = !!(h && h.source === 'alpaca');
  return (t) => {
    try {
      return alpaca
        ? new Date((t - 5 * 3600) * 1000).toLocaleDateString('en-CA', { timeZone: 'America/New_York' })
        : new Date(t * 1000).toISOString().slice(0, 10);
    } catch (_e) { return ''; }
  };
}

/* The account's own change for each session (#3517): the broker's daily closing
   equity minus the close before it. Booked P&L lands on the day a trade CLOSES, so a
   day spent holding showed nothing -- Wed 9/9 was blank while the account made
   +$183.46. This gives every session a number, the way the broker reports a day.
   Daily series only: the demo book's monthly points would read as one-day jumps. A
   day that did not move at all stays blank rather than printing $0.00. */
function jpAccountDaily(h) {
  if (!h || h.ok === false || h.demo === true || h.source === 'champion-demo') return null;
  const ts = Array.isArray(h.timestamps) ? h.timestamps : [], eq = h.equity || [];
  if (ts.length < 3) return null;
  const gaps = [];
  for (let i = 1; i < ts.length; i++) gaps.push(ts[i] - ts[i - 1]);
  gaps.sort((a, b) => a - b);
  if (!(gaps[Math.floor(gaps.length / 2)] <= 4 * 86400)) return null;   // a long weekend is 4 days
  const dayOf = jpDayOf(h), out = {};
  let prev = null;
  for (let i = 0; i < ts.length; i++) {
    const v = eq[i];
    if (v == null || !isFinite(v)) continue;
    const d = dayOf(ts[i]);
    if (prev != null && d) {
      const chg = Math.round((Number(v) - prev) * 100) / 100;
      if (chg !== 0) out[d] = chg;
    }
    prev = Number(v);
  }
  return Object.keys(out).length ? out : null;
}

/* ONE balance chart, not two. The page used to draw the broker's equity AND the
   autopilot's cumulative realized as separate line charts -- two near-identical shapes
   asking the reader to work out which was which. The broker's series is the real
   account balance, so that is the one that stays; the autopilot's cumulative line is
   the same information the calendar and the bar chart already carry, per day.
   When the broker cannot answer (a box with no linked account), the autopilot's own
   cumulative curve stands in rather than leaving an empty slot. */
function jpBalanceChart(h, daily, liveToday) {
  const iso = jpDayOf(h);   // the exchange day each broker point belongs to (#3501)
  if (h && h.ok !== false && Array.isArray(h.timestamps) && h.timestamps.length > 1) {
    const eq = h.equity || [], pts = [];
    for (let i = 0; i < h.timestamps.length; i++) {
      const v = eq[i];
      if (v != null && isFinite(v)) pts.push({ d: iso(h.timestamps[i]), v: Number(v) });
    }
    // The payload says whether it is real. champion-demo is a SIMULATED 26-year DCA
    // book -- coherent on its own terms, but calling it "from the broker" would be a
    // false claim about provenance on the one page whose job is an honest record.
    const sim = h.demo === true || h.source === 'champion-demo';
    /* Today, live (#3502). The daily history's newest bar is the previous close, so
       during a session the chart ended a day behind. The live equity -- same broker,
       same account -- adds today's point, and the readout names it as today. */
    let live = false;
    if (!sim && liveToday && liveToday.equity > 0 && pts.length && pts[pts.length - 1].d < liveToday.date
        && (!liveToday.source || !h.source || liveToday.source === h.source)) {
      pts.push({ d: liveToday.date, v: liveToday.equity });
      live = true;
    }
    if (pts.length > 1) {
      const base = Number(h.base_value) || pts[0].v;
      const last = pts[pts.length - 1], net = last.v - base;
      return {
        title: sim ? 'Account balance — simulated demo book'
                   : 'Account balance — all time, from the broker',
        html: jpPlot(pts, { type: 'line', baseline: base, baselineLabel: 'opened ' + jpAxisMoney(base),
          aria: 'Account balance from ' + pts[0].d + ' to ' + last.d + ', opened ' + jpUsd(base) + ', now ' + jpUsd(last.v) })
          + '<p class="jp-note">Opened <b>' + jpEsc(jpUsd(base)) + '</b> on ' + jpEsc(pts[0].d)
          + ' — now <b>' + jpEsc(jpUsd(last.v)) + '</b>' + (live ? ' live' : '') + ' (<span class="' + jpSign(net) + '">'
          + jpEsc((net >= 0 ? '+' : '') + jpUsd(net)) + '</span>). '
          + (sim
              ? 'Simulated sample data for the demo book — not a real account, and not a real track record.'
              : 'Straight from the broker, so it counts manual trades and deposits too — the calendar '
                + 'below counts only what the autopilot booked.')
          + '</p>',
      };
    }
  }
  if (!daily || !daily.length) return null;
  const pts = daily.map(d => ({ d: d.date, v: d.cum }));
  return {
    title: 'Autopilot cumulative — realized, by exchange day',
    html: jpPlot(pts, { type: 'line', baseline: 0, baselineLabel: 'flat',
      aria: 'Cumulative realized profit and loss by exchange day' })
      + '<p class="jp-note">The broker did not return an account history for this box, so this is the '
      + 'autopilot\'s own realized total instead — it starts at zero, not at the opening balance.</p>',
  };
}

/* ── The reader's arrangement (#3543) ─────────────────────────────────────────
   Every card here is a widget with an id. Which ones show, in what order, at what width
   is the reader's business: TradeZella and TraderWaves both let a trader build the
   dashboard they actually read, and this is that without a layout library -- one CSS
   grid, cards spanning one column or two, dragged or nudged into place.

   It is kept per user on the server so it follows them to another device, with a copy in
   this browser so the first paint is already the right shape. A guest keeps theirs in the
   browser alone. A layout that names a card this page no longer has loses that card, and
   a card the layout never heard of is appended -- so a new card appears for everyone
   instead of being hidden by omission. */
const JP_WIDGETS = [
  { id: 'kpis', name: 'Key figures', w: 2 },
  { id: 'calendar', name: 'P&L calendar', w: 1 },
  { id: 'balance', name: 'Account balance', w: 1 },
  { id: 'pnlday', name: 'Net P&L per day', w: 1 },
  { id: 'trades', name: 'Trade log', w: 2 },
  { id: 'breakdown', name: 'Breakdown', w: 1 },
  { id: 'symbols', name: 'Symbol statistics', w: 2 },
  { id: 'monthly', name: 'Monthly report', w: 2 },
  { id: 'heatmap', name: 'Weekday × hour', w: 2 },
  { id: 'rdist', name: 'R multiples', w: 2 },
  { id: 'placements', name: 'Placement notes', w: 2 },
];
const JP_WIDGET = {};
JP_WIDGETS.forEach((w) => { JP_WIDGET[w.id] = w; });
const JP_LAYOUT_KEY = 'jp-layout-v1';
let jpEdit = false;

function jpLayoutDefault() {
  return { v: 1, order: JP_WIDGETS.map((w) => w.id), hidden: [], width: {} };
}
function jpLayoutMerge(stored) {
  const base = jpLayoutDefault();
  if (!stored || !Array.isArray(stored.order)) return base;
  const known = new Set(base.order);
  const order = [];
  for (const id of stored.order) if (known.has(id) && !order.includes(id)) order.push(id);
  for (const id of base.order) if (!order.includes(id)) order.push(id);
  const hidden = [];
  for (const id of (Array.isArray(stored.hidden) ? stored.hidden : [])) if (known.has(id) && !hidden.includes(id)) hidden.push(id);
  const width = {};
  const w = (stored.width && typeof stored.width === 'object') ? stored.width : {};
  for (const id of Object.keys(w)) if (known.has(id) && (w[id] === 1 || w[id] === 2)) width[id] = w[id];
  return { v: 1, order, hidden, width };
}
const jpWidthOf = (l, id) => l.width[id] || (JP_WIDGET[id] ? JP_WIDGET[id].w : 1);
function jpLayoutMove(l, id, delta) {
  const order = l.order.slice();
  const i = order.indexOf(id), j = i + delta;
  if (i < 0 || j < 0 || j >= order.length) return l;
  order.splice(j, 0, order.splice(i, 1)[0]);
  return { v: 1, order, hidden: l.hidden, width: l.width };
}
function jpLayoutPlace(l, id, beforeId) {
  if (id === beforeId || !l.order.includes(id)) return l;
  const order = l.order.filter((x) => x !== id);
  const at = order.indexOf(beforeId);
  order.splice(at < 0 ? order.length : at, 0, id);
  return { v: 1, order, hidden: l.hidden, width: l.width };
}
function jpLayoutWidth(l, id, w) {
  const width = Object.assign({}, l.width);
  width[id] = w === 2 ? 2 : 1;
  return { v: 1, order: l.order, hidden: l.hidden, width };
}
const jpLayoutHide = (l, id) => (l.hidden.includes(id) || !l.order.includes(id)
  ? l : { v: 1, order: l.order, hidden: l.hidden.concat(id), width: l.width });
const jpLayoutShow = (l, id) => ({ v: 1, order: l.order, hidden: l.hidden.filter((x) => x !== id), width: l.width });

function jpLayoutRead() {
  try { return JSON.parse(localStorage.getItem(JP_LAYOUT_KEY) || 'null'); } catch (_e) { return null; }
}
let jpLayout = jpLayoutMerge(jpLayoutRead());

function jpApplyLayout(next) {
  jpLayout = next;
  try { localStorage.setItem(JP_LAYOUT_KEY, JSON.stringify(next)); } catch (_e) { /* private window: this tab only */ }
  fetch('/api/journal/layout', { method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ layout: next }) }).catch(() => {});
  jpPaintCards();
}
/* The server's copy is the one that follows the reader between devices; the browser's is
   only so the first paint is right. Quiet either way: an offline page keeps what it has. */
async function jpLayoutSync() {
  try {
    const r = await fetch('/api/journal/layout', { credentials: 'same-origin', cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    if (!j || !j.layout) return;
    const merged = jpLayoutMerge(j.layout);
    if (JSON.stringify(merged) === JSON.stringify(jpLayout)) return;
    jpLayout = merged;
    try { localStorage.setItem(JP_LAYOUT_KEY, JSON.stringify(merged)); } catch (_e) { /* nothing to keep it in */ }
    jpPaintCards();
  } catch (_e) { /* offline: what the browser has stands */ }
}
function jpLayoutReset() {
  jpLayout = jpLayoutDefault();
  try { localStorage.removeItem(JP_LAYOUT_KEY); } catch (_e) { /* nothing stored */ }
  fetch('/api/journal/layout', { method: 'DELETE', credentials: 'same-origin' }).catch(() => {});
  jpPaintCards();
}
function jpSetEdit(on) {
  jpEdit = !!on;
  document.body.classList.toggle('jp-editing', jpEdit);
  const b = document.getElementById('jpEditBtn');
  if (b) { b.classList.toggle('on', jpEdit); b.textContent = jpEdit ? 'Done' : 'Edit layout'; }
  jpPaintCards();
}

/* One card's contents. The ids the in-place painters look for (#3541) live INSIDE the
   card, so rearranging the page never breaks them. */
function jpCardBody(id, data) {
  const L = jpLast || {};
  if (id === 'kpis') {
    const dsr = jpDaySeries(L.daily, L.liveToday, L.acct);
    return '<div id="jpKpis">' + jpKpis(L.s, L.book, Object.assign(jpDayStats(dsr.days), { mode: dsr.mode })) + '</div>';
  }
  if (id === 'calendar') return '<div id="jpCalCard">' + jpCalendarCard(L.daily, L.liveToday, L.acct) + '</div>';
  if (id === 'breakdown') return '<div id="jpBreakdownCard">' + jpBreakdown(data.slice) + '</div>';
  if (id === 'balance') {
    const b = jpBalanceChart(data.equity, L.daily, L.liveToday);
    return b ? '<h2>' + b.title + '</h2>' + b.html : '';
  }
  if (id === 'pnlday') {
    return '<h2>Net P&amp;L per day — realized</h2>'
      + jpPlot((L.daily || []).map((d) => ({ d: d.date, v: d.pnl })), { type: 'bar', height: 150,
          aria: 'Realized profit and loss for each exchange day' });
  }
  if (id === 'trades') return '<div id="jpTradesCard">' + jpTrades(jpTradeData === null ? undefined : jpTradeData) + '</div>';
  if (id === 'symbols') return '<div id="jpSymbolsCard">' + jpSymbols(jpSliceCache.symbol) + '</div>';
  if (id === 'heatmap') return '<div id="jpHeatCard">' + jpHeatmap(jpSliceCache['weekday-hour']) + '</div>';
  if (id === 'rdist') return '<div id="jpRCard">' + jpRDist(jpSliceCache.r) + '</div>';
  if (id === 'monthly') {
    return '<div id="jpMonthlyCard">' + jpMonthly(jpDaySeries(L.daily, L.liveToday, L.acct)) + '</div>';
  }
  if (id === 'placements') return jpPlacements({ bare: true });
  return '';
}

function jpCardBar(id, w) {
  if (!jpEdit) return '';
  const name = (JP_WIDGET[id] || {}).name || id;
  return '<div class="jp-bar"><span class="grip" aria-hidden="true">⠿⠿</span>'
    + '<span class="name">' + jpEsc(name) + '</span>'
    + '<button type="button" class="jp-chip" data-act="left" aria-label="Move ' + jpEsc(name) + ' earlier">◀</button>'
    + '<button type="button" class="jp-chip" data-act="right" aria-label="Move ' + jpEsc(name) + ' later">▶</button>'
    + '<button type="button" class="jp-chip' + (w === 2 ? ' on' : '') + '" data-act="width" aria-label="Width of ' + jpEsc(name) + '">'
    + (w === 2 ? 'Full' : 'Half') + '</button>'
    + '<button type="button" class="jp-chip" data-act="hide" aria-label="Hide ' + jpEsc(name) + '">Hide</button></div>';
}

function jpTray() {
  if (!jpEdit) return '';
  const hidden = jpLayout.order.filter((id) => jpLayout.hidden.includes(id));
  return '<div class="jp-tray">'
    + (hidden.length
      ? '<span class="jp-dim">Hidden:</span>' + hidden.map((id) => '<button type="button" class="jp-chip" data-act="show" data-id="'
        + id + '">+ ' + jpEsc((JP_WIDGET[id] || {}).name || id) + '</button>').join('')
      : '<span class="jp-dim">Drag a card to move it, or use ◀ ▶. Hide what you do not read.</span>')
    + '<button type="button" class="jp-chip" data-act="reset" style="margin-left:auto">Reset</button></div>';
}

/* Repaints the cards from data already in hand -- arranging the page never refetches. */
function jpPaintCards() {
  const host = document.getElementById('jpCards');
  if (!host || !jpData || !jpLast) return;
  const visible = jpLayout.order.filter((id) => !jpLayout.hidden.includes(id));
  host.innerHTML = visible.map((id) => {
    const body = jpCardBody(id, jpData);
    if (!body) return '';
    const w = jpWidthOf(jpLayout, id);
    return '<section class="jp-card' + (w === 2 ? ' w2' : '') + (id === 'kpis' ? ' bare' : '') + '"'
      + ' data-card="' + id + '"' + (jpEdit ? ' draggable="true"' : '') + '>'
      + jpCardBar(id, w) + body + '</section>';
  }).join('') + jpTray();
  jpBindPlots();
  jpEnsureSymbols();
  jpEnsureHeatmap();
  jpEnsureRDist();
  jpEnsureTrades();
}

/* Bound once, on the body host, because the cards themselves are replaced on every
   arrangement. Dragging is for a mouse; the arrows do the same thing from a keyboard. */
function jpBindLayout(root) {
  if (!root) return;
  let dragId = null;
  root.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.getAttribute('data-act');
    if (act === 'reset') { jpLayoutReset(); return; }
    const card = btn.closest('[data-card]');
    const id = btn.getAttribute('data-id') || (card && card.getAttribute('data-card'));
    if (!id) return;
    if (act === 'left') jpApplyLayout(jpLayoutMove(jpLayout, id, -1));
    else if (act === 'right') jpApplyLayout(jpLayoutMove(jpLayout, id, 1));
    else if (act === 'width') jpApplyLayout(jpLayoutWidth(jpLayout, id, jpWidthOf(jpLayout, id) === 2 ? 1 : 2));
    else if (act === 'hide') jpApplyLayout(jpLayoutHide(jpLayout, id));
    else if (act === 'show') jpApplyLayout(jpLayoutShow(jpLayout, id));
  });
  root.addEventListener('dragstart', (e) => {
    const c = e.target.closest && e.target.closest('[data-card]');
    if (!jpEdit || !c) return;
    dragId = c.getAttribute('data-card');
    c.classList.add('drag');
    if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (_e) { /* older browsers */ } }
  });
  root.addEventListener('dragend', () => {
    dragId = null;
    root.querySelectorAll('.drag, .over').forEach((x) => x.classList.remove('drag', 'over'));
  });
  root.addEventListener('dragover', (e) => {
    const c = e.target.closest && e.target.closest('[data-card]');
    if (!jpEdit || !dragId || !c || c.getAttribute('data-card') === dragId) return;
    e.preventDefault();
    c.classList.add('over');
  });
  root.addEventListener('dragleave', (e) => {
    const c = e.target.closest && e.target.closest('[data-card]');
    if (c) c.classList.remove('over');
  });
  root.addEventListener('drop', (e) => {
    const c = e.target.closest && e.target.closest('[data-card]');
    if (!jpEdit || !dragId || !c) return;
    e.preventDefault();
    const moved = dragId;
    dragId = null;
    jpApplyLayout(jpLayoutPlace(jpLayout, moved, c.getAttribute('data-card')));
  });
}

function jpRender(host, data) {
  const bookKey = Object.keys(data.rec.books || {})[0];
  const book = (data.rec.books || {})[bookKey] || {};
  const s = book.stats || {};
  const daily = book.daily || [];
  // Today's live figure (#3502); the demo book has no live account behind it.
  const liveToday = data.demo ? null : jpLiveToday(data.live);
  // The account's own change per session (#3517); the demo book's series is monthly.
  const acct = data.demo ? null : jpAccountDaily(data.equity);
  let html = '';

  if (data.demo) {
    html += '<div class="jp-banner"><span><b>' + jpEsc(book.label || 'Demo book')
      + '</b> — simulated sample data, not real trades. Your own account fills this in once it trades.</span>'
      + '<a href="/pricing.html" style="margin-left:auto;white-space:nowrap">See plans →</a></div>';
  }

  const rangeEl = document.getElementById('jpRange');
  if (rangeEl) {
    rangeEl.textContent = (daily.length
      ? ('Realized results, ' + daily[0].date + ' to ' + daily[daily.length - 1].date + '.')
      : 'Realized results, day by day.')
      + (liveToday ? ' Today so far: ' + (liveToday.pnl > 0 ? '+' : '') + jpUsd(liveToday.pnl) + ', live.' : '');
  }

  if (!s.trades) {
    /* This used to say the page would fill in "as soon as a position closes" -- which
       is true only for the autopilot, and the autopilot is the $200 tier. For everyone
       who trades by hand it promised something nothing would ever keep: their fills
       were never written to this ledger at all (#3557). Say what is actually true, and
       offer the thing that fixes it. */
    html += '<div class="jp-empty">No trades on record yet. This journal fills in from two places: '
      + 'trades you place yourself through a connected broker, and — on the Pilot plan — the autopilot\'s own. '
      + 'If you have already been trading, bring that history in:</div>'
      + '<div id="jpImport" class="jp-import"></div>';
    html += jpPlacements();          // things you DID still belong here
    host.innerHTML = html;
  jpBindPlots();
    return;
  }

  jpLast = { s, book, daily, liveToday, acct };
  html += '<div class="jp-cards" id="jpCards"></div>';   // filled by jpPaintCards (#3543)

  const disclosed = jpDisclosures(book.disclosures);
  if (disclosed) html += '<p class="jp-note">' + jpEsc(disclosed) + '</p>';
  host.innerHTML = html;
  jpPaintCards();
}

/* ── Staying current ──────────────────────────────────────────────────────────
   The page reads the broker record when it opens, and when you press Refresh. Nothing
   else moves it (#3541). It used to refetch on focus, on visibilitychange and on a
   two-minute timer, so switching tabs and coming back repainted the page under you --
   scroll position included -- and any control did the same. A review surface that shifts
   while you are reading it is worse than one a few minutes old, so the header carries the
   time it last read the record instead. */
function jpStampLoaded(at) {
  const el = document.getElementById('jpLoadedAt');
  if (!el) return;
  let t = '';
  try { t = (at || new Date()).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); } catch (_e) { t = ''; }
  el.textContent = t ? 'Loaded ' + t : '';
}

document.addEventListener('DOMContentLoaded', () => {
  jpBindLayout(document.getElementById('jpBody'));
  jpLoad();
  jpLayoutSync();            // the copy that follows the reader between devices (#3543)
  jpImportCheck();           // can this reader bring in their own broker trades? (#3557)
});
</script>
