<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="loop-stage" content="verify">
<title>Unisona Trading Journal</title>

<!-- Apply the saved theme before paint so the global header + light mode don't flash (#1577). -->
<script>
  (function(){ try {
    var stored = localStorage.getItem('lantern-theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var isDark = stored ? stored === 'dark' : prefersDark;
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  } catch(e){ document.documentElement.setAttribute('data-theme','dark'); } })();
</script>
<link rel="stylesheet" href="/css/site.css">

<style>
  @import url('/css/trader.css');

  /* ── Journal page ───────────────────────────────────────────────────────────
     The journal used to be the fourth tab of the trader's bottom panel, in a
     306px strip under the charts. A review surface is not a strip: a calendar,
     an equity curve and a breakdown table all want room at once, and the panel
     could only ever show one of them at a time.
     Laid out the way the journal products lay this out (TradeZella, TraderWaves):
     a KPI band across the top, then the calendar as the centrepiece with the
     curve beside it, then the tables underneath. */
  /* --green and --red are declared INLINE in stock-trader.html and watch.html, not in
     any shared stylesheet. This page loads site.css + trader.css, one of which happens
     to define --green -- but NOTHING defines --red. So gains rendered green and every
     LOSS fell back to the inherited text colour: white on dark, black on light. A
     trading journal that shows losses in the same colour as ordinary text is worse than
     one with no colour at all. Same values as the trader page, so the two agree. */
  /* THE FULL TOKEN SET, not just the two colours. Neither site.css nor trader.css
     defines --text0/--text1/--text2/--bg0..--bg3, so on this page every one of them was
     UNDEFINED. HTML text got away with it -- an invalid var() on `color` falls back
     through inheritance to a UA default that happens to be light in dark mode. SVG did
     not: an invalid var() in a `fill` resolves to fill's INITIAL value, which is BLACK.
     That is why every label on every chart was black on a dark background while the
     surrounding text looked fine. Same values as stock-trader.html so the pages agree. */
  :root{--bg0:#0a0c0f;--bg1:#111318;--bg2:#181c22;--bg3:#1f242d;
    --border:#252b35;--text0:#e8eaf0;--text1:#b3b9c5;--text2:#828a99;
    --green:#00d4aa;--red:#ff5f6d;--amber:#f5a623;--blue:var(--accent,#4a9eff)}
  html[data-theme="light"]{
    --bg0:#f4f6fa;--bg1:#ffffff;--bg2:#eef1f6;--bg3:#e3e8f0;
    --border:#d6dbe4;--text0:#1a1d24;--text1:#4a5160;--text2:#828b9c}
  body{margin:0;background:var(--bg0);color:var(--text1);font-family:var(--sans,system-ui,sans-serif)}
  .jp-shell{max-width:1440px;margin:0 auto;padding:0 16px 40px}

  .jp-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0 12px}
  .jp-title{font-size:19px;font-weight:600;color:var(--text0);margin:0}
  .jp-sub{font-size:11.5px;color:var(--text2)}
  .jp-controls{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

  /* KPI band. auto-fit keeps it one row on a wide screen and reflows rather than
     scrolling on a narrow one -- a metric you have to scroll to is a metric you
     will not read. */
  .jp-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .jp-kpi{background:var(--bg1);border:1px solid var(--border);border-radius:10px;padding:11px 13px;min-width:0}
  .jp-kpi .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .jp-kpi .v{font-size:21px;font-weight:600;color:var(--text0);font-variant-numeric:tabular-nums;margin-top:3px;
    line-height:1.15}
  .jp-kpi .s{font-size:10.5px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .jp-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;align-items:start}
  @media (max-width:1080px){ .jp-grid{grid-template-columns:1fr} }
  .jp-col{display:flex;flex-direction:column;gap:12px;min-width:0}

  .jp-card{background:var(--bg1);border:1px solid var(--border);border-radius:10px;padding:12px 14px;min-width:0}
  .jp-card h2{margin:0 0 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);
    font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .jp-card h2 .sp{margin-left:auto;display:flex;gap:4px}

  /* Calendar. Colour carries the sign, the figure carries the size -- colour alone
     would leave a -$4 day and a -$400 day looking identical. */
  .jp-cal-head{display:grid;grid-template-columns:repeat(7,1fr) 76px;gap:4px;margin-bottom:4px}
  .jp-cal-head span{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);text-align:center}
  .jp-cal{display:grid;grid-template-columns:repeat(7,1fr) 76px;gap:4px}
  /* NOT aspect-ratio:1. A square cell takes its HEIGHT from the column width, so the
     calendar grew as the window did -- 95px tall to hold a date and one figure that
     need about 34px. Five rows spent 493px, which put the last week flush against the
     fold on a 1080p screen at 125% scaling (viewport 1536x864: calendar bottom 862).
     A bounded min-height sizes the cell to its CONTENT and stops the month growing
     off-screen on a wider monitor. */
  .jp-day{min-height:clamp(44px,4.6vh,62px);border-radius:7px;background:var(--bg2);border:1px solid var(--border);padding:5px 6px;
    display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .jp-day.empty{background:transparent;border-color:transparent}
  .jp-day .d{font-size:9.5px;color:var(--text2);font-variant-numeric:tabular-nums}
  .jp-day .p{margin-top:auto;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .jp-day.win{background:color-mix(in srgb,var(--green) 15%,var(--bg2));border-color:color-mix(in srgb,var(--green) 35%,var(--border))}
  .jp-day.loss{background:color-mix(in srgb,var(--red) 15%,var(--bg2));border-color:color-mix(in srgb,var(--red) 35%,var(--border))}
  .jp-day.flat{background:var(--bg3)}
  /* Today is a RING, never a fill: it has to be legible on a green day, a red day and
     an empty one alike, and a fill would fight the P&L colour that the cell exists to
     show. inset keeps it inside the 7px radius instead of bleeding into the gap. */
  .jp-day.today{box-shadow:inset 0 0 0 1.5px var(--accent),0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
  .jp-day.today .d{color:var(--accent);font-weight:700}
  /* Today, live (#3502): the broker's figure for a session still running. It is not a
     booked result, so it takes no win/loss fill -- the figure carries the sign, and a
     dashed edge plus a "live" tag say it is still moving. At the close it becomes an
     ordinary booked day. */
  .jp-day.live, .jp-week.live{border-style:dashed;border-color:color-mix(in srgb,var(--accent) 55%,var(--border))}
  .jp-day .lv{float:right;font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);line-height:1.2}
  .jp-week{border-radius:7px;background:var(--bg2);border:1px solid var(--border);padding:5px 6px;
    display:flex;flex-direction:column;justify-content:center;min-width:0}
  .jp-week .l{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
  .jp-week .v{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .jp-day .p-abbr{display:none}
  /* Narrow screens: the 76px week column is a fifth of a 375px viewport, and the full
     figure cannot fit what is left. Drop the column, show the short figure. The week
     totals are not lost -- they are a sum of days already on screen. */
  @media (max-width:560px){
    .jp-cal, .jp-cal-head{grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
    .jp-cal-head span:last-child, .jp-week{display:none}
    .jp-day{padding:3px 4px;min-height:clamp(40px,5.2vh,52px)}
    .jp-day .d{font-size:9px}
    .jp-day .p{font-size:9.5px}
    .jp-day .p-full{display:none}
    .jp-day .lv{font-size:0;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:3px}
    .jp-day .p-abbr{display:inline}
    .jp-shell{padding:0 10px 32px}
  }
  .jp-monthbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .jp-monthbar .m{font-size:12.5px;font-weight:600;color:var(--text0)}
  .jp-navb{background:var(--bg2);border:1px solid var(--border);color:var(--text1);border-radius:6px;
    width:24px;height:24px;cursor:pointer;font:inherit;font-size:12px;line-height:1;display:grid;place-items:center}
  .jp-navb:hover:not(:disabled){background:var(--bg3);color:var(--text0)}
  .jp-navb:disabled{opacity:.35;cursor:default}

  /* .jp-kpi .v declares color:var(--text0) at (0,2,0); .jp-neg alone is (0,1,0) and
     loses, so Max drawdown rendered WHITE while the same figure in the calendar was
     red. The sign has to read the same wherever it appears. */
  /* A sign colour has to win WHEREVER it lands. Both `.jp-kpi .v` (0,2,0) and
     `.jp-table td` (0,1,1) declare their own colour, out-specifying a bare `.jp-neg`
     at (0,1,0) -- so losses rendered white in the KPI band, and then again in the
     tables after the KPI band was fixed. Naming the containers here settles it once,
     for every place a figure can appear, without reaching for !important. */
  .jp-dim{color:var(--text2)}
  .jp-pos, .jp-kpi .v.jp-pos, .jp-table td.jp-pos,
  .jp-week .v.jp-pos, .jp-day .p.jp-pos{color:var(--green)}
  .jp-neg, .jp-kpi .v.jp-neg, .jp-table td.jp-neg,
  .jp-week .v.jp-neg, .jp-day .p.jp-neg{color:var(--red)}
  .jp-chip{font-size:10.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--border);background:transparent;
    color:var(--text2);cursor:pointer;font-family:inherit}
  .jp-chip.on{background:var(--blue);border-color:var(--blue);color:#08131f}
  .jp-chip:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

  .jp-table{width:100%;border-collapse:collapse;font-size:12px}
  .jp-table th{text-align:left;color:var(--text2);font-weight:600;font-size:10px;text-transform:uppercase;
    letter-spacing:.05em;padding:5px 7px;border-bottom:1px solid var(--border);white-space:nowrap;
    position:sticky;top:0;background:var(--bg1)}
  .jp-table td{padding:5px 7px;border-bottom:1px solid var(--border);color:var(--text1);white-space:nowrap}
  .jp-table tr:last-child td{border-bottom:0}
  .jp-table .num{text-align:right;font-variant-numeric:tabular-nums}
  .jp-scroll{overflow:auto;max-height:300px}

  .jp-curve svg{display:block;width:100%;height:auto}
  /* A chart you cannot read a value off is decoration. The readout replaces the
     crosshair: it follows the pointer and names the point, without drawing the two
     lines across the plot that were explicitly not wanted. */
  .jp-chart{position:relative}
  .jp-chart .jp-read{position:absolute;top:6px;left:8px;display:none;gap:10px;align-items:baseline;
    background:color-mix(in srgb,var(--bg2) 92%,transparent);border:1px solid var(--border);
    border-radius:7px;padding:4px 9px;font-size:11.5px;pointer-events:none;z-index:2;
    box-shadow:0 4px 14px rgba(0,0,0,.28);white-space:nowrap}
  .jp-chart.on .jp-read{display:flex}
  .jp-read .d{color:var(--text2);font-variant-numeric:tabular-nums}
  .jp-read .v{color:var(--text0);font-weight:600;font-variant-numeric:tabular-nums}
  .jp-chart .jp-dot{display:none;pointer-events:none}
  .jp-chart.on .jp-dot{display:block}
  /* A finger is not a mouse: give the plot room so the readout is not under the thumb. */
  @media (max-width:560px){ .jp-chart .jp-read{font-size:11px;padding:3px 7px} }
  .jp-empty{color:var(--text2);padding:16px 2px;max-width:66ch;line-height:1.6}
  .jp-loading{color:var(--text2);padding:16px 2px}
  .jp-banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--bg1);border:1px solid var(--border);
    border-left:3px solid var(--blue);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:12px}
  .jp-banner a{color:var(--blue)}
  .jp-note{font-size:10.5px;color:var(--text2);margin:6px 0 0;line-height:1.5}
</style>
</head>
<body>

<div class="jp-shell">

  <div class="jp-head">
    <div>
      <h1 class="jp-title">Trading journal</h1>
      <div class="jp-sub" id="jpRange">Realized results, day by day.</div>
    </div>
    <div class="jp-controls">
      <button type="button" class="jp-chip on" id="jpViewConfirmed" onclick="jpSetView('confirmed')">Confirmed</button>
      <button type="button" class="jp-chip" id="jpViewSkips" onclick="jpSetView('skips')">Declined</button>
      <button type="button" class="jp-chip" onclick="jpLoad(true)" title="Reload from the broker record">Refresh</button>
    </div>
  </div>

  <div id="jpBody"><div class="jp-loading">Loading the journal…</div></div>
</div>

<script>
/* ── Journal page ──────────────────────────────────────────────────────────────
   Reads the same endpoints the bottom-panel journal read -- /track-record for the
   realized book, /scorecard for the breakdown slice, /skips for declined trades --
   and lays them out with room to breathe. No new server surface. */
const JP_LABELS = { reason:'Exit reason', symbol:'Symbol', hour:'Hour' };
let jpView = 'confirmed', jpSlice = 'reason', jpBusy = false, jpMonth = null, jpData = null;

const jpEsc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jpUsd = (n) => (typeof n !== 'number' || !isFinite(n)) ? '—'
  : (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
/* A 375px screen gives each day ~30px of text box; "-$65.11" needs 38. Rather than
   hide the figure (colour alone cannot tell a -$4 day from a -$400 one -- the whole
   point of the calendar) both forms are rendered and CSS shows one. Doing it in CSS
   rather than JS means a rotate or a resize cannot leave the wrong one showing. */
const jpUsdShort = (n) => {
  if (typeof n !== 'number' || !isFinite(n)) return '';
  const a = Math.abs(n), sign = n < 0 ? '-' : '';
  if (a >= 1000) return sign + '$' + (a / 1000).toFixed(a >= 10000 ? 0 : 1) + 'k';
  return sign + '$' + Math.round(a);
};
const jpPct = (n) => (typeof n === 'number' && isFinite(n)) ? n.toFixed(1) + '%' : '—';
const jpSign = (n) => (typeof n === 'number' && isFinite(n) && n !== 0) ? (n > 0 ? 'jp-pos' : 'jp-neg') : 'jp-dim';

async function jpFetch(demo) {
  const qs = demo ? '?demo=champion' : '';
  const amp = demo ? '&' : '?';
  const get = (u) => fetch(u, { cache: 'no-store' }).then(r => {
    if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
    return r.json();
  });
  const [rec, slice, skips, equity, live] = await Promise.all([
    get('/api/trading/track-record' + qs),
    get('/api/trading/scorecard' + qs + amp + 'by=' + jpSlice),
    get('/api/trading/skips' + qs).catch(() => null),
    // The broker's OWN equity series -- a different question from the ledger. The
    // ledger answers "what did the autopilot do"; this answers "what is the money
    // doing", so it includes manual trades, deposits, and everything from before the
    // autopilot started, anchored to the opening balance rather than to zero.
    // Never fatal: a broker that cannot answer simply gets no card.
    get('/api/trading/portfolio/history' + (demo ? qs + '&range=ALL' : '?range=ALL'))
      .catch(() => null),
    // Today, live (#3502). Everything else here is closed trades or the broker's daily
    // history, whose newest bar is the previous close -- so without this, today read
    // blank until something closed. It is the trader header's own figure; a demo book
    // has no live account behind it, so it asks for none.
    demo ? Promise.resolve(null)
         : get('/api/trading/positions').then(j => (j && j.account) || null).catch(() => null),
  ]);
  return { rec, slice, skips, equity, live, demo };
}

async function jpLoad(force) {
  if (jpBusy && !force) return;
  jpBusy = true;
  const host = document.getElementById('jpBody');
  host.innerHTML = '<div class="jp-loading">Loading the journal…</div>';
  let demo = !!(window.DEMO_ACCT || window.GUEST);
  try {
    let data;
    try { data = await jpFetch(demo); }
    catch (e) {
      // Same fallbacks the panel had: a gated feed shows the demo book rather than a
      // dead page, and a status-less rejection is usually a server mid-restart.
      if (!demo && (e.status === 401 || e.status === 403)) { demo = true; data = await jpFetch(true); }
      else if (!e.status) { await new Promise(r => setTimeout(r, 1500)); data = await jpFetch(demo); }
      else throw e;
    }
    jpData = data;
    jpRender(host, data);
  } catch (e) {
    const network = !(e && e.status);
    host.innerHTML = '<div class="jp-empty">'
      + (network ? 'The server didn’t answer — it may be restarting.' : 'The server said ' + jpEsc(e.message) + '.')
      + ' Nothing is shown rather than something stale. '
      + '<button type="button" class="jp-chip on" style="margin-left:6px" onclick="jpLoad(true)">Retry</button></div>';
  } finally { jpBusy = false; }
}

function jpSetView(v) {
  if (jpView === v) return;
  jpView = v;
  document.getElementById('jpViewConfirmed').classList.toggle('on', v === 'confirmed');
  document.getElementById('jpViewSkips').classList.toggle('on', v === 'skips');
  if (jpData) jpRender(document.getElementById('jpBody'), jpData);
}
function jpSetSlice(k) { if (jpSlice === k) return; jpSlice = k; jpLoad(true); }

/* Derived from `daily`, not invented: a day counts as a win when its realized P&L is
   positive, which is the same rule the day-win figure uses in the products this page
   is modelled on. */
function jpDayStats(daily) {
  const d = daily || [];
  const traded = d.filter(x => typeof x.pnl === 'number' && x.pnl !== 0);
  const wins = traded.filter(x => x.pnl > 0).length;
  let streak = 0, dir = 0;
  for (let i = d.length - 1; i >= 0; i--) {
    const p = d[i].pnl;
    if (!p) break;
    const s = p > 0 ? 1 : -1;
    if (!dir) dir = s; else if (s !== dir) break;
    streak++;
  }
  return { tradingDays: traded.length, dayWinRate: traded.length ? (wins / traded.length) * 100 : null, streak, dir };
}

function jpKpis(s, book, ds) {
  const dd = book.maxDrawdown || { amount: 0 };
  const card = (k, v, cls, sub) => '<div class="jp-kpi"><div class="k">' + k + '</div>'
    + '<div class="v ' + (cls || '') + '">' + v + '</div>'
    + '<div class="s">' + (sub || '&nbsp;') + '</div></div>';
  const streakTxt = ds.streak ? (ds.streak + (ds.dir > 0 ? ' winning day' : ' losing day') + (ds.streak === 1 ? '' : 's')) : 'no run';
  return '<div class="jp-kpis">'
    + card('Net P&amp;L', jpUsd(s.totalRealized), jpSign(s.totalRealized), s.trades + ' closed trade' + (s.trades === 1 ? '' : 's'))
    + card('Trade win %', jpPct(s.winRate), '', 'risk exits only: ' + jpPct(s.riskExitWinRate))
    + card('Profit factor', (typeof s.profitFactor === 'number' && isFinite(s.profitFactor)) ? s.profitFactor.toFixed(2) : '—', '',
           'gross win ÷ gross loss')
    + card('Day win %', ds.dayWinRate == null ? '—' : jpPct(ds.dayWinRate), '', ds.tradingDays + ' trading day' + (ds.tradingDays === 1 ? '' : 's'))
    // The paired amounts wrapped to two lines while every other card was one figure.
    // The RATIO is the headline metric anyway -- how much a winner returns per dollar a
    // loser costs -- so it leads, and both amounts sit underneath where they still read.
    + card('Avg win / loss',
           (typeof s.avgWin === 'number' && typeof s.avgLoss === 'number' && Math.abs(s.avgLoss) > 0)
             ? (s.avgWin / Math.abs(s.avgLoss)).toFixed(2)
             : '—',
           // Above 1.0 means the average winner outruns the average loser. Colour it
           // by that, not by the sum -- the headline figure IS the ratio.
           (Math.abs(s.avgLoss) > 0 ? jpSign((s.avgWin / Math.abs(s.avgLoss)) - 1) : ''),
           jpUsd(s.avgWin) + ' win · ' + jpUsd(s.avgLoss) + ' loss')
    + card('Expectancy', jpUsd(s.expectancy), jpSign(s.expectancy), 'per trade')
    + card('Max drawdown', jpUsd(-Math.abs(dd.amount || 0)), 'jp-neg',
           dd.peakDate ? (jpEsc(dd.peakDate) + ' → ' + jpEsc(dd.troughDate || '')) : 'peak to trough')
    + card('Current streak', String(ds.streak || 0), ds.streak ? (ds.dir > 0 ? 'jp-pos' : 'jp-neg') : '', streakTxt)
    + '</div>';
}

/* Cumulative realized P&L. Deliberately a plain SVG: it is one series and a zero line,
   and a charting library for that would be more code than the chart. */

/* Per-day bars, so a single outsized day is visible as one day rather than as a step
   in the cumulative line. */

/* Today's live figure, or null (#3502). The number is the one the trader's header
   shows -- realized today plus today's move on open positions, worked out by the server
   (routes/trading/market.js). It is $0 before the open and on a day with no session, and
   a blank cell says that better than "$0.00 live" would -- so a zero, a weekend or a
   missing account shows nothing at all. */
function jpLiveToday(live, now) {
  if (!live || live.pnl_today == null) return null;
  const pnl = Number(live.pnl_today);
  if (!isFinite(pnl) || pnl === 0) return null;
  const t = now || new Date();
  let date = '';
  try { date = t.toLocaleDateString('en-CA', { timeZone: 'America/New_York' }); } catch (_e) { return null; }
  const wd = new Date(date + 'T12:00:00Z').getUTCDay();
  if (wd === 0 || wd === 6) return null;
  let asOf = '';
  try { asOf = t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); } catch (_e) { /* cosmetic */ }
  return { date, pnl, equity: Number(live.equity), source: String(live.source || ''), asOf };
}

/* The calendar is the piece both TradeZella and TraderWaves put front and centre, and
   the weekly column on the right is the part that makes it more than decoration. */
function jpCalendar(daily, liveToday) {
  const byDate = {};
  (daily || []).forEach(d => { byDate[d.date] = d; });
  const dates = Object.keys(byDate).sort();
  if (!dates.length && !liveToday) return '<div class="jp-empty">No closed days yet.</div>';
  // Every month with something to show: booked days, plus today while it has a live
  // figure -- so the first session of a month opens on the month that is moving (#3502).
  const months = Array.from(new Set(dates.map(d => d.slice(0, 7))
    .concat(liveToday ? [liveToday.date.slice(0, 7)] : []))).sort();
  if (!jpMonth) jpMonth = months[months.length - 1];
  const [yy, mm] = jpMonth.split('-').map(Number);
  const first = new Date(Date.UTC(yy, mm - 1, 1));
  const days = new Date(Date.UTC(yy, mm, 0)).getUTCDate();
  const lead = first.getUTCDay();                       // 0=Sun, matching the header row
  const monthName = first.toLocaleString(undefined, { month: 'long', year: 'numeric', timeZone: 'UTC' });
  const idx = months.indexOf(jpMonth);

  /* The calendar's rows are exchange days, so "today" is the exchange day too --
     en-CA gives YYYY-MM-DD directly, which is the shape the ledger already uses. */
  let todayIso = '';
  try { todayIso = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' }); }
  catch (_e) { todayIso = new Date().toISOString().slice(0, 10); }
  let weekPnl = 0, weekHasData = false, weekLive = false, out = '';
  const flushWeek = () => {
    out += '<div class="jp-week' + (weekLive ? ' live' : '') + '"'
      + (weekLive ? ' title="Includes today\'s live figure."' : '')
      + '><div class="l">Week</div><div class="v ' + (weekHasData ? jpSign(weekPnl) : 'jp-dim') + '">'
      + (weekHasData ? jpUsd(weekPnl) : '—') + '</div></div>';
    weekPnl = 0; weekHasData = false; weekLive = false;
  };
  for (let i = 0; i < lead; i++) out += '<div class="jp-day empty"></div>';
  let col = lead;
  for (let d = 1; d <= days; d++) {
    const iso = jpMonth + '-' + String(d).padStart(2, '0');
    const rec = byDate[iso];
    /* Today, live (#3502): while a session runs, today's cell shows the broker's figure
       for the day so far, open positions included, rather than waiting for a close. It
       stands in for anything already booked today -- it includes it -- so nothing is
       counted twice, and at the close the cell becomes an ordinary booked day. */
    const lv = (liveToday && iso === liveToday.date) ? liveToday : null;
    const val = lv ? lv.pnl : (rec ? rec.pnl : null);
    const cls = lv ? 'live' : rec ? (rec.pnl > 0 ? 'win' : rec.pnl < 0 ? 'loss' : 'flat') : '';
    const isToday = (iso === todayIso) ? ' today' : '';
    if (val != null) { weekPnl += val || 0; weekHasData = true; if (lv) weekLive = true; }
    const tip = lv
      ? 'Live: today so far, from the broker, open positions included' + (lv.asOf ? ' (as of ' + lv.asOf + ')' : '')
        + '. It becomes a booked result as trades close.' + (rec ? ' Booked so far today: ' + jpUsd(rec.pnl) + '.' : '')
      : '';
    out += '<div class="jp-day ' + cls + isToday + '"'
      + (isToday ? ' aria-current="date"' : '') + (tip ? ' title="' + jpEsc(tip) + '"' : '')
      + '><div class="d">' + d + (lv ? '<span class="lv">live</span>' : '') + '</div>'
      + '<div class="p ' + (val != null ? jpSign(val) : 'jp-dim') + '">'
      + (val != null ? '<span class="p-full">' + jpUsd(val) + '</span><span class="p-abbr">' + jpUsdShort(val) + '</span>' : '')
      + '</div></div>';
    col++;
    if (col === 7) { flushWeek(); col = 0; }
  }
  if (col !== 0) { for (let i = col; i < 7; i++) out += '<div class="jp-day empty"></div>'; flushWeek(); }

  return '<div class="jp-monthbar">'
    + '<button type="button" class="jp-navb" onclick="jpShiftMonth(-1)"' + (idx <= 0 ? ' disabled' : '') + ' aria-label="Previous month">‹</button>'
    + '<button type="button" class="jp-navb" onclick="jpShiftMonth(1)"' + (idx >= months.length - 1 ? ' disabled' : '') + ' aria-label="Next month">›</button>'
    + '<span class="m">' + jpEsc(monthName) + '</span></div>'
    + '<div class="jp-cal-head"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Total</span></div>'
    + '<div class="jp-cal">' + out + '</div>';
}
function jpShiftMonth(n) {
  const booked = ((jpData && jpData.rec && Object.values(jpData.rec.books || {})[0] || {}).daily || [])
    .map(d => d.date.slice(0, 7));
  const lt = (jpData && !jpData.demo) ? jpLiveToday(jpData.live) : null;   // same months the calendar shows
  const months = Array.from(new Set(booked.concat(lt ? [lt.date.slice(0, 7)] : []))).sort();
  const i = months.indexOf(jpMonth);
  if (i < 0) return;
  const next = months[i + n];
  if (!next) return;
  jpMonth = next;
  jpRender(document.getElementById('jpBody'), jpData);
}

function jpBreakdown(slice) {
  /* The scorecard does NOT return `rows`. It returns an object keyed by the slice value
     under two headings: `confirmed` = broker-accepted fills, `all` = every exit decision
     including the ones that never filled. Reading .rows silently produced an empty table
     for every slice, which looked like "no data" rather than like a bug.
     Supported slices come from the API itself: symbol, hour, reason, skip. `weekday` is
     not one of them -- offering it returned unknown_breakdown. */
  const SLICES = ['reason', 'symbol', 'hour'];
  const chips = SLICES.map(k =>
    '<button type="button" class="jp-chip' + (jpSlice === k ? ' on' : '') + '" onclick="jpSetSlice(\'' + k + '\')">'
    + jpEsc(JP_LABELS[k] || k) + '</button>').join('');
  const head = '<h2>Breakdown<span class="sp">' + chips + '</span></h2>';
  const bucket = (slice && slice.confirmed) || {};
  const keys = Object.keys(bucket);
  if (!keys.length) return head + '<div class="jp-empty">Nothing to break down yet.</div>';
  const rows = keys.map(k => Object.assign({ key: k }, bucket[k]))
    .sort((a, b) => (b.totalRealized || 0) - (a.totalRealized || 0));
  return head
    + '<div class="jp-scroll"><table class="jp-table"><thead><tr>'
    + '<th>' + jpEsc(JP_LABELS[jpSlice] || jpSlice) + '</th><th class="num">Trades</th>'
    + '<th class="num">Win %</th><th class="num">Realized</th></tr></thead><tbody>'
    + rows.map(r => '<tr><td>' + jpEsc(jpLabelValue(r.key)) + '</td>'
      + '<td class="num">' + (r.trades != null ? r.trades : '—') + '</td>'
      + '<td class="num">' + jpPct(r.winRate) + '</td>'
      + '<td class="num ' + jpSign(r.totalRealized) + '">' + jpUsd(r.totalRealized) + '</td></tr>').join('')
    + '</tbody></table></div>'
    + '<p class="jp-note">Broker-accepted fills only. Exit reasons are the engine\'s own names for why a position closed.</p>';
}
/* signal_exit -> "signal exit". The engine's keys are snake_case internally. */
function jpLabelValue(k) { return String(k == null ? '—' : k).replace(/_/g, ' '); }

function jpSkips(sk) {
  const rows = (sk && (sk.rows || sk.skips)) || [];
  if (!rows.length) return '<h2>Declined</h2><div class="jp-empty">Nothing was declined in this window. Every candidate that reached the gate was taken.</div>';
  return '<h2>Declined <span class="jp-dim" style="text-transform:none;letter-spacing:0">' + rows.length + ' passed over</span></h2>'
    + '<div class="jp-scroll"><table class="jp-table"><thead><tr><th>When</th><th>Symbol</th><th>Why</th></tr></thead><tbody>'
    + rows.slice(0, 200).map(r => '<tr><td class="jp-dim">' + jpEsc(String(r.ts || r.date || '').slice(0, 16).replace('T', ' ')) + '</td>'
      + '<td><b>' + jpEsc(r.symbol || '') + '</b></td>'
      + '<td>' + jpEsc(r.reason || r.why || '') + '</td></tr>').join('')
    + '</tbody></table></div>';
}

/* Placement notes. journalLog() on the trader page has captured a snapshot on every
   order since #2446 -- signal, pattern, RVOL, session -- into localStorage, and until
   now nothing read them back. They are device-local and they are NOT P&L: these are
   intentions, the figures above are outcomes. */
function jpPlacements() {
  let rows = [];
  try { rows = JSON.parse(localStorage.getItem('trader.journal') || '[]'); } catch (_e) { rows = []; }
  if (!rows.length) return '';
  const cell = v => (v === null || v === undefined || v === '') ? '<td class="jp-dim">—</td>' : '<td>' + jpEsc(String(v)) + '</td>';
  const when = ts => { try { return new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (_e) { return ts || ''; } };
  return '<div class="jp-card"><h2>Placement notes — this device</h2>'
    + '<p class="jp-note">What the screen said at the moment each order went in. Captured locally, never uploaded, '
    + 'newest first, capped at 500. Not profit and loss — these are intentions, not outcomes.</p>'
    + '<div class="jp-scroll"><table class="jp-table"><thead><tr>'
    + '<th>When</th><th>Symbol</th><th>Side</th><th class="num">Qty</th><th class="num">Price</th>'
    + '<th>Signal</th><th>Pattern</th><th class="num">RVOL</th><th>Session</th></tr></thead><tbody>'
    + rows.slice(0, 100).map(r => '<tr><td class="jp-dim">' + jpEsc(when(r.ts)) + '</td>'
      + '<td><b>' + jpEsc(r.symbol || '') + '</b></td>'
      + '<td class="' + (String(r.side).toLowerCase() === 'buy' ? 'jp-pos' : 'jp-neg') + '">' + jpEsc(String(r.side || '').toUpperCase()) + '</td>'
      + '<td class="num">' + jpEsc(r.qty == null ? '—' : r.qty) + '</td>'
      + '<td class="num">' + (r.price != null ? jpEsc(jpUsd(r.price)) : '—') + '</td>'
      + cell(r.signal) + cell(r.pattern) + '<td class="num">' + jpEsc(r.rvol == null ? '—' : r.rvol) + '</td>' + cell(r.session)
      + '</tr>').join('')
    + '</tbody></table></div>'
    + (rows.length > 100 ? '<p class="jp-note">Showing the most recent 100 of ' + rows.length + '.</p>' : '')
    + '</div>';
}


/* Account equity, from the broker's own record. Deliberately NOT the same chart as the
   realized curve above it: that one starts at zero and counts only what the autopilot
   booked, this one starts at the opening balance and counts everything the account did.
   Showing both is the point -- the gap between them IS the manual trades, the deposits,
   and the history from before the ledger existed. */
/* ── Plot engine ───────────────────────────────────────────────────────────────
   One builder for every chart on the page, because the three hand-rolled SVGs had
   drifted apart: two of them drew the same shape from different data, and the bar
   chart shipped with no axis at all -- bars floating over a baseline with no dates
   and no values, which tells you a day was red but not which day or by how much.

   Every plot gets:
     - a labelled Y axis (values) and X axis (dates)
     - a readout that follows the pointer and names the point under it
   and deliberately NOT a crosshair: no horizontal or vertical rule across the plot.
   The readout is the tracker.

   Series are kept in _jpPlots rather than serialised into the DOM, so the numbers a
   tooltip shows are the numbers the chart was drawn from -- not a re-parse that can
   disagree with it. */
const _jpPlots = {};
let _jpPlotSeq = 0;

/* Nice round tick values, so the axis reads 100k / 102k rather than 99,812.37. */
function jpTicks(lo, hi, n) {
  if (!(hi > lo)) return [lo];
  const raw = (hi - lo) / Math.max(1, n);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(v => v >= raw) || mag * 10;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(v);
  return out.length ? out : [lo, hi];
}
/* Axis labels want to be short: $102k reads at a glance, $102,033.33 does not. */
function jpAxisMoney(v) {
  const a = Math.abs(v), sign = v < 0 ? '-' : '';
  if (a >= 1000) return sign + '$' + (a / 1000).toFixed(a >= 10000 ? 0 : 1) + 'k';
  if (a >= 1) return sign + '$' + Math.round(a);
  return sign + '$' + a.toFixed(2);
}

/**
 * pts  : [{ d:'YYYY-MM-DD', v:Number }]
 * opts : { type:'line'|'bar', baseline:Number|null, baselineLabel:String, height:Number }
 */
function jpPlot(pts, opts) {
  const o = opts || {};
  if (!Array.isArray(pts) || pts.length < 1) return '';
  const id = 'jpp' + (++_jpPlotSeq);
  const bar = o.type === 'bar';
  const H = o.height || 190, W = 620;
  const padL = 8, padR = 8, padT = 14, padB = 22, axisW = 44;
  const iw = W - padL - padR - axisW, ih = H - padT - padB;
  const x0 = padL + axisW;

  const vals = pts.map(p => p.v).filter(v => typeof v === 'number' && isFinite(v));
  if (!vals.length) return '';
  let lo, hi;
  if (bar) { const m = Math.max.apply(null, vals.map(Math.abs)) || 1; lo = -m; hi = m; }
  else {
    lo = Math.min.apply(null, vals); hi = Math.max.apply(null, vals);
    if (o.baseline != null) { lo = Math.min(lo, o.baseline); hi = Math.max(hi, o.baseline); }
    if (hi === lo) hi = lo + 1;
    const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  }
  const X = i => x0 + (pts.length === 1 ? iw / 2 : (i / (pts.length - 1)) * iw);
  const Y = v => padT + (1 - (v - lo) / (hi - lo)) * ih;

  // ── axes ──────────────────────────────────────────────────────────────────
  let g = '';
  for (const t of jpTicks(lo, hi, 4)) {
    const y = Y(t);
    if (y < padT - 1 || y > padT + ih + 1) continue;
    g += '<line x1="' + x0 + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1)
      + '" stroke="var(--border)" opacity=".55"/>'
      + '<text x="' + (x0 - 6) + '" y="' + (y + 3.5).toFixed(1) + '" font-size="9.5" fill="var(--text2)" '
      + 'text-anchor="end">' + jpEsc(jpAxisMoney(t)) + '</text>';
  }
  // X labels: first, middle, last — enough to place the series in time without clutter.
  const marks = pts.length <= 2 ? [0, pts.length - 1] : [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
  for (const i of Array.from(new Set(marks))) {
    const anchor = i === 0 ? 'start' : (i === pts.length - 1 ? 'end' : 'middle');
    g += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 5) + '" font-size="9.5" fill="var(--text2)" '
      + 'text-anchor="' + anchor + '">' + jpEsc(pts[i].d) + '</text>';
  }

  // ── series ────────────────────────────────────────────────────────────────
  let body = '';
  const net = o.baseline != null ? (pts[pts.length - 1].v - o.baseline) : (pts[pts.length - 1].v);
  const col = net >= 0 ? 'var(--green)' : 'var(--red)';
  if (bar) {
    g += '<line x1="' + x0 + '" y1="' + Y(0).toFixed(1) + '" x2="' + (W - padR) + '" y2="' + Y(0).toFixed(1)
      + '" stroke="var(--text2)" opacity=".5"/>';
    const bw = Math.max(1.5, Math.min(16, iw / Math.max(1, pts.length) - 2));
    body = pts.map((p, i) => {
      const h = Math.abs(Y(p.v) - Y(0));
      const up = p.v >= 0;
      return '<rect x="' + (X(i) - bw / 2).toFixed(1) + '" y="' + (up ? Y(p.v) : Y(0)).toFixed(1)
        + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, h).toFixed(1) + '" rx="1.5" fill="'
        + (up ? 'var(--green)' : 'var(--red)') + '" opacity=".9"/>';
    }).join('');
  } else {
    const base = o.baseline != null ? o.baseline : 0;
    const line = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
    const area = 'M' + X(0).toFixed(1) + ' ' + Y(base).toFixed(1) + ' '
      + pts.map((p, i) => 'L' + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ')
      + ' L' + X(pts.length - 1).toFixed(1) + ' ' + Y(base).toFixed(1) + ' Z';
    if (o.baseline != null) {
      g += '<line x1="' + x0 + '" y1="' + Y(o.baseline).toFixed(1) + '" x2="' + (W - padR) + '" y2="'
        + Y(o.baseline).toFixed(1) + '" stroke="var(--text2)" stroke-dasharray="3 3" opacity=".75"/>';
      if (o.baselineLabel) {
        g += '<text x="' + (x0 + 4) + '" y="' + (Y(o.baseline) - 4).toFixed(1) + '" font-size="9" '
          + 'fill="var(--text2)">' + jpEsc(o.baselineLabel) + '</text>';
      }
    }
    body = '<path d="' + area + '" fill="' + col + '" opacity=".12"/>'
      + '<path d="' + line + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round"/>';
  }

  _jpPlots[id] = { pts: pts, geom: { W: W, H: H, x0: x0, iw: iw, padT: padT, ih: ih, lo: lo, hi: hi }, bar: bar };

  return '<div class="jp-chart" id="' + id + '">'
    + '<div class="jp-read"><span class="d"></span><span class="v"></span></div>'
    + '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + jpEsc(o.aria || 'chart') + '">'
    + g + body
    + '<circle class="jp-dot" r="3.5" fill="var(--text0)" stroke="var(--bg1)" stroke-width="1.5"/>'
    + '</svg></div>';
}

/* Bind after every render. Pointer events cover mouse, pen AND touch from one code
   path, so the phone behaves the way the desktop does rather than getting a second
   implementation that drifts. touch-action:none would kill page scrolling, so the
   readout tracks on move and clears on leave/cancel instead of capturing the gesture. */
function jpBindPlots() {
  Object.keys(_jpPlots).forEach(function (id) {
    const el = document.getElementById(id);
    if (!el || el.dataset.bound === '1') return;
    el.dataset.bound = '1';
    const rec = _jpPlots[id], svg = el.querySelector('svg');
    const dot = el.querySelector('.jp-dot');
    const rd = el.querySelector('.jp-read'), rdD = rd.querySelector('.d'), rdV = rd.querySelector('.v');
    const show = (clientX) => {
      const r = svg.getBoundingClientRect();
      if (!r.width) return;
      const vx = ((clientX - r.left) / r.width) * rec.geom.W;      // client px -> viewBox units
      const f = (vx - rec.geom.x0) / (rec.geom.iw || 1);
      const i = Math.max(0, Math.min(rec.pts.length - 1, Math.round(f * (rec.pts.length - 1))));
      const p = rec.pts[i];
      if (!p) return;
      rdD.textContent = p.d;
      rdV.textContent = jpUsd(p.v);
      rdV.className = 'v ' + jpSign(p.v);
      const gx = rec.geom.x0 + (rec.pts.length === 1 ? rec.geom.iw / 2 : (i / (rec.pts.length - 1)) * rec.geom.iw);
      const gy = rec.geom.padT + (1 - (p.v - rec.geom.lo) / (rec.geom.hi - rec.geom.lo)) * rec.geom.ih;
      dot.setAttribute('cx', gx.toFixed(1));
      dot.setAttribute('cy', gy.toFixed(1));
      el.classList.add('on');
    };
    const clear = () => el.classList.remove('on');
    el.addEventListener('pointermove', (e) => show(e.clientX));
    el.addEventListener('pointerdown', (e) => show(e.clientX));
    el.addEventListener('pointerleave', clear);
    el.addEventListener('pointercancel', clear);
  });
}


/* ONE balance chart, not two. The page used to draw the broker's equity AND the
   autopilot's cumulative realized as separate line charts -- two near-identical shapes
   asking the reader to work out which was which. The broker's series is the real
   account balance, so that is the one that stays; the autopilot's cumulative line is
   the same information the calendar and the bar chart already carry, per day.
   When the broker cannot answer (a box with no linked account), the autopilot's own
   cumulative curve stands in rather than leaving an empty slot. */
function jpBalanceChart(h, daily, liveToday) {
  /* Which exchange day a broker point belongs to (#3501). The brokers stamp a day
     differently. IBKR (ibkr-cpapi _toEpochSeconds) and the demo stamp the session's own
     date at 00:00 UTC, which the UTC date reads correctly. Alpaca stamps each daily bar
     at the END of the session it closes -- 00:00 UTC the next day, 8 PM ET -- so its UTC
     date ran a day late: Friday's close showed as a Saturday, the Tuesday after a Monday
     holiday vanished, and the point labelled today was yesterday's close. Alpaca stamps
     are read in ET instead, backed off 5 hours so a stamp at or just after midnight
     (either side of daylight saving) still lands on the session it closed. */
  const alpaca = !!(h && h.source === 'alpaca');
  const iso = (t) => {
    try {
      return alpaca
        ? new Date((t - 5 * 3600) * 1000).toLocaleDateString('en-CA', { timeZone: 'America/New_York' })
        : new Date(t * 1000).toISOString().slice(0, 10);
    } catch (_e) { return ''; }
  };
  if (h && h.ok !== false && Array.isArray(h.timestamps) && h.timestamps.length > 1) {
    const eq = h.equity || [], pts = [];
    for (let i = 0; i < h.timestamps.length; i++) {
      const v = eq[i];
      if (v != null && isFinite(v)) pts.push({ d: iso(h.timestamps[i]), v: Number(v) });
    }
    // The payload says whether it is real. champion-demo is a SIMULATED 26-year DCA
    // book -- coherent on its own terms, but calling it "from the broker" would be a
    // false claim about provenance on the one page whose job is an honest record.
    const sim = h.demo === true || h.source === 'champion-demo';
    /* Today, live (#3502). The daily history's newest bar is the previous close, so
       during a session the chart ended a day behind. The live equity -- same broker,
       same account -- adds today's point, and the readout names it as today. */
    let live = false;
    if (!sim && liveToday && liveToday.equity > 0 && pts.length && pts[pts.length - 1].d < liveToday.date
        && (!liveToday.source || !h.source || liveToday.source === h.source)) {
      pts.push({ d: liveToday.date, v: liveToday.equity });
      live = true;
    }
    if (pts.length > 1) {
      const base = Number(h.base_value) || pts[0].v;
      const last = pts[pts.length - 1], net = last.v - base;
      return {
        title: sim ? 'Account balance — simulated demo book'
                   : 'Account balance — all time, from the broker',
        html: jpPlot(pts, { type: 'line', baseline: base, baselineLabel: 'opened ' + jpAxisMoney(base),
          aria: 'Account balance from ' + pts[0].d + ' to ' + last.d + ', opened ' + jpUsd(base) + ', now ' + jpUsd(last.v) })
          + '<p class="jp-note">Opened <b>' + jpEsc(jpUsd(base)) + '</b> on ' + jpEsc(pts[0].d)
          + ' — now <b>' + jpEsc(jpUsd(last.v)) + '</b>' + (live ? ' live' : '') + ' (<span class="' + jpSign(net) + '">'
          + jpEsc((net >= 0 ? '+' : '') + jpUsd(net)) + '</span>). '
          + (sim
              ? 'Simulated sample data for the demo book — not a real account, and not a real track record.'
              : 'Straight from the broker, so it counts manual trades and deposits too — the calendar '
                + 'below counts only what the autopilot booked.')
          + '</p>',
      };
    }
  }
  if (!daily || !daily.length) return null;
  const pts = daily.map(d => ({ d: d.date, v: d.cum }));
  return {
    title: 'Autopilot cumulative — realized, by exchange day',
    html: jpPlot(pts, { type: 'line', baseline: 0, baselineLabel: 'flat',
      aria: 'Cumulative realized profit and loss by exchange day' })
      + '<p class="jp-note">The broker did not return an account history for this box, so this is the '
      + 'autopilot\'s own realized total instead — it starts at zero, not at the opening balance.</p>',
  };
}

function jpRender(host, data) {
  const bookKey = Object.keys(data.rec.books || {})[0];
  const book = (data.rec.books || {})[bookKey] || {};
  const s = book.stats || {};
  const daily = book.daily || [];
  // Today's live figure (#3502); the demo book has no live account behind it.
  const liveToday = data.demo ? null : jpLiveToday(data.live);
  let html = '';

  if (data.demo) {
    html += '<div class="jp-banner"><span><b>' + jpEsc(book.label || 'Demo book')
      + '</b> — simulated sample data, not real trades. Your own account fills this in once it trades.</span>'
      + '<a href="/pricing.html" style="margin-left:auto;white-space:nowrap">See plans →</a></div>';
  }

  const rangeEl = document.getElementById('jpRange');
  if (rangeEl) {
    rangeEl.textContent = (daily.length
      ? ('Realized results, ' + daily[0].date + ' to ' + daily[daily.length - 1].date + '.')
      : 'Realized results, day by day.')
      + (liveToday ? ' Today so far: ' + (liveToday.pnl > 0 ? '+' : '') + jpUsd(liveToday.pnl) + ', live.' : '');
  }

  if (jpView === 'skips') {
    html += '<div class="jp-card">' + jpSkips(data.skips) + '</div>';
    host.innerHTML = html;
  jpBindPlots();
    return;
  }

  if (!s.trades) {
    html += '<div class="jp-empty">No confirmed trades yet. As soon as a position closes with a broker-accepted fill, '
      + 'this page fills in: realized P&amp;L by day, the equity curve with its drawdown, where the exits happened, '
      + 'and every candidate the autopilot passed over.</div>';
    html += jpPlacements();          // things you DID still belong here
    host.innerHTML = html;
  jpBindPlots();
    return;
  }

  const ds = jpDayStats(daily);
  html += jpKpis(s, book, ds);
  html += '<div class="jp-grid">'
    + '<div class="jp-col">'
      + '<div class="jp-card"><h2>P&amp;L calendar</h2>' + jpCalendar(daily, liveToday) + '</div>'
      + '<div class="jp-card">' + jpBreakdown(data.slice) + '</div>'
    + '</div>'
    + '<div class="jp-col">'
      + (function () {
          const b = jpBalanceChart(data.equity, daily, liveToday);
          return b ? '<div class="jp-card jp-curve"><h2>' + b.title + '</h2>' + b.html + '</div>' : '';
        })()
      + '<div class="jp-card jp-curve"><h2>Net P&amp;L per day — realized</h2>'
        + jpPlot(daily.map(d => ({ d: d.date, v: d.pnl })), { type: 'bar', height: 150,
            aria: 'Realized profit and loss for each exchange day' })
        + '</div>'
      + '<div class="jp-card">' + jpSkips(data.skips) + '</div>'
    + '</div>'
  + '</div>';
  html += jpPlacements();

  if (book.disclosures) {
    html += '<p class="jp-note">' + jpEsc(String(book.disclosures)) + '</p>';
  }
  host.innerHTML = html;
  jpBindPlots();
}

/* ── Staying current ──────────────────────────────────────────────────────────
   This page used to call jpLoad() exactly once, on DOMContentLoaded, and never again.
   No interval, no refresh on focus. A tab left open showed whatever was true when it
   was opened -- so a session could close, the ledger could gain a day, and the journal
   would still be reporting yesterday with no sign anything was stale.

   Refreshing on FOCUS rather than on a timer, because that is how a review surface is
   actually used: you glance at it, go somewhere else, and come back wanting the number
   to be right. A hidden tab costs nothing, which a fixed interval cannot say -- the
   trader page runs seven of those, and it is a live surface that earns them.

   The slow poll underneath is a floor, not the mechanism: it only fires while the page
   is VISIBLE, so a forgotten tab in the background is not quietly hammering the broker
   all night. STALE_MS is deliberately larger than the poll so a refresh triggered by
   coming back to the tab does not re-fetch something fetched seconds ago. */
const JP_POLL_MS = 120000;   // visible-only background refresh
const JP_STALE_MS = 45000;   // don't re-fetch on focus if we just did
let _jpLastLoad = 0;

async function jpRefresh(reason) {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - _jpLastLoad < JP_STALE_MS) return;
  _jpLastLoad = Date.now();
  try { await jpLoad(true); } catch (_e) { /* the error card already explains itself */ }
}

document.addEventListener('DOMContentLoaded', () => { _jpLastLoad = Date.now(); jpLoad(); });
document.addEventListener('visibilitychange', () => jpRefresh('visible'));
window.addEventListener('focus', () => jpRefresh('focus'));
setInterval(() => jpRefresh('poll'), JP_POLL_MS);
</script>
