  <script>
    /* Theme bootstrap — set before first paint to avoid flash of wrong theme */
    (function() {
      try {
        var stored = localStorage.getItem('lantern-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = stored ? stored === 'dark' : prefersDark;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();

    /* SW cleanup — unregister any cached service worker and reload once.
       Runs synchronously before any deferred scripts or fetches so the SW
       cannot intercept resources on this load. A sessionStorage flag prevents
       reload loops if the SW somehow re-registers itself. */
    (function() {
      if (!('serviceWorker' in navigator)) return;
      if (sessionStorage.getItem('sw_cleaned')) return;
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        if (!regs.length) return;
        sessionStorage.setItem('sw_cleaned', '1');
        Promise.all(regs.map(function(r) { return r.unregister(); })).then(function() {
          window.location.reload();
        });
      });
    })();
  </script>

  <style>
    /* One-screen, no-scroll home shell (matches the dream-chat app feel) */
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; }
    .site-nav { flex-shrink: 0; }
    .home-main {
      flex: 1 1 auto;
      display: grid;
      grid-template-rows: auto auto;      /* hero + chat, centered together as a group */
      align-content: center;              /* balance empty space above & below the pair */
      row-gap: clamp(16px, 3.5vh, 34px);
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      overflow: hidden;
    }
    /* Brand/hero sits directly above the search bar; the two are centered
       together as one group (see .home-main align-content) now that the former
       bottom zone — duplicate version meta + Trader/Create/Explore quick-links —
       was merged into the single site footer below. */
    .home-top { width: 100%; text-align: center; }
    .home-mid { width: 100%; }
    .hero { position: relative; text-align: center; padding: 0; }
    /* Hero mandala — the same self-contained animated SVG used in the header,
       sized up and centered above the title. Renders reliably in Chrome
       (replaces the masked full-bleed ambient background that did not). */
    .hero__mandala {
      display: block;
      width: clamp(88px, 14vh, 148px);
      height: auto; aspect-ratio: 1;
      margin: 0 auto clamp(10px, 2vh, 20px);
      pointer-events: none; user-select: none;
    }
    /* Gothic hero wordmark — a geometric "gothic" sans (Century Gothic / Franklin
       Gothic), heavy and rounded to match the design wireframe. NOT blackletter
       (that read as illegible). These faces ship with Windows/Office; graceful
       fallback to the heaviest system sans elsewhere. */
    .hero h1 {
      margin-bottom: 6px;
      font-family: "Century Gothic", "Franklin Gothic Heavy", "Arial Rounded MT Bold", "Segoe UI Black", "Segoe UI", system-ui, sans-serif;
      font-size: clamp(2.5rem, 10vw, 4rem);       /* large, prominent wordmark to match the wireframe */
      letter-spacing: -0.01em;
      font-weight: 700;
    }
    .hero .motto { font-size: 0.82rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
    .hero .tagline { color: var(--text); max-width: 560px; margin: 0 auto 20px; font-size: 1rem; line-height: 1.55; }
    html[data-theme="dark"] .hero h1 { text-shadow: 0 2px 26px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.4); }
    html[data-theme="dark"] .hero .tagline { text-shadow: 0 1px 3px rgba(0,0,0,.55); }
    /* ── Home chat bar — every control merged into ONE search/feature bar ── */
    .home-chat {
      display: flex; align-items: center; gap: 0;
      max-width: 620px; width: 100%; margin: 0 auto;
      padding: 5px 6px;
      border: 1.5px solid var(--border);
      border-radius: 9999px;
      background: var(--bg);
      transition: border-color .18s, box-shadow .18s;
    }
    .home-chat:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
    }
    /* text input — borderless, fills the bar */
    .home-chat input {
      flex: 1; min-width: 0;
      padding: 10px 12px;
      border: none; background: transparent; color: var(--text);
      font-size: 1rem; outline: none;
    }
    .home-chat input::placeholder { color: var(--muted); }
    /* provider pin — borderless, divider on its left */
    .home-chat select {
      flex-shrink: 0;
      padding: 0 6px 0 10px; height: 32px;
      border: none; border-left: 1px solid var(--border); border-radius: 0;
      background: transparent; color: var(--muted);
      font-size: 0.85rem; cursor: pointer; outline: none;
      transition: color .18s;
    }
    .home-chat select:hover { color: var(--text); }
    .home-chat select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
    /* submit — round accent send button (paper plane) at the right end of the bar */
    .home-chat button[type="submit"] {
      flex-shrink: 0;
      margin-left: 4px; width: 42px; height: 42px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; border-radius: 9999px;
      background: var(--accent); color: #fff;
      cursor: pointer;
      transition: background .18s, transform .12s;
    }
    .home-chat button[type="submit"] svg { width: 18px; height: 18px; display: block; }
    .home-chat button[type="submit"]:hover { background: var(--accent-hover); transform: scale(1.03); }
    .home-chat button[type="submit"]:active { transform: scale(0.97); }
    /* ── "+" attach — borderless icon button on the left ── */
    .home-attach-btn {
      flex-shrink: 0;
      width: 38px; height: 38px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; border-radius: 9999px;
      background: transparent; color: var(--muted);
      font-size: 22px; line-height: 1; cursor: pointer;
      transition: color .18s, background .18s;
    }
    .home-attach-btn:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .home-attach-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .home-chat.drag-over { outline: 2px dashed var(--accent); outline-offset: 5px; }
    /* ── Whole-screen file drop overlay ── */
    #home-drop-overlay {
      position: fixed; inset: 0; z-index: 50;
      display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      background: color-mix(in srgb, var(--accent) 16%, rgba(0,0,0,.55));
      color: #fff; font-size: 1.4rem; font-weight: 700; text-align: center;

      border-radius: 9999px;

    .home-file-chip button {

      color: var(--muted); font-size: 13px; line-height: 1; padding: 0;
      flex-shrink: 0;
    }
    .home-file-chip button:hover { color: var(--text); }
    /* ── Suggestion chips under the search bar ── */
    .home-suggest {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
      max-width: 620px; margin: 18px auto 0;
    }
    .home-suggest-chip {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 16px;
      border: 1px solid var(--border); border-radius: 9999px;
      background: var(--bg); color: var(--text);
      font-size: 0.9rem; cursor: pointer; white-space: nowrap;
      transition: border-color .18s, background .18s, transform .12s;
    }
    .home-suggest-chip:hover {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 8%, var(--bg));
      transform: translateY(-1px);
    }
    .home-suggest-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    /* chip icons — same feather stroke idiom as the nav buttons (no emoji) */
    .home-suggest-chip svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--muted); transition: color .18s; }
    .home-suggest-chip:hover svg { color: var(--accent); }
    .site-footer { flex-shrink: 0; margin-top: 0; padding: 12px 20px; }
    /* One-line footer: keep the whole row (brand · nav · GitHub · edition/version)
       on a single line. `nowrap` stops the flex row from stacking; the
       edition/version meta no longer claims `flex-basis:100%` (which used to push
       it onto its own second line). On narrow viewports the row scrolls
       horizontally instead of wrapping, and `safe center` keeps the start of the
       row reachable when it overflows. */
    .footer-inner {
      flex-wrap: nowrap;
      white-space: nowrap;
      overflow-x: auto;
      justify-content: safe center;
    }
    .footer-meta { text-align: center; font-size: 0.78rem; }
    /* ── Narrow viewports (phones) ──
       The one-line pill can't hold attach + input + provider-pin + submit at
       ~360px, so the submit button slid off-screen (clipped by overflow:hidden).
       Drop the provider pin (Auto still applies — it's the default), tighten the
       control spacing, and let the input keep the room it needs so the whole bar
       always fits on screen. Also scale the hero + link row down a notch. */
    @media (max-width: 560px) {
      .home-main { padding: 16px 14px; }
      .hero__mandala { width: clamp(72px, 16vw, 108px); }
      .hero .tagline { font-size: 0.95rem; max-width: 92%; }
      .home-chat { max-width: 100%; padding: 4px 5px; }
      .home-chat input { padding: 10px 8px; font-size: 0.95rem; }
      .home-chat select { display: none; }           /* Auto is the mobile default */
      .home-chat button[type="submit"] { margin-left: 2px; width: 38px; height: 38px; }
      .home-suggest { gap: 8px; margin-top: 14px; }
      .home-suggest-chip { font-size: 0.82rem; padding: 8px 13px; }
      .home-attach-btn { width: 34px; height: 34px; font-size: 20px; }
      .home-file-chip { max-width: 100%; }
      .footer-meta { font-size: 0.72rem; }
    }
    /* Fallback: on short viewports (small laptops, phones) let the page scroll
       and stack the two zones naturally instead of forcing the centered grid. */
    @media (max-height: 740px) {
      body { overflow: auto; }
      .home-main {
        grid-template-rows: auto auto;
        align-content: center; row-gap: clamp(18px, 4vh, 36px);
        overflow: visible;
      }
      .home-top { padding-top: 0; }
    }

<script>
/* Theme toggle event listener (logout lives on the profile page, not the nav) */

  if (themeToggle && window.toggleTheme) {

/* Real-time honest state loader */
(function() {
  const $ = id => document.getElementById(id) || { textContent: '', className: '', style: {}, title: '', onclick: null };
  const fmtDate = iso => { try { return new Date(iso).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'}); } catch { return iso; } };

  async function fetchJson(path) {
    try { const r = await fetch(path, { cache: 'no-store', signal: AbortSignal.timeout(5000) }); return r.ok ? await r.json() : null; }
    catch { return null; }
  }

  async function loadState() {
    // #878: only these 3 endpoints drive elements that exist on this page
    // (footer status dot/label, hero edition/commit line, version badges).
    // The former "full index" dashboard — providers, agents, node mesh,
    // dreamer, readiness, recent entries — was removed, so its loader and the
    // 8 endpoints it polled (incl. /api/nodes/mesh, /api/agents/workers and
    // /api/nodes/this, which 404'd every cycle) are gone with it.
    const [health, version, git, serving] = await Promise.all([
      fetchJson('/api/health'),
      fetchJson('/version.json'),
      fetchJson('/api/version'),
      fetchJson('/api/serving/status'),
    ]);

    // Footer light = Ollama health. /api/serving/status → local_model probes
    // Ollama at :11434: `serving` = server reachable, `pinned_served` = the
    // pinned model is actually loaded. RED when Ollama is down (or the web server
    // itself is unreachable), GOLD when Ollama is up but the pinned model isn't
    // served, GREEN when Ollama is up and ready.
    const serverOnline = !!(health && health.ok);
    const lm = serving?.local_model;
    const ollamaUp = !!(lm && lm.serving);
    const pinnedConfigured = !!(lm && lm.pinned);
    const modelUp = !!(lm && lm.pinned_served);
    let dotState, statusText, statusTitle;
    if (!serverOnline || !ollamaUp) {
      dotState = 'offline';                                   // red — Ollama is down
      statusText = serverOnline ? 'ollama offline' : 'server unreachable';
      statusTitle = serverOnline
        ? 'Ollama down' + (lm && lm.base ? ' (' + lm.base + ')' : '')
        : 'Server unreachable';
    } else if (pinnedConfigured && !modelUp) {
      dotState = 'warn';                                      // gold — up but model not loaded
      statusText = 'ollama online · model not loaded';
      statusTitle = 'Ollama up · pinned model ' + lm.pinned + ' not served';
    } else {
      dotState = 'online';                                   // green — Ollama up and ready
      statusText = 'ollama online';
      const active = lm.active_model || lm.pinned;
      statusTitle = 'Ollama up' + (active ? ' · ' + active : '');
    }
    const dotEl = $('status-dot');
    dotEl.className = 'dot ' + dotState;
    dotEl.title = statusTitle;
    $('status-label').textContent = statusText;

    // Version + git (hero sub-line + clickable version badges)
    // /version.json can 500 in some checkouts; fall back to the git
    // endpoint's semver (already fetched below) before giving up.
    const g = git?.version;
    // Prefer the live git semver (reflects the running commit) over the static
    // /version.json file, which is committed and routinely lags the real build.
    const v = g?.semver || version?.version || 'unknown';
    const branch = g?.branch || '';
    const shortCommit = g?.commit ? g.commit.slice(0, 7) : '—';
    const commitDate = g?.date ? fmtDate(g.date) : '';

    $('hero-edition').textContent = 'Orion Edition';
    $('hero-git').textContent = [branch, shortCommit, commitDate].filter(Boolean).join(' · ');

    document.querySelectorAll('[data-version-badge]').forEach(el => {
      const prefix = el.dataset.versionBadge || '';
      el.textContent = prefix + 'v' + v;
      el.style.cursor = 'pointer';
      el.title = 'View changelog';
      el.onclick = () => window.open('/repo/CHANGELOG.MD', '_blank');
    });
  }

  loadState();
  setInterval(loadState, 30_000);
})();
</script>

<!-- Screenshot → GitHub issue reporter (📷 in the header). Modal + styles self-inject; report includes the page URL + captured DOM/console errors. -->
<script src="/vendor/html2canvas/html2canvas.min.js" defer></script>
<script src="/js/issue-reporter.js?v=20260628f-autoattach" defer></script>
<script>
(function () {
  let pendingDocx = null;

  function setDocxChip(file) {
    pendingDocx = file;
    const chip = document.getElementById('home-file-chip');
    document.getElementById('home-file-chip-name').textContent = '📄 ' + file.name;
    chip.classList.add('visible');
    const input = document.getElementById('home-chat-input');
    input.placeholder = 'Add an instruction (or leave blank to polish)…';
    input.focus();
  }

  window.clearHomeDocx = function () {
    pendingDocx = null;
    document.getElementById('home-file-chip').classList.remove('visible');
    document.getElementById('home-chat-input').placeholder = 'Ask Unisona anything…';
  };

  // ── Provider pin: sticky choice forwarded to dream-chat via ?provider= ──────
  // dream-chat-ui.js reads ?provider= and routes the turn to that provider
  // (empty = Auto, i.e. the live PCSF-ranked pick). Persisted in localStorage so
  // the pin survives reloads.
  const providerPin = document.getElementById('home-provider-pin');
  if (providerPin) {
    providerPin.addEventListener('change', () => {
      try { localStorage.setItem('keystone.providerPin', providerPin.value); } catch {}
    });

    // Build the pin dropdown dynamically from the providers the running server
    // can actually dispatch to, instead of advertising a hardcoded list and
    // greying the dead ones out. /api/providers/status reports per-provider
    // `available` (from process.env) + the default `model`. We list only the
    // live providers; Auto (the live PCSF-ranked pick) is always present and is
    // the default. Option VALUES stay in the vocabulary dream-chat understands
    // (claude/openai/gemini/grok/ollama/keystone-ft) since they forward via
    // ?provider= and are matched against #provider-select there.
    //
    // catalog: dropdown value → { label, bucket } where bucket is the
    // /api/providers/status key. keystone-ft is the local fine-tune, served
    // through ollama, so it shares the ollama bucket.
    // Local-first: the on-device models lead the list, cloud providers follow.
    const PROVIDER_CATALOG = [
      { value: 'ollama',      label: 'Local Σ₀',    bucket: 'ollama'    },
      { value: 'keystone-ft', label: 'Unisona FT', bucket: 'ollama'    },
      { value: 'claude',      label: 'Claude',      bucket: 'anthropic' },
      { value: 'openai',      label: 'ChatGPT',     bucket: 'openai'    },
      { value: 'gemini',      label: 'Gemini',      bucket: 'gemini'    },
      { value: 'grok',        label: 'Grok',        bucket: 'xai'       },
    ];

    function addPinOption(entry, model) {
      const opt = document.createElement('option');
      opt.value = entry.value;
      opt.textContent = entry.label;
      // Surface the concrete model id on hover (skip the placeholder "auto").
      if (model && model !== 'auto') opt.title = model;
      providerPin.appendChild(opt);
    }

    function restorePin(available, localUp) {
      // saved === null → never chosen (first visit): default to the local model when it's
      //   confirmed up, so queries route on-device first. saved === '' → the user explicitly
      //   picked Auto: respect it. saved === 'x' → an explicit provider: keep it if still live.
      let saved = null;
      try { saved = localStorage.getItem('keystone.providerPin'); } catch {}
      if (saved && available.has(saved)) {
        providerPin.value = saved;                       // explicit, still-live provider
      } else if (saved === null && localUp && available.has('ollama')) {
        providerPin.value = 'ollama';                    // first visit + local up → route local-first
      } else {
        // Auto: an explicit Auto choice, or a previously-pinned provider that's now offline
        // (which would dispatch-fail) — fall back to Auto and clear the stale pin.
        providerPin.value = '';
        if (saved && !available.has(saved)) { try { localStorage.setItem('keystone.providerPin', ''); } catch {} }
      }
    }

    (async function buildProviderPin() {
      let providers = null;
      try {
        const r = await fetch('/api/providers/status', { cache: 'no-store', signal: AbortSignal.timeout(5000) });
        if (r.ok) providers = (await r.json()).providers;
      } catch { /* status unreachable — fall back to the full catalog below */ }

      const available = new Set(['']); // Auto is always available
      for (const entry of PROVIDER_CATALOG) {
        // If status is unreachable we can't tell what's live, so show the whole
        // catalog (better a pin that may fall back than an Auto-only dropdown).
        const p = providers && providers[entry.bucket];
        const isLive = providers ? !!(p && p.available) : true;
        if (!isLive) continue;
        addPinOption(entry, p && p.model);
        available.add(entry.value);
      }
      // Default to local only when status CONFIRMS it's up — not when status was merely
      // unreachable and we optimistically listed the whole catalog (that route could fail).
      const localUp = !!(providers && providers.ollama && providers.ollama.available);
      restorePin(available, localUp);
    })();
  }
  function pinnedProviderQS() {
    const v = providerPin && providerPin.value;
    return v ? '&provider=' + encodeURIComponent(v) : '';
  }

  window.homeChat = function (e) {
    e.preventDefault();
    const q = document.getElementById('home-chat-input').value.trim();
    if (pendingDocx) {
      const reader = new FileReader();
      reader.onload = function () {
        try {
          sessionStorage.setItem('pendingDocx', JSON.stringify({
            name: pendingDocx.name,
            data: reader.result,
            instruction: q || null,
          }));
        } catch { /* storage full — skip, dream-chat will prompt */ }
        window.location.href = '/dream-chat.html?autoprocess=docx';
      };
      reader.readAsDataURL(pendingDocx);
      return;
    }
    if (!q) { document.getElementById('home-chat-input').focus(); return; }
    window.location.href = '/dream-chat.html?q=' + encodeURIComponent(q) + pinnedProviderQS();
  };

  /* Route picked/dropped files: .docx → chip (improve flow on submit),
     everything else (.pdf, images, text, code…) → forward to the chat as an
     attachment so the LLM can read it directly. Mirrors dream-chat.html. */
  function forwardAttach(files) {
    const q = (document.getElementById('home-chat-input').value || '').trim();
    Promise.all(files.map(f => new Promise(res => {
      const r = new FileReader();
      r.onload = () => res({ name: f.name, data: r.result });
      r.onerror = () => res(null);
      r.readAsDataURL(f);
    }))).then(items => {
      try {
        sessionStorage.setItem('pendingAttach', JSON.stringify({ q, files: items.filter(Boolean) }));
      } catch { /* storage full — chat will fall back to its own picker */ }
      const qs = pinnedProviderQS(); // '&provider=…' or ''
      window.location.href = '/dream-chat.html' + (qs ? ('?' + qs.slice(1)) : '');
    });
  }

  function handleHomeFiles(fileList) {
    const files = [...(fileList || [])];
    if (!files.length) return;
    const docx = files.find(f => f.name.toLowerCase().endsWith('.docx'));
    const rest = files.filter(f => !f.name.toLowerCase().endsWith('.docx'));
    if (docx) setDocxChip(docx);
    if (rest.length) forwardAttach(rest);
  }

  /* Suggestion chips → complete prompts go straight to chat; open-ended ones
     (data-q ending in ": ") prefill the bar and focus it for the user to finish. */
  document.querySelectorAll('.home-suggest-chip').forEach((chip) => {
    chip.addEventListener('click', () => {
      const q = chip.dataset.q || '';
      const input = document.getElementById('home-chat-input');
      if (/[:\s]$/.test(q)) {
        input.value = q;
        input.focus();
        return;
      }
      window.location.href = '/dream-chat.html?q=' + encodeURIComponent(q) + pinnedProviderQS();
    });
  });

  /* "+" attach button → native file picker */
  const fileInput = document.getElementById('home-file-input');
  window.homeAttachPick = function () { fileInput.click(); };
  fileInput.addEventListener('change', () => { handleHomeFiles(fileInput.files); fileInput.value = ''; });

  /* Whole-screen drag-and-drop — drop a file anywhere on the page */
  const overlay = document.getElementById('home-drop-overlay');
  let dragDepth = 0;
  document.addEventListener('dragenter', (e) => {
    e.preventDefault();
    if (![...(e.dataTransfer.types || [])].includes('Files')) return;
    if (++dragDepth === 1) overlay.classList.add('active');
  });
  document.addEventListener('dragleave', () => {
    if (--dragDepth <= 0) { dragDepth = 0; overlay.classList.remove('active'); }
  });
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    dragDepth = 0; overlay.classList.remove('active');
    handleHomeFiles(e.dataTransfer.files);
  });
})();
</script>
</body>
