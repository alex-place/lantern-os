<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06b6d4">
  <title>Reset password — unisona.ai</title>
  <script>
    (function(){try{var s=localStorage.getItem('lantern-theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',(s?s==='dark':d)?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
  </script>
  <link rel="stylesheet" href="/css/site.css">
  <style>
    html,body{min-height:100%;} body{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:24px;box-sizing:border-box;}
    .card{width:100%;max-width:400px;border:1px solid var(--border);border-radius:18px;background:var(--surface);padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.28);}
    .card h1{margin:0 0 6px;font-size:20px;color:var(--text);}
    .card p{margin:0 0 18px;font-size:13.5px;color:var(--muted);line-height:1.5;}
    label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
    input{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-size:16px;}
    input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent);}
    button{width:100%;margin-top:16px;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;color:#fff;background:var(--accent);cursor:pointer;}
    button:hover{background:var(--accent-hover);}
    .msg{margin-top:14px;font-size:13px;line-height:1.5;display:none;}
    .msg.err{display:block;color:#f87171;} .msg.ok{display:block;color:var(--accent);}
    a{color:var(--accent);}
  </style>
</head>
<body>
  <div class="card">
    <h1>Set a new password</h1>
    <p>Choose a new password for your unisona.ai account.</p>
    <form id="form" onsubmit="submitReset(event)">
      <label for="pw">New password (min 8 characters)</label>
      <input type="password" id="pw" autocomplete="new-password" minlength="8" required>
      <button type="submit" id="btn">Reset password</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    const msg = document.getElementById('msg');
    if (!token) { msg.className = 'msg err'; msg.textContent = 'Missing or invalid reset link.'; document.getElementById('form').style.display = 'none'; }
    async function submitReset(e){
      e.preventDefault();
      const btn = document.getElementById('btn'); btn.disabled = true; btn.textContent = 'Saving…';
      msg.className = 'msg';
      try{
        const res = await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:document.getElementById('pw').value})});
        const data = await res.json().catch(()=>({}));
        if(res.ok){ msg.className='msg ok'; msg.innerHTML='Password reset. <a href="/auth.html">Sign in →</a>'; document.getElementById('form').style.display='none'; }
        else { const m={invalid_or_expired:'This reset link is invalid or has expired.',weak_password:'Password must be at least 8 characters.'}; msg.className='msg err'; msg.textContent = m[data.error] || 'Could not reset password.'; }
      }catch(_){ msg.className='msg err'; msg.textContent='Network error. Please try again.'; }
      finally{ btn.disabled=false; btn.textContent='Reset password'; }
    }
  </script>
</body>
</html>
