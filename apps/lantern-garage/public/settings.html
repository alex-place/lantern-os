<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="utf-8">
  <meta name="loop-stage" content="act">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06b6d4">
  <script>
    (function () { try { var s = localStorage.getItem('lantern-theme'); var d = window.matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.setAttribute('data-theme', (s ? s === 'dark' : d) ? 'dark' : 'light'); } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); } })();
  </script>
  <link rel="stylesheet" href="/css/site.css">
  <title>Settings — Unisona</title>
  <style>
    /* Match index.html: the rounded brand display face for headings + section labels. */
    :root { --head-font: "Century Gothic", "Franklin Gothic Heavy", "Arial Rounded MT Bold", "Segoe UI Black", "Segoe UI", system-ui, sans-serif; }
    .settings-shell { max-width: 1000px; margin: 0 auto; padding: 24px 16px 64px; display: grid; grid-template-columns: 220px 1fr; gap: 28px; align-items: start; }
    .set-nav { position: sticky; top: 16px; }
    .set-nav h1 { font-family: var(--head-font); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 4px 0 10px 10px; font-weight: 700; }
    .set-nav a { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 9px; color: var(--text); text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer; }
    .set-nav a:hover { background: var(--surface); }
    .set-nav a.active { background: var(--surface); color: var(--accent-strong); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent); }
    .set-nav a svg { width: 17px; height: 17px; flex-shrink: 0; }
    .set-nav .adv { margin-top: 12px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); padding-top: 14px; }
    .panel { display: none; }
    .panel.active { display: block; animation: fade .18s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .panel > h2 { font-family: var(--head-font); font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.01em; }
    .panel > .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 22px; }
    .group-label { font-family: var(--head-font); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 26px 0 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 0; border-bottom: 1px solid var(--border); }
    .row:last-child { border-bottom: none; }
    .row .rl { min-width: 0; }
    .row .rl .k { font-size: 14px; font-weight: 600; }
    .row .rl .v { font-size: 13px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
    .row .rc { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    input.fld, select.fld, textarea.fld { padding: 9px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; min-width: 220px; }
    input.fld:focus, select.fld:focus, textarea.fld:focus { outline: none; border-color: var(--accent); }
    textarea.fld::placeholder { color: var(--muted); }
    .btn { padding: 8px 15px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent-strong); border: none; color: #fff; }
    .btn.primary:hover { background: var(--accent-strong-hover); }
    .btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--border)); }
    .btn.danger:hover { background: color-mix(in srgb, var(--red) 12%, transparent); }
    .btn:disabled { opacity: .5; cursor: default; }
    .avatar-lg { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-dim); color: var(--accent-strong); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
    .seg button { padding: 7px 14px; background: transparent; border: none; color: var(--muted); font-size: 13px; cursor: pointer; }
    .seg button.on { background: var(--accent-dim); color: var(--accent-strong); font-weight: 600; }
    .pill { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; }
    .pill.ok { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
    .tier-badge2 { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 4px 12px; border-radius: 999px; color: var(--accent-strong); background: var(--accent-dim); }
    .plan-card { border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; background: var(--surface); }
    .plan-card .pc-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .plan-card ul { margin: 12px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    table.inv { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    table.inv th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    table.inv td { padding: 10px; border-bottom: 1px solid var(--border); }
    table.inv td.num, table.inv th.num { text-align: right; font-variant-numeric: tabular-nums; }
    table.inv tr:last-child td { border-bottom: none; }
    table.inv a { color: var(--accent-strong); }
    .banner { padding: 10px 14px; border-radius: 9px; font-size: 13px; margin-bottom: 16px; background: color-mix(in srgb, var(--amber) 14%, transparent); border: 1px solid color-mix(in srgb, var(--amber) 40%, var(--border)); color: var(--text); }
    .banner a { color: var(--accent-strong); }
    .muted-note { color: var(--muted); font-size: 12.5px; margin-top: 10px; line-height: 1.6; }
    .loading-panel { color: var(--muted); padding: 30px 0; }
    /* Inline modal (change email / password) */
    .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
    .modal-back.open { display: flex; }
    .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 24px 60px rgba(0,0,0,.4); }
    .modal-box h3 { font-family: var(--head-font); font-size: 18px; margin: 0 0 4px; }
    .modal-box .m-sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
    .modal-box label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 5px; }
    .modal-box input { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; }
    .modal-box input:focus { outline: none; border-color: var(--accent); }
    .modal-box .m-err { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 0; }
    .modal-box .m-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
    @media (max-width: 720px) {
      .settings-shell { grid-template-columns: 1fr; gap: 14px; }
      .set-nav { position: static; }
      .set-nav h1, .set-nav a span { display: none; }
      .set-nav .set-links { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
      .set-nav a { white-space: nowrap; padding: 9px 13px; }
      .set-nav .adv { display: none; }
      .row { flex-wrap: wrap; }
      input.fld, select.fld, textarea.fld { min-width: 0; width: 100%; }
    }
  </style>
</head>

<main class="settings-shell">
  <nav class="set-nav">
    <h1>Settings</h1>
    <div class="set-links">
      <a data-panel="general" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>General</span></a>
      <a data-panel="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Account</span></a>
      <a data-panel="billing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Billing</span></a>
      <a data-panel="connections"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.6 13.4a2 2 0 0 0 2.8 0l3-3a2 2 0 0 0-2.8-2.8l-1 1"/><path d="M13.4 10.6a2 2 0 0 0-2.8 0l-3 3a2 2 0 0 0 2.8 2.8l1-1"/></svg><span>Connections</span></a>
    </div>
  </nav>

  <section class="set-content">
    <div class="panel active" id="p-general"><div class="loading-panel">Loading…</div></div>
    <div class="panel" id="p-account"><div class="loading-panel">Loading…</div></div>
    <div class="panel" id="p-billing"><div class="loading-panel">Loading…</div></div>
    <div class="panel" id="p-connections"><div class="loading-panel">Loading…</div></div>
  </section>
</main>

<div class="modal-back" id="modal-root"></div>

<script src="/js/theme-toggle.js"></script>
<script src="/js/site-chrome.js" defer></script>
<script src="/js/auth-gate.js" defer></script>
<script>
(function () {
  "use strict";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = (id) => document.getElementById(id);
  let profile = null;

  async function api(url, opts) {
    try { const r = await fetch(url, Object.assign({ credentials: "same-origin", cache: "no-store" }, opts || {})); const body = await r.json().catch(() => null); return { ok: r.ok, status: r.status, body }; }
    catch (e) { return { ok: false, status: 0, body: null }; }
  }
  const initials = (n) => (String(n || "").trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("") || "U").toUpperCase();
  const ROLE_PLAN = { guest: "Free", supporter: "Free", deep_dreamer: "Pro", founder: "Pro", pilot: "Pilot", admin: "Pilot" };
  const planName = (role) => ROLE_PLAN[role] || "Free";

  // Reusable inline modal. fields: [{name,label,type?,placeholder?,autocomplete?}].
  // onSubmit(values, close) → return an error string to show, or falsy on success.
  function openModal({ title, sub, fields, submitLabel, onSubmit }) {
    const root = $("modal-root");
    const inputs = fields.map((f) =>
      `<label for="m-${f.name}">${f.label}</label><input id="m-${f.name}" type="${f.type || "text"}"${f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : ""}${f.autocomplete ? ` autocomplete="${f.autocomplete}"` : ""}>`).join("");
    root.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${sub ? `<p class="m-sub">${esc(sub)}</p>` : ""}${inputs}<div class="m-err" id="m-err"></div><div class="m-actions"><button class="btn" id="m-cancel">Cancel</button><button class="btn primary" id="m-submit">${esc(submitLabel)}</button></div></div>`;
    root.classList.add("open");
    const close = () => { root.classList.remove("open"); root.innerHTML = ""; };
    $("m-cancel").onclick = close;
    root.onclick = (e) => { if (e.target === root) close(); };
    const submit = async () => {
      const vals = {}; fields.forEach((f) => { vals[f.name] = ($("m-" + f.name) || {}).value || ""; });
      const btn = $("m-submit"); btn.disabled = true; $("m-err").textContent = "";
      const err = await onSubmit(vals, close);
      btn.disabled = false; if (err) $("m-err").textContent = err;
    };
    $("m-submit").onclick = submit;
    root.querySelectorAll("input").forEach((i) => i.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); }));
    const first = root.querySelector("input"); if (first) first.focus();
  }

  const PANELS = ["general", "account", "billing", "connections"];
  function show(name) {
    if (!PANELS.includes(name)) name = "general";
    document.querySelectorAll(".set-nav a[data-panel]").forEach((a) => a.classList.toggle("active", a.dataset.panel === name));
    PANELS.forEach((p) => $("p-" + p).classList.toggle("active", p === name));
    if (location.hash.slice(1) !== name) history.replaceState(null, "", "#" + name);
  }
  document.querySelectorAll(".set-nav a[data-panel]").forEach((a) => a.addEventListener("click", () => show(a.dataset.panel)));
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));

  async function load() {
    profile = (await api("/api/profiles/me")).body || null;
    renderGeneral(); renderAccount(); renderBilling(); renderConnections();
  }
  function needSignIn(el, what) {
    el.innerHTML = `<h2>${what}</h2><p class="sub">Sign in to manage your ${what.toLowerCase()}.</p><a class="btn primary" href="/auth.html?returnTo=%2Fsettings.html">Sign in</a>`;
  }

  // ── GENERAL ──────────────────────────────────────────────────────────────
  function renderGeneral() {
    const el = $("p-general");
    if (!profile) return needSignIn(el, "General");
    const prefs = profile.preferences || {};
    const theme = localStorage.getItem("lantern-theme") || "system";
    el.innerHTML = `
      <h2>General</h2><p class="sub">Your profile and how the app looks.</p>
      <div class="group-label">Profile</div>
      <div class="row"><div class="rl"><div class="k">Avatar</div></div><div class="rc"><div class="avatar-lg">${esc(initials(profile.name))}</div></div></div>
      <div class="row"><div class="rl"><div class="k">Full name</div></div><div class="rc"><input class="fld" id="g-name" value="${esc(profile.name || "")}" maxlength="80"><button class="btn primary" id="g-name-save">Save</button></div></div>
      <div class="row"><div class="rl"><div class="k">What should we call you?</div><div class="v">Used to greet you in chat and the trader.</div></div><div class="rc"><input class="fld" id="g-callme" value="${esc(prefs.displayName || "")}" maxlength="40" placeholder="${esc(profile.name || "Your name")}"><button class="btn primary" id="g-callme-save">Save</button></div></div>
      <div class="row"><div class="rl"><div class="k">What best describes your work?</div><div class="v">Helps tailor examples and defaults.</div></div><div class="rc"><select class="fld" id="g-work">${["", "Trader / investor", "Software developer", "Founder / operator", "Researcher", "Creator", "Student", "Other"].map((o) => `<option ${((prefs.work || "") === o) ? "selected" : ""} value="${esc(o)}">${o || "Select…"}</option>`).join("")}</select></div></div>
      <div class="group-label">Instructions for Unisona</div>
      <div class="row" style="align-items:flex-start"><div class="rl"><div class="k">Custom instructions</div><div class="v">Unisona keeps these in mind across all your chats — tone, format, what you're working on.</div></div><div class="rc" style="flex-direction:column;align-items:stretch;gap:6px;min-width:300px"><textarea class="fld" id="g-instr" rows="4" maxlength="2000" style="min-width:300px;resize:vertical;font-family:inherit;line-height:1.5" placeholder="e.g. I'm a day trader — be concise, lead with the number, and always flag uncertainty.">${esc(prefs.instructions || "")}</textarea><button class="btn primary" id="g-instr-save" style="align-self:flex-end">Save</button></div></div>
      <div class="group-label">Preferences</div>
      <div class="row"><div class="rl"><div class="k">Appearance</div><div class="v">System follows your device setting.</div></div><div class="rc">
        <div class="seg" id="g-theme">
          <button data-t="system" class="${theme === "system" ? "on" : ""}">🖥 System</button>
          <button data-t="light" class="${theme === "light" ? "on" : ""}">☀ Light</button>
          <button data-t="dark" class="${theme === "dark" ? "on" : ""}">🌙 Dark</button>
        </div></div></div>`;
    $("g-name-save").onclick = async (e) => {
      e.target.disabled = true;
      const out = await api("/api/profiles/me", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: $("g-name").value.trim() }) });
      e.target.textContent = out.ok ? "Saved ✓" : "Retry"; e.target.disabled = false;
      if (out.ok) { profile.name = $("g-name").value.trim(); renderAccount(); }
    };
    $("g-callme-save").onclick = async (e) => {
      e.target.disabled = true;
      const merged = Object.assign({}, profile.preferences || {}, { displayName: $("g-callme").value.trim() });
      const out = await api("/api/profiles/me", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ preferences: merged }) });
      e.target.textContent = out.ok ? "Saved ✓" : "Retry"; e.target.disabled = false;
      if (out.ok) profile.preferences = merged;
    };
    $("g-instr-save").onclick = async (e) => {
      e.target.disabled = true;
      const merged = Object.assign({}, profile.preferences || {}, { instructions: $("g-instr").value.slice(0, 2000) });
      const out = await api("/api/profiles/me", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ preferences: merged }) });
      e.target.textContent = out.ok ? "Saved ✓" : "Retry"; e.target.disabled = false;
      if (out.ok) profile.preferences = merged;
    };
    $("g-work").onchange = async () => {
      const merged = Object.assign({}, profile.preferences || {}, { work: $("g-work").value });
      const out = await api("/api/profiles/me", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ preferences: merged }) });
      if (out.ok) profile.preferences = merged;
    };
    $("g-theme").querySelectorAll("button").forEach((b) => b.onclick = () => {
      const t = b.dataset.t;
      if (t === "system") { localStorage.removeItem("lantern-theme"); const d = window.matchMedia("(prefers-color-scheme: dark)").matches; document.documentElement.setAttribute("data-theme", d ? "dark" : "light"); }
      else { localStorage.setItem("lantern-theme", t); document.documentElement.setAttribute("data-theme", t); }
      $("g-theme").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x.dataset.t === t));
    });
  }

  // ── ACCOUNT ──────────────────────────────────────────────────────────────
  const PROV = { google: { label: "Google", emoji: "🇬" }, local: { label: "Email + password", emoji: "🔑" } };
  function renderAccount() {
    const el = $("p-account");
    if (!profile) return needSignIn(el, "Account");
    const verified = profile.emailVerified === true, hasPw = profile.hasPassword !== false;
    const pending = profile.pendingEmail || null;
    const ids = new Set((profile.identities || []).map((i) => i.provider));
    if (profile.provider) ids.add(profile.provider);
    const banner = (!verified && profile.email) || pending
      ? `<div class="banner">${pending ? `Confirm <strong>${esc(pending)}</strong> to finish changing your email. ` : `Please confirm your email <strong>${esc(profile.email || "")}</strong>. `}<a href="#" id="a-resend">Resend link</a></div>` : "";
    const provRows = Object.keys(PROV).map((p) => {
      const on = ids.has(p);
      return `<div class="row"><div class="rl"><div class="k">${PROV[p].emoji} ${PROV[p].label}</div></div><div class="rc">${on ? `<span class="pill ok">Connected</span>` : `<button class="btn" data-connect="${p}">Connect</button>`}</div></div>`;
    }).join("");
    el.innerHTML = `
      <h2>Account</h2><p class="sub">Your sign-in, email and password.</p>${banner}
      <div class="group-label">Identity</div>
      <div class="row"><div class="rl"><div class="k">Email address</div><div class="v">${esc(profile.email || "—")} ${verified ? '<span class="pill ok">verified</span>' : ""}</div></div><div class="rc"><button class="btn" id="a-email">Change</button></div></div>
      <div class="row"><div class="rl"><div class="k">Password</div><div class="v">${hasPw ? "••••••••" : "No password set"}</div></div><div class="rc"><button class="btn" id="a-pw">${hasPw ? "Change" : "Set password"}</button></div></div>
      <div class="row"><div class="rl"><div class="k">Account ID</div><div class="v">${esc(profile.id || "—")}</div></div></div>
      ${(profile.metadata && profile.metadata.createdAt) ? `<div class="row"><div class="rl"><div class="k">Member since</div><div class="v">${esc(new Date(profile.metadata.createdAt).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }))}</div></div></div>` : ""}
      <div class="group-label">Sign-in methods</div>${provRows}
      <div class="group-label">Session</div>
      <div class="row"><div class="rl"><div class="k">Sign out</div><div class="v">End your session on this device.</div></div><div class="rc"><button class="btn" id="a-logout">Sign out</button></div></div>
      <div class="row"><div class="rl"><div class="k" style="color:var(--red)">Delete account</div><div class="v">Permanently remove your account and data.</div></div><div class="rc"><button class="btn danger" id="a-delete">Delete…</button></div></div>`;
    const r = $("a-resend"); if (r) r.onclick = async (e) => { e.preventDefault(); await api("/api/profiles/me/resend-verification", { method: "POST" }); e.target.textContent = "Sent ✓"; };
    $("a-email").onclick = () => openModal({
      title: "Change email", sub: "We'll email a confirmation link to the new address — the change applies once you click it.",
      fields: [{ name: "email", label: "New email address", type: "email", placeholder: "you@example.com", autocomplete: "email" }],
      submitLabel: "Send confirmation",
      onSubmit: async ({ email }, close) => {
        if (!email.trim()) return "Enter an email address.";
        const o = await api("/api/profiles/me/change-email", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: email.trim() }) });
        if (!o.ok) return (o.body && (o.body.error || o.body.message)) || "Could not change email.";
        close(); alert("Check your inbox to confirm the change.");
      },
    });
    $("a-pw").onclick = () => openModal({
      // Verified change: if the account has a password, the server requires the CURRENT
      // one to match before setting a new one (OAuth-only accounts just set one).
      title: hasPw ? "Change password" : "Set a password",
      sub: hasPw ? "Enter your current password, then choose a new one." : "Set a password so you can also sign in with email.",
      fields: (hasPw ? [{ name: "current", label: "Current password", type: "password", autocomplete: "current-password" }] : [])
        .concat([{ name: "next", label: "New password (at least 8 characters)", type: "password", autocomplete: "new-password" }]),
      submitLabel: hasPw ? "Update password" : "Set password",
      onSubmit: async (v, close) => {
        if (!v.next || v.next.length < 8) return "Pick a password of at least 8 characters.";
        const body = hasPw ? { currentPassword: v.current, newPassword: v.next } : { newPassword: v.next };
        const o = await api("/api/profiles/me/change-password", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        if (!o.ok) { const e = o.body && (o.body.error || o.body.message); return ({ wrong_password: "That current password is incorrect.", weak_password: "Pick a longer password (at least 8 characters)." })[e] || e || "Could not update your password."; }
        close(); alert("Password updated.");
      },
    });
    el.querySelectorAll("[data-connect]").forEach((b) => b.onclick = () => { location.href = `/api/auth/${b.dataset.connect}/start?returnTo=${encodeURIComponent("/settings.html#account")}`; });
    $("a-logout").onclick = async () => { await api("/api/auth/logout", { method: "POST" }); location.href = "/"; };
    $("a-delete").onclick = () => {
      // Two-step confirm for an irreversible action (there is no self-serve delete
      // endpoint yet — deletion is done by support, so route there after confirming).
      if (!confirm("Delete your account permanently? This removes your profile and data and cannot be undone.")) return;
      const typed = prompt('This is permanent. Type DELETE to confirm:');
      if ((typed || "").trim().toUpperCase() !== "DELETE") return;
      alert("Thanks — account deletion is handled by support so nothing is removed by mistake. Email founder@lantern-os.net from this address and we'll delete it right away.");
    };
  }

  // ── BILLING ──────────────────────────────────────────────────────────────
  async function renderBilling() {
    const el = $("p-billing");
    if (!profile) return needSignIn(el, "Billing");
    const plan = planName(profile.role);
    const paid = plan === "Pro" || plan === "Pilot";
    const FEATURES = {
      Free: ["Memory-backed chat", "Personalized charts + watchlist", "Paper-trading contest", "Live demo account"],
      Pro: ["Everything in Free", "Real-money trading (your broker)", "Creator Suite (video → shorts)", "Wide multi-model research + persistent memory"],
      Pilot: ["Everything in Pro", "Autonomous AI trader", "1:1 operator review", "Priority support"],
    };
    const PRICE = { Pro: "$20/mo", Pilot: "$200/mo" };
    const BLURB = { Pro: "Real-money trading, the creator suite, and wide multi-model research.", Pilot: "Everything in Pro plus the hands-free autonomous AI trader." };
    const UPGRADES = ({ Free: ["Pro", "Pilot"], Pro: ["Pilot"], Pilot: [] })[plan] || [];
    const upsell = UPGRADES.map((t) =>
      `<div class="row"><div class="rl"><div class="k">Upgrade to ${t} · <span style="color:var(--muted);font-weight:600">${PRICE[t]}</span></div><div class="v">${BLURB[t]}</div></div><div class="rc"><button class="btn primary" data-buy="${t.toLowerCase()}">Upgrade to ${t}</button></div></div>`).join("");
    el.innerHTML = `
      <h2>Billing</h2><p class="sub">${paid ? "Your plan and subscription." : "You're on the Free plan — upgrade any time."}</p>
      <div class="plan-card">
        <div class="pc-head"><div><div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700">Current plan</div><div style="font-size:22px;font-weight:800;margin-top:2px">${plan} <span style="font-size:14px;font-weight:600;color:var(--muted)">· ${({ Free: "Free", Pro: "$20/mo", Pilot: "$200/mo" })[plan] || "Free"}</span></div></div><span class="tier-badge2">${esc(plan)}</span></div>
        <ul>${(FEATURES[plan] || []).map((f) => `<li>${esc(f)}</li>`).join("")}</ul>
      </div>
      ${upsell ? `<div class="group-label">${plan === "Free" ? "Upgrade" : "Go further"}</div>${upsell}
        <div class="row"><div class="rl"><div class="k">Compare all plans</div><div class="v">See everything each plan includes, side by side.</div></div><div class="rc"><a class="btn" href="/pricing.html">Pricing →</a></div></div>` : ""}
      ${paid ? `
        <div class="group-label">Payment</div>
        <div class="row"><div class="rl"><div class="k">Payment method</div><div class="v" id="b-card">Loading…</div></div><div class="rc"><button class="btn" id="b-update">Update</button></div></div>
        <div class="group-label">Invoices</div>
        <div id="b-invoices" class="muted-note" style="margin-top:0">Loading…</div>
        <div class="group-label" style="color:var(--red)">Cancellation</div>
        <div class="row"><div class="rl"><div class="k">Cancel plan</div><div class="v">You keep access until the end of the current billing period.</div></div><div class="rc"><button class="btn danger" id="b-cancel">Cancel</button></div></div>` : ""}
      <p class="muted-note">Payments are handled securely by Stripe — card details go straight to Stripe, we never see or store them. The Free plan needs no billing.</p>`;
    // Inline checkout: buy right here. On any snag (billing not configured, tier has
    // no live price, etc.) fall through to the full pricing page which handles those
    // states; an existing subscription opens the Stripe portal to change plan.
    el.querySelectorAll("[data-buy]").forEach((b) => b.onclick = async () => {
      b.disabled = true; b.textContent = "Redirecting…";
      const o = await api("/api/billing/checkout", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ tier: b.dataset.buy }) });
      if (o.status === 200 && o.body && o.body.url) { location.href = o.body.url; return; }
      if (o.status === 409 && o.body && o.body.error === "already_subscribed") {
        const p = await api("/api/billing/portal", { method: "POST" });
        if (p.body && p.body.url) { location.href = p.body.url; return; }
      }
      location.href = "/pricing.html";
    });
    if (paid) {
      // Editing the card stays in the Stripe portal (PCI — we never collect card fields).
      const upd = $("b-update"); if (upd) upd.onclick = async () => { const o = await api("/api/billing/portal", { method: "POST" }); if (o.body && o.body.url) location.href = o.body.url; else alert("Updating your card opens the Stripe portal — no active subscription was found."); };
      const cancel = $("b-cancel"); if (cancel) cancel.onclick = async () => {
        if (!confirm("Cancel your subscription? You keep access until the end of the current billing period, then drop to Free.")) return;
        cancel.disabled = true;
        const o = await api("/api/billing/cancel", { method: "POST" });
        if (o.ok) { alert("Done — your plan ends at the close of the current period. You keep access until then."); load(); }
        else { alert((o.body && (o.body.error || o.body.detail)) || "Could not cancel here — try Update → Stripe portal."); cancel.disabled = false; }
      };
      // Fill card + invoices (async; both gracefully handle billing-not-configured).
      const [pm, inv] = await Promise.all([api("/api/billing/payment-method"), api("/api/billing/invoices")]);
      const cardEl = $("b-card");
      if (cardEl) { const c = pm.body && pm.body.card; cardEl.innerHTML = c ? `${esc(String(c.brand || "card").toUpperCase())} •••• ${esc(c.last4 || "")}${c.exp_month ? ` · exp ${c.exp_month}/${String(c.exp_year).slice(-2)}` : ""}` : (pm.status === 503 ? "Billing not configured" : "No card on file"); }
      const invEl = $("b-invoices");
      if (invEl) {
        const rows = (inv.body && inv.body.invoices) || [];
        invEl.innerHTML = rows.length
          ? `<table class="inv"><thead><tr><th>Date</th><th class="num">Total</th><th>Status</th><th></th></tr></thead><tbody>${rows.map((i) => `<tr><td>${i.date ? new Date(i.date).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "—"}</td><td class="num">$${Number(i.total || 0).toFixed(2)}</td><td>${esc(i.status || "")}</td><td>${i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">View</a>` : ""}</td></tr>`).join("")}</tbody></table>`
          : (inv.status === 503 ? "Billing not configured." : "No invoices yet.");
      }
    }
  }

  // ── CONNECTIONS (brokers + AI keys + connectors + invite) ─────────────────
  const BYOK = [
    { id: "anthropic", label: "✦ Claude (Anthropic)" },
    { id: "openai", label: "◯ ChatGPT (OpenAI)" },
    { id: "gemini", label: "✧ Gemini (Google)" },
  ];
  async function renderConnections() {
    const el = $("p-connections");
    if (!profile) return needSignIn(el, "Connections");
    el.innerHTML = `<h2>Connections</h2><p class="sub">Brokers, your own AI keys, connectors and your invite link.</p><div class="loading-panel">Checking connections…</div>`;
    const [ib, al, ref, keys, indeed, pref] = await Promise.all([
      api("/api/trading/ibkr/connection"), api("/api/broker/alpaca/status"), api("/api/referral/link"),
      api("/api/providers/set-key"), api("/api/job/indeed/status"), api("/api/broker/preference"),
    ]);
    const ibLive = ib.body && ib.body.live && ib.body.live.connected;
    const ibCreds = ib.body && ib.body.hasCredentials;
    const alConn = al.body && (al.body.connected || al.body.status === "connected");
    const refUrl = ref.body && (ref.body.url || ref.body.link);
    const keyStatus = {}; ((keys.body && keys.body.keys) || []).forEach((k) => { keyStatus[k.provider || k.id] = k.set || k.configured || k.hasKey; });
    const indeedOn = indeed.body && (indeed.body.connected || indeed.body.status === "connected");

    // Which connected broker executes this user's trades. The switch only makes sense
    // once a broker is linked; the store may say 'alpaca'/'ibkr'/'auto' (or null=auto).
    const prefBody = pref.body || {};
    const prefConn = prefBody.connected || { alpaca: alConn, ibkr: ibLive };
    const anyBroker = !!(prefConn.alpaca || prefConn.ibkr);
    const curPref = (prefBody.preference === "alpaca" || prefBody.preference === "ibkr") ? prefBody.preference : "auto";
    const effText = (effective, chosen) => {
      const lbl = effective === "alpaca" ? "⚡ Alpaca" : effective === "ibkr" ? "🔗 IBKR" : null;
      return lbl ? `${lbl} executes your trades now${chosen === "auto" ? " (Auto → server default)" : ""}.` : "Pick which connected broker routes your trades.";
    };
    const switchRow = anyBroker ? `
      <div class="row"><div class="rl"><div class="k">Active broker</div><div class="v" id="c-broker-eff">${effText(prefBody.effective, curPref)}</div></div><div class="rc">
        <div class="seg" id="c-broker-pref">
          <button data-b="auto" class="${curPref === "auto" ? "on" : ""}" title="Follow the server default">Auto</button>
          <button data-b="alpaca" class="${curPref === "alpaca" ? "on" : ""}"${prefConn.alpaca ? "" : " disabled title='Connect Alpaca first'"}>⚡ Alpaca</button>
          <button data-b="ibkr" class="${curPref === "ibkr" ? "on" : ""}"${prefConn.ibkr ? "" : " disabled title='Connect IBKR first'"}>🔗 IBKR</button>
        </div></div></div>` : "";

    const brokerRows = `
      <div class="group-label">Brokerage</div>
      <div class="row"><div class="rl"><div class="k">🔗 Interactive Brokers</div><div class="v">${ibLive ? `Connected · ${esc((ib.body.live && ib.body.live.accountId) || "")}` : ibCreds ? "Saved, not connected" : "Route real-money trades to your own IBKR account."}</div></div><div class="rc">${ibLive ? '<span class="pill ok">Connected</span>' : `<a class="btn" href="/orchestration.html#broker">${ibCreds ? "Reconnect" : "Connect"}</a>`}</div></div>
      <div class="row"><div class="rl"><div class="k">⚡ Alpaca</div><div class="v">${alConn ? "Connected — paper trading" : "One-click paper-trading account."}</div></div><div class="rc">${alConn ? `<button class="btn" id="c-al-off">Disconnect</button>` : `<button class="btn" id="c-al-on">Connect</button>`}</div></div>${switchRow}`;

    const keyRows = `
      <div class="group-label">Your AI keys (bring-your-own)</div>
      ${BYOK.map((p) => { const on = !!keyStatus[p.id]; return `<div class="row"><div class="rl"><div class="k">${p.label}</div><div class="v">${on ? "Key saved — encrypted on the server" : "Use your own API key for this provider."}</div></div><div class="rc">${on ? `<span class="pill ok">Set</span> <button class="btn" data-key-clear="${p.id}">Remove</button>` : `<button class="btn" data-key-set="${p.id}">Add key</button>`}</div></div>`; }).join("")}`;

    const connectorRows = `
      <div class="group-label">Connectors</div>
      <div class="row"><div class="rl"><div class="k">💼 Indeed</div><div class="v">${indeedOn ? "Connected — the assistant can search Indeed for you." : "Let the assistant search Indeed jobs on your behalf."}</div></div><div class="rc">${indeedOn ? `<button class="btn" id="c-indeed-off">Disconnect</button>` : `<button class="btn" id="c-indeed-on">Connect</button>`}</div></div>`;

    const inviteRows = `
      <div class="group-label">Invite</div>
      <div class="row"><div class="rl"><div class="k">Your referral link</div><div class="v">${refUrl ? esc(refUrl) : "Generated once you can refer friends."}</div></div><div class="rc">${refUrl ? `<button class="btn" id="c-copy">Copy</button>` : ""}</div></div>`;

    el.innerHTML = `<h2>Connections</h2><p class="sub">Brokers, your own AI keys, connectors and your invite link.</p>${brokerRows}${keyRows}${connectorRows}${inviteRows}
      <p class="muted-note">Everything here is stored encrypted on the server and never leaves it. Your AI keys let the app run on your own provider quota; brokerage credentials stay server-side (Alpaca paper-only, IBKR paper or live).</p>`;

    const on = $("c-al-on"); if (on) on.onclick = async () => { const o = await api("/api/broker/alpaca/connect", { method: "POST" }); if (o.body && o.body.url) location.href = o.body.url; else renderConnections(); };
    const off = $("c-al-off"); if (off) off.onclick = async () => { await api("/api/broker/alpaca/disconnect", { method: "POST" }); renderConnections(); };
    // Active-broker switch: POST the choice and update the row IN PLACE (highlight +
    // "executes now" from the server's resolved `effective`) — no full-panel re-render,
    // so the page doesn't flash/scroll-jump on every switch.
    const prefSeg = $("c-broker-pref"); if (prefSeg) prefSeg.querySelectorAll("button[data-b]").forEach((b) => b.onclick = async () => {
      if (b.disabled || b.classList.contains("on")) return;
      const btns = [...prefSeg.querySelectorAll("button")];
      btns.forEach((x) => x.disabled = true);
      const o = await api("/api/broker/preference", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ broker: b.dataset.b }) });
      // Re-enable (respect which brokers are actually connected), then reflect the result.
      btns.forEach((x) => { x.disabled = (x.dataset.b === "alpaca" && !prefConn.alpaca) || (x.dataset.b === "ibkr" && !prefConn.ibkr); });
      if (!o.ok) { alert("Couldn't switch broker — try again."); return; }
      const chosen = (o.body && o.body.preference) || b.dataset.b;
      btns.forEach((x) => x.classList.toggle("on", x.dataset.b === chosen));
      const effEl = $("c-broker-eff"); if (effEl) effEl.textContent = effText(o.body && o.body.effective, chosen);
    });
    el.querySelectorAll("[data-key-set]").forEach((b) => b.onclick = async () => {
      const id = b.dataset.keySet; const v = prompt(`Paste your ${id} API key:`); if (!v) return;
      const o = await api("/api/providers/set-key", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ provider: id, key: v.trim() }) });
      if (!o.ok) alert((o.body && (o.body.error || o.body.detail)) || "Could not save key."); renderConnections();
    });
    el.querySelectorAll("[data-key-clear]").forEach((b) => b.onclick = async () => {
      if (!confirm("Remove this API key?")) return;
      await api("/api/providers/set-key", { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ provider: b.dataset.keyClear }) }); renderConnections();
    });
    const ion = $("c-indeed-on"); if (ion) ion.onclick = async () => { const o = await api("/api/job/indeed/connect", { method: "POST" }); if (o.body && o.body.url) location.href = o.body.url; else renderConnections(); };
    const ioff = $("c-indeed-off"); if (ioff) ioff.onclick = async () => { await api("/api/job/indeed/disconnect", { method: "POST" }); renderConnections(); };
    const cp = $("c-copy"); if (cp) cp.onclick = () => { navigator.clipboard.writeText(refUrl).then(() => { cp.textContent = "Copied ✓"; }); };
  }

  load().then(() => show(location.hash.slice(1) || "general"));
})();
</script>
</html>
