<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="utf-8">
  <meta name="loop-stage" content="act">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06b6d4">
  <script>
    (function () { try { var s = localStorage.getItem('lantern-theme'); var d = window.matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.setAttribute('data-theme', (s ? s === 'dark' : d) ? 'dark' : 'light'); } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); } })();
  </script>
  <link rel="stylesheet" href="/css/site.css">
  <title>Settings — Unisona</title>
  <style>
    .settings-shell { max-width: 1000px; margin: 0 auto; padding: 24px 16px 64px; display: grid; grid-template-columns: 220px 1fr; gap: 28px; align-items: start; }
    .set-nav { position: sticky; top: 16px; }
    .set-nav h1 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 4px 0 10px 10px; font-weight: 700; }
    .set-nav a { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 9px; color: var(--text); text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer; }
    .set-nav a:hover { background: var(--surface); }
    .set-nav a.active { background: var(--surface); color: var(--accent-strong); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent); }
    .set-nav a svg { width: 17px; height: 17px; flex-shrink: 0; }
    .set-nav .adv { margin-top: 12px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); padding-top: 14px; }
    .panel { display: none; }
    .panel.active { display: block; animation: fade .18s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .panel > h2 { font-size: 20px; font-weight: 800; margin: 0 0 4px; letter-spacing: -.01em; }
    .panel > .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 22px; }
    .group-label { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; margin: 26px 0 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 0; border-bottom: 1px solid var(--border); }
    .row:last-child { border-bottom: none; }
    .row .rl { min-width: 0; }
    .row .rl .k { font-size: 14px; font-weight: 600; }
    .row .rl .v { font-size: 13px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
    .row .rc { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    input.fld, select.fld { padding: 9px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; min-width: 220px; }
    input.fld:focus, select.fld:focus { outline: none; border-color: var(--accent); }
    .btn { padding: 8px 15px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent-strong); border: none; color: #fff; }
    .btn.primary:hover { background: var(--accent-strong-hover); }
    .btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--border)); }
    .btn.danger:hover { background: color-mix(in srgb, var(--red) 12%, transparent); }
    .btn:disabled { opacity: .5; cursor: default; }
    .avatar-lg { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-dim); color: var(--accent-strong); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
    .seg button { padding: 7px 14px; background: transparent; border: none; color: var(--muted); font-size: 13px; cursor: pointer; }
    .seg button.on { background: var(--accent-dim); color: var(--accent-strong); font-weight: 600; }
    .pill { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; }
    .pill.ok { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
    .tier-badge2 { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 4px 12px; border-radius: 999px; color: var(--accent-strong); background: var(--accent-dim); }
    .plan-card { border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; background: var(--surface); }
    .plan-card .pc-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .plan-card ul { margin: 12px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .banner { padding: 10px 14px; border-radius: 9px; font-size: 13px; margin-bottom: 16px; background: color-mix(in srgb, var(--amber) 14%, transparent); border: 1px solid color-mix(in srgb, var(--amber) 40%, var(--border)); color: var(--text); }
    .banner a { color: var(--accent-strong); }
    .muted-note { color: var(--muted); font-size: 12.5px; margin-top: 10px; line-height: 1.6; }
    .loading-panel { color: var(--muted); padding: 30px 0; }
    @media (max-width: 720px) {
      .settings-shell { grid-template-columns: 1fr; gap: 14px; }
      .set-nav { position: static; }
      .set-nav h1, .set-nav a span { display: none; }
      .set-nav .set-links { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
      .set-nav a { white-space: nowrap; padding: 9px 13px; }
      .set-nav .adv { display: none; }
      .row { flex-wrap: wrap; }
      input.fld, select.fld { min-width: 0; width: 100%; }
    }
  </style>
</head>

<main class="settings-shell">
  <nav class="set-nav">
    <h1>Settings</h1>
    <div class="set-links">
      <a data-panel="general" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>General</span></a>
      <a data-panel="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Account</span></a>
      <a data-panel="billing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Billing</span></a>
      <a data-panel="connections"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.6 13.4a2 2 0 0 0 2.8 0l3-3a2 2 0 0 0-2.8-2.8l-1 1"/><path d="M13.4 10.6a2 2 0 0 0-2.8 0l-3 3a2 2 0 0 0 2.8 2.8l1-1"/></svg><span>Connections</span></a>
    </div>
    <a class="adv" href="/orchestration.html">API keys &amp; connectors →</a>
  </nav>

  <section class="set-content">
    <div class="panel active" id="p-general"><div class="loading-panel">Loading…</div></div>
    <div class="panel" id="p-account"><div class="loading-panel">Loading…</div></div>
    <div class="panel" id="p-billing"><div class="loading-panel">Loading…</div></div>
    <div class="panel" id="p-connections"><div class="loading-panel">Loading…</div></div>
  </section>
</main>

<script src="/js/theme-toggle.js"></script>
<script src="/js/site-chrome.js" defer></script>
<script src="/js/auth-gate.js" defer></script>
<script>
(function () {
  "use strict";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = (id) => document.getElementById(id);
  let profile = null;

  async function api(url, opts) {
    try { const r = await fetch(url, Object.assign({ credentials: "same-origin", cache: "no-store" }, opts || {})); const body = await r.json().catch(() => null); return { ok: r.ok, status: r.status, body }; }
    catch (e) { return { ok: false, status: 0, body: null }; }
  }
  const initials = (n) => (String(n || "").trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("") || "U").toUpperCase();
  const ROLE_PLAN = { guest: "Free", supporter: "Free", deep_dreamer: "Pro", founder: "Pro", pilot: "Pilot", admin: "Pilot" };
  const planName = (role) => ROLE_PLAN[role] || "Free";

  const PANELS = ["general", "account", "billing", "connections"];
  function show(name) {
    if (!PANELS.includes(name)) name = "general";
    document.querySelectorAll(".set-nav a[data-panel]").forEach((a) => a.classList.toggle("active", a.dataset.panel === name));
    PANELS.forEach((p) => $("p-" + p).classList.toggle("active", p === name));
    if (location.hash.slice(1) !== name) history.replaceState(null, "", "#" + name);
  }
  document.querySelectorAll(".set-nav a[data-panel]").forEach((a) => a.addEventListener("click", () => show(a.dataset.panel)));
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));

  async function load() {
    profile = (await api("/api/profiles/me")).body || null;
    renderGeneral(); renderAccount(); renderBilling(); renderConnections();
  }
  function needSignIn(el, what) {
    el.innerHTML = `<h2>${what}</h2><p class="sub">Sign in to manage your ${what.toLowerCase()}.</p><a class="btn primary" href="/auth.html?returnTo=%2Fsettings.html">Sign in</a>`;
  }

  // ── GENERAL ──────────────────────────────────────────────────────────────
  function renderGeneral() {
    const el = $("p-general");
    if (!profile) return needSignIn(el, "General");
    const prefs = profile.preferences || {};
    const theme = localStorage.getItem("lantern-theme") || "system";
    el.innerHTML = `
      <h2>General</h2><p class="sub">Your profile and how the app looks.</p>
      <div class="group-label">Profile</div>
      <div class="row"><div class="rl"><div class="k">Avatar</div></div><div class="rc"><div class="avatar-lg">${esc(initials(profile.name))}</div></div></div>
      <div class="row"><div class="rl"><div class="k">Full name</div></div><div class="rc"><input class="fld" id="g-name" value="${esc(profile.name || "")}" maxlength="80"><button class="btn primary" id="g-name-save">Save</button></div></div>
      <div class="row"><div class="rl"><div class="k">What should we call you?</div><div class="v">Used to greet you in chat and the trader.</div></div><div class="rc"><input class="fld" id="g-callme" value="${esc(prefs.displayName || "")}" maxlength="40" placeholder="${esc(profile.name || "Your name")}"><button class="btn primary" id="g-callme-save">Save</button></div></div>
      <div class="group-label">Preferences</div>
      <div class="row"><div class="rl"><div class="k">Appearance</div><div class="v">System follows your device setting.</div></div><div class="rc">
        <div class="seg" id="g-theme">
          <button data-t="system" class="${theme === "system" ? "on" : ""}">🖥 System</button>
          <button data-t="light" class="${theme === "light" ? "on" : ""}">☀ Light</button>
          <button data-t="dark" class="${theme === "dark" ? "on" : ""}">🌙 Dark</button>
        </div></div></div>`;
    $("g-name-save").onclick = async (e) => {
      e.target.disabled = true;
      const out = await api("/api/profiles/me", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: $("g-name").value.trim() }) });
      e.target.textContent = out.ok ? "Saved ✓" : "Retry"; e.target.disabled = false;
      if (out.ok) { profile.name = $("g-name").value.trim(); renderAccount(); }
    };
    $("g-callme-save").onclick = async (e) => {
      e.target.disabled = true;
      const merged = Object.assign({}, profile.preferences || {}, { displayName: $("g-callme").value.trim() });
      const out = await api("/api/profiles/me", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ preferences: merged }) });
      e.target.textContent = out.ok ? "Saved ✓" : "Retry"; e.target.disabled = false;
      if (out.ok) profile.preferences = merged;
    };
    $("g-theme").querySelectorAll("button").forEach((b) => b.onclick = () => {
      const t = b.dataset.t;
      if (t === "system") { localStorage.removeItem("lantern-theme"); const d = window.matchMedia("(prefers-color-scheme: dark)").matches; document.documentElement.setAttribute("data-theme", d ? "dark" : "light"); }
      else { localStorage.setItem("lantern-theme", t); document.documentElement.setAttribute("data-theme", t); }
      $("g-theme").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x.dataset.t === t));
    });
  }

  // ── ACCOUNT ──────────────────────────────────────────────────────────────
  const PROV = { google: { label: "Google", emoji: "🇬" }, local: { label: "Email + password", emoji: "🔑" }, discord: { label: "Discord", emoji: "💬" } };
  function renderAccount() {
    const el = $("p-account");
    if (!profile) return needSignIn(el, "Account");
    const verified = profile.emailVerified === true, hasPw = profile.hasPassword !== false;
    const pending = profile.pendingEmail || null;
    const ids = new Set((profile.identities || []).map((i) => i.provider));
    if (profile.provider) ids.add(profile.provider);
    const banner = (!verified && profile.email) || pending
      ? `<div class="banner">${pending ? `Confirm <strong>${esc(pending)}</strong> to finish changing your email. ` : `Please confirm your email <strong>${esc(profile.email || "")}</strong>. `}<a href="#" id="a-resend">Resend link</a></div>` : "";
    const provRows = Object.keys(PROV).map((p) => {
      const on = ids.has(p);
      return `<div class="row"><div class="rl"><div class="k">${PROV[p].emoji} ${PROV[p].label}</div></div><div class="rc">${on ? `<span class="pill ok">Connected</span>` : `<button class="btn" data-connect="${p}">Connect</button>`}</div></div>`;
    }).join("");
    el.innerHTML = `
      <h2>Account</h2><p class="sub">Your sign-in, email and password.</p>${banner}
      <div class="group-label">Identity</div>
      <div class="row"><div class="rl"><div class="k">Email address</div><div class="v">${esc(profile.email || "—")} ${verified ? '<span class="pill ok">verified</span>' : ""}</div></div><div class="rc"><button class="btn" id="a-email">Change</button></div></div>
      <div class="row"><div class="rl"><div class="k">Password</div><div class="v">${hasPw ? "••••••••" : "No password set"}</div></div><div class="rc"><button class="btn" id="a-pw">${hasPw ? "Change" : "Set password"}</button></div></div>
      <div class="row"><div class="rl"><div class="k">Account ID</div><div class="v">${esc(profile.id || "—")}</div></div></div>
      <div class="group-label">Sign-in methods</div>${provRows}
      <div class="group-label">Session</div>
      <div class="row"><div class="rl"><div class="k">Sign out</div><div class="v">End your session on this device.</div></div><div class="rc"><button class="btn" id="a-logout">Sign out</button></div></div>
      <div class="row"><div class="rl"><div class="k" style="color:var(--red)">Delete account</div><div class="v">Permanently remove your account and data.</div></div><div class="rc"><button class="btn danger" id="a-delete">Delete…</button></div></div>`;
    const r = $("a-resend"); if (r) r.onclick = async (e) => { e.preventDefault(); await api("/api/profiles/me/resend-verification", { method: "POST" }); e.target.textContent = "Sent ✓"; };
    $("a-email").onclick = () => { const v = prompt("New email address:"); if (v) api("/api/profiles/me/change-email", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: v.trim() }) }).then((o) => alert(o.ok ? "Check your inbox to confirm the change." : (o.body && (o.body.error || o.body.message)) || "Could not change email.")); };
    $("a-pw").onclick = () => { const v = prompt("New password (min 8 chars):"); if (v) api("/api/profiles/me/change-password", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ newPassword: v }) }).then((o) => alert(o.ok ? "Password updated." : (o.body && (o.body.error || o.body.message)) || "Could not set password.")); };
    el.querySelectorAll("[data-connect]").forEach((b) => b.onclick = () => { location.href = `/api/auth/${b.dataset.connect}/start?returnTo=${encodeURIComponent("/settings.html#account")}`; });
    $("a-logout").onclick = async () => { await api("/api/auth/logout", { method: "POST" }); location.href = "/"; };
    $("a-delete").onclick = () => { if (confirm("Delete your account permanently? This cannot be undone.")) alert("For your safety, account deletion is handled by support — email founder@lantern-os.net and we'll remove it right away."); };
  }

  // ── BILLING ──────────────────────────────────────────────────────────────
  function renderBilling() {
    const el = $("p-billing");
    if (!profile) return needSignIn(el, "Billing");
    const plan = planName(profile.role);
    const FEATURES = {
      Free: ["Memory-backed chat", "Personalized charts + watchlist", "Paper-trading contest", "Live demo account"],
      Pro: ["Everything in Free", "Real-money trading (your broker)", "Creator Suite (video → shorts)", "Wide multi-model research + persistent memory"],
      Pilot: ["Everything in Pro", "Autonomous AI trader", "1:1 operator review", "Priority support"],
    };
    el.innerHTML = `
      <h2>Billing</h2><p class="sub">Your plan and subscription.</p>
      <div class="plan-card">
        <div class="pc-head"><div><div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700">Current plan</div><div style="font-size:22px;font-weight:800;margin-top:2px">${plan}</div></div><span class="tier-badge2">${esc(plan)}</span></div>
        <ul>${(FEATURES[plan] || []).map((f) => `<li>${esc(f)}</li>`).join("")}</ul>
      </div>
      <div class="group-label">Manage</div>
      ${plan !== "Pilot" ? `<div class="row"><div class="rl"><div class="k">Upgrade</div><div class="v">${plan === "Free" ? "Unlock real-money trading + the creator suite." : "Add the autonomous AI trader."}</div></div><div class="rc"><a class="btn primary" href="/pricing.html">See plans</a></div></div>` : ""}
      <div class="row"><div class="rl"><div class="k">Manage subscription</div><div class="v">Update card, invoices, or cancel — via Stripe.</div></div><div class="rc"><button class="btn" id="b-portal">Open portal</button></div></div>
      <div class="row"><div class="rl"><div class="k">Already subscribed elsewhere?</div><div class="v">Link a Stripe or Patreon subscription to this account.</div></div><div class="rc"><button class="btn" id="b-link">Link subscription</button></div></div>
      <p class="muted-note">Payments are handled by Stripe or Patreon — we never see or store your card. The Free plan needs no billing.</p>`;
    $("b-portal").onclick = async (e) => { e.target.disabled = true; const o = await api("/api/billing/portal", { method: "POST" }); if (o.ok && o.body && o.body.url) location.href = o.body.url; else { alert((o.body && o.body.message) || "No active subscription to manage — upgrade first."); e.target.disabled = false; } };
    $("b-link").onclick = async (e) => { e.target.disabled = true; const o = await api("/api/billing/link", { method: "POST" }); alert(o.ok ? (o.body && o.body.already ? "Already linked." : "Subscription linked — your plan will update shortly.") : (o.body && o.body.message) || "No subscription found for your email."); e.target.disabled = false; if (o.ok) load(); };
  }

  // ── CONNECTIONS ──────────────────────────────────────────────────────────
  async function renderConnections() {
    const el = $("p-connections");
    if (!profile) return needSignIn(el, "Connections");
    el.innerHTML = `<h2>Connections</h2><p class="sub">Link your brokerage and share your invite.</p><div class="loading-panel">Checking connections…</div>`;
    const [ib, al, ref] = await Promise.all([
      api("/api/trading/ibkr/connection"), api("/api/broker/alpaca/status"), api("/api/referral/link"),
    ]);
    const ibLive = ib.body && ib.body.live && ib.body.live.connected;
    const ibCreds = ib.body && ib.body.hasCredentials;
    const alConn = al.body && (al.body.connected || al.body.status === "connected");
    const refUrl = ref.body && (ref.body.url || ref.body.link);
    el.innerHTML = `
      <h2>Connections</h2><p class="sub">Link your brokerage and share your invite.</p>
      <div class="group-label">Brokerage</div>
      <div class="row"><div class="rl"><div class="k">🔗 Interactive Brokers</div><div class="v">${ibLive ? `Connected · ${esc((ib.body.live && ib.body.live.accountId) || "")}` : ibCreds ? "Saved, not connected" : "Route real-money trades to your own IBKR account."}</div></div><div class="rc">${ibLive ? '<span class="pill ok">Connected</span>' : `<a class="btn" href="/orchestration.html#broker">${ibCreds ? "Reconnect" : "Connect"}</a>`}</div></div>
      <div class="row"><div class="rl"><div class="k">⚡ Alpaca</div><div class="v">${alConn ? "Connected — paper trading" : "One-click paper-trading account."}</div></div><div class="rc">${alConn ? `<button class="btn" id="c-al-off">Disconnect</button>` : `<button class="btn" id="c-al-on">Connect</button>`}</div></div>
      <div class="group-label">Invite</div>
      <div class="row"><div class="rl"><div class="k">Your referral link</div><div class="v">${refUrl ? esc(refUrl) : "Generated once you can refer friends."}</div></div><div class="rc">${refUrl ? `<button class="btn" id="c-copy">Copy</button>` : ""}</div></div>
      <p class="muted-note">Brokerage credentials are stored encrypted on the server and never leave it. Alpaca is paper-only; IBKR can be paper or live.</p>`;
    const on = $("c-al-on"); if (on) on.onclick = async () => { const o = await api("/api/broker/alpaca/connect", { method: "POST" }); if (o.body && o.body.url) location.href = o.body.url; else renderConnections(); };
    const off = $("c-al-off"); if (off) off.onclick = async () => { await api("/api/broker/alpaca/disconnect", { method: "POST" }); renderConnections(); };
    const cp = $("c-copy"); if (cp) cp.onclick = () => { navigator.clipboard.writeText(refUrl).then(() => { cp.textContent = "Copied ✓"; }); };
  }

  load().then(() => show(location.hash.slice(1) || "general"));
})();
</script>
