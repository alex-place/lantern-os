<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06b6d4">
  <script>
    /* Theme bootstrap — set before first paint to avoid a flash of the wrong
       theme, and respect the user's saved / system preference (this page used
       to hardcode data-theme="dark", ignoring both). Mirrors index.html. */
    (function() {
      try {
        var stored = localStorage.getItem('lantern-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = stored ? stored === 'dark' : prefersDark;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <title>Profile — unisona.ai</title>
  <link rel="stylesheet" href="/css/site.css">
  <style>
    /* Scrolling, card-based profile shell that matches the index / dream-chat
       look. The previous version forced everything into one non-scrolling
       screen (main{overflow:hidden} + vertical centering + a squeezed 2-column
       grid); on some viewports the content collided — the reported overlap of
       the Account ID and the "Connect multiple providers" note (#2138). This
       lets the page flow and breathe instead. */
    html, body { margin: 0; padding: 0; }
    body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
    main {
      flex: 1;
      width: 100%;
      padding: clamp(24px, 5vh, 48px) 20px clamp(40px, 6vh, 64px);
      box-sizing: border-box;
    }

    .profile-wrap {
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Hero card ── */
    .hero-card {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: clamp(18px, 2.6vh, 26px) clamp(20px, 3vw, 30px);
      background:
        radial-gradient(circle at top left, rgba(6,182,212,.13), transparent 45%),
        radial-gradient(circle at bottom right, rgba(167,139,250,.10), transparent 40%),
        var(--surface);
      display: flex;
      align-items: center;
      gap: 22px;
    }
    @media (max-width: 540px) {
      .hero-card { flex-direction: column; text-align: center; padding: 22px 18px; gap: 14px; }
    }

    .avatar {
      flex-shrink: 0;
      width: 64px; height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #06b6d4, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 700; color: #fff;
      letter-spacing: -.5px;
      border: 3px solid var(--border);
    }

    .hero-info { flex: 1; min-width: 0; }
    .hero-name {
      font-size: 22px; font-weight: 700;
      color: var(--text); margin: 0 0 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hero-email { font-size: 13px; color: var(--muted); margin: 0 0 10px; }

    .tier-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      border: 1px solid;
    }
    .tier-badge.guest    { background: rgba(156,163,175,.15); color: #9ca3af; border-color: rgba(156,163,175,.3); }
    .tier-badge.supporter{ background: rgba(6,182,212,.15);   color: #06b6d4; border-color: rgba(6,182,212,.35); }
    .tier-badge.deep_dreamer,
    .tier-badge.founder  { background: rgba(251,146,60,.15);  color: #fb923c; border-color: rgba(251,146,60,.35); }
    .tier-badge.pilot    { background: rgba(251,191,36,.15);  color: #fbbf24; border-color: rgba(251,191,36,.4); }
    .tier-badge.admin,
    .tier-badge.tech_support { background: rgba(167,139,250,.15); color: #a78bfa; border-color: rgba(167,139,250,.35); }

    .hero-actions {
      display: flex; gap: 10px; margin-top: 14px;
      flex-wrap: wrap;
    }
    @media (max-width: 540px) { .hero-actions { justify-content: center; } }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 10px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      border: 1px solid var(--border); text-decoration: none;
      transition: border-color .15s, background .15s, color .15s;
      background: var(--surface2); color: var(--text);
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: rgba(239,68,68,.1); color: #ef4444; border-color: rgba(239,68,68,.3); }
    .btn-danger:hover { background: rgba(239,68,68,.2); border-color: #ef4444; color: #ef4444; }
    .btn-primary { background: rgba(6,182,212,.15); color: var(--accent); border-color: rgba(6,182,212,.4); }
    .btn-primary:hover { background: rgba(6,182,212,.25); border-color: var(--accent); }

    /* ── Two-column body on wide screens so everything fits without scrolling;
       stacks to one column on narrow/mobile. ── */
    .profile-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }
    .col { display: flex; flex-direction: column; gap: 22px; }
    @media (max-width: 720px) { .profile-cols { grid-template-columns: 1fr; gap: 22px; } }

    /* ── Info grid ── */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 540px) { .info-grid { grid-template-columns: 1fr; } }

    .info-cell {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      background: var(--surface);
    }
    .info-label {
      font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--accent); font-family: 'IBM Plex Mono', monospace;
      margin-bottom: 4px;
    }
    .info-value {
      font-size: 14px; color: var(--text); word-break: break-word;
    }
    .info-value code {
      font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted);
    }

    /* ── Access grid ── */
    .section-title {
      font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }
    .access-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
    }
    .access-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      background: var(--surface);
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
      transition: border-color .15s, background .15s;
    }
    .access-card:hover { border-color: var(--accent); background: var(--surface2); }
    .access-card.locked {
      opacity: .45; cursor: default; pointer-events: none;
    }
    .access-icon { font-size: 20px; flex-shrink: 0; }
    .access-label { font-size: 13px; font-weight: 600; color: var(--text); }
    .access-req   { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* ── Edit modal ── */
    .modal-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.6); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px; max-width: 440px; width: 90%;
    }
    .modal h2 { margin: 0 0 24px; font-size: 18px; }
    .form-error {
      margin-bottom: 16px; padding: 10px 12px; border-radius: 8px;
      background: rgba(220, 38, 38, 0.12);
      border: 1px solid rgba(220, 38, 38, 0.45);
      color: #dc2626; font-size: 13px; line-height: 1.4;
    }
    .form-row { margin-bottom: 16px; }
    .form-row label {
      display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
    }
    .form-row input, .form-row textarea {
      width: 100%; padding: 9px 12px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface2); color: var(--text); font-size: 14px;
      font-family: inherit;
    }
    .form-row textarea { min-height: 80px; resize: vertical; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions .btn { flex: 1; justify-content: center; }

    /* ── Connected accounts ── */
    .link-list { display: flex; flex-direction: column; gap: 7px; }
    .link-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      border: 1px solid var(--border); border-radius: 11px;
      padding: 9px 14px; background: var(--surface);
    }
    .link-row.linked { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
    .link-name { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: var(--text); }
    .link-sub { font-size: 12px; font-weight: 400; color: var(--muted); }
    .link-emoji { font-size: 18px; }
    .link-state { display: flex; align-items: center; gap: 10px; }
    .link-badge {
      font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      padding: 3px 9px; border-radius: 20px;
    }
    .link-btn {
      font-size: 13px; font-weight: 600; cursor: pointer;
      padding: 7px 14px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text);
      transition: border-color .15s, background .15s, color .15s;
    }
    .link-btn.connect { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); color: var(--accent); }
    .link-btn.connect:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .link-btn.unlink:hover { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,.08); }
    .link-hint { font-size: 12px; color: var(--muted); font-style: italic; }
    .link-note { font-size: 11.5px; color: var(--muted); margin: 7px 2px 0; line-height: 1.45; }

    /* ── Verify banner ── */
    .verify-banner {
      display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
      padding: 11px 16px; border-radius: 12px;
      border: 1px solid color-mix(in srgb, #fbbf24 45%, transparent);
      background: color-mix(in srgb, #fbbf24 12%, transparent);
      color: var(--text); font-size: 13px; line-height: 1.4;
    }
    .verify-banner strong { color: var(--text); }

    /* ── Toast ── */
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
      max-width: 90%; padding: 12px 18px; border-radius: 12px; z-index: 200;
      font-size: 14px; font-weight: 600; color: #fff;
      opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast-ok    { background: linear-gradient(135deg, var(--accent), #7c3aed); }
    .toast-error { background: #dc2626; }

    @media (max-width: 540px) {
      .link-row { flex-direction: column; align-items: stretch; gap: 10px; }
      .link-state { justify-content: space-between; }
    }

    .loading { text-align: center; color: var(--muted); padding: 80px 20px; font-size: 14px; }

    .loop-stage-note {
      text-align: center; color: var(--muted); font-size: 12px;
      margin: 4px 0 0; opacity: .8;
    }
    .loop-stage-note strong { color: var(--muted); font-weight: 700; }
  </style>
</head>
<body>

<!-- Header injected by /js/site-chrome.js (the single global header) -->


<main>
  <div class="profile-wrap" id="profile-wrap">
    <div class="loading">Loading profile…</div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span class="footer-brand">
      <span class="dot online" id="status-dot" title="Server status"></span>
      <span class="mandala-icon spin-slow" aria-hidden="true"></span> unisona.ai
    </span>
    <span class="sep">·</span>

</footer>

<!-- Change email modal -->
<div class="modal-backdrop" id="email-modal">
  <div class="modal">
    <h2>Change email</h2>
    <form id="email-form" onsubmit="saveEmail(event)">
      <div id="email-error" class="form-error" role="alert" hidden></div>
      <div class="form-row">
        <label>New email address</label>

      <div class="modal-actions">

        <button type="button" class="btn" onclick="closeModal('email-modal')">Cancel</button>

</div>

<!-- Change password modal -->
<div class="modal-backdrop" id="password-modal">
  <div class="modal">
    <h2 id="password-modal-title">Change password</h2>
    <form id="password-form" onsubmit="savePassword(event)">
      <div id="password-error" class="form-error" role="alert" hidden></div>
      <div class="form-row" id="current-password-row">
        <label>Current password</label>
        <input type="password" id="current-password" autocomplete="current-password">
      </div>
      <div class="form-row">
        <label>New password (min 8 characters)</label>
        <input type="password" id="new-password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">Save password</button>
        <button type="button" class="btn" onclick="closeModal('password-modal')">Cancel</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit modal -->
<div class="modal-backdrop" id="edit-modal">
  <div class="modal">
    <h2>Edit Profile</h2>
    <form id="edit-form" onsubmit="saveProfile(event)">
      <div id="edit-error" class="form-error" role="alert" hidden></div>
      <div class="form-row">
        <label>Display Name</label>
        <input type="text" id="edit-name" maxlength="80" autocomplete="name">
      </div>
      <div class="form-row">
        <label>Bio</label>
        <textarea id="edit-bio" maxlength="400" placeholder="A short intro…"></textarea>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="button" class="btn" onclick="closeEdit()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/theme-toggle.js"></script>
<script>
// Patreon tiers by pledge amount: supporter $5 Member, deep_dreamer $20 Pro,
// pilot $200 Pilot. `founder` kept as a legacy alias for deep_dreamer (#698).
const ROLE_LEVEL = { guest: 0, supporter: 1, deep_dreamer: 2, founder: 2, pilot: 3, tech_support: 4, admin: 5 };

// Tier chip labels. Member ($5) is no longer a sold tier — an existing supporter is
// grandfathered and shown as Free (matches the nav badge + auth.html), keeping a
// distinct chip colour. tech_support/pilot now render properly instead of falling
// back to a 'Free'/locked chip (#2632, #2642).
const TIER_LABELS = {
  guest:        { label: 'Free',              emoji: '🔓' },
  supporter:    { label: 'Free',              emoji: '🌀' }, // legacy Member, grandfathered
  deep_dreamer: { label: 'Pro — $20/mo',      emoji: '✦' },
  founder:      { label: 'Pro — $20/mo',      emoji: '✦' }, // legacy alias (#698)
  pilot:        { label: 'Pilot — $200/mo',   emoji: '🛩️' },
  tech_support: { label: 'Tech Support',      emoji: '🛠️' },
  admin:        { label: 'Admin (staff)',     emoji: '⬡' },
};

// Feature access is role-laddered EXCEPT Trader, which is a per-account
// opt-in entitlement (entitlements.trade), independent of tier — see
// user-profiles.js. A `req` of 'trade' means "check entitlements.trade".
// Feature access is tier-laddered. Trader (manual stocks + Kalshi + AI
// suggestions) unlocks at the $20 Pro tier; the autonomous AI Trader
// unlocks at the $200 Pilot tier.
const FEATURES = [
  { emoji: '📖', label: 'Journal',    href: '/dream-chat.html',      req: 'guest',        note: '' },
  { emoji: '📈', label: 'Trader',     href: '/stock-trader.html',    req: 'deep_dreamer', note: 'Trade stocks & Kalshi + AI suggestions' },
  { emoji: '🤖', label: 'AI Trader',  href: '/stock-trader.html',    req: 'pilot',        note: 'Autonomous AI trading' },
  { emoji: '🔗', label: 'Connect broker', href: '/orchestration.html#broker', req: 'deep_dreamer', note: 'Link Alpaca (one click) or IBKR' },
  { emoji: '✏️', label: 'Create',     href: '/create.html',          req: 'deep_dreamer', note: '' },
  { emoji: '🗺️', label: 'Explore',    href: '/explore.html',         req: 'guest',        note: '' },
  { emoji: '📚', label: 'Knowledge',  href: '/knowledgecenter.html', req: 'guest',        note: '' },
];

// How each provider presents as a sign-in method. Identity is provider-agnostic
// (ADR-0005) — every provider is one identity among many on a single account.
const SOURCE_LABELS = {
  local:   { label: 'Email + password', emoji: '🔑' },
  patreon: { label: 'Patreon',          emoji: '♥' },
  discord: { label: 'Discord',          emoji: '🎮' },
  google:  { label: 'Google',           emoji: 'ᴳ' },
  oauth:   { label: 'OAuth',            emoji: '🔗' },
  dev:     { label: 'Local dev bypass', emoji: '🛠️' },
};

// The OAuth providers a user can connect/disconnect from this page.
const LINKABLE_PROVIDERS = ['discord', 'google', 'patreon'];

let currentProfile = null;
let currentSession = null;

function initials(name) {
  if (!name) return '?';
  return name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
}

function escapeHtml(s) {
  const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML;
}

function fmtDate(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' }); }
  catch { return iso; }
}

function hasAccess(profile, reqRole) {
  if (reqRole === 'trade') {
    return profile.role === 'admin' || !!(profile.entitlements && profile.entitlements.trade);
  }
  return (ROLE_LEVEL[profile.role] || 0) >= (ROLE_LEVEL[reqRole] || 0);
}

function providerMeta(id) {
  return SOURCE_LABELS[id] || { label: id, emoji: '🔗' };
}

// The method the user is CURRENTLY signed in with (this session), not how the
// account was first created (#profile-provider-display).
function currentSignInMethod() {
  const p = currentSession?.provider || currentSession?.user?.provider;
  if (p && p !== 'local-bypass') return providerMeta(p);
  if (p === 'local-bypass') return SOURCE_LABELS.dev;
  return providerMeta(currentProfile?.metadata?.source) || SOURCE_LABELS.local;
}

// All providers connected to this account, derived from identities[] (with a
// legacy fallback to the denormalized *Id mirrors + metadata.source).
function connectedProviders(profile) {
  const set = new Set((profile.identities || []).map((i) => i.provider));
  if (profile.discordId) set.add('discord');
  if (profile.patreonId) set.add('patreon');
  if (!set.size && profile.metadata?.source) set.add(profile.metadata.source);
  return set;
}

function renderProfile(profile) {
  const wrap = document.getElementById('profile-wrap');
  const role = profile.role || 'guest';
  const tier = TIER_LABELS[role] || TIER_LABELS.guest;

  const source = currentSignInMethod();
  const connected = connectedProviders(profile);
  // UX guard only — the server also refuses to remove the last login method.
  const canUnlink = connected.size > 1;

  const hasEmail = !!profile.email;
  const emailVerified = profile.emailVerified === true;
  const pendingEmail = profile.pendingEmail || null;
  const hasPassword = profile.hasPassword !== false; // undefined (legacy) → assume yes

  const verifyBanner = (!emailVerified && hasEmail) || pendingEmail
    ? `<div class="verify-banner">
         <span>${pendingEmail
            ? `Confirm <strong>${escapeHtml(pendingEmail)}</strong> to finish changing your email.`
            : `Please confirm your email <strong>${escapeHtml(profile.email)}</strong>.`}</span>
         <button class="link-btn connect" onclick="resendVerification()">Resend email</button>
       </div>`
    : '';

  const securityRows = `
    <div class="link-row">
      <span class="link-name"><span class="link-emoji">✉️</span> Email address</span>
      <span class="link-state">${emailVerified ? '<span class="link-badge">Verified</span>' : ''}<button class="link-btn connect" onclick="openEmailModal()">Change</button></span>
    </div>
    <div class="link-row">
      <span class="link-name"><span class="link-emoji">🔑</span> Password</span>
      <span class="link-state"><button class="link-btn connect" onclick="openPasswordModal()">${hasPassword ? 'Change' : 'Set password'}</button></span>
    </div>`;

  const connectedRows = LINKABLE_PROVIDERS.map((id) => {
    const meta = providerMeta(id);
    const isLinked = connected.has(id);
    const action = isLinked
      ? (canUnlink
          ? `<button class="link-btn unlink" onclick="disconnectProvider('${id}')">Disconnect</button>`
          : `<span class="link-hint" title="Add another sign-in method first">Only method</span>`)
      : `<button class="link-btn connect" onclick="connectProvider('${id}')">Connect</button>`;
    return `<div class="link-row ${isLinked ? 'linked' : ''}">
        <span class="link-name"><span class="link-emoji">${meta.emoji}</span> ${escapeHtml(meta.label)}</span>
        <span class="link-state">${isLinked ? '<span class="link-badge">Connected</span>' : ''}${action}</span>
      </div>`;
  }).join('');

  const featureCards = FEATURES.map(f => {
    const ok = hasAccess(profile, f.req);
    const reqLabel = f.req !== 'guest' ? `Requires ${TIER_LABELS[f.req]?.label || f.req}` : '';
    return ok
      ? `<a class="access-card" href="${f.href}">
           <span class="access-icon">${f.emoji}</span>
           <div><div class="access-label">${f.label}</div>${f.note ? `<div class="access-req">${escapeHtml(f.note)}</div>` : ''}</div>
         </a>`
      : `<div class="access-card locked" title="${escapeHtml(reqLabel)}">
           <span class="access-icon">${f.emoji}</span>
           <div><div class="access-label">${f.label}</div><div class="access-req">${escapeHtml(f.note ? f.note + ' · ' + reqLabel : reqLabel)}</div></div>
         </div>`;
  }).join('');

  wrap.innerHTML = `

          <a class="btn" href="/">← Home</a>

    <div class="profile-cols">

    <div class="info-grid">

    <div>

}

// ── Billing: Stripe subscription status / link / manage (#2568 follow-up) ──
// Hidden entirely unless the server reports billing configured; then shows either
// "Manage" (live sub, opens the customer portal) or "Link subscription" (claims an
// existing card sub by the account's VERIFIED email via POST /api/billing/link).
const STRIPE_STATUS_LABELS = {
  active: 'active', trialing: 'trial', past_due: 'payment issue — fix in portal',
  incomplete: 'payment issue — fix in portal',
};
async function refreshStripeBilling() {
  const section = document.getElementById('billing-section');
  const sub = document.getElementById('stripe-sub');
  const state = document.getElementById('stripe-state');
  if (!section || !sub || !state) return;
  let cfg = null;
  try { cfg = await (await fetch('/api/billing/config', { credentials: 'include', cache: 'no-store' })).json(); } catch (_e) {}
  if (!cfg || !cfg.configured) { section.hidden = true; return; }
  section.hidden = false;
  const row = state.closest('.link-row');
  if (cfg.subscribed) {
    if (row) row.classList.add('linked');
    sub.textContent = STRIPE_STATUS_LABELS[cfg.stripeStatus] || cfg.stripeStatus || 'active';
    state.innerHTML = '<span class="link-badge">Linked</span><button class="link-btn connect" onclick="openStripePortal()">Manage</button>';
  } else {
    if (row) row.classList.remove('linked');
    sub.textContent = 'not linked';
    state.innerHTML = '<button class="link-btn connect" onclick="linkStripeSubscription(this)">Link subscription</button>'
      + '<a class="link-btn" href="/pricing.html">Plans</a>';
  }
}
async function linkStripeSubscription(btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Looking…'; }
  try {
    const res = await fetch('/api/billing/link', { method: 'POST', credentials: 'include' });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.linked) {
      showToast(data.already ? 'Your card subscription is already linked. ✓' : 'Card subscription linked — your tier is unlocked. ✓', 'ok');
      // Role/tier may have changed — re-pull the profile so the badge + features update.
      try {
        const pr = await fetch('/api/profiles/me', { credentials: 'include' });
        if (pr.ok) { currentProfile = await pr.json(); renderProfile(currentProfile); return; }
      } catch (_) {}
      refreshStripeBilling();
      return;
    }
    if (res.ok && data.linked === false) { showToast('No card subscription found for your verified email.', 'error'); }
    else if (data.error === 'email_unverified') { showToast('Confirm your email first — that\'s how we prove the subscription is yours.', 'error'); }
    else if (data.error === 'customer_already_linked') { showToast('That subscription is already linked to a different account.', 'error'); }
    else if (data.error === 'too_many_attempts') { showToast('Please wait a few seconds and try again.', 'error'); }
    else { showToast('Could not link right now — please try again.', 'error'); }
  } catch (_) {
    showToast('Network error — please try again.', 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Link subscription'; }
  }
}
async function openStripePortal() {
  try {
    const res = await fetch('/api/billing/portal', { method: 'POST', credentials: 'include' });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.url) { location.href = data.url; return; }
    showToast('Could not open the customer portal.', 'error');
  } catch (_) { showToast('Network error — please try again.', 'error'); }
}

// ── Brokerage: Alpaca one-click status/connect/disconnect (ADR-0027) ──
async function refreshAlpacaBroker() {
  const sub = document.getElementById('alpaca-sub');
  const state = document.getElementById('alpaca-state');
  if (!sub || !state) return;
  let s = null;
  try { s = await (await fetch('/api/broker/alpaca/status', { cache: 'no-store' })).json(); } catch (_e) {}
  if (!s) { sub.textContent = 'status unavailable'; state.innerHTML = ''; return; }
  const row = state.closest('.link-row');
  if (s.connected) {
    if (row) row.classList.add('linked');
    const acct = s.accountNumber ? ` · ${s.accountNumber}` : (s.via === 'server-keys' ? ' · shared paper account' : '');
    sub.textContent = `connected (${s.env || 'paper'})${acct}`;
    // A server-keys connection isn't per-user, so it has nothing to disconnect.
    state.innerHTML = '<span class="link-badge">Connected</span>'
      + (s.via === 'server-keys' ? '' : '<button class="link-btn unlink" onclick="disconnectAlpaca()">Disconnect</button>');
  } else if (s.configured === false) {
    if (row) row.classList.remove('linked');
    sub.textContent = 'one-click setup pending';
    state.innerHTML = '<a class="link-btn connect" href="/orchestration.html#broker">Set up</a>';
  } else {
    if (row) row.classList.remove('linked');
    sub.textContent = 'one click · paper by default';
    state.innerHTML = '<a class="link-btn connect" href="/api/broker/alpaca/connect?returnTo=%2Fprofile.html">Connect</a>';
  }
}
async function disconnectAlpaca() {
  try { await fetch('/api/broker/alpaca/disconnect', { method: 'POST' }); } catch (_e) {}
  refreshAlpacaBroker();
}

function showEditError(msg) {
  const el = document.getElementById('edit-error');
  el.textContent = msg;
  el.hidden = false;
}

function clearEditError() {
  const el = document.getElementById('edit-error');
  el.textContent = '';
  el.hidden = true;
}

function openEdit() {
  clearEditError();
  document.getElementById('edit-name').value = currentProfile?.name || '';
  document.getElementById('edit-bio').value  = currentProfile?.bio  || '';
  document.getElementById('edit-modal').classList.add('open');
}

function closeEdit() {
  document.getElementById('edit-modal').classList.remove('open');
}

async function saveProfile(e) {
  e.preventDefault();
  const btn = e.submitter || e.target.querySelector('[type=submit]');
  btn.textContent = 'Saving…'; btn.disabled = true;
  clearEditError();
  try {
    const res = await fetch('/api/profiles/me', {
      method: 'PUT', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('edit-name').value.trim(),
        bio:  document.getElementById('edit-bio').value.trim(),
      }),
    });
    if (!res.ok) {
      let detail = `Save failed (${res.status})`;
      try {
        const body = await res.json();
        if (body && (body.error || body.message)) detail = body.error || body.message;
      } catch { /* non-JSON body; keep status-based message */ }
      throw new Error(detail);
    }
    currentProfile = await res.json();
    closeEdit();
    renderProfile(currentProfile);
  } catch (err) {
    showEditError(err.message || 'Could not save your changes.');
  } finally {
    btn.textContent = 'Save'; btn.disabled = false;
  }
}

async function logout() {
  const res = await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
  if (res.ok) location.href = '/auth.html';
  else alert('Logout failed');
}

// ── Connected accounts: link / unlink ──
function connectProvider(provider) {
  // Kick off OAuth in link mode; the callback attaches the identity to THIS
  // account and returns to /profile.html?linked=<provider>.
  location.href = `/api/auth/${encodeURIComponent(provider)}/start?link=1`;
}

async function disconnectProvider(provider) {
  const meta = providerMeta(provider);
  if (!confirm(`Disconnect ${meta.label} from your account?`)) return;
  try {
    const res = await fetch('/api/profiles/me/unlink', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ provider }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const msg = data.error === 'last_login_method'
        ? "That's your only way to sign in — connect another provider first."
        : (data.error || `Couldn't disconnect (${res.status})`);
      showToast(msg, 'error');
      return;
    }
    currentProfile = data.profile;
    renderProfile(currentProfile);
    showToast(`${meta.label} disconnected.`, 'ok');
  } catch (_) {
    showToast('Network error — please try again.', 'error');
  }
}

let toastTimer = null;
function showToast(msg, kind) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.className = `toast show ${kind === 'error' ? 'toast-error' : 'toast-ok'}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 4000);
}

// Surface the outcome of a link-mode OAuth round-trip (?linked / ?error) and
// clean the URL so a refresh doesn't re-toast.
function surfaceLinkResult() {
  const q = new URLSearchParams(location.search);
  const linked = q.get('linked');
  const error = q.get('error');
  if (linked) showToast(`${providerMeta(linked).label} connected.`, 'ok');
  else if (error === 'identity_in_use') {
    showToast(`That ${providerMeta(q.get('provider')).label} account is already linked to another account.`, 'error');
  } else if (error === 'oauth_failed') {
    showToast("Couldn't connect that provider. Please try again.", 'error');
  }
  if (linked || error) history.replaceState(null, '', '/profile.html');

  // Email-verification outcome (?verify=…) from the verify-email redirect.
  const v = q.get('verify');
  if (v === '1') showToast('Email confirmed. ✓', 'ok');
  else if (v === 'invalid') showToast('That confirmation link is invalid or expired.', 'error');
  else if (v === 'email_taken') showToast('That email is already used by another account.', 'error');
  if (v) history.replaceState(null, '', '/profile.html');
}

// ── Switch account (distinct from Sign out): end this session and go to login. ──
async function switchAccount() {
  await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }).catch(() => {});
  location.href = '/auth.html?returnTo=/profile.html';
}

async function resendVerification() {
  try {
    const res = await fetch('/api/profiles/me/resend-verification', { method: 'POST', credentials: 'include' });
    const data = await res.json().catch(() => ({}));
    if (res.ok) showToast(data.delivery === 'dev'
      ? 'Confirmation link logged to the server console (no SMTP configured yet).'
      : `Confirmation email sent to ${data.sentTo}.`, 'ok');
    else showToast(data.error || "Couldn't send the email.", 'error');
  } catch (_) { showToast('Network error — please try again.', 'error'); }
}

// ── Modal helpers ──
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function openEmailModal() {
  document.getElementById('email-error').hidden = true;
  document.getElementById('new-email').value = '';
  document.getElementById('email-modal').classList.add('open');
}

async function saveEmail(e) {
  e.preventDefault();
  const btn = e.submitter; btn.disabled = true; const prev = btn.textContent; btn.textContent = 'Sending…';
  const errEl = document.getElementById('email-error'); errEl.hidden = true;
  try {
    const res = await fetch('/api/profiles/me/change-email', {
      method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('new-email').value.trim() }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const map = { invalid_email: 'That doesn\'t look like a valid email.', email_taken: 'That email is already in use.' };
      errEl.textContent = map[data.error] || 'Could not change email.'; errEl.hidden = false; return;
    }
    closeModal('email-modal');
    showToast(data.delivery === 'dev'
      ? `Confirmation link for ${data.pending} logged to the server console.`
      : `Confirmation sent to ${data.pending}. Click it to finish.`, 'ok');
    const pr = await fetch('/api/profiles/me', { credentials: 'include' });
    if (pr.ok) { currentProfile = await pr.json(); renderProfile(currentProfile); }
  } catch (_) { errEl.textContent = 'Network error.'; errEl.hidden = false; }
  finally { btn.disabled = false; btn.textContent = prev; }
}

function openPasswordModal() {
  document.getElementById('password-error').hidden = true;
  document.getElementById('current-password').value = '';
  document.getElementById('new-password').value = '';
  const hasPassword = currentProfile?.hasPassword !== false;
  document.getElementById('current-password-row').style.display = hasPassword ? '' : 'none';
  document.getElementById('current-password').required = hasPassword;
  document.getElementById('password-modal-title').textContent = hasPassword ? 'Change password' : 'Set a password';
  document.getElementById('password-modal').classList.add('open');
}

async function savePassword(e) {
  e.preventDefault();
  const btn = e.submitter; btn.disabled = true; const prev = btn.textContent; btn.textContent = 'Saving…';
  const errEl = document.getElementById('password-error'); errEl.hidden = true;
  try {
    const res = await fetch('/api/profiles/me/change-password', {
      method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        currentPassword: document.getElementById('current-password').value,
        newPassword: document.getElementById('new-password').value,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const map = { wrong_password: 'Your current password is incorrect.', weak_password: 'New password must be at least 8 characters.' };
      errEl.textContent = map[data.error] || 'Could not update password.'; errEl.hidden = false; return;
    }
    closeModal('password-modal');
    showToast(data.hadPassword ? 'Password changed.' : 'Password set — you can now sign in with email.', 'ok');
    const pr = await fetch('/api/profiles/me', { credentials: 'include' });
    if (pr.ok) { currentProfile = await pr.json(); renderProfile(currentProfile); }
  } catch (_) { errEl.textContent = 'Network error.'; errEl.hidden = false; }
  finally { btn.disabled = false; btn.textContent = prev; }
}

async function init() {
  try {
    const sr = await fetch('/api/auth/session', { credentials: 'include' });
    const session = sr.ok ? await sr.json() : null;
    if (!session?.authenticated) { location.href = '/auth.html?returnTo=/profile.html'; return; }
    currentSession = session;

    const pr = await fetch('/api/profiles/me', { credentials: 'include' });
    const profile = pr.ok ? await pr.json() : { ...session.user, role: session.role };
    currentProfile = profile;
    renderProfile(profile);
    surfaceLinkResult();
  } catch (err) {
    console.error(err);
    location.href = '/auth.html';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  // Theme toggle lives in the global header (site-chrome.js) with its own
  // onclick; no per-page binding needed here.
  // Backdrop click closes any open modal.
  document.querySelectorAll('.modal-backdrop').forEach(m => {
    m.addEventListener('click', e => { if (e.target === e.currentTarget) m.classList.remove('open'); });
  });
  init();
});
</script>
