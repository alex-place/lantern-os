<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06b6d4">
<script>
  /* Theme bootstrap — set before first paint (shared with home + chat) */
  (function(){
    try{
      var stored=localStorage.getItem('lantern-theme');
      /* Trading terminal defaults to the dark phosphor (green-on-black RobCo) look
         unless the user explicitly chose light. */
      document.documentElement.setAttribute('data-theme',(stored?stored==='dark':true)?'dark':'light');
    }catch(e){ document.documentElement.setAttribute('data-theme','dark'); }
    /* Pip-Boy / phosphor terminal skin (shared with dream-chat). This IS the
       terminal's native look — default ON here unless the user toggled it off. */
    try{
      if(localStorage.getItem('keystone-skin')!=='default') document.documentElement.setAttribute('data-skin','terminal');
    }catch(e){ document.documentElement.setAttribute('data-skin','terminal'); }
  })();
</script>
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/css/dream-chat-terminal.css?v=20260630-terminal"><!-- RobCo/Pip-Boy phosphor skin (data-skin=terminal); ?v matches dream-chat.html so the shared CSS caches once (#2496) -->
<link rel="stylesheet" href="/vendor/fonts/fonts.css"><!-- #861: vendored local-first (was Google Fonts CDN) -->
<title>Kalshi Terminal — unisona.ai</title>
<style>
/* Canonical site.css tokens — NO palette override, so this page matches home + chat
   in both themes and stays WCAG-AA (metadata uses --muted, never --accent-dim as text). */
/* Pip-Boy phosphor palette — pinned with enough specificity to win over site.css's
   :root[data-theme] tokens, so the terminal is green-on-black in dark and mint in light. */
html[data-skin="terminal"][data-theme="dark"]{
  --bg:#050e08;--surface:#08140d;--surface2:#0c1f14;--border:#14301f;
  --text:#cdefd8;--muted:#6fbf90;--accent:#2bff88;--accent-hover:#57ffa3;--accent-dim:#0f2a1b;
}
html[data-skin="terminal"][data-theme="light"]{
  --bg:#dfece1;--surface:#e9f3ea;--surface2:#d6e8da;--border:#a9c6b4;
  --text:#0f3524;--muted:#33604a;--accent:#0e6b3b;--accent-hover:#0b5730;--accent-dim:#c3ddca;
}
html,body{height:100%;background:var(--bg);color:var(--text)}
body{min-height:100vh;overflow:hidden;display:flex;flex-direction:column}
.site-nav{flex-shrink:0}


/* ── card stage ──────────────────────────────────────────── */
.deck{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  position:relative;padding:10px 16px 16px;min-height:0}
.stage{position:relative;width:min(440px,94vw);height:min(460px,52vh)}

.card{position:absolute;inset:0;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;
  box-shadow:var(--shadow);will-change:transform;touch-action:none;cursor:grab;user-select:none;overflow:hidden}
.card.front{box-shadow:var(--shadow-hover);z-index:2;border-color:#3a4355}
.card.peek{transform:scale(.94) translateY(18px);filter:brightness(.65);z-index:1;pointer-events:none}
.card.peek2{transform:scale(.88) translateY(36px);filter:brightness(.45);z-index:0;pointer-events:none}
.card.exit{border-color:var(--danger)}

/* card content */
.card-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-bottom:4px;gap:8px}
.card-klass{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.card-klass.position{color:var(--accent)}.card-klass.exit{color:var(--danger)}.card-klass.engine,.card-klass.suggestion{color:var(--gold)}.card-klass.crypto{color:var(--green)}.card-klass.convergence{color:var(--green);font-size:11px}
.countdown{font-weight:600;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px}
.countdown.soon{color:var(--gold)}.countdown.now{color:var(--danger)}
/* uniform real-time generation-age chip — same on every card kind */
.gen-age{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;font-weight:600;
  color:var(--green);letter-spacing:.04em;padding:1px 6px;border:1px solid var(--green);
  border-radius:999px;background:rgba(0,212,170,.06);white-space:nowrap}

.card-q{font-size:16px;font-weight:600;line-height:1.35;margin:6px 0 8px;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}

/* favorable hero */
.fav{border-radius:8px;padding:9px 11px;margin:6px 0 8px;border:1px solid var(--border);background:var(--bg)}
.fav.yes{border-color:var(--green);background:rgba(0,212,170,.04)}.fav.no{border-color:var(--danger);background:rgba(255,95,109,.04)}
.fav-tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fav-act{font-size:19px;font-weight:800;margin:4px 0 3px;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fav.yes .fav-act{color:var(--green)}.fav.no .fav-act{color:var(--danger)}
.fav-px{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',ui-monospace,monospace}
.conv-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.conv-bar{flex:1;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.conv-fill{height:100%;border-radius:2px}
.conv-num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;color:var(--muted);min-width:54px;text-align:right}
.reason{font-size:11px;color:var(--muted);margin-top:6px;min-height:13px;font-family:'IBM Plex Mono',ui-monospace,monospace}

/* exit ribbon */
.ribbon{font-size:11px;padding:5px 10px;border-radius:7px;background:rgba(239,68,68,.1);
  border:1px solid var(--danger);color:var(--danger);margin-bottom:8px;font-weight:600;letter-spacing:.04em}
.ribbon.profit{background:rgba(52,211,153,.08);border-color:var(--green);color:var(--green)}

/* market meta strip */
.card-meta{display:flex;gap:10px;align-items:center;padding:5px 0 3px;font-size:11px;
  color:var(--muted);font-family:'IBM Plex Mono',ui-monospace,monospace;border-top:1px solid var(--border);margin-top:auto}
.card-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta .meta-badge{padding:1px 6px;border-radius:4px;border:1px solid var(--border);background:var(--surface);font-size:10px;font-weight:600;letter-spacing:.06em}

/* card actions */
.card-actions{display:flex;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.card-actions button{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--text);transition:all .15s}
.card-actions .btn-pass,.card-actions .btn-skip{color:var(--muted);border-color:var(--border)}
.card-actions .btn-pass:hover,.card-actions .btn-skip:hover{background:rgba(255,255,255,.05);color:var(--text)}
.card-actions .btn-take,.card-actions .btn-exit,.card-actions .btn-lockin,.card-actions .btn-hold{background:var(--green);color:#000;border-color:var(--green)}
.card-actions .btn-take:hover,.card-actions .btn-exit:hover,.card-actions .btn-lockin:hover,.card-actions .btn-hold:hover{background:color-mix(in srgb,var(--green) 85%,#fff)}

/* hide actions from peek cards */
.card.peek .card-actions,.card.peek2 .card-actions{display:none}

/* sides */
.sides{display:flex;gap:6px;padding-top:6px}
.side{flex:1;border:1px solid var(--border);border-radius:6px;padding:6px 6px;text-align:center;background:var(--bg)}
.side .lbl{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-transform:uppercase;letter-spacing:.08em;font-family:'IBM Plex Mono',ui-monospace,monospace}
.side .pct{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:17px;font-weight:600;margin-top:2px}
.side.yes .pct{color:var(--green)}.side.no .pct{color:var(--danger)}

/* stamps */
.stamp{position:absolute;top:22px;font-weight:800;font-size:23px;letter-spacing:.06em;
  padding:4px 12px;border-radius:8px;border:3px solid;opacity:0}
.stamp.take{left:20px;color:var(--green);border-color:var(--green);transform:rotate(-12deg)}
.stamp.pass{right:20px;color:var(--danger);border-color:var(--danger);transform:rotate(12deg)}

/* IE state badge */
.state-badge{font-size:10px;font-weight:700;letter-spacing:.1em;padding:2px 6px;border-radius:4px;border:1px solid;vertical-align:middle}
.state-badge.DETERMINED{color:var(--green);border-color:var(--green);background:rgba(52,211,153,.1)}
.state-badge.CONFIDENT{color:var(--gold);border-color:var(--gold);background:rgba(251,191,36,.1)}
.state-badge.UNCERTAIN{color:var(--muted);border-color:var(--border)}
.engine-trace{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9px;color:var(--muted);margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}
.trace-chip{padding:1px 5px;border-radius:3px;background:var(--surface);border:1px solid var(--border)}

/* progress + end screen */
.progress{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;color:var(--muted);text-align:center;padding:3px}
.end{text-align:center;color:var(--muted);font-size:15px;display:none;flex-direction:column;gap:12px;align-items:center}
.scan-idle{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;letter-spacing:.22em;
  color:var(--accent);text-shadow:0 0 10px color-mix(in srgb,var(--accent) 45%,transparent);
  animation:scanpulse 1.6s ease-in-out infinite}
@keyframes scanpulse{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.scan-idle{animation:none}}
.reload{font-size:12px;padding:8px 20px;border-radius:8px;border:1px solid var(--accent);
  background:rgba(6,182,212,.1);color:var(--accent);cursor:pointer;font-weight:600}

/* Two-button game — one prominent Pass / Take pair below the card. The in-card
   buttons are hidden so there is exactly one action control set. */
.actions{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap}
.card-actions{display:none}
.btn-pass,.btn-take{font-size:17px;font-weight:700;padding:14px 42px;border-radius:12px;
  cursor:pointer;font-family:inherit;letter-spacing:.02em;transition:transform .1s,background .15s,filter .15s;min-width:140px}
.btn-pass{border:2px solid var(--danger);background:transparent;color:var(--danger)}
.btn-pass:hover{background:color-mix(in srgb,var(--danger) 12%,transparent);transform:scale(1.03)}
.btn-take{border:none;background:var(--green);color:#052e22}
.btn-take:hover{filter:brightness(1.06);transform:scale(1.03)}
.btn-pass:focus-visible,.btn-take:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn-pass:disabled,.btn-take:disabled{opacity:.5;cursor:default;transform:none}
.kbd-hint{font-size:11px;color:var(--muted);text-align:center;margin:0;letter-spacing:.06em;text-transform:uppercase}

/* focus visible for keyboard navigation */
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* visually hidden heading for screen readers */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border-width:0}

/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);
  background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;
  font-size:12px;font-family:'IBM Plex Mono',ui-monospace,monospace;max-width:90vw;opacity:0;transition:.25s;z-index:50;white-space:pre-wrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.dry{border-color:var(--green)}.toast.live{border-color:var(--danger)}.toast.err{border-color:var(--gold)}

/* freshness dot pulse (extends site.css .dot) */
@keyframes dotpulse{0%{transform:scale(1.7);opacity:1}100%{transform:scale(1);opacity:.8}}
#sdot{vertical-align:middle;margin-right:4px;transition:background .3s}
#sdot.pulse{animation:dotpulse .5s ease-out}

/* side why — brief rationale under the % */
.side-why{font-size:9px;color:var(--muted);margin-top:3px;line-height:1.3;
  font-family:'IBM Plex Mono',ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ══ Device console — polished frame (fallout-radio inspired, theme-adaptive) ══ */
/* ── main row: console (left) + side column (right) ─────────── */
.kx-main{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch;
  gap:16px;width:100%;padding:0 12px;box-sizing:border-box}
.kx-side{flex:0 0 300px;display:flex;flex-direction:column;gap:12px;margin:10px 0 12px;min-height:0}
.side-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:12px 14px;box-shadow:var(--shadow)}
.side-h{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.bal-big{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:30px;font-weight:700;
  color:var(--text);line-height:1.1}
.bal-sub{font-size:12px;color:var(--muted);margin-top:5px}
.side-hist{flex:1;min-height:0;display:flex;flex-direction:column}
.hist-list{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px}
.hist-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:7px 0;border-bottom:1px solid var(--border)}
.hist-row:last-child{border-bottom:none}
.hist-row .tk{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.hist-row .rt{text-align:right;font-size:12px;white-space:nowrap}
.hist-row .side-y{color:var(--green)} .hist-row .side-n{color:var(--gold)}
.hist-row .pnl.pos{color:var(--green);font-weight:700} .hist-row .pnl.neg{color:var(--danger);font-weight:700}
.hist-row .st{font-size:10.5px;color:var(--muted);letter-spacing:.06em}
@media (max-width:820px){
  .kx-main{flex-direction:column;align-items:center;gap:10px}
  .kx-side{flex:0 0 auto;width:min(560px,96vw);order:2}
  .side-hist{max-height:38vh}
}
.kx-console{flex:0 1 560px;max-width:min(560px,96vw);min-height:0;display:flex;flex-direction:column;
  margin:10px 0 12px;
  background:linear-gradient(180deg,var(--surface2),var(--surface));
  border:1px solid var(--border);border-radius:20px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -6px 16px rgba(0,0,0,.10),var(--shadow-hover);
  padding:12px 14px 0;position:relative;overflow:hidden}
/* four recessed corner screws — subtle device detail */
.kx-console::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;border-radius:20px;
  background:
    radial-gradient(circle at 13px 13px, color-mix(in srgb,var(--border) 88%,#000) 0 2px, transparent 3px),
    radial-gradient(circle at calc(100% - 13px) 13px, color-mix(in srgb,var(--border) 88%,#000) 0 2px, transparent 3px),
    radial-gradient(circle at 13px calc(100% - 13px), color-mix(in srgb,var(--border) 88%,#000) 0 2px, transparent 3px),
    radial-gradient(circle at calc(100% - 13px) calc(100% - 13px), color-mix(in srgb,var(--border) 88%,#000) 0 2px, transparent 3px)}
.kx-console>*{position:relative;z-index:2}

/* the recessed "screen" that holds the card */
.deck{border-radius:14px;
  background:radial-gradient(130% 100% at 50% 0%, color-mix(in srgb,var(--accent) 7%,var(--bg)) 0%, var(--bg) 60%);
  box-shadow:inset 0 2px 10px rgba(0,0,0,.20),inset 0 0 0 1px var(--border)}
/* faint scanlines over the screen — very subtle, works in both themes */
.deck::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.45;
  background:repeating-linear-gradient(to bottom, rgba(127,127,127,0) 0 2px, rgba(127,127,127,.05) 2px 3px);mix-blend-mode:overlay}
.deck>*{position:relative;z-index:2}
/* soft phosphor glow behind the live card */
.card.front{box-shadow:var(--shadow-hover),0 0 26px -6px color-mix(in srgb,var(--accent) 40%,transparent)}
/* NOW-readout status line */
.progress{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);text-align:center;margin:0;padding:0}

/* tactile transport + tabs */
.mode-bar{padding:2px 2px 10px}
.mode-btn{box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.mode-btn.active{box-shadow:inset 0 0 12px -2px color-mix(in srgb,var(--accent) 55%,transparent)}
.btn-pass{box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.btn-take{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 16px -6px color-mix(in srgb,var(--green) 70%,transparent)}

/* ══ Account · profile · positions — bottom status HUD, collapsed to a bar ══ */
.acct{flex-shrink:0;border-top:1px solid var(--border);margin:8px -14px 0}
.acct-bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:none;border:none;cursor:pointer;padding:9px 16px;color:var(--text);
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;text-align:left}
.acct-bar:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.acct-bar:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.acct-summary{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted)}
.acct-summary b{color:var(--text);font-weight:600}
.acct-sep{color:var(--border);margin:0 3px}
.acct-env{color:var(--accent);font-weight:600}
.acct-edge{color:var(--gold)}
.acct-caret{color:var(--muted);font-size:12px;flex-shrink:0}
.acct-panel{max-height:44vh;overflow-y:auto;padding:2px 16px 14px}
.acct-panel[hidden]{display:none}
.acct-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px}
.acct-sec h3{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:6px 0 5px;font-weight:700}
.acct-kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:2px 0;border-bottom:1px solid color-mix(in srgb,var(--border) 55%,transparent)}
.acct .mut{color:var(--muted)}
.acct-kv a{color:var(--accent);text-decoration:none}
.acct-note{font-size:11px;color:var(--muted);margin-top:5px;font-style:italic;line-height:1.5}
.acct .pill{font-size:10px}
/* ── deck mode toggle + Σ₀ council banner ───────────────────────────────────── */
.mode-bar{display:flex;gap:6px;justify-content:center;padding:8px 8px 2px;flex-wrap:wrap;flex-shrink:0}
.mode-btn{background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.mode-btn:hover{color:var(--text)}
.mode-btn.active{background:var(--accent);color:#fff;border-color:transparent}
.mode-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.council-banner{margin:0 auto 4px;max-width:560px;padding:8px 12px;border-radius:8px;font-size:11px;line-height:1.5}
.council-banner.warn{background:rgba(220,70,70,.10);border:1px solid rgba(220,70,70,.45)}
.council-banner.ok{background:rgba(60,180,120,.08);border:1px solid rgba(60,180,120,.4)}
.council-banner .cb-head{font-weight:700;font-size:12px;margin-bottom:2px;color:#e8edf5}
.council-banner.warn .cb-head{color:#ff9b9b}
.council-banner .cb-stats{color:var(--muted);font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px}
.council-banner .cb-verdict{color:var(--muted);margin-top:3px;font-size:10px;font-style:italic}
/* grounded-card evidence box */
.grounded-box{margin-top:6px;padding:7px 9px;border-radius:7px;font-size:10.5px;line-height:1.5;font-family:'IBM Plex Mono',ui-monospace,monospace}
.grounded-box.ok{background:rgba(60,150,220,.08);border:1px solid rgba(60,150,220,.4)}
.grounded-box.warn{background:rgba(220,160,40,.08);border:1px solid rgba(220,160,40,.4);color:var(--muted)}
.grounded-box.pending{background:#11151d;border:1px solid #2c3446;color:var(--muted)}
.grounded-box .gb-head{color:var(--text);font-weight:600;margin-bottom:3px}
.grounded-box .gb-rat{color:var(--muted);margin-bottom:3px;font-family:inherit}
.grounded-box .gb-foot{color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grounded-box a{color:#6db3f2;text-decoration:none}
.reground-btn{margin-left:auto;background:#1b2230;color:#cfe3f5;border:1px solid #2c3446;border-radius:6px;padding:3px 9px;font-size:10px;cursor:pointer;font-family:inherit}
.reground-btn:hover{background:#222b3d}
.reground-btn:disabled{opacity:.6;cursor:default}
.grounded-box .spin{display:inline-block;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* The card is fixed-height but grounded cards carry variable-length evidence, so a
   long card clipped its footer (sources/meta) under overflow:hidden — on desktop and
   phones alike. Let ONLY the front card scroll its overflow. touch-action:pan-y keeps
   horizontal swipe working (the swipe handler already bails on vertical-dominant
   gestures), so a vertical drag scrolls the evidence and a horizontal drag still
   takes/passes. Peek cards stay clipped (they're scaled + dimmed). */
.card.front{overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.card.front::-webkit-scrollbar{width:6px}
.card.front::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.card.front{scrollbar-width:thin}

/* ── phones: reclaim vertical space + tighten content so most cards fit without
   scrolling; the scroll rule above is the guarantee for the tallest cards. ──── */
@media (max-width:480px){
  .kx-console{padding:8px 10px 0;border-radius:16px;margin:6px auto 8px}
  .deck{padding:6px 8px 10px;gap:8px}
  .stage{width:min(440px,94vw);height:min(560px,66vh)}
  .card{padding:11px 12px}
  .card-q{font-size:14px;margin:4px 0 6px}
  .fav{padding:7px 9px;margin:5px 0 6px}
  .fav-act{font-size:17px}
  .grounded-box{font-size:10px;padding:6px 8px;line-height:1.45}
  .actions{gap:12px}
  .btn-pass,.btn-take{padding:12px 30px;min-width:120px;font-size:16px}
}

/* ══════════════════════════════════════════════════════════════════════════
   CRT SKIN — phosphor-green fallout-radio console. The deck is its OWN device,
   so within .kx-console we remap the design tokens to a phosphor/amber palette
   (the whole deck goes CRT without touching the shared nav/footer) and add the
   curved-glass + scanline treatment. Simplified card: question · the call · one
   Σ₀ line · evidence. Noisy rows (yes/no grid, trace chips, badges) are dropped.
   ══════════════════════════════════════════════════════════════════════════ */
.kx-console{
  --bg:#06140d; --surface:#0a1f14; --surface2:#0c2318; --border:#17402a;
  --text:#c9ffe1; --muted:#4fae7d; --green:#2bff88; --danger:#ff7a3c;
  --gold:#ffb53b; --accent:#2bff88;
  font-family:ui-monospace,"Cascadia Mono","Courier New",monospace;
  -webkit-font-smoothing:none;
  background:linear-gradient(180deg,#0d1a12,#07120c);
  border:2px solid #15301f;border-radius:16px;
  box-shadow:0 0 0 2px #050a07,0 22px 48px rgba(0,0,0,.6),inset 0 1px 0 rgba(80,255,160,.08);
}
.kx-console::before{background:
  radial-gradient(circle at 13px 13px,#0a2417 0 2px,transparent 3px),
  radial-gradient(circle at calc(100% - 13px) 13px,#0a2417 0 2px,transparent 3px),
  radial-gradient(circle at 13px calc(100% - 13px),#0a2417 0 2px,transparent 3px),
  radial-gradient(circle at calc(100% - 13px) calc(100% - 13px),#0a2417 0 2px,transparent 3px)}
/* curved glass */
.kx-console .deck{
  background:radial-gradient(120% 100% at 50% 0%,#0a2417 0%,#06140d 72%);
  border:1px solid #143a26;border-radius:14px/22px;
  box-shadow:inset 0 0 60px rgba(0,0,0,.5),inset 0 0 14px rgba(43,255,136,.05),0 0 0 1px rgba(0,0,0,.5)}
.kx-console .deck::before{opacity:.6;mix-blend-mode:normal;
  background:repeating-linear-gradient(to bottom,rgba(43,255,136,.05) 0 1px,transparent 1px 3px)}
.kx-console .deck::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;
  background:linear-gradient(133deg,rgba(190,255,220,.06) 0%,transparent 42%)}
/* card = phosphor screen element (OPAQUE so the stacked peek cards behind it
   don't ghost through) */
.kx-console .card{
  background:linear-gradient(180deg,#0b2016,#07130d);
  border:1px solid #1c4a30;border-radius:8px;color:var(--text);
  box-shadow:inset 0 0 26px rgba(0,0,0,.35)}
.kx-console .card.front{border-color:#2bff8855;
  box-shadow:inset 0 0 26px rgba(0,0,0,.35),0 0 20px -6px rgba(43,255,136,.4)}
.kx-console .card.peek{filter:brightness(.5)}
.kx-console .card.peek2{filter:brightness(.32)}
/* SIMPLIFY: drop the noisy secondary rows */
.kx-console .sides,.kx-console .engine-trace,.kx-console .state-badge,.kx-console .card-klass{display:none}
/* labels + question */
.kx-console .card-top{color:#3c8a63;letter-spacing:.1em;text-transform:uppercase}
.kx-console .countdown{color:var(--gold)}
.kx-console .gen-age{color:var(--green);border-color:#1c4a30;background:rgba(43,255,136,.06)}
.kx-console .card-q{color:var(--text);text-shadow:0 0 9px rgba(43,255,136,.35);font-weight:700}
/* the CALL */
.kx-console .fav{border:1px solid #1c4a30;background:rgba(43,255,136,.03);border-radius:7px}
.kx-console .fav.yes{border-color:#2bff8844;background:rgba(43,255,136,.06)}
.kx-console .fav.no{border-color:#ffb53b44;background:rgba(255,181,59,.05)}
.kx-console .fav-tag{color:#3c8a63;letter-spacing:.2em}
.kx-console .fav-act{font-size:21px;text-shadow:0 0 12px rgba(43,255,136,.5)}
.kx-console .fav.yes .fav-act{color:var(--green)}
.kx-console .fav.no .fav-act{color:var(--gold);text-shadow:0 0 12px rgba(255,181,59,.5)}
.kx-console .fav-px{color:var(--muted)}
.kx-console .conv-bar{background:#0c1f14;height:3px}
.kx-console .conv-fill{box-shadow:0 0 6px currentColor}
.kx-console .reason{color:var(--muted);font-family:inherit}
/* simplified Σ₀ readout line */
.s0{margin-top:7px;padding:5px 8px;border:1px solid #1c4a30;border-radius:6px;
  background:rgba(43,255,136,.04);font-size:10px;letter-spacing:.02em;color:var(--muted);
  font-family:ui-monospace,"Cascadia Mono",monospace;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.s0 .s0-end{color:#2bff88;font-weight:700}
.s0 .s0-end.NO{color:#ffb53b}
.s0 .s0-sep{color:#1c4a30}
.s0 .s0-pos{color:#2bff88}.s0 .s0-neg{color:#ff7a3c}
.s0 .s0-v{margin-left:auto;font-weight:700;color:#2bff88;letter-spacing:.1em}
.s0 .s0-v.SKIP_NEG_EV{color:#ff7a3c}.s0 .s0-v.LOW_CONFIDENCE{color:#ffb53b}
/* EDGE badge — the moat surface (price · grounded P(YES) · edge after fees · Brier). */
.edge-badge{margin-top:7px;padding:6px 9px;border-radius:7px;font-size:11px;line-height:1.5;
  font-family:'IBM Plex Mono',ui-monospace,monospace;display:flex;flex-wrap:wrap;align-items:center;gap:5px;
  border:1px solid;font-weight:500}
.edge-badge.edge-pos{background:rgba(43,255,136,.07);border-color:#1c5a38;color:#cfeede}
.edge-badge.edge-neg{background:rgba(255,122,60,.06);border-color:#5a331c;color:#e8d3c6}
.edge-badge .edge-lead{font-weight:800;letter-spacing:.12em;font-size:9.5px;padding:1px 5px;border-radius:4px}
.edge-badge.edge-pos .edge-lead{background:#123; color:#2bff88}
.edge-badge.edge-neg .edge-lead{background:#221; color:#ff9a5c}
.edge-badge .edge-ev{font-weight:800}
.edge-badge.edge-pos .edge-ev{color:#2bff88}.edge-badge.edge-neg .edge-ev{color:#ff7a3c}
.edge-badge .edge-sep{opacity:.35}
.edge-badge .edge-mut{opacity:.6}
.edge-badge .edge-brier{margin-left:auto;opacity:.85;font-size:10px}
@media (max-width:820px){.edge-badge{font-size:10px;padding:5px 8px}}
/* .ev-chip styles + logic come from /js/evidence-chip.js (shared across trader surfaces, #2252) */
/* news → signal badge */
.news-sig{margin-top:6px;padding:5px 8px;border:1px solid #33321c;border-radius:6px;
  background:rgba(255,213,74,.05);font-size:10px;letter-spacing:.02em;color:var(--muted);
  font-family:ui-monospace,"Cascadia Mono",monospace;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.news-sig .news-tag{font-weight:700;color:#ffd54a}
.news-sig .news-tag.hi{color:#ff7a3c}.news-sig .news-tag.med{color:#ffd54a}.news-sig .news-tag.lo{color:#9aa}
.news-sig .news-sep{color:#33321c}
.news-sig .news-cnt{color:var(--muted)}
.news-sig .news-hl{flex:1 1 100%;color:#cfd6dd;text-decoration:none;opacity:.85;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.news-sig .news-hl:hover{opacity:1;text-decoration:underline}
/* grounded evidence */
.kx-console .grounded-box{font-family:inherit}
.kx-console .grounded-box.ok{background:rgba(43,255,136,.05);border-color:#1c4a30}
.kx-console .grounded-box .gb-head{color:var(--green)}
.kx-console .grounded-box .gb-rat,.kx-console .grounded-box .gb-foot{color:var(--muted)}
.kx-console .grounded-box a{color:var(--gold)}
/* meta strip */
.kx-console .card-meta{color:#3c8a63;border-top-color:#143a26}
.kx-console .card-meta .meta-badge{border-color:#1c4a30;background:rgba(43,255,136,.05);color:var(--green)}
/* mode tabs */
.kx-console .mode-btn{background:#0a1f14;color:var(--muted);border-color:#1c4a30;border-radius:6px;letter-spacing:.06em}
.kx-console .mode-btn:hover{color:var(--green)}
.kx-console .mode-btn.active{background:#0f2a1b;color:var(--green);border-color:#2bff8855;box-shadow:inset 0 0 12px rgba(43,255,136,.16)}
/* transport buttons */
.kx-console .btn-pass{border:2px solid #8a5a12;background:#160d02;color:var(--gold)}
.kx-console .btn-pass:hover{background:#1e1204}
.kx-console .btn-take{border:2px solid #2bff8855;background:#0f2a1b;color:var(--green);text-shadow:0 0 8px rgba(43,255,136,.5);box-shadow:inset 0 0 12px rgba(43,255,136,.12)}
.kx-console .btn-take:hover{filter:brightness(1.15)}
.kx-console .kbd-hint,.kx-console .progress{color:#3c8a63}
/* stamps */
.kx-console .stamp.take{color:var(--green);border-color:var(--green)}
.kx-console .stamp.pass{color:var(--gold);border-color:var(--gold)}
/* account HUD */
.kx-console .acct{border-top-color:#143a26}
.kx-console .acct-bar,.kx-console .acct-summary{color:var(--muted)}
.kx-console .acct-summary b{color:var(--text)}
.kx-console .acct-env{color:var(--gold)}
@media (prefers-reduced-motion:no-preference){
  .kx-console .card.front{animation:crtwarm .5s ease-out}
  @keyframes crtwarm{from{filter:brightness(1.4) saturate(.6)}to{filter:none}}
}
</style>
</head>
<body>

<a class="sr-only" href="#deck">Skip to the deck</a>
<h1 class="sr-only">Kalshi Swipe — unisona.ai</h1>

<!-- Global header — shared with home + chat -->
<!-- Header injected by the global site-chrome.js component (single source of truth). The
     app-specific terminal-skin toggle is declared below and site-chrome injects it into the nav. -->
<template id="nav-extra-actions">
  <button class="nav-btn" id="skin-toggle" title="Toggle terminal (Pip-Boy) skin" aria-label="Toggle terminal skin" aria-pressed="true" onclick="toggleSkin()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></button>
</template>

<!-- Console + side column (account balance + trade history) -->
<div class="kx-main">
<!-- Device console — polished frame (bezel + recessed screen + tactile controls) -->
<div class="kx-console">
<!-- Deck mode — on-screen segmented switch -->
<div class="mode-bar" role="tablist" aria-label="Trading mode">
  <button class="mode-btn" id="mLive" role="tab" aria-selected="true" onclick="switchMode('live')" title="LIVE — real 1-contract orders on the Σ₀ weather-edge (scope-gated)">● LIVE</button>
  <button class="mode-btn" id="mPaper" role="tab" aria-selected="false" onclick="switchMode('paper')" title="PAPER — practice candidates, no real orders">📝 PAPER</button>
</div>

<!-- The two-button game -->
<main class="deck" id="deck">
  <article class="stage" id="stage" role="region" aria-label="Current market card"></article>
  <div class="end" id="end" role="status" aria-label="No cards available">
    <div>No cards right now</div>
    <div style="font-size:12px;color:var(--muted)">Checking automatically…</div>
  </div>
  <p class="progress" id="progress" aria-live="polite" aria-label="Deck progress" role="status"></p>
  <div class="actions" role="group" aria-label="Card actions">
    <button class="btn-pass" id="bPass" aria-label="Pass on current card" onclick="act('pass')">✕ Pass</button>
    <button class="btn-take" id="bTake" aria-label="Take current card" onclick="act('take')">✓ Take</button>
  </div>
  <p class="kbd-hint" aria-hidden="true">← Pass&nbsp;&nbsp;·&nbsp;&nbsp;Take →</p>
</main>

</div><!-- /kx-console -->

<!-- Right column: account balance + trade history -->
<aside class="kx-side" id="kxSide" aria-label="Account balance and trade history">
  <div class="side-card">
    <div class="side-h">Account balance</div>
    <div class="bal-big" id="balBig">—</div>
    <div class="bal-sub" id="balSub">connecting…</div>
  </div>
  <div class="side-card side-hist">
    <div class="side-h">Trade history <span class="mut" id="histCount"></span></div>
    <div class="hist-list" id="histList"><div class="mut" style="padding:4px 2px">Loading…</div></div>
  </div>
</aside>

</div><!-- /kx-main -->

<div class="toast" id="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>

<script src="/js/evidence-chip.js"></script>
<script>
const API='/api/trading/kalshi';
const SYNC_MS=10000, DECK_TARGET=20, PREFETCH_AT=10, MAX_AGE_MS=60000, PREFETCH_COOLDOWN_MS=8000;
let conn={}, deck=[], idx=0, busy=false, dragging=false, liveMap={}, prefetching=false;
let lastSyncMs=0, lastDetCount=null, lastPrefetchMs=0;
// Trading MODE: 'live' (real 1-contract orders on the Σ₀ weather-edge, scope-gated)
// or 'paper' (practice candidates, no real orders). Each mode has its OWN deck.
// Switching forces a full reload so no state leaks across modes/decks.
let MODE='live', lastGroundStats=null, walletState=null;

// switchMode — the mode buttons call this: persist the choice and hard-reload.
function switchMode(m){
  if(m===MODE) return;
  try{ localStorage.setItem('kx-mode', m); }catch(_){}
  location.reload();
}

// setMode — apply the chosen mode in-page (called once at init).
function setMode(m){
  MODE=m; deck=[]; idx=0; liveMap={}; prefetching=false;
  for(const [id,mode] of [['mPaper','paper'],['mLive','live']]){
    const b=document.getElementById(id);
    if(b){ b.classList.toggle('active',mode===m); b.setAttribute('aria-selected',mode===m?'true':'false'); }
  }
  const stage=document.getElementById('stage'); if(stage) stage.innerHTML='';
  const end=document.getElementById('end'); if(end) end.style.display='none';
  loadCouncil();
  loadModeDeck();
}

// Load a paper/grounded deck slice and append unique cards (continuous deck).
async function loadModeDeck(){
  let d;
  if(MODE==='live'){
    // LIVE deck = the Σ₀ weather-edge winning cards (real, scope-gated execution).
    d=await j('/grounded-deck?limit=14');
    if(d) lastGroundStats=d;
  } else { // paper — practice candidates
    d=await j('/paper-deck?limit=20');
  }
  const cards=(d&&d.cards)||[];
  stampCards(cards, d&&d.generatedAt);
  if(MODE==='live'){
    // Grounded cards mutate as background research completes (pending → done), so
    // UPDATE in place (preserving order + the card on screen) and append new tickers.
    const pos=new Map(deck.map((c,i)=>[c.ticker,i]));
    for(const nc of cards){
      if(pos.has(nc.ticker)){
        const i=pos.get(nc.ticker);
        if(!(i===idx&&dragging)) deck[i]=Object.assign({},nc,{_genMs:deck[i]._genMs});
      } else deck.push(nc);
    }
    if(idx<deck.length){
      document.getElementById('end').style.display='none';
      if(!document.getElementById('front')) render(); else if(!dragging) patchFront(deck[idx]);
    } else showModeEnd(d);
    markFresh(deck.length-idx);
    return;
  }
  // Key by ticker+kind so an open-position card can join the deck alongside the
  // (already-swiped) buy card for the same market.
  const have=new Set(deck.map(c=>c.ticker+':'+(c.kind||'')));
  const add=cards.filter(c=>!have.has(c.ticker+':'+(c.kind||'')));
  if(deck.length===0){ deck=add.slice(); idx=0; }
  else if(add.length){ deck.push(...add); }
  if(idx<deck.length){
    document.getElementById('end').style.display='none';
    if(!document.getElementById('front')) render();
  } else {
    showModeEnd(d);
  }
  markFresh(deck.length-idx);
}

function showModeEnd(d){
  const end=document.getElementById('end');
  const stage=document.getElementById('stage'); if(stage) stage.innerHTML='';
  if(!end) return;
  end.style.display='flex';
  // Cards load continuously — no counter, no reload button, no verbose note.
  // Just a quiet phosphor "scanning" idle state until the next card arrives.
  end.innerHTML=`<div class="scan-idle">◉ SCANNING FEED…</div>`;
}

// Σ₀ council readout — realized after-fee truth, shown prominently (honesty surface).
async function loadCouncil(){
  try{
    const c=await j('/council');
    if(c&&!c.error) lastCouncil=c;
    renderAccount();
  }catch(_){}
}

// ── real-time freshness ───────────────────────────────────────────────────────
// Every card carries _genMs (server generatedAt, else receipt time). Only cards
// generated within MAX_AGE_MS are shown; the rest are flushed continuously so the
// deck is always live and never serves a stale design.
function stampCards(cards, genAt){
  const ms = genAt ? Date.parse(genAt) : NaN;
  const base = isFinite(ms) ? ms : Date.now();
  for(const c of (cards||[])) c._genMs = base;
  return cards||[];
}
function cardAgeMs(card){ return card._genMs==null ? Infinity : Date.now()-card._genMs; }
function isFresh(card){ return cardAgeMs(card) < MAX_AGE_MS; }
// Drop non-fresh cards. Never yank a card mid-drag. Returns true if the visible
// front card was removed (caller must re-render); pruning hidden cards needs none.
function flushStale(){
  for(let i=deck.length-1;i>idx;i--){ if(!isFresh(deck[i])) deck.splice(i,1); }
  let frontChanged=false;
  if(!dragging){ while(idx<deck.length && !isFresh(deck[idx])){ deck.splice(idx,1); frontChanged=true; } }
  return frontChanged;
}

async function j(path,opts){ try{const r=await fetch(API+path,opts);return await r.json();}catch(e){return{error:e.message};} }

// ── account · profile · positions (collapsed to a bar; theme.js owns the toggle) ──
let acctOpen=false, lastCouncil=null;
const acctState={conn:null,bal:null,session:null,positions:null,posLoaded:false};

function fmtUsd(x){ return '$'+((Number(x)||0)/100).toFixed(2); }
function balStr(bal){ if(!bal||bal.error) return '—'; return bal.balance_dollars!=null?('$'+Number(bal.balance_dollars).toFixed(2)):fmtUsd(bal.balance_cents!=null?bal.balance_cents:(bal.balance||0)); }

async function loadAccount(){
  const [cn,bal,ses]=await Promise.all([
    j('/connection'),
    j('/balance'),
    fetch('/api/auth/session').then(r=>r.json()).catch(()=>({authenticated:false,role:'guest'})),
  ]);
  acctState.conn=cn; acctState.bal=bal; acctState.session=ses; conn=cn||{};
  renderAccount();
}
// balance refresh alias kept for callers (e.g. after a live order)
async function loadBalance(){ return loadAccount(); }

async function loadPositions(){
  const p=await j('/positions');
  acctState.positions=(p&&(p.market_positions||(p.data&&p.data.market_positions)))||[];
  acctState.posLoaded=true;
  renderAccount();
}

function renderAccount(){
  const cn=acctState.conn||{}, bal=acctState.bal||{}, ses=acctState.session||{};
  const name=(ses.user&&ses.user.name)||(ses.authenticated?'You':'Guest');
  const dotCls=cn.error?'offline':(cn.canTradeLive?'online':'warn');
  const envLbl=cn.error?'offline':(cn.canTradeLive?'LIVE':(cn.credentials?'dry-run':'no creds'));
  const posN=acctState.posLoaded?(acctState.positions||[]).length:null;
  const noEdge=lastCouncil&&/NO PROVEN EDGE/i.test(lastCouncil.verdict||'');
  const sum=document.getElementById('acctSummary');
  if(sum) sum.innerHTML=`<span class="dot ${dotCls}"></span><b>${name}</b><span class="acct-sep">·</span>${balStr(bal)}`
    +(posN!=null?`<span class="acct-sep">·</span>${posN} pos`:'')
    +`<span class="acct-sep">·</span><span class="acct-env">${envLbl}</span>`
    +(noEdge?`<span class="acct-sep">·</span><span class="acct-edge">⛔ no proven edge</span>`:'');
  const panel=document.getElementById('acctPanel');
  if(panel&&acctOpen) panel.innerHTML=renderAcctPanel();
  renderSide();
}

function renderAcctPanel(){
  const cn=acctState.conn||{}, bal=acctState.bal||{}, ses=acctState.session||{}, co=lastCouncil||{};
  const name=(ses.user&&ses.user.name)||(ses.authenticated?'You':'Guest');
  const tier=(ses.user&&ses.user.tier)||ses.role||'guest';
  const reason=cn.tradingPaused?'trading paused (kill-switch)':cn.killSwitch?'kill-switch engaged':(cn.credentials?'':'no credentials configured');
  let pos;
  if(!acctState.posLoaded) pos='<div class="mut">Loading positions…</div>';
  else if(!(acctState.positions||[]).length) pos=`<div class="mut">No open Kalshi positions${cn.credentials?'':' — connect credentials to view'}.</div>`;
  else pos=acctState.positions.map(p=>{const pnl=Number(p.realized_pnl||0);return `<div class="acct-kv"><span>${(p.ticker||'').slice(0,24)}</span><span>${p.position} · ${fmtUsd(p.market_exposure)} <b style="color:${pnl>=0?'var(--green)':'var(--danger)'}">${pnl>=0?'+':''}${fmtUsd(pnl)}</b></span></div>`;}).join('');
  const wr=co.win_rate!=null?Math.round(co.win_rate*100)+'%':'—';
  const net=co.avg_pnl_pct!=null?(co.avg_pnl_pct>=0?'+':'')+co.avg_pnl_pct+'%':'—';
  const netCol=co.avg_pnl_pct>=0?'var(--green)':'var(--danger)';
  return `
    <div class="acct-grid">
      <section class="acct-sec">
        <h3>Profile</h3>
        <div class="acct-kv"><span>${name}</span><span class="pill">${tier}</span></div>
        <div class="acct-kv"><span class="mut">Account</span><a href="/profile.html">View profile →</a></div>
      </section>
      <section class="acct-sec">
        <h3>Kalshi account</h3>
        <div class="acct-kv"><span class="mut">Balance</span><b>${balStr(bal)}</b></div>

// Minimum quality bar for suggestion cards (entry/crypto/engine/convergence)
function isSuggestionTradeable(c){
  if(c.minsToClose!=null && c.minsToClose<=0) return false;   // expired
  if(c.favAsk==null) return false;                             // no live ask
  if(c.kind==='convergence'){
    if(c.favAsk>90) return false;  // <10¢ profit — not worth it
    if(c.favAsk<80) return false;  // not converged enough to be reliable
    return true;
  }
  if(c.favAsk<4 || c.favAsk>96) return false;                 // already resolved (entry cards)
  if((c.conviction||0)<45) return false;                       // edge too thin
  return true;
}

// ── blended deck prefetch (20-card buffer) ────────────────────────────────────
async function maybePrefetch(){
  if(prefetching) return;
  const remaining=deck.length-idx;
  if(remaining>=PREFETCH_AT) return;
  // The feed legitimately returns few cards, and stale cards are flushed on arrival,
  // so `remaining` can sit at/near zero indefinitely. Without a hard cooldown the 1s
  // countdown tick re-fetches the expensive, web-grounded deck ~once per second — the
  // runaway the audit saw. Rate-limit ALL prefetch (even when empty); the 5s syncDeck
  // interval already handles timely refills, so an empty deck waits at most ~5s.
  if((Date.now()-lastPrefetchMs) < PREFETCH_COOLDOWN_MS) return;
  prefetching=true;
  lastPrefetchMs=Date.now();
  const before=deck.length;
  try {
    // Both modes refill from their own deck endpoint (loadModeDeck).
    await loadModeDeck();
  } catch(_){}
  finally{
    prefetching=false;
    // Futile-fetch backoff: today's grounded feed genuinely has only a few cards, so a
    // refill that adds nothing shouldn't retry on the next tick. Push the cooldown out
    // 3x so we stop hammering a feed with nothing new; the 10s syncDeck still refreshes,
    // and any real new card resets this on the next successful add.
    if(deck.length===before) lastPrefetchMs = Date.now() + PREFETCH_COOLDOWN_MS*2;
  }
}

// Σ₀ end-state badge — predicted attractor, win/loss odds, capturable delta, EV,
// contraction confidence. Renders only on cards the Σ₀ engine scored.
// Simplified single-line Σ₀ readout — the CRT skin styles `.s0`. (The old dense
// two-row number grid was the main source of card clutter.)
function sigma0Badge(card){
  const s=card.sigma0; if(!s||s.score==null) return '';
  const end=s.end_state||'—';
  const win=s.p_win!=null?Math.round(s.p_win*100)+'%':'—';
  const conf=s.confidence!=null?Math.round(s.confidence*100)+'%':'—';
  const ev=s.ev_cents;
  const evStr=ev==null?'—':(ev>0?'+':'')+ev+'¢';
  return `<div class="s0">`
    +`<span class="s0-end ${end}">Σ₀ ${end}</span>`
    +`<span class="s0-sep">·</span>win ${win}`
    +`<span class="s0-sep">·</span>EV <b class="${ev>0?'s0-pos':'s0-neg'}">${evStr}</b>`
    +`<span class="s0-sep">·</span>conf ${conf}`
    +(s.verdict?`<span class="s0-v ${s.verdict}">${s.verdict}</span>`:'')
    +`</div>`;
}

// The EDGE badge — the moat surface. Not "what moved" (Verso) but "what's MISPRICED,
// which way, by how much AFTER FEES, and our track record (Brier) on such calls."
// card.edge is attached server-side (lib/kalshi-edge) from CACHED grounding + fees +
// calibration. Ungrounded markets carry { grounded:false } → no badge (no edge claimed).
function edgeBadge(card){
  const e=card.edge; if(!e||!e.grounded||e.edgeCents==null) return '';
  const pos=e.positive;
  const ev=(e.edgeCents>0?'+':'')+e.edgeCents+'¢';
  const pctY=e.p_yes!=null?Math.round(e.p_yes*100):null;
  const pctM=e.marketP!=null?Math.round(e.marketP*100):null;
  const brier=e.brier!=null?`Brier ${e.brier.toFixed(2)}${e.n?` · n=${e.n}`:''}`:'';
  return `<div class="edge-badge ${pos?'edge-pos':'edge-neg'}" title="Fee-adjusted expected value of the better side, from our web-grounded P(YES) vs the market price. Brier = how calibrated our probabilities have been on settled outcomes (lower is better).">`
    +`<span class="edge-lead">EDGE</span>`
    +`<b>BUY ${e.side}</b> <b class="edge-ev">${ev}</b><span class="edge-mut"> after fees</span>`
    +`<span class="edge-sep">·</span>P(YES) <b>${pctY}%</b> vs mkt <b>${pctM}%</b>`
    +(brier?`<span class="edge-sep">·</span><span class="edge-brier">${brier}</span>`:'')
    +`</div>`;
}
// Evidence chip (#2252) lives in /js/evidence-chip.js (shared across trader surfaces).
// evidenceChip.fromKalshiCard(card) maps this deck's card.edge/sigma0 onto the chip.
function cleanTitle(title,ticker){
  if(!title) return ticker||'Market';
  // Strip leading "yes " / "no " prefix from raw position labels
  let clean=title.replace(/^(yes|no)\s+/i,'').trim();
  // Only split on compound-market separators (", yes " / ", no "), NOT currency commas
  const m=clean.match(/^(.+?),\s*(yes |no )/i);
  if(m) clean=m[1].trim();
  return clean.length>52?clean.slice(0,49)+'…':clean;
}
function shortLabel(lbl,fallback){
  if(!lbl||lbl===fallback) return fallback;
  // Garbage check: concatenated position list
  if(/,\s*(yes|no)\s/i.test(lbl)) return fallback;
  const clean=lbl.replace(/^(yes|no)\s+/i,'').trim();
  return clean.length>22?clean.slice(0,20)+'…':clean||fallback;
}
function sideLabels(card){
  const y=shortLabel(card.yesLabel,'YES');
  const n=shortLabel(card.noLabel,'NO');
  // If API returns identical labels for both sides, fall back to YES/NO
  return y===n ? {y:'YES',n:'NO'} : {y,n};
}
// Parse threshold from favLabel/yesLabel ("$64,500 or above") → side rationale.
function parseSideWhy(card){
  // Try favLabel first ("$64,500 or above"), then title, then ticker
  const src = card.favLabel || card.yesLabel || card.title || '';
  const m = src.match(/\$([\d,]+(?:\.\d+)?)\s*(?:or\s*(above|below))?/i);
  if(m){
    const price = m[0].replace(/\s+or\s+\w+/i,'').trim();
    const isAbove = !m[2] || m[2].toLowerCase()==='above';
    return {
      y: isAbove ? `▲ resolves above ${price}` : `▼ resolves below ${price}`,
      n: isAbove ? `▼ resolves below ${price}` : `▲ resolves above ${price}`
    };
  }
  // Fallback: parse ticker T-suffix (e.g. KXBTCD-26JUN14-T64499.99)
  const t=(card.ticker||'').match(/T([\d.]+)$/);
  if(t){
    const p='$'+parseFloat(t[1]).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});
    return {y:`▲ resolves above ${p}`, n:`▼ resolves below ${p}`};
  }
  // Final fallback: compact reason
  const r=(card.reason||'').replace(/\d+m to close\s*·?\s*/,'').slice(0,30);
  return {y:r, n:r};
}
function convColor(v){ return v>=66?'var(--green)':v>=45?'var(--gold)':'var(--muted)'; }
function fmtCountdown(card){
  if(card.close){
    const ms=Date.parse(card.close)-Date.now();
    if(isFinite(ms)){
      const s=Math.max(0,Math.floor(ms/1000));
      const h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60;
      const txt=h>0?`${h}h ${m}m`:m>0?`${m}m ${ss}s`:`${ss}s`;
      const cls=s<300?'now':s<3600?'soon':'';
      return {txt:'⏱ '+txt, cls};
    }
  }
  return {txt:'⏱ —', cls:''};
}

function fmtStrategyFitness(fitness){
  if(!fitness) return '';
  const cnt=fitness.count||0;
  if(!cnt) return ''; // hide when no trade history yet
  const pnl=(fitness.pnl||0).toFixed(1);
  const dd=(fitness.drawdown||0).toFixed(1);
  const stab=(fitness.stability||0).toFixed(1);
  const pnlCol=fitness.pnl>0?'var(--green)':fitness.pnl<0?'var(--danger)':'var(--muted)';
  return `<div style="margin-top:6px;padding:5px 8px;border-radius:4px;background:var(--bg);font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace;display:flex;gap:10px;align-items:center">
    <span style="font-weight:600;color:var(--muted)">Fitness</span>
    <span>PnL <b style="color:${pnlCol}">${fitness.pnl>0?'+':''}${pnl}%</b></span>
    <span>DD <b>${dd}%</b></span>
    <span>Stab <b>${stab}</b></span>
    <span style="margin-left:auto">${cnt} trades</span>
  </div>`;
}

  const favClass=isExit?(card.exitTag==='TAKE-PROFIT'?'yes':'no'):fav;
  const ribbonClass=isExit&&card.exitTag==='TAKE-PROFIT'?'ribbon profit':'ribbon';
  const ribbon=isExit?`<div class="${ribbonClass}">⚠ SELL NOW · ${card.exitTag}${card.pnlPct!=null?' '+(card.pnlPct>=0?'+':'')+card.pnlPct+'%':''}</div>`:'';
  const klLabel=card.kind==='crypto'?'crypto':isExit?'exit':'signal';

  const act=isSell
    ? `● SELL ${favLbl}`
    : `${fav==='yes'?'▲':'▼'} BUY ${favLbl}`;
  const px=isSell
    ? `@ ${card.favAsk!=null?card.favAsk+'¢':'mkt'} · ${card.qty||1} contract${(card.qty||1)>1?'s':''}`
    : `@ ${card.favAsk!=null?card.favAsk+'¢':'mkt'} · 1 contract`;
  const convLabel=isExit?'priority':'certainty';
  const sl=card.stateLabel||'';
  const stateBadge=(!isSell&&sl)?`<span class="state-badge ${sl}">${sl}</span>`:'';
  const traceHtml=(!isSell&&card.trace&&card.trace.length)?
    `<div class="engine-trace">${card.trace.map(t=>`<span class="trace-chip">${t.constraint} −${t.eliminated}</span>`).join('')}</div>`:'';
  const why2=parseSideWhy(card);
  return `
    <div class="stamp take">${isSell?'EXIT':'TAKE'}</div><div class="stamp pass">PASS</div>
    ${ribbon}
    <div class="card-top"><span class="countdown ${cd.cls}">${cd.txt}</span>${genAge}${regimeLabel}${stateBadge}<span class="card-klass ${klLabel}">${klLabel.toUpperCase()}</span></div>
    <h3 class="card-q">${cleanTitle(card.title,card.ticker)}</h3>
    <div class="fav ${favClass}">
      <div class="fav-tag">${isSell?'Exit recommended':'Best entry now'}</div>
      <div class="fav-act">${act}</div>
      <div class="fav-px">${px}</div>
      <div class="conv-row">
        <div class="conv-bar"><div class="conv-fill" style="width:${card.conviction}%;background:${convColor(card.conviction)}"></div></div>
        <div class="conv-num">${card.conviction}% ${convLabel}</div>
      </div>
      <div class="reason">${card.reason||''}</div>
      ${window.evidenceChip.fromKalshiCard(card)}
      ${edgeBadge(card)}
      ${sigma0Badge(card)}
      ${newsBadge(card)}
      ${groundedExtra(card)}
      ${strategyReason}
      ${fitnessDisplay}
      ${traceHtml}
    </div>
    <div class="card-meta">
      <span class="meta-badge">${card.ticker?.split('-')[0]||'MKT'}</span>
      <span style="flex:1">${card.ticker?.slice(-18)||''}</span>
      ${card.minsToClose!=null?`<span>${card.minsToClose<60?card.minsToClose+'m':Math.round(card.minsToClose/60)+'h'} left</span>`:''}
    </div>
    <div class="sides">
      ${(sl=>{
        return `<div class="side yes"><div class="lbl">${sl.y}</div><div class="pct">${card.yesPct==null?'—':card.yesPct+'%'}</div><div class="side-why">${why2.y}</div></div>
      <div class="side no"><div class="lbl">${sl.n}</div><div class="pct">${card.yesPct==null?'—':noPct+'%'}</div><div class="side-why">${why2.n}</div></div>`;
      })(sideLabels(card))}
    </div>
    <div class="card-actions">

    </div>`;
}

function patchFront(card){
  const el=document.getElementById('front');
  if(el) el.innerHTML=cardInner(card);
}

function render(){
  const stage=document.getElementById('stage');
  const remaining=deck.length-idx;
  document.getElementById('progress').textContent=remaining>0?`Card ${deck.length-remaining+1} of ${deck.length} · soonest first`:'';
  if(idx>=deck.length){ stage.innerHTML=''; document.getElementById('end').style.display='flex'; return; }
  document.getElementById('end').style.display='none';
  let html='';
  if(deck[idx+2]){
    html+=`<div class="card peek2">${cardInner(deck[idx+2])}</div>`;
  }
  if(deck[idx+1]){
    const peekExit=deck[idx+1].kind==='exit'?' exit':'';
    html+=`<div class="card peek${peekExit}">${cardInner(deck[idx+1])}</div>`;
  }
  const frontExit=deck[idx].kind==='exit'?' exit':'';
  html+=`<div class="card front${frontExit}" id="front">${cardInner(deck[idx])}</div>`;
  stage.innerHTML=html;
  attachSwipe(document.getElementById('front'));
  maybePrefetch();
}

// tick countdown + freshness every second
setInterval(()=>{
  updateFreshnessChip();
  if(dragging) return;
  // flush cards older than one minute; only re-render if the visible front went stale
  const frontChanged=flushStale();
  if(frontChanged){
    if(idx>=deck.length){ document.getElementById('end').style.display='flex'; maybePrefetch(); }
    else render();
  }
  if(deck.length-idx<PREFETCH_AT) maybePrefetch();
  if(idx>=deck.length) return;
  const el=document.getElementById('front'); if(!el) return;
  const cd=fmtCountdown(deck[idx]); const c=el.querySelector('.countdown');
  if(c){ c.textContent=cd.txt; c.className='countdown '+cd.cls; }
  // live-age indicator on the front card's generation (consistent across all kinds)
  const ageEl=el.querySelector('.gen-age');
  if(ageEl){ const a=Math.floor(cardAgeMs(deck[idx])/1000); ageEl.textContent=`◉ ${a<2?'live':a+'s old'}`; }
},1000);

// ── swipe with deadzone + minimum distance + velocity ────────────────────────
// RIGHT (take): ≥150px swipe right → EXIT position (hard commit)
// LEFT (pass): ≥150px swipe left → HOLD position (hard commit)
// Deadzone: ±10px to ignore accidental taps
// Time: must complete within 500ms (velocity = distance/time)
function attachSwipe(el){
  if(!el) return;
  // Each render attaches fresh window-level move/up listeners; without removing the
  // previous card's, stale handlers accumulate and race on the shared `dragging` flag
  // (a stale mouseup can clear it before the live card's handler runs, eating swipes).
  if(attachSwipe._cleanup) attachSwipe._cleanup();
  const DEADZONE=10, MIN_SWIPE=150, MAX_SWIPE_TIME=500;
  let startX=0,startY=0,startMs=0,dx=0,dy=0,active=false;
  const take=el.querySelector('.stamp.take'), pass=el.querySelector('.stamp.pass');

  const down=e=>{
    dragging=true; active=true;
    startX=(e.touches?e.touches[0]:e).clientX;
    startY=(e.touches?e.touches[0]:e).clientY;
    startMs=Date.now();
    el.style.cursor='grabbing';
    el.style.transition='none';
    dx=0; dy=0;
  };

  const move=e=>{
    if(!dragging||!active) return;
    const p=e.touches?e.touches[0]:e;
    dx=p.clientX-startX;
    dy=p.clientY-startY;

    // Deadzone: if still in deadzone, don't show feedback
    const inDeadzone=Math.abs(dx)<DEADZONE && Math.abs(dy)<DEADZONE;
    if(inDeadzone){
      el.style.transform='';
      take.style.opacity=0;
      pass.style.opacity=0;
      return;
    }

    // Prevent vertical swipes (check if dx >> dy)
    if(Math.abs(dy) > Math.abs(dx)*0.5){
      active=false;  // not a horizontal swipe
      return;
    }

    // Show feedback proportional to swipe distance
    const swipePercent=Math.min(1, Math.abs(dx)/MIN_SWIPE);
    el.style.transform=`translate(${dx}px,0) rotate(${dx*0.03}deg)`;

    if(dx>DEADZONE){
      take.style.opacity=swipePercent*0.8;
      pass.style.opacity=0;
    } else if(dx<-DEADZONE){
      pass.style.opacity=swipePercent*0.8;
      take.style.opacity=0;
    } else {
      take.style.opacity=0;
      pass.style.opacity=0;
    }
  };

  const up=()=>{
    if(!dragging) return;
    dragging=false;
    active=false;
    el.style.cursor='grab';
    el.style.transition='transform .25s ease';

    const elapsed=Date.now()-startMs;
    const absDx=Math.abs(dx);

    // Require: min distance (150px) AND fast enough (<500ms)
    if(elapsed<=MAX_SWIPE_TIME && absDx>=MIN_SWIPE){
      if(dx>MIN_SWIPE) flyOut('take');        // RIGHT → EXIT
      else if(dx<-MIN_SWIPE) flyOut('pass');  // LEFT → HOLD
      else { reset(); }
    } else {
      reset();
    }
  };

  const reset=()=>{
    el.style.transform='';
    take.style.opacity=0;
    pass.style.opacity=0;
    dx=dy=0;
  };

  el.addEventListener('mousedown',down);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',up);
  el.addEventListener('touchstart',down,{passive:true});
  el.addEventListener('touchmove',move,{passive:true});
  el.addEventListener('touchend',up);
  // Remove THIS card's window listeners before the next card attaches its own.
  attachSwipe._cleanup=()=>{
    window.removeEventListener('mousemove',move);
    window.removeEventListener('mouseup',up);
  };
}
function flyOut(dir){
  const el=document.getElementById('front'); if(!el) return;
  const x=dir==='take'?700:-700;
  el.style.transition='transform .3s ease,opacity .3s'; el.style.opacity='0';
  el.style.transform=`translate(${x}px,0) rotate(${x*0.04}deg)`;
  setTimeout(()=>act(dir,true),180);
}

function blockTake(reason){
  const t=document.getElementById('toast');
  t.className='toast err show';
  t.textContent='✕ Blocked — '+reason;
  clearTimeout(blockTake._h); blockTake._h=setTimeout(()=>t.classList.remove('show'),3000);
  idx++; render();
}

// ── act ───────────────────────────────────────────────────────────────────────
async function act(dir,fromSwipe){
  if(busy||idx>=deck.length) return;
  if(dir==='pass'){ if(!fromSwipe) return flyOut('pass'); idx++; render(); return; }
  if(dir==='take' && !fromSwipe) return flyOut('take');

  const card=deck[idx];

  // ── Position card (paper): TAKE = SELL (close for profit/loss). PASS = HOLD is
  // handled above — passing just advances and leaves the position open.
  if(card.kind==='position' && card.positionId){
    busy=true;
    try{
      const res=await j('/paper-close',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:card.positionId, exitTag:'MANUAL', exitPriceCents:card.currentBid, pnlPct:card.pnlPct})});
      const t=document.getElementById('toast');
      if(res&&res.error){ t.className='toast err show'; t.textContent='✕ '+res.error; }
      else{ const p=card.pnlPct||0, win=p>=0; t.className='toast '+(win?'live':'dry')+' show';
        t.textContent=`PAPER · sold ${String(card.ticker||'').replace('KXHIGHNY-','NYC ')} @ ${card.currentBid}¢ · ${win?'+':''}${p}%`; }
      clearTimeout(showResult._h); showResult._h=setTimeout(()=>t.classList.remove('show'),3200);
      idx++; render(); loadHistory(); loadWallet();
    }catch(e){ showResult({error:e.message},card); idx++; }
    finally{ busy=false; }
    return;
  }

  // ── LIVE mode: place a REAL 1-contract order on the Σ₀ weather-edge card.
  // The server's scope gate caps size and refuses any non-weather-edge source, so an
  // out-of-scope or gated card comes back as a dry-run rather than a live fill.
  if(MODE==='live'){
    if(card.grounding_status && card.grounding_status!=='done'){ blockTake('Still loading — wait for the live edge'); return; }
    if(card.favAsk==null){ blockTake('No live ask — cannot trade'); return; }
    busy=true;
    try{
      // Live fill = REAL money → require an explicit per-order confirmation on top of
      // the server's kill-switch/scope gates (defense-in-depth). When live isn't
      // tradable this is a no-op; the server dry-runs regardless.
      const canLive=!!(acctState.conn&&acctState.conn.canTradeLive);
      const confirmLive = canLive ? window.confirm(`LIVE order — REAL money.\n\n${card.favSide==='yes'?'YES':'NO'} @ ${card.favAsk}¢ · 1 contract\n${card.ticker}\n\nPlace it?`) : false;
      if(canLive && !confirmLive){ blockTake('Live order cancelled'); return; }
      const o={ticker:card.ticker, side:card.favSide, action:'buy', type:'limit', count:1, limitCents:card.favAsk,
        source:'kalshi-weather-edge', confirmLive, grounded_confidence:card.grounded_confidence, grounded_p_yes:card.grounded_p_yes};
      const res=await j('/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});
      showResult(res,card);            // live / dry-run toast
      idx++; render();
      loadHistory(); if(res.mode==='live') loadBalance();
    }catch(e){ showResult({error:e.message},card); idx++; }
    finally{ busy=false; }
    return;
  }

  // ── PAPER mode: open a paper position (no real order) ───────────────────────
  if(MODE==='paper'){
    if(card.favAsk==null){ blockTake('No live ask — cannot paper-trade'); return; }
    busy=true;
    try{
      const o={ticker:card.ticker, side:card.favSide, action:'buy', type:'limit', count:1, limitCents:card.favAsk,
        source:'kalshi-paper', pPredicted:card.pPredicted,
        // Weather-edge distribution stamp (#2218): forward dist+ladder+heldBucket so the
        // verifier can grade the forecast distribution once the market settles.
        dist:card.dist, ladder:card.ladder, heldBucket:card.heldBucket};
      const res=await j('/paper-trade',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});
      if(res&&res.wallet) walletState=res.wallet;
      showPaperResult(res,card);
      if(res&&res.error){ renderSide(); }          // out of cash → keep the card, don't advance
      else { idx++; render(); loadHistory(); renderSide(); }
    }catch(e){ showResult({error:e.message},card); idx++; }
    finally{ busy=false; }
    return;
  }
}

function showResult(res,card){
  const t=document.getElementById('toast');
  const lbl=(card.favSide==='yes'?'▲ ':'▼ ')+(card.favLabel||card.favSide.toUpperCase());
  if(res.mode==='dry_run'){
    t.className='toast dry show';
    t.textContent=`DRY-RUN · take ${lbl} @ ${card.favAsk||'?'}¢\nplanned, not sent (${(res.wouldBlock||[]).join('; ')})`;
  } else if(res.mode==='live'){
    const ok=res.status>=200&&res.status<300;
    t.className=ok?'toast live show':'toast err show';
    t.textContent=ok?`LIVE · took ${lbl} ✓`:`LIVE · FAILED ${lbl} (status ${res.status}) — check portfolio`;
  } else { t.className='toast err show'; t.textContent=JSON.stringify(res).slice(0,140); }
  clearTimeout(showResult._h); showResult._h=setTimeout(()=>t.classList.remove('show'),3200);
}

function showPaperResult(res,card){
  const t=document.getElementById('toast');
  if(res.error){ t.className='toast err show'; t.textContent = res.error==='insufficient_paper_cash' ? '✕ Out of paper cash — sell a position to free funds' : ('✕ '+res.error); }
  else{
    const lbl=(card.favSide==='yes'?'▲ YES':'▼ NO');
    t.className='toast dry show';
    t.textContent=`PAPER · opened ${lbl} @ ${card.favAsk}¢ · tracked in ledger (no real order)`;
  }
  clearTimeout(showResult._h); showResult._h=setTimeout(()=>t.classList.remove('show'),3400);
}

function showGroundedResult(res,card){
  const t=document.getElementById('toast');
  if(res.error){ t.className='toast err show'; t.textContent='✕ '+res.error; }
  else{
    const lbl=(card.favSide==='yes'?'▲ YES':'▼ NO');
    t.className='toast live show';
    t.textContent=`GROUNDED · ${lbl} @ ${card.favAsk}¢ · P(YES) ${Math.round((card.grounded_p_yes||0)*100)}% · paper pick logged, graded on resolution`;
  }
  clearTimeout(showResult._h); showResult._h=setTimeout(()=>t.classList.remove('show'),3600);
}

// Re-ground a single market on demand (web search + LLM, ~20s). Updates the card in place.
async function reground(ticker){
  const card=deck[idx]; if(!card||card.ticker!==ticker) return;
  const btn=document.getElementById('regroundBtn'); if(btn){ btn.disabled=true; btn.textContent='🔎 Researching…'; }
  try{
    const res=await j('/ground',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticker})});
    if(res&&res.card){ deck[idx]=Object.assign({},res.card,{_genMs:Date.now()}); patchFront(deck[idx]); loadCouncil(); }
    else if(btn){ btn.disabled=false; btn.textContent='🔎 Re-ground'; }
  }catch(_){ if(btn){ btn.disabled=false; btn.textContent='🔎 Re-ground'; } }
}

let imageGalleryOpen=true;

async function loadImages(){
  try{
    const res=await fetch('/api/images');
    const data=await res.json();
    if(data.images&&data.images.length>0){
      document.getElementById('imageGallery').style.display='';
      renderImages(data.images);
    }
  }catch(e){
    console.error('Failed to load images:',e);
  }
}

function renderImages(images){
  const grid=document.getElementById('imageGrid');
  grid.innerHTML=images.slice(0,12).map(img=>{
    const url=img.url||'/images/'+img.id;
    const title=img.filename||'Image';
    return `<div class="image-item" data-url="${encodeURIComponent(url)}" data-title="${encodeURIComponent(title)}" title="${title.replace(/"/g,'&quot;')}"><img src="${url.replace(/"/g,'%22')}" alt="${title.replace(/"/g,'&quot;')}" loading="lazy" onerror="this.parentElement.innerHTML='⚠'"></div>`;
  }).join('');
  grid.onclick=e=>{
    const el=e.target.closest('[data-url]');
    if(el) openImageModal(decodeURIComponent(el.dataset.url),decodeURIComponent(el.dataset.title));
  };
}

function openImageModal(url,title){
  document.getElementById('modalImage').src=url;
  document.getElementById('modalImage').alt=title;
  document.getElementById('imageModal').classList.add('active');
  document.body.style.overflow='hidden';
}

function closeImageModal(e){
  if(e&&e.target!==document.getElementById('imageModal')) return;
  document.getElementById('imageModal').classList.remove('active');
  document.body.style.overflow='';
}

function toggleGallery(){
  const gallery=document.getElementById('imageGallery');
  const grid=document.getElementById('imageGrid');
  imageGalleryOpen=!imageGalleryOpen;
  grid.style.display=imageGalleryOpen?'':'none';
}

// Consolidated keyboard shortcut handler (arrow keys + escape)
document.addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA') return;
  if(e.key==='ArrowRight') act('take');
  else if(e.key==='ArrowLeft') act('pass');
  else if(e.key==='Escape'&&acctOpen) toggleAcct();
});

// ── live-status heartbeat ─────────────────────────────────────────────────────
async function pollLiveStatus(){
  try {
    const d = await fetch(API+'/live-status', {cache:'no-store', signal: AbortSignal.timeout(4000)});
    if(!d.ok){ document.getElementById('cLive').textContent='⟳ —'; return; }
    const s = await d.json();
    const mkt = s.marketCount ?? '?';
    const trained = s.selfTrainRounds ?? 0;
    const alive = s.pollerStatus === 'running';
    const chip = document.getElementById('cLive');
    if(chip){
      chip.textContent = `⟳ live · ${mkt} mkt · ✦${trained}`;
      chip.style.color = alive ? 'var(--green)' : 'var(--gold)';
    }
  } catch(_){ /* silent */ }
}

// Polling interval references for visibility-based pausing
let syncInterval, acctInterval;

async function init(){
  // Theme is handled by the shared bootstrap + /js/theme-toggle.js (#theme-toggle).
  // Choose the mode: a stored choice wins; otherwise default to LIVE when an account
  // is connected (credentials present / live-tradeable), else PAPER.
  const cn = await j('/connection'); conn = cn || {};
  let mode; try{ mode = localStorage.getItem('kx-mode'); }catch(_){}
  if(mode!=='live' && mode!=='paper') mode = (conn.canTradeLive || conn.credentials) ? 'live' : 'paper';
  loadAccount(); setMode(mode); loadCouncil(); loadHistory(); loadWallet();
  syncInterval=setInterval(syncDeck,SYNC_MS);
  acctInterval=setInterval(()=>{loadAccount();loadCouncil();loadHistory();loadWallet();},30000);

  // Pause/resume on tab visibility to save API quota + battery.
  document.addEventListener('visibilitychange',()=>{
    clearInterval(syncInterval); clearInterval(acctInterval);
    const slow=document.hidden;
    syncInterval=setInterval(syncDeck,slow?30000:SYNC_MS);
    acctInterval=setInterval(()=>{loadAccount();loadCouncil();loadHistory();},slow?60000:30000);
    if(!slow){ syncDeck(); loadAccount(); loadCouncil(); loadHistory(); }
  });
}
document.addEventListener('DOMContentLoaded',init);
