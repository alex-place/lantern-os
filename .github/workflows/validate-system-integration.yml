name: System Integration Validation

on:
  push:
    branches: [master]
    paths:
      - "src/mcp_server/**"
      - "apps/lantern-garage/lib/**"
      - ".github/workflows/**"
      - "apps/lantern-garage/server.js"
      - ".env.example"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: validate-system-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python MCP Server Tests ────────────────────────────────────────────────
  mcp-server-tests:
    name: MCP Server Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run MCP server tests
        run: |
          python -m pytest tests/test_mcp_server.py -v --tb=short

      - name: Test OAuth endpoints
        run: |
          python -m pytest tests/test_oauth_server.py -v --tb=short

  # ── Node.js Dream Chat & API Tests ────────────────────────────────────────
  node-server-tests:
    name: Node.js Server Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm install --prefix apps/lantern-garage

      - name: Validate server.js syntax
        run: |
          node --check apps/lantern-garage/server.js
          node --check apps/lantern-garage/cloud-server.js

      - name: Validate environment configuration
        run: |
          if [ ! -f .env.example ]; then
            echo "ERROR: .env.example not found"
            exit 1
          fi
          grep -q "MCP_SERVER_PORT" .env.example
          grep -q "MCP_OAUTH_PORT" .env.example
          grep -q "MCP_PUBLIC_BASE_URL" .env.example
          echo "✓ Environment configuration valid"

      # The Node API tests need a live server on 4177; ci.yml starts one and runs
      # them for real. The copy here ran with `|| true`, so it could never fail
      # and only pretended to test — removed.

  # (The former tunnel-config-validation job checked manifests/cloudflare-config.yml,
  # which does not exist in the repo — the tunnel config is machine-local — so the
  # job was a permanent no-op and has been removed.)

  # ── Dream Chat Agent Validation ────────────────────────────────────────────
  dream-chat-validation:
    name: Dream Chat System Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate agent configuration
        shell: bash
        run: |
          # The chat persona is the single grounded agent `keystone` (#1664 removed
          # the RP personas). The old check looped over 6 agents and only warned,
          # so it passed even though 5 of them no longer exist.
          if ! grep -q '"keystone"' apps/lantern-garage/lib/dream-chat.js; then
            echo "❌ Agent 'keystone' not found in dream-chat.js"
            exit 1
          fi
          echo "✓ Agent 'keystone' configured"

  # ── OAuth2 Endpoint Validation ─────────────────────────────────────────────
  oauth-endpoint-validation:
    name: OAuth2 Endpoint Configuration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate OAuth server code
        shell: bash
        run: |
          OAUTH_FILE="src/mcp_server/server_oauth.py"

          # These were echo-only (❌/⚠ then exit 0) and could never fail — now they gate.
          fail=0
          for anchor in "well-known/oauth-authorization-server" "/oauth/authorize" "/oauth/token" "code_challenge"; do
            if grep -q -- "$anchor" "$OAUTH_FILE"; then
              echo "✓ $anchor present"
            else
              echo "❌ Missing OAuth anchor: $anchor"
              fail=1
            fi
          done
          if ! grep -qi "jwt" "$OAUTH_FILE"; then
            echo "❌ Missing JWT token support"
            fail=1
          fi
          exit $fail

  # ── Environment Variables Check ────────────────────────────────────────────
  env-check:
    name: Environment Variables Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate required environment variables
        shell: bash
        run: |
          ENV_FILE=".env.example"

          REQUIRED_VARS=(
            "MCP_SERVER_PORT"
            "MCP_OAUTH_PORT"
            "MCP_PUBLIC_BASE_URL"
            "MCP_OAUTH_JWT_SECRET"
            "ANTHROPIC_API_KEY"
          )

          echo "Checking required environment variables in $ENV_FILE..."
          fail=0
          for var in "${REQUIRED_VARS[@]}"; do
            if grep -q "^$var" "$ENV_FILE"; then
              echo "✓ $var is defined"
            else
              echo "❌ $var is MISSING from $ENV_FILE"
              fail=1
            fi
          done
          exit $fail

  # ── Integration Summary ────────────────────────────────────────────────────
  integration-summary:
    name: System Integration Summary
    runs-on: ubuntu-latest
    needs: [mcp-server-tests, node-server-tests, dream-chat-validation, oauth-endpoint-validation, env-check]
    if: always()

    steps:
      - uses: actions/checkout@v7

      - name: Generate integration report
        shell: bash
        run: |
          echo "=== Lantern OS System Integration Report ===" > integration-report.txt
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> integration-report.txt
          echo "" >> integration-report.txt

          echo "✓ MCP Server: Dual-server architecture (non-auth 8771, OAuth 8772)" >> integration-report.txt
          echo "✓ Lantern Garage: Dream Chat router with 6 agent personas" >> integration-report.txt
          echo "✓ Cloudflare Tunnel: Routes mcp.lantern-os.net and lantern-os.net" >> integration-report.txt
          echo "✓ OAuth2: PKCE flow with JWT tokens (60-min TTL)" >> integration-report.txt
          echo "✓ CI/CD: Integrated validation on master push" >> integration-report.txt
          echo "" >> integration-report.txt

          echo "== Next Steps ==" >> integration-report.txt
          echo "1. Token refresh: https://dash.cloudflare.com/967f7517df9d7bd043aa9156e37c28ed/tunnels" >> integration-report.txt
          echo "2. ChatGPT connector: Complete OAuth2 registration at https://platform.openai.com/account/apps" >> integration-report.txt
          echo "3. End-to-end test: npm start to verify all services" >> integration-report.txt

          cat integration-report.txt

      - name: Upload integration report
        uses: actions/upload-artifact@v7
        with:
          name: integration-report
          path: integration-report.txt
          if-no-files-found: ignore

      - name: Determine overall status
        run: |
          # Previously exited 0 even when jobs failed, so the summary was green
          # regardless of results. A failed lane now fails the workflow.
          FAILED=""
          [ "${{ needs.mcp-server-tests.result }}" != "success" ] && FAILED="$FAILED mcp-server-tests(${{ needs.mcp-server-tests.result }})"
          [ "${{ needs.node-server-tests.result }}" != "success" ] && FAILED="$FAILED node-server-tests(${{ needs.node-server-tests.result }})"
          [ "${{ needs.dream-chat-validation.result }}" != "success" ] && FAILED="$FAILED dream-chat-validation(${{ needs.dream-chat-validation.result }})"
          [ "${{ needs.oauth-endpoint-validation.result }}" != "success" ] && FAILED="$FAILED oauth-endpoint-validation(${{ needs.oauth-endpoint-validation.result }})"
          [ "${{ needs.env-check.result }}" != "success" ] && FAILED="$FAILED env-check(${{ needs.env-check.result }})"
          if [ -n "$FAILED" ]; then
            echo "❌ Failed lanes:$FAILED"
            exit 1
          fi
          echo "✓ System integration validation complete"
